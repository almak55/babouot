          const r = await api('POST', { action: 'generer', ids: [bt.dataset.id], rang_depart: Number(bt.dataset.rang) || 1, ...etapes });
          const x = (r.resultats || [])[0] || {};
          if (x.erreur || !x.numero) throw new Error(x.erreur || 'Création impossible.');
          toast(`OF ${x.numero} créé : ${x.titre}.`);
          data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); chargerDonneesReelles();
          $('m-msg').innerHTML = `<div class="msg ok">OF ${esc(x.numero)} créé pour « ${esc(x.titre)} ».${(x.avertissements || []).length ? '<br>⚠ ' + x.avertissements.map(esc).join('<br>⚠ ') : ''}</div>`;
        } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; bt.disabled = false; }
      }));
      $('pa-corps').querySelectorAll('.pa-suppr').forEach((bt) => bt.addEventListener('click', async () => {
        if (!confirm(`Retirer « ${bt.dataset.titre} » du planning annuel ?\n(à utiliser si le titre est annulé ou saisi par erreur)`)) return;
        try { await api('DELETE', null, `?id=${bt.dataset.id}`); data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); toast('Titre retiré du planning annuel.'); }
        catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      }));
      $('pa-corps').querySelectorAll('input[data-id]').forEach((inp) => inp.addEventListener('change', async () => {
        const v = inp.value.trim(); const num = ['quantite', 'mp', 'carte_dos'].includes(inp.dataset.k);
        try {
          await api('PUT', { id: inp.dataset.id, [inp.dataset.k]: num ? (v === '' ? null : parseInt(v, 10)) : (v === '' ? null : v) });
          if (inp.dataset.k === 'date_livraison' && v && v.slice(0, 7) !== courant) { courant = v.slice(0, 7); toast(`Titre déplacé vers ${nomMois(courant)}.`); }
          data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre();
        } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      }));
    }
    // Liste du mois à imprimer : mêmes titres, même ordre de passage que l'écran.
    $('pa-imprimer').addEventListener('click', () => {
      const m = prop.mois.find((x) => x.mois === courant); if (!m) return;
      const parId = new Map(data.lignes.filter((l) => l.mois === m.mois).map((l) => [l.id, l]));
      const jjmm = (d) => (d ? `${d.slice(8, 10)}/${d.slice(5, 7)}` : '');
      const cellules = (l, s) => `<td>${esc(s.titre)}${l.flags ? ` <small>${esc(l.flags)}</small>` : ''}</td><td class="n">${s.quantite || ''}</td><td class="n">${s.mp || ''}</td><td class="n">${s.carte_dos || ''}</td><td>${esc(s.tete || '')}</td><td>${esc(s.peau || '')}</td><td>${l.date_livraison ? jjmm(l.date_livraison) : ''}</td>`;
      let corps = '';
      m.sequence.forEach((s, i) => {
        const l = parId.get(s.id) || {};
        const d = (i === 0 || s.change_reglage) ? (m.series_detail || []).find((x) => x.serie === s.serie) : null;
        if (d) corps += `<tr class="serie"><td colspan="9">Série ${d.serie} — cartes de dos de ${d.carte_max} à ${d.carte_min} mm · ${d.nb} titre${d.nb > 1 ? 's' : ''}</td></tr>`;
        corps += `<tr><td class="n">${i + 1}</td><td class="n">${i === 0 || m.sequence[i - 1].jour_bdm !== s.jour_bdm ? 'J' + s.jour_bdm : ''}</td>${cellules(l, s)}</tr>`;
      });
      if (m.sans_carte.length) {
        corps += `<tr class="serie"><td colspan="9">Carte de dos à renseigner (hors classement)</td></tr>`;
        m.sans_carte.forEach((x) => { const l = parId.get(x.id) || {}; corps += `<tr><td class="n">—</td><td></td>${cellules(l, { titre: x.titre, quantite: l.quantite, mp: l.mp, carte_dos: '', tete: l.tete, peau: l.peau })}</tr>`; });
      }
      const html = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Liste Pléiade ${esc(nomMois(m.mois))}</title><style>
        body{font:12px Arial,sans-serif;margin:16px;color:#111} h1{font-size:16px;margin:0 0 4px} p{margin:2px 0 8px;color:#444}
        table{border-collapse:collapse;width:100%} th,td{border:1px solid #999;padding:3px 6px;text-align:left} th{background:#eee} td.n{text-align:right;white-space:nowrap}
        tr.serie td{background:#f1f1f1;font-weight:bold} small{color:#666} @media print{body{margin:6mm}}</style></head><body>
        <h1>Pléiade — titres à produire en ${esc(nomMois(m.mois))}</h1>
        <p>${m.sequence.length + m.sans_carte.length} titre(s) · classés par carte de dos décroissante puis couleur de tête · ${m.jours_bdm} jour(s) de BDM (${prop.parametres.parJour} titres par jour) · ${m.reglages} changement(s) de réglage · ${m.nettoyages} changement(s) de tête · imprimé le ${esc(new Date().toLocaleDateString('fr-FR'))}</p>
        <table><thead><tr><th>#</th><th>Jour BDM</th><th>Titre</th><th>Qté</th><th>Cahiers</th><th>Carte de dos</th><th>Tête</th><th>Peau</th><th>Livraison</th></tr></thead><tbody>${corps}</tbody></table></body></html>`;
      const w = window.open('', '_blank');
      if (!w) { toast('Fenêtre bloquée par le navigateur : autorisez les fenêtres pour ce site, puis recommencez.', 'error'); return; }
      w.document.open(); w.document.write(html); w.document.close(); w.focus();
      setTimeout(() => { try { w.print(); } catch (e) { /* impression manuelle possible */ } }, 300);
    });
    $('pa-creer').addEventListener('click', async () => {
      const m = prop.mois.find((x) => x.mois === courant); if (!m) return;
      const lignes = data.lignes.filter((l) => m.sequence.some((s) => s.id === l.id) && !l.of_id);
      if (!lignes.length) { $('m-msg').innerHTML = '<div class="msg">Tous les OF de ce mois sont déjà créés.</div>'; return; }
      const etapes = await demanderEtapes(lignes[0].id, lignes.length); if (!etapes) return;
      $('pa-creer').disabled = true; const sortie = [];
      const ordre = m.sequence.filter((s) => lignes.some((l) => l.id === s.id));
      for (let i = 0; i < ordre.length; i++) {
        $('m-msg').innerHTML = `<div class="msg">Création ${i + 1} / ${ordre.length} : ${esc(ordre[i].titre)}…</div>`;
        try { const r = await api('POST', { action: 'generer', ids: [ordre[i].id], rang_depart: i + 1, ...etapes }); sortie.push(r.resultats[0]); }
        catch (e) { sortie.push({ titre: ordre[i].titre, erreur: e.message }); }
      }
      const ok = sortie.filter((x) => x.numero).length;
      $('m-msg').innerHTML = `<div class="msg ${ok === sortie.length ? 'ok' : ''}">${ok} OF créé(s) sur ${sortie.length}.${sortie.filter((x) => x.erreur).map((x) => `<br>⚠ ${esc(x.titre)} : ${esc(x.erreur)}`).join('')}</div>`;
      $('pa-creer').disabled = false; data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); chargerDonneesReelles();
    });
    $('pa-coches').addEventListener('click', async () => {
      const cases = Array.from($('pa-corps').querySelectorAll('.pa-chk:checked'));
      if (!cases.length) return;
      const etapes = await demanderEtapes(cases[0].dataset.id, cases.length); if (!etapes) return;
      $('pa-coches').disabled = true; $('pa-creer').disabled = true; const sortie = [];
      for (let i = 0; i < cases.length; i++) {
        const ligne = data.lignes.find((l) => l.id === cases[i].dataset.id) || {};
        $('m-msg').innerHTML = `<div class="msg">Création ${i + 1} / ${cases.length} : ${esc(ligne.titre || '')}…</div>`;
        try { const r = await api('POST', { action: 'generer', ids: [cases[i].dataset.id], rang_depart: i + 1, ...etapes }); sortie.push(r.resultats[0]); }
        catch (e) { sortie.push({ titre: ligne.titre, erreur: e.message }); }
      }
      const ok = sortie.filter((x) => x.numero).length;
      data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); chargerDonneesReelles();
      $('pa-coches').disabled = false; $('pa-creer').disabled = false;
      $('m-msg').innerHTML = `<div class="msg ${ok === sortie.length ? 'ok' : ''}">${ok} OF créé(s) sur ${sortie.length}.${sortie.filter((x) => x.erreur).map((x) => `<br>⚠ ${esc(x.titre)} : ${esc(x.erreur)}`).join('')}</div>`;
    });
    rendre();
  }

  async function ouvrirModaleNouvelOf() {
    let refs;
    try { refs = await getReferentiels(); }
    catch (e) {
      afficherModale(`<h3>Nouvel OF</h3><div class="msg error">Backend indisponible : impossible de charger les opérations/titres. (${e.message})</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }

    const opsHtml = refs.operations.map(o => `
      <label class="op-ligne" style="display:grid;grid-template-columns:22px 26px minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center;"><input type="checkbox" value="${o.code}" data-nom="${esc(o.nom)}"><span class="op-num" style="color:var(--muted);text-align:right;"></span><span>${o.nom}</span><span class="op-apres" style="font-size:12px;color:var(--muted);"></span></label>
    `).join('');

    afficherModale(`
      <h3>Nouvel ordre de fabrication</h3>
      <div class="import-box" id="import-box">
        <input type="file" id="m-import" accept=".jpg,.jpeg,.png,.webp,.pdf,.doc,.docx,.xls,.xlsx" class="hidden">
        <label for="m-import" class="import-label">
          ${svgIcon('<path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/>')}
          <span><strong>Importer une fiche</strong> — photo, PDF, Word ou Excel<br>remplit le formulaire automatiquement</span>
        </label>
        <div id="import-status"></div><div id="import-car"></div>
      </div>
      <div class="field"><label>Titre / produit</label><input id="m-titre-nom" placeholder="ex: Trône de Fer 5"></div>
      <div class="field"><label>Client</label><input id="m-titre-client" placeholder="ex: Éditions Pléiade"></div>
      <div class="field"><label>Quantité</label><input id="m-qte" type="number" min="1" placeholder="2000"></div>
      <div class="field"><label>Délai</label><input id="m-delai" type="date"></div>
      <div class="field"><label>Type de production <span class="plan-note">— choisit les temps de machine (Pléiade, Cartonné…)</span></label>
        <select id="m-type"><option value="">— non précisé —</option>${(refs.types_production || []).map(t => `<option value="${esc(t.code)}">${esc(t.libelle)}</option>`).join('')}</select></div>
      <div class="field"><label>Priorité</label>
        <select id="m-priorite"><option value="normale">Normale</option><option value="haute">Haute</option><option value="urgente">Urgente</option></select>
      </div>
      <div class="field"><label>Opérations de la gamme <span class="plan-note">— listées dans l'ordre de fabrication ; cochez celles dont l'OF a besoin, les « après… » se calculent</span></label><div class="op-list">${opsHtml}</div></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn" id="m-submit-delais" title="Crée l'OF (sans le planifier) puis calcule 3 créneaux de livraison avec 3 tarifs">Créer l'OF et proposer 3 délais</button><button class="btn primary" id="m-submit">Créer l'OF</button></div>
    `);
    const majOps = () => {
      let n = 0, prec = null;
      document.querySelectorAll('.op-list .op-ligne').forEach((l) => {
        const cb = l.querySelector('input'); const on = cb.checked;
        l.querySelector('.op-num').textContent = on ? ++n : '';
        l.querySelector('.op-apres').textContent = on ? (prec ? `après : ${prec}` : 'démarre dès le début') : '';
        if (on) prec = cb.dataset.nom;
      });
    };
    document.querySelectorAll('.op-list input[type="checkbox"]').forEach((cb) => cb.addEventListener('change', majOps));
    majOps();

    let caracteristiquesFiche = {};
    document.getElementById('m-import').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('import-status');
      statusEl.innerHTML = `<div class="msg">Analyse du document en cours…</div>`;
      try {
        const estImage = file.type.startsWith('image/');
        const { base64, mimeType } = estImage
          ? await compresserImage(file)
          : { base64: await fichierEnBase64(file), mimeType: file.type };
        const res = await fetch(`${API}/analyser-fiche`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file_base64: base64, file_name: file.name, mime_type: mimeType }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');

        if (data.titre) document.getElementById('m-titre-nom').value = data.titre;
        if (data.client) document.getElementById('m-titre-client').value = data.client;
        if (data.quantite) document.getElementById('m-qte').value = data.quantite;
        if (data.delai) document.getElementById('m-delai').value = data.delai;
        if (data.type_production) document.getElementById('m-type').value = data.type_production;
        caracteristiquesFiche = data.caracteristiques || {};
        const lues = Object.entries(caracteristiquesFiche);
        document.getElementById('import-car').innerHTML = lues.length ? `<div class="plan-note">Caractéristiques lues sur la fiche : ${lues.map(([k, v]) => esc(k) + ' = ' + esc(String(v))).join(' · ')} (modifiables ensuite dans le chiffrage).</div>` : '';
        document.querySelectorAll('.op-list input[type="checkbox"]').forEach(cb => {
          cb.checked = (data.operation_codes || []).includes(cb.value);
        });
        majOps();

        const confianceClasse = data.confiance === 'haute' ? 'ok' : data.confiance === 'basse' ? 'error' : '';
        statusEl.innerHTML = `<div class="msg ${confianceClasse}">Extraction ${data.confiance || ''} — relisez les champs avant de créer l'OF.${data.notes ? ' ' + data.notes : ''}</div>`;
        toast('Fiche analysée — vérifiez les champs pré-remplis.');
      } catch (err) {
        statusEl.innerHTML = `<div class="msg error">Échec de l'analyse : ${err.message}</div>`;
      }
    });

    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    const creerOf = async (avecDelais) => {
      const nom = document.getElementById('m-titre-nom').value.trim();
      const client = document.getElementById('m-titre-client').value.trim();
      const quantite = parseInt(document.getElementById('m-qte').value, 10);
      const delai = document.getElementById('m-delai').value || null;
      const priorite = document.getElementById('m-priorite').value;
      const operations = Array.from(document.querySelectorAll('.op-list input:checked')).map(i => i.value);
      const msg = document.getElementById('m-msg');

      if (!nom || !quantite || operations.length === 0) {
        msg.innerHTML = `<div class="msg error">Titre, quantité et au moins une opération sont requis.</div>`;
        return;
      }
      msg.innerHTML = `<div class="msg">Création en cours…</div>`;
      try {
        const res = await fetch(`${API}/creer-ordre`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ titre: { nom, client }, quantite, delai, priorite, operations, type_production: document.getElementById('m-type').value || null, caracteristiques: caracteristiquesFiche }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        msg.innerHTML = `<div class="msg ok">OF ${data.numero} créé.</div>`;
        toast(`OF ${data.numero} créé avec succès.`);
        fermerModale(); chargerDonneesReelles();
        if (avecDelais) ouvrirModaleDelais(data.of_id, data.numero);
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    };
    document.getElementById('m-submit').addEventListener('click', () => creerOf(false));
    document.getElementById('m-submit-delais').addEventListener('click', () => creerOf(true));
  }

  // ---------- Délais de livraison proposés au client : au plus 3 créneaux, 3 tarifs ----------
  async function ouvrirModaleDelais(ofUuid, ofNumero) {
    afficherModale(`<h3>Délais de livraison — ${esc(ofNumero)}</h3><div id="dl-titre"></div><div id="dl-corps"><div class="msg">Calcul des créneaux disponibles sur le planning actuel…</div></div><div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    $('m-cancel').addEventListener('click', fermerModale);
    const post = async (corps) => {
      const r = await fetch(`${API}/proposer-delais`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, ...corps }) });
      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d;
    };
    const euro = (n) => Number(n || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    const jourLong = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    try {
      const [tar, nor, rap] = await Promise.all([post({ action: 'tarifs' }), post({ action: 'simuler', scenario: 'normal' }), post({ action: 'simuler', scenario: 'rapide' })]);
      $('dl-titre').innerHTML = `<div style="margin:-4px 0 10px;font-size:15px;"><strong>${esc(tar.of.titre || '')}</strong>${tar.of.client ? ` <span class="plan-note">— ${esc(tar.of.client)}</span>` : ''} <span class="plan-note">· ${tar.of.quantite} ex.</span></div>`;
      if (nor.erreur) {
        $('dl-corps').innerHTML = `<div class="msg error" style="display:block;">${esc(nor.erreur)}${(nor.bloquants || []).map((x) => `<br>• ${esc(x.operation)} — ${esc(x.detail)}`).join('')}<br>Corrigez le chiffrage ou la gamme de l'OF (menu « Chiffrage des temps ») puis relancez.</div>`;
        return;
      }
      const lon = await post({ action: 'simuler', scenario: 'long', debut_normal: nor.debut.slice(0, 10) });
      const cartes = [];
      const avertissements = [...(tar.avertissements || []), ...(nor.avertissements || [])];   // (l'avis « lot minimum » du rapide est affiché sur sa carte)
      if (!rap.erreur && rap.date_livraison < nor.date_livraison) cartes.push({ code: 'rapide', sim: rap });
      else avertissements.push('Le délai rapproché n\u2019avance pas la date de livraison : il n\u2019est pas proposé (au plus 3 créneaux, tous différents).');
      cartes.push({ code: 'normal', sim: nor });
      if (!lon.erreur && lon.date_livraison > nor.date_livraison) cartes.push({ code: 'long', sim: lon });
      const style = { rapide: '#c2410c', normal: '#0f766e', long: '#4338ca' };
      const note = (c) => {
        if (c.code === 'rapide') return ((c.sim.of_decales || []).length
          ? `Sans heures supplémentaires. Passe devant le travail non commencé de <strong>${c.sim.of_decales.length} OF sans délai ferme</strong> : ${c.sim.of_decales.map(esc).join(', ')}.`
          : 'Sans heures supplémentaires. Aucun autre OF n\u2019est décalé.') + (c.sim.lot_leve ? ' <strong>Lot minimum Pléiade levé</strong> : l\u2019OF peut tourner seul.' : '');
        if (c.code === 'normal') return 'Au plus tôt dans le planning actuel, sans rien décaler.';
        return `Début décalé de ${tar.parametres.decalage_jours} jours ouvrés : l\u2019atelier a de la marge.`;
      };
      $('dl-corps').innerHTML = `<div style="display:grid;grid-template-columns:repeat(${cartes.length},minmax(0,1fr));gap:12px;">${cartes.map((c) => {
        const t = tar.tarifs[c.code];
        return `<div style="border:1px solid var(--line,#d9dee5);border-top:4px solid ${style[c.code]};border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;">
          <div style="font-weight:700;color:${style[c.code]};">${esc(t.libelle)}</div>
          <div style="font-size:18px;font-weight:700;">${esc(jourLong(c.sim.date_livraison))}</div>
          <div class="plan-note">Production du ${dateCourte(c.sim.debut.slice(0, 10))} au ${dateCourte(c.sim.fin.slice(0, 10))}</div>
          <div style="font-size:20px;font-weight:700;margin-top:4px;">${euro(t.ht)} <span class="plan-note" style="font-weight:400;">HT</span></div>
          <div class="plan-note">${esc(t.texte)}${t.prix_mille_ht ? ` · ${euro(t.prix_mille_ht)} le mille` : ''}</div>
          <div class="plan-note" style="flex:1;">${note(c)}</div>
          <button class="btn primary dl-choisir" data-code="${c.code}" data-date="${c.sim.date_livraison}" style="margin-top:6px;">Choisir ce délai</button></div>`;
      }).join('')}</div>
      <div class="plan-note" style="margin-top:10px;">Prix d'après le chiffrage de l'OF (main d'œuvre et machines), <strong>hors matières premières</strong>. Réglages : supplément ${tar.parametres.supplement_pct} %, remise ${tar.parametres.remise_pct} %, décalage ${tar.parametres.decalage_jours} jours ouvrés (« Coûts & tarifs »). Le planning n'est pas modifié par cette proposition : après le choix, validez l'OF puis lancez « Réorganiser par priorité » pour que le délai soit appliqué.</div>
      ${avertissements.length ? `<div class="msg" style="display:block;margin-top:8px;">${avertissements.map((a) => '• ' + esc(a)).join('<br>')}</div>` : ''}`;
      $('dl-corps').querySelectorAll('.dl-choisir').forEach((b) => b.addEventListener('click', async () => {
        $('dl-corps').querySelectorAll('.dl-choisir').forEach((x) => { x.disabled = true; });
        $('m-msg').innerHTML = '<div class="msg">Enregistrement du délai et du devis…</div>';
        try {
          const r = await post({ action: 'choisir', option: b.dataset.code, date_livraison: b.dataset.date });
          toast(`Délai du ${dateCourte(r.delai)} inscrit sur ${ofNumero} — devis ${r.devis.numero} (${euro(r.devis.total_ht)} HT) créé.${r.lot_minimum_leve ? ' Lot minimum Pléiade levé pour cet OF.' : ''}`);
          fermerModale(); chargerDonneesReelles();
        } catch (e) {
          $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
          $('dl-corps').querySelectorAll('.dl-choisir').forEach((x) => { x.disabled = false; });
        }
      }));
    } catch (e) {
      $('dl-corps').innerHTML = `<div class="msg error" style="display:block;">${esc(e.message)}</div>`;
    }
  }

  async function ouvrirModaleAffectation({ machineUuid, machineName, dayIdx, ofUuid, gammeId, retour }) {
    let refs;
    try { refs = await getReferentiels(); }
    catch (e) {
      afficherModale(`<h3>Affecter un OF</h3><div class="msg error">Backend indisponible. (${e.message})</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }

    const dateIso = dayIdx != null ? DAYS_ISO[dayIdx] : DAYS_ISO[0];
    const ofOptions = state.ordres.map(o => `<option value="${o.uuid}" ${o.uuid === ofUuid ? 'selected' : ''}>${o.id} — ${o.produit}</option>`).join('');
    const machineOptions = `<option value="">— Aucune machine (opération manuelle) —</option>` + state.machines.filter(m => m.uuid).map(m => `<option value="${m.uuid}" ${m.uuid===machineUuid?'selected':''}>${m.name}</option>`).join('');
    const persCases = refs.personnel.map(p => `<label><input type="checkbox" value="${p.id}"> ${p.nom}${p.poste ? ' <span style="color:var(--ink-500);">— ' + p.poste + '</span>' : ''}</label>`).join('');

    afficherModale(`
      <h3>Affecter un OF au planning</h3>
      <div class="field"><label>Ordre de fabrication</label><select id="m-of">${ofOptions}</select></div>
      <div class="field"><label>Étape de gamme</label><select id="m-etape"><option>Choisir un OF d'abord…</option></select></div>
      <div id="m-etape-note"></div>
      <div class="field"><label>Machine <span class="plan-note">— laissez « Aucune machine » pour un travail manuel</span></label><select id="m-machine">${machineOptions}</select><div id="m-dispo" class="dispo-strip"></div></div>
      <div class="field"><label>Jour de début <span class="plan-note">— proposé automatiquement selon les dépendances</span></label><input id="m-date" type="date" value="${dateIso}"><div id="m-date-note" class="plan-note" style="margin-top:4px;"></div></div>
      <div class="field"><label>Personnel <span class="plan-note">— cocher une ou plusieurs personnes</span></label>
        <div style="margin-bottom:6px;"><button class="btn" type="button" id="m-prop-btn">Proposer le personnel</button></div>
        <div id="m-prop" class="plan-note" style="margin-bottom:6px;"></div>
        <div class="op-list" id="m-personnel-list">${persCases}</div></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">Affecter</button></div>
    `);

    document.getElementById('m-cancel').addEventListener('click', () => (retour ? retour() : fermerModale()));

    const etapeSelect = document.getElementById('m-etape');
    const noteEtape = document.getElementById('m-etape-note');
    const statutChoisi = () => { const o = etapeSelect.selectedOptions[0]; return o ? o.dataset.statut : null; };

    function majNoteEtape(gammes) {
      const st = statutChoisi();
      if (st === 'planifié') {
        noteEtape.innerHTML = `
          <div class="msg" style="margin:-4px 0 12px;">Cette étape est <strong>déjà planifiée</strong>. Pour l'affecter autrement, déplanifiez-la d'abord.
            <div class="note-actions"><button class="btn" id="dp-etape">Déplanifier cette étape</button><button class="btn" id="dp-of">Déplanifier tout l'OF</button></div></div>`;
        document.getElementById('dp-etape').addEventListener('click', () => deplanifier({ gamme_ids: [etapeSelect.value] }));
        document.getElementById('dp-of').addEventListener('click', () => deplanifier({ of_id: document.getElementById('m-of').value }));
      } else if (gammes && !gammes.some(g => g.statut === 'à planifier' || g.statut === 'planifié')) {
        noteEtape.innerHTML = `<div class="msg" style="margin:-4px 0 12px;">Toutes les étapes de cet OF sont démarrées ou terminées : il n'y a plus rien à planifier.</div>`;
      } else {
        noteEtape.innerHTML = '';
      }
    }

    async function deplanifier(corps) {
      const msg = document.getElementById('m-msg');
      msg.innerHTML = `<div class="msg">Déplanification…</div>`;
      try {
        const res = await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        toast(`${d.deplanifiees.length} étape(s) déplanifiée(s).${d.conservees.length ? ' ' + d.conservees.length + ' conservée(s) (déjà démarrées).' : ''}`);
        msg.innerHTML = '';
        chargerDonneesReelles();
        await chargerEtapes();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }

    async function chargerEtapes() {
      const ofSel = document.getElementById('m-of').value;
      etapeSelect.innerHTML = `<option>Chargement…</option>`;
      noteEtape.innerHTML = '';
      try {
        const res = await fetch(`${API}/gammes-ordre?of_id=${ofSel}`);
        const gammes = await lireJson(res);
        if (!res.ok) { etapeSelect.innerHTML = `<option value="">Erreur : ${esc(gammes.error || 'HTTP ' + res.status)}</option>`; return; }
        if (!Array.isArray(gammes) || gammes.length === 0) {
          etapeSelect.innerHTML = `<option value="">Cet OF n'a aucune étape de gamme</option>`;
          return;
        }
        const SUFFIXE = { 'planifié': ' — déjà planifiée', 'en cours': ' — en cours', 'terminé': ' — terminée' };
        etapeSelect.innerHTML = gammes.map(g => `<option value="${g.id}" data-statut="${g.statut}" data-manuel="${g.sans_machine ? 1 : 0}" ${g.statut === 'en cours' || g.statut === 'terminé' ? 'disabled' : ''}>${esc(g.operation.nom)}${SUFFIXE[g.statut] || ''}</option>`).join('');
        const defaut = (gammeId && gammes.find(g => g.id === gammeId && g.statut !== 'en cours' && g.statut !== 'terminé')) || gammes.find(g => g.statut === 'à planifier') || gammes.find(g => g.statut === 'planifié');
        if (defaut) etapeSelect.value = defaut.id;
        majNoteEtape(gammes);
        ajusterMachine();
        majJourDebut();
      } catch (e) {
        etapeSelect.innerHTML = `<option value="">Erreur de chargement</option>`;
      }
    }
    // Disponibilité de la machine choisie : jours libres / occupés / en maintenance.
    let dateManuelle = false;
    const aujourdhuiLocal = () => new Date().toLocaleDateString('sv-SE');
    async function majDispo(auto) {
      const zone = document.getElementById('m-dispo');
      const machine = document.getElementById('m-machine').value;
      if (!machine) { zone.innerHTML = ''; return; }
      const champ = document.getElementById('m-date');
      const auj = aujourdhuiLocal();
      let du = auj;
      if (champ.value && champ.value > auj) { const d = new Date(champ.value + 'T00:00:00'); d.setDate(d.getDate() - 3); const t = d.toLocaleDateString('sv-SE'); if (t > auj) du = t; }
      zone.innerHTML = '<span class="plan-note">Disponibilités de la machine…</span>';
      try {
        const res = await fetch(`${API}/dispo-machine?machine_id=${machine}&du=${du}&jours=21`);
        const r = await res.json();
        if (!res.ok) throw new Error(r.error || 'Erreur inconnue');
        let note = '';
        const premierLibre = r.jours.find(j => j.etat === 'libre' && j.date >= (champ.value || auj));
        const courant = r.jours.find(j => j.date === champ.value);
        if (auto && !dateManuelle && courant && courant.etat !== 'libre' && premierLibre) {
          note = `La machine est occupée le ${courant.libelle} : premier jour libre proposé (${premierLibre.libelle}).`;
          champ.value = premierLibre.date;
        }
        const choisi = champ.value;
        const bandeau = (r.interventions || []).map(i => `<div class="msg ${i.bloquant ? 'error' : ''}" style="margin:0 0 6px;font-size:12px;">${i.bloquant ? '⛔' : '⚠'} ${esc(i.texte)}${i.etat === 'programmée' ? ' (programmée)' : ''}${i.bloquant ? ' — la machine ne peut pas être affectée à ces dates.' : ' — marche dégradée.'}</div>`).join('');
        zone.innerHTML = bandeau + r.jours.map(j => `<button type="button" class="dispo-chip ${j.etat} ${j.date === choisi ? 'choisi' : ''}" data-date="${j.date}" title="${esc(j.etat === 'libre' ? 'Libre — cliquer pour choisir ce jour' : j.details.join('\n'))}">${esc(j.libelle)}</button>`).join('')
          + `<div class="dispo-legende">${note ? esc(note) + ' · ' : ''}Vert : libre (cliquez pour choisir) · barré : occupé (survolez pour voir par quoi) · orangé : maintenance.</div>`;
        zone.querySelectorAll('.dispo-chip.libre').forEach(b => b.addEventListener('click', () => {
          champ.value = b.dataset.date; dateManuelle = true;
          zone.querySelectorAll('.dispo-chip').forEach(x => x.classList.toggle('choisi', x === b));
        }));
      } catch (e) { zone.innerHTML = `<span class="plan-note">Disponibilités indisponibles (${esc(e.message)}).</span>`; }
    }
    document.getElementById('m-machine').addEventListener('change', () => majDispo(true));
    document.getElementById('m-date').addEventListener('change', () => { dateManuelle = true; majDispo(false); });

    // Jour de début automatique : déduit des dépendances de l'opération choisie.
    let suggestionNum = 0;
    async function majJourDebut() {
      const note = document.getElementById('m-date-note');
      const id = etapeSelect.value;
      if (!id || statutChoisi() === 'planifié') { note.textContent = ''; return; }
      const num = ++suggestionNum;
      note.textContent = 'Calcul du jour de début…';
      try {
        const res = await fetch(`${API}/jour-debut-etape?gamme_id=${id}`);
        const r = await res.json();
        if (num !== suggestionNum) return;   // une autre étape a été choisie entre-temps
        if (!res.ok) throw new Error(r.error || 'Erreur inconnue');
        document.getElementById('m-date').value = r.date;
        await majDispo(true);
        proposerPersonnel(true);
        if (r.bloques && r.bloques.length) {
          note.innerHTML = `<span style="color:var(--danger);">À planifier d'abord : ${r.bloques.map(esc).join(', ')}.</span>`;
        } else {
          note.innerHTML = esc(`Début le ${r.libelle} — ${r.raison}.`)
            + (r.details && r.details.length > 1 ? `<div style="margin-top:3px;">Contraintes : ${r.details.map(d => (d.decisive ? '<strong>' : '') + esc(d.raison) + ' (' + esc(d.quand) + ')' + (d.decisive ? ' ← décisive</strong>' : '')).join(' ; ')}.</div>` : '');
        }
      } catch (e) { if (num === suggestionNum) note.textContent = ''; }
    }
    // Proposition automatique du personnel (conducteur de la machine + aides disponibles).
    let heureDebutProposee = null, persTouche = false, propNum = 0, conducteurPropose = null;
    document.getElementById('m-personnel-list').addEventListener('change', () => { persTouche = true; });
    async function proposerPersonnel(auto) {
      const zone = document.getElementById('m-prop');
      const id = etapeSelect.value, date = document.getElementById('m-date').value;
      if (!id || !date || statutChoisi() === 'planifié') { zone.innerHTML = ''; return; }
      if (auto && persTouche) return;   // ne pas écraser une sélection faite à la main
      const num = ++propNum;
      zone.textContent = 'Recherche du personnel disponible…';
      try {
        const machine = document.getElementById('m-machine').value;
        const res = await fetch(`${API}/proposer-affectation?gamme_id=${id}&date=${date}${machine ? '&machine_id=' + machine : ''}${machine && !dateManuelle ? '&chercher_jour=1' : ''}`);
        const r = await res.json();
        if (num !== propNum) return;
        if (!res.ok) throw new Error(r.error || 'Erreur inconnue');
        let noteJour = '';
        if (r.jour_propose && r.jour_propose.change) {
          document.getElementById('m-date').value = r.jour_propose.date;
          noteJour = `<div>📅 Jour proposé : <strong>${esc(r.jour_propose.libelle)}</strong> — premier jour où la machine et un conducteur sont disponibles.</div>`;
          majDispo(false);
        }
        // Étiquettes « conducteur » dans la liste des personnes
        const badges = {}; (r.conducteurs || []).forEach(c => { badges[c.id] = c.du_jour ? 'conducteur du jour' : c.rang === 1 ? 'conducteur titulaire' : 'conducteur suppléant'; });
        document.querySelectorAll('#m-personnel-list label').forEach(l => {
          const inp = l.querySelector('input'); if (!inp) return;
          let b = l.querySelector('.pf-badge'); if (b) b.remove();
          if (badges[inp.value]) l.insertAdjacentHTML('beforeend', ` <span class="pf-badge" style="background:var(--accent,#0f766e);color:#fff;border-radius:8px;padding:0 7px;font-size:11px;">${badges[inp.value]}</span>`);
        });
        const cases = Array.from(document.querySelectorAll('#m-personnel-list input'));
        cases.forEach(c => { c.checked = false; });
        conducteurPropose = r.conducteur ? r.conducteur.id : null;
        const ids = [r.conducteur && r.conducteur.id, ...r.aides.map(a => a.id)].filter(Boolean);
        ids.forEach(pid => { const c = cases.find(x => x.value === pid); if (c) c.checked = true; });
        persTouche = false;
        // Conducteur libre seulement après sa tâche en cours : le jour et l'heure de début s'alignent sur ce moment (confirmé côté serveur).
        heureDebutProposee = r.debut_suggere ? r.debut_suggere.heure : null;
        if (r.debut_suggere && document.getElementById('m-date').value !== r.debut_suggere.date) { document.getElementById('m-date').value = r.debut_suggere.date; majDispo(false); }
        let h = noteJour + `<div>Équipe requise : <strong>${r.equipe_requise}</strong> personne(s)${r.prioritaire ? ' — OF prioritaire' : ''}.</div>`;
        if (machine) {
          h += `<div style="margin-top:4px;"><strong>Conducteurs de la machine</strong> (un seul conducteur par jour : celui déjà prévu ce jour-là est repris) :</div>`;
          if (!(r.conducteurs || []).length) h += `<div style="color:var(--danger);">Aucun conducteur défini : renseignez-les dans la fiche de la machine.</div>`;
          (r.conducteurs || []).forEach(c => {
            const etat = c.statut === 'libre' ? 'libre' : c.statut === 'libre_apres' ? 'libre après sa tâche en cours' : (c.motif || 'indisponible');
            const choisi = r.conducteur && r.conducteur.id === c.id;
            h += `<div style="padding-left:10px;">${choisi ? '✅' : '▫️'} ${esc(c.nom)} <span style="color:var(--muted);">(${c.du_jour ? 'déjà conducteur de la machine ce jour-là' : c.rang === 1 ? 'titulaire' : 'suppléant ' + (c.rang - 1)})</span> — ${esc(etat)}</div>`;
          });
        }
        if (r.debut_suggere) h += `<div>⏱ Début le <strong>${esc(r.debut_suggere.date.split('-').reverse().slice(0, 2).join('/'))} à ${esc(r.debut_suggere.heure)}</strong> : dès que ${r.conducteur ? esc(r.conducteur.nom) : 'le conducteur'} a fini sa tâche en cours (non prioritaire).</div>`;
        h += `<div style="margin-top:4px;"><strong>Aides</strong> : ${r.aides.length ? r.aides.map(a => esc(a.nom) + (a.competent ? '' : ' (sans compétence enregistrée)')).join(', ') : 'aucune'}.</div>`;
        (r.avertissements || []).forEach(w => { h += `<div style="color:var(--danger);">⚠ ${esc(w)}</div>`; });
        zone.innerHTML = h;
      } catch (e) { if (num === propNum) zone.innerHTML = `<span style="color:var(--danger);">Proposition indisponible (${esc(e.message)}).</span>`; }
    }
    document.getElementById('m-prop-btn').addEventListener('click', () => { persTouche = false; proposerPersonnel(false); });
    document.getElementById('m-machine').addEventListener('change', () => proposerPersonnel(true));
    document.getElementById('m-date').addEventListener('change', () => proposerPersonnel(true));
    // Opération manuelle : pas de machine à choisir.
    function ajusterMachine() {
      const opt = etapeSelect.selectedOptions && etapeSelect.selectedOptions[0];
      if (opt && opt.dataset.manuel === '1') document.getElementById('m-machine').value = '';
    }
    etapeSelect.addEventListener('change', () => { dateManuelle = false; majNoteEtape(null); ajusterMachine(); majJourDebut(); });
    document.getElementById('m-of').addEventListener('change', chargerEtapes);
    if (ofOptions) chargerEtapes();

    document.getElementById('m-submit').addEventListener('click', async () => {
      const gamme_operatoire_id = document.getElementById('m-etape').value;
      const machine_id = document.getElementById('m-machine').value;
      const date = document.getElementById('m-date').value;
      const personnel_ids = Array.from(document.querySelectorAll('#m-personnel-list input:checked')).map(i => i.value);
      if (conducteurPropose && personnel_ids.includes(conducteurPropose)) { personnel_ids.splice(personnel_ids.indexOf(conducteurPropose), 1); personnel_ids.unshift(conducteurPropose); }   // le conducteur est le référent du créneau
      const msg = document.getElementById('m-msg');

      if (statutChoisi() === 'planifié') {
        msg.innerHTML = `<div class="msg error">Cette étape est déjà planifiée : déplanifiez-la d'abord (boutons ci-dessus).</div>`;
        return;
      }
      if (!gamme_operatoire_id || !date) {
        msg.innerHTML = `<div class="msg error">Étape et jour sont requis.</div>`;
        return;
      }
      const optChoisie = etapeSelect.selectedOptions[0];
      if (!machine_id && optChoisie && optChoisie.dataset.manuel === '0' && !confirm('Cette opération utilise normalement une machine. L\'affecter sans machine ?')) return;
      msg.innerHTML = `<div class="msg">Affectation en cours…</div>`;
      try {
        const envoyer = async (extra) => {
          const r = await fetch(`${API}/affecter-planning`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gamme_operatoire_id, machine_id: machine_id || null, date, personnel_ids, ...extra, ...(heureDebutProposee ? { heure_debut: heureDebutProposee } : {}) }),
          });
          return { res: r, data: await r.json() };
        };
        const extra = {};
        let { res, data } = await envoyer(extra);
        for (let tour = 0; tour < 3; tour++) {
          if (res.status === 409 && data.conflit === 'dependance' && !extra.forcer) {
            if (!confirm(`${data.error}\n\nAffecter quand même à la date choisie ?`)) {
              document.getElementById('m-date').value = data.date_suggeree;
              msg.innerHTML = `<div class="msg">Date remplacée par le premier jour possible. Cliquez sur Affecter pour valider.</div>`;
              return;
            }
            extra.forcer = true; ({ res, data } = await envoyer(extra)); continue;
          }
          if (res.status === 409 && data.conflit === 'conducteur' && !extra.forcer_conducteur) {
            // Un seul conducteur par machine et par jour : on propose de reprendre celui du jour.
            if (!confirm(`${data.error}\n\nOK = affecter quand même avec deux conducteurs différents.\nAnnuler = sélectionner ${data.conducteur_nom} comme conducteur.`)) {
              const cases = Array.from(document.querySelectorAll('#m-personnel-list input'));
              const ancien = personnel_ids[0];
              cases.forEach(c => { if (c.value === ancien) c.checked = false; if (c.value === data.conducteur_id) c.checked = true; });
              conducteurPropose = data.conducteur_id; persTouche = true;
              msg.innerHTML = `<div class="msg">${esc(data.conducteur_nom)} est sélectionné comme conducteur du jour. Cliquez sur Affecter pour valider.</div>`;
              return;
            }
            extra.forcer_conducteur = true; ({ res, data } = await envoyer(extra)); continue;
          }
          break;
        }
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        msg.innerHTML = `<div class="msg ok">Affecté.</div>`;
        const c0 = data.creneaux && data.creneaux[0];
        toast(c0 && c0.heure_debut && !heureDebutProposee && c0.heure_debut.slice(0, 5) !== '08:00' ? `Affectation enregistrée — démarre à ${c0.heure_debut.slice(0, 5)} (après la tâche précédente).` : 'Affectation enregistrée.');
        chargerDonneesReelles(); if (retour) retour(); else fermerModale();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }

  // Report automatique des tâches non terminées : une fois par jour à l'ouverture, ou à la demande (bouton).
  async function reporterTachesNonTerminees(manuel) {
    try {
      const res = await fetch(`${API}/reporter-retards`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const d = await res.json(); if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
      try { localStorage.setItem('report_auto_date', new Date().toLocaleDateString('sv-SE')); } catch (e) { /* stockage indisponible */ }
      const faits = (d.ofs || []).filter(o => o.applique);
      const echecs = (d.ofs || []).filter(o => o.retard && !o.applique);
      if (faits.length) { toast(`${faits.length} OF replanifié(s) : tâches non terminées reportées (${faits.map(o => o.numero).join(', ')}).`); chargerDonneesReelles(); }
      if (echecs.length) toast(`Report impossible pour ${echecs.map(o => o.numero + ' (' + (o.raison || '?') + ')').join(' ; ')}`, 'error');
      if (manuel && !faits.length && !echecs.length) toast('Aucune tâche non terminée à reporter.');
    } catch (e) { if (manuel) toast(`Report impossible : ${e.message}`, 'error'); }
  }
  document.addEventListener('click', (ev) => { if (ev.target.closest && ev.target.closest('#report-btn')) reporterTachesNonTerminees(true); });
  setTimeout(() => {
    let deja = null; try { deja = localStorage.getItem('report_auto_date'); } catch (e) { /* ignoré */ }
    if (deja !== new Date().toLocaleDateString('sv-SE')) reporterTachesNonTerminees(false);
  }, 4000);

  chargerDonneesReelles();
  demarrerMessagerie();
})();
</script>
</body>
</html>
