  // ---------- Affichage collectif : tout le personnel sur une page, en grille horaire ----------
  async function genererAffichageCollectif(date) {
    const res = await fetch(`${API}/feuille-journaliere?date=${date}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
    await chargerLibsPdf();

    const mn = (t) => { const [h, m] = String(t).split(':'); return Number(h) * 60 + Number(m); };
    const gens = [
      ...data.personnes.map(p => ({ nom: p.nom, poste: p.poste, statut: p.statut, plage: p.plage, commentaire: p.commentaire, creneaux: p.creneaux })),
      ...data.presents_sans_tache.map(p => ({ nom: p.nom, poste: p.poste, statut: 'présent', plage: '', commentaire: '', creneaux: [] })),
    ].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    // Créneaux planifiés mais sans personne : une ligne « NON AFFECTÉ » par machine, pour que rien ne manque sur l'affichage.
    const parMachine = {};
    data.sans_personnel.forEach(c => { (parMachine[c.machine] = parMachine[c.machine] || []).push(c); });
    Object.entries(parMachine).forEach(([mach, cs]) => gens.push({ nom: 'NON AFFECTE', poste: mach.replace(/\s*\(.*\)$/, ''), statut: 'présent', plage: '', commentaire: '', creneaux: cs, sansPers: true }));

    // Horaires de l'atelier : lun-ven 8h00-12h00 / 12h30-16h30 (pause 12h00-12h30) ; heures supplémentaires 7h00-12h00 / 12h30-17h30 ;
    // samedi exceptionnel 6h00-12h00 sans pause. Le mode du jour se déduit de la date et des créneaux planifiés.
    const jourSemaine = new Date(date + 'T12:00:00Z').getUTCDay();
    const horsNormal = gens.some(g => g.creneaux.some(c => (c.debut && c.debut < '08:00') || (c.fin && c.fin > '16:30')));
    const MODE = jourSemaine === 6 ? 'samedi' : (horsNormal ? 'heures_sup' : 'normal');
    const J = MODE === 'samedi' ? { d: 6 * 60, pd: 12 * 60, pf: 12 * 60, f: 12 * 60 }
      : (MODE === 'heures_sup' ? { d: 7 * 60, pd: 12 * 60, pf: 12 * 60 + 30, f: 17 * 60 + 30 } : { d: 8 * 60, pd: 12 * 60, pf: 12 * 60 + 30, f: 16 * 60 + 30 });
    const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    // Axe horaire : exactement la journée de l'atelier ; élargi seulement si un créneau sort de ces horaires.
    let h0 = J.d, h1 = J.f;
    gens.forEach(g => g.creneaux.forEach(c => { if (c.debut) h0 = Math.min(h0, mn(c.debut)); if (c.fin) h1 = Math.max(h1, mn(c.fin)); }));
    h0 = Math.floor(h0 / 30) * 30; h1 = Math.ceil(h1 / 30) * 30;
    // Un créneau est enregistré d'un seul tenant même s'il enjambe la pause : on le dessine en deux morceaux (avant / après la pause).
    const morceauxDe = (d, f) => {
      if (d < J.pd && f > J.pf) return [[d, J.pd], [J.pf, f]];
      if (d < J.pd && f > J.pd && f <= J.pf) return [[d, J.pd]];
      if (d >= J.pd && d < J.pf && f > J.pf) return [[J.pf, f]];
      return [[d, f]];
    };

    // Couleur par OF
    const PALETTE = [[200,230,225],[250,220,190],[210,220,245],[245,210,225],[225,240,190],[235,215,250],[255,240,170],[200,235,245],[250,205,200],[215,235,215],[240,225,205],[220,220,235]];
    const ofs = [...new Set(data.personnes.flatMap(p => p.creneaux).concat(data.sans_personnel).map(c => c.of).filter(Boolean))];   // les temps libres hors OF n'ont pas d'OF : grisés, hors légende
    const couleurOf = Object.fromEntries(ofs.map((o, i) => [o, PALETTE[i % PALETTE.length]]));

    const grand = gens.length > 13;
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: grand ? 'a3' : 'a4' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const maj = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const M = 8, nomW = 42, x0 = M + nomW, gw = W - M - x0;
    const px = (min) => x0 + ((min - h0) / (h1 - h0)) * gw;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(grand ? 24 : 18);
    doc.text('Affectation du personnel', M, 13);
    doc.text(pdfTxt(maj(dateFr(date))), W - M, 13, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(100);
    doc.text(pdfTxt(`Atelier Babouot - edite le ${new Date().toLocaleString('fr-FR')}`), M, 18);
    doc.setTextColor(0);

    // Lecture des lignes : lanes si chevauchement
    gens.forEach(g => {
      const tri = g.creneaux.slice().sort((a, b) => (a.debut ? mn(a.debut) : h0) - (b.debut ? mn(b.debut) : h0));
      const fins = [];
      tri.forEach(c => {
        const d = c.debut ? mn(c.debut) : J.d, f = c.fin ? mn(c.fin) : J.f;   // sans horaire : toute la journée de l'atelier
        let l = fins.findIndex(x => x <= d); if (l < 0) { l = fins.length; fins.push(0); }
        fins[l] = f; c._l = l; c._d = d; c._f = f;
      });
      g.lanes = Math.max(1, fins.length);
    });

    const yHead = 22, hHead = 7;
    const legendeH = Math.min(40, 8 + Math.ceil(ofs.length / 2) * 5);
    const dispo = H - yHead - hHead - legendeH - 14;
    const totLanes = gens.reduce((s, g) => s + g.lanes, 0) || 1;
    const hLane = Math.max(11, Math.min(26, dispo / totLanes));

    // En-tête horaire
    doc.setFillColor(30, 90, 100); doc.rect(M, yHead, W - 2 * M, hHead, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('Personnel', M + 2, yHead + 4.8);
    for (let t = Math.ceil(h0 / 60) * 60; t < h1; t += 60) doc.text(`${String(t / 60).padStart(2, '0')}h`, px(t) + 1.5, yHead + 4.8);
    doc.setFontSize(7.5);
    if (J.pf > J.pd) doc.text('12h30', px(J.pf) + 1.5, yHead + 4.8);      // reprise après la pause
    doc.setTextColor(0);

    let y = yHead + hHead;
    gens.forEach((g, i) => {
      const hRow = g.lanes * hLane;
      if (i % 2 === 0) { doc.setFillColor(247, 248, 249); doc.rect(M, y, W - 2 * M, hRow, 'F'); }
      // hors horaires de l'atelier (seulement si l'axe a dû être élargi) puis pause
      doc.setFillColor(238, 238, 238);
      if (h0 < J.d) doc.rect(px(h0), y, px(J.d) - px(h0), hRow, 'F');
      if (h1 > J.f) doc.rect(px(J.f), y, px(h1) - px(J.f), hRow, 'F');
      if (J.pf > J.pd) { doc.setFillColor(222, 222, 222); doc.rect(px(J.pd), y, px(J.pf) - px(J.pd), hRow, 'F'); }
      // grille verticale
      doc.setDrawColor(215); doc.setLineWidth(0.15);
      for (let t = Math.ceil(h0 / 60) * 60; t <= h1; t += 60) doc.line(px(t), y, px(t), y + hRow);
      doc.line(M, y + hRow, W - M, y + hRow);

      // nom
      doc.setFont('helvetica', 'bold'); doc.setFontSize(grand ? 11 : 10);
      if (g.sansPers) { doc.setFillColor(253, 232, 224); doc.rect(M, y, nomW, hRow, 'F'); doc.setTextColor(180, 60, 30); }
      doc.text(pdfTxt(g.nom), M + 2, y + hRow / 2 - (g.poste ? 0.5 : -1.2), { maxWidth: nomW - 3 });
      doc.setTextColor(0);
      if (g.poste) { doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(g.sansPers ? 180 : 100, g.sansPers ? 60 : 100, g.sansPers ? 30 : 100); doc.text(pdfTxt(g.poste), M + 2, y + hRow / 2 + 3.2, { maxWidth: nomW - 3 }); doc.setTextColor(0); }

      if (!g.creneaux.length) {
        const indispo = !['présent', 'disponible'].includes(g.statut);
        doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(indispo ? 180 : 130, indispo ? 60 : 130, indispo ? 40 : 130);
        doc.text(pdfTxt(indispo ? `${g.statut.toUpperCase()}${g.plage ? ' ' + g.plage : ''}${g.commentaire ? ' - ' + g.commentaire : ''}` : 'Disponible - sans affectation'), x0 + 3, y + hRow / 2 + 1);
        doc.setTextColor(0);
      }
      g.creneaux.forEach(cr => morceauxDe(cr._d, cr._f).forEach(([ma, mb]) => {
        const c = Object.assign({}, cr, { debut: hm(ma), fin: hm(mb) });   // horaire propre à ce morceau
        const bx = px(ma), bw = px(mb) - bx - 0.4, by = y + cr._l * hLane + 0.8, bh = hLane - 1.6;
        const col = couleurOf[c.of] || [230, 230, 230];
        doc.setFillColor(...col); doc.setDrawColor(90); doc.setLineWidth(0.25);
        if (g.sansPers) { doc.setDrawColor(180, 60, 30); doc.setLineDashPattern([1.2, 0.8], 0); }
        doc.roundedRect(bx + 0.2, by, bw, bh, 1, 1, 'FD');
        doc.setLineDashPattern([], 0);
        const base = grand ? 8.5 : 7.5;
        const grandBloc = bh >= 17;
        const nbL = grandBloc ? 4 : 3;
        const fs = Math.max(5.8, Math.min(base, (bh - 1.2) / (nbL * 0.43)));
        const pas = fs * 0.43;
        const nomMachine = c.machine.replace(/\s*\(.*\)$/, '');
        const horaire = `${c.debut}-${c.fin}`;
        const titre = [c.titre, c.client].filter(Boolean).join(' - ') || c.of;
        // Le titre du travail en gros et en gras ; l'opération, la machine ; le n° d'OF et l'horaire en petit.
        const titreGros = [c.titre, c.client].filter(Boolean).join(' - ') || c.operation || c.of;
        const items = grandBloc
          ? [['b', titreGros, 1.12], ['n', c.operation, 1], ['n', nomMachine, 1], ['n', [c.of, horaire].filter(Boolean).join('  '), 0.82]]
          : [['b', titreGros, 1.1], ['n', [c.operation, nomMachine].filter(Boolean).join(' | '), 1], ['n', [c.of, horaire].filter(Boolean).join('  '), 0.82]];
        if (bw < 22) {
          // Bloc étroit : seul le titre, sur plusieurs lignes courtes (le détail figure sur la feuille détaillée).
          doc.setFont('helvetica', 'bold'); doc.setFontSize(fs);
          const coupe = (t) => { let r = t; while (r.length > 1 && doc.getTextWidth(r) > bw - 1.6) r = r.slice(0, -1); return r; };
          const maxL = Math.max(1, Math.floor((bh - 1) / pas));
          doc.splitTextToSize(pdfTxt(titreGros), bw - 1.6).slice(0, maxL).forEach((l, k) => doc.text(coupe(l), bx + 1, by + 0.8 + (k + 1) * pas));
        } else items.forEach(([st, txt, echelle], k) => {
          doc.setFont('helvetica', st === 'b' ? 'bold' : 'normal'); doc.setFontSize(fs * echelle);
          const l = doc.splitTextToSize(pdfTxt(txt), bw - 2)[0] || '';
          doc.text(l, bx + 1.2, by + 0.8 + (k + 1) * pas);
        });
      }));
      y += hRow;
    });
    doc.setDrawColor(150); doc.setLineWidth(0.3); doc.rect(M, yHead, W - 2 * M, y - yHead);

    // Légende des OF
    y += 5;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('Ordres de fabrication du jour', M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    const detail = {};
    data.personnes.flatMap(p => p.creneaux).concat(data.sans_personnel).forEach(c => { detail[c.of] = c; });
    const colW = (W - 2 * M) / 2;
    ofs.forEach((o, i) => {
      const c = detail[o]; const cx = M + (i % 2) * colW, cy = y + 5 + Math.floor(i / 2) * 5;
      doc.setFillColor(...couleurOf[o]); doc.setDrawColor(90); doc.rect(cx, cy - 3, 6, 3.6, 'FD');
      doc.text(pdfTxt(`${c.titre || o}${c.client ? ' (' + c.client + ')' : ''}${c.quantite != null ? ' - ' + Number(c.quantite).toLocaleString('fr-FR') + ' ex.' : ''}${c.delai ? ' - livraison ' + dateCourte(c.delai) : ''}  [${o}]`), cx + 8, cy, { maxWidth: colW - 10 });
    });
    if (data.sans_personnel.length) {
      doc.setTextColor(180, 60, 30); doc.setFont('helvetica', 'bold');
      doc.text(pdfTxt(`Attention : ${data.sans_personnel.length} creneau(x) planifie(s) sans personnel affecte (lignes NON AFFECTE).`), W - M, H - 7, { align: 'right' });
      doc.setTextColor(0);
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(110);
    doc.text(MODE === 'samedi' ? 'Samedi exceptionnel : 6h00-12h00, sans pause.' : (MODE === 'heures_sup' ? 'Heures supplementaires : 7h00-12h00 et 12h30-17h30 - zone grisee : pause 12h00-12h30.' : 'Horaires atelier : 8h00-12h00 et 12h30-16h30 - zone grisee : pause 12h00-12h30.'), M, H - 7); doc.setTextColor(0);
    doc.save(`affichage-personnel-${date}.pdf`);
  }

  // ---------- Feuille de la semaine (à titre indicatif) : personnel × jours, titre en gros, n° d'OF en petit ----------
  async function genererFeuilleSemaine(dateIso) {
    const res = await fetch(`${API}/feuille-semaine?date=${dateIso}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
    await chargerLibsPdf();
    const jours = data.jours;
    const JOURS_LONGS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const nomJour = (iso) => JOURS_LONGS[new Date(iso + 'T12:00:00Z').getUTCDay()];
    const maj = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const jm = (iso) => `${Number(iso.slice(8, 10))} ${MOIS_FR[Number(iso.slice(5, 7)) - 1]}`;
    const longJour = (iso) => `${nomJour(iso)} ${jm(iso)}`;
    const d0 = data.semaine.debut, d1 = data.semaine.fin;
    const libSemaine = `Semaine du ${Number(d0.slice(8, 10))}${d0.slice(5, 7) !== d1.slice(5, 7) ? ' ' + MOIS_FR[Number(d0.slice(5, 7)) - 1] : ''} au ${jm(d1)} ${d1.slice(0, 4)}`;

    // Affichage collectif : TOUJOURS une seule page A3 paysage. Si le contenu déborde, on réduit l'échelle (polices et blocs)
    // et on recommence jusqu'à ce que tout tienne.
    const kp = 420 / 297;                    // échelle A3 (référence : A4 = 1)
    let k = kp, doc = null, y = 0;
    for (let essai = 0; essai < 30; essai++) {
    doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const M = 8 * kp, nomW = 34 * kp, dayW = (W - 2 * M - nomW) / jours.length, maxY = H - 14 * kp;
    const LH = (pt) => pt * 0.3528 * 1.2;                  // hauteur d'une ligne (mm) pour une taille en points
    const F = { titre: 9.5 * k, of: 6.8 * k, mach: 7.6 * k, nom: 10 * k, poste: 7 * k };
    const PALETTE = [[200, 230, 225], [250, 220, 190], [210, 220, 245], [245, 210, 225], [225, 240, 190], [235, 215, 250], [255, 240, 170], [200, 235, 245], [250, 205, 200], [215, 235, 215], [240, 225, 205], [220, 220, 235]];
    const cles = [];
    data.personnes.forEach((p) => jours.forEach((j) => p.jours[j].travaux.forEach((t) => { if (!cles.includes(t.cle)) cles.push(t.cle); })));
    const couleur = (t) => (t.libre ? [232, 228, 244] : PALETTE[cles.indexOf(t.cle) % PALETTE.length]);
    const couper = (lignes, max) => { if (lignes.length <= max) return lignes; const l = lignes.slice(0, max); l[max - 1] = l[max - 1].replace(/\s*\S{0,2}$/, '') + '...'; return l; };

    // Bloc d'un travail pour une largeur donnée : titre (gros), n° d'OF et quantité (petit), machines ou équipement.
    const mesurer = (t, bw) => {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(F.titre);
      const lt = couper(doc.splitTextToSize(pdfTxt(t.titre || t.of), bw - 3 * k), 3);       // titre inconnu : le n° d'OF en tient lieu
      const ofTxt = t.titre && t.of ? pdfTxt([t.of, t.quantite != null ? Number(t.quantite).toLocaleString('fr-FR') + ' ex.' : ''].filter(Boolean).join('   -   ')) : '';
      doc.setFont('helvetica', 'normal'); doc.setFontSize(F.mach);
      const equip = t.machines.length ? t.machines : (t.libre ? [] : t.operations);        // travail manuel : l'opération tient lieu d'équipement
      const lm = equip.length ? couper(doc.splitTextToSize(pdfTxt(equip.join(' + ')), bw - 3 * k), 2) : [];
      return { t, lt, ofTxt, lm, h: 1.4 * k + lt.length * LH(F.titre) + (ofTxt ? LH(F.of) : 0) + lm.length * LH(F.mach) + 1.4 * k };
    };
    // Jours consécutifs avec exactement les mêmes travaux : un seul bloc qui s'étend sur ces jours.
    const decouper = (p) => {
      const cle = jours.map((j) => { const x = p.jours[j]; return x.travaux.length ? x.travaux.map((t) => t.cle).sort().join('||') : (x.absent ? 'ABS' : ''); });
      const segs = [];
      for (let i = 0; i < jours.length;) {
        let n = 1; while (i + n < jours.length && cle[i + n] === cle[i]) n++;
        const seg = { i, n, cle: cle[i], blocs: [], h: 0 };
        if (seg.cle && seg.cle !== 'ABS') { seg.blocs = p.jours[jours[i]].travaux.map((t) => mesurer(t, n * dayW - 2 * k)); seg.h = 2 * k + seg.blocs.reduce((a, b) => a + b.h, 0) + (seg.blocs.length - 1) * 1 * k; }
        else if (seg.cle === 'ABS') seg.h = 9 * k;
        segs.push(seg); i += n;
      }
      return segs;
    };

    const enteteTable = (yTop) => {
      doc.setFillColor(30, 90, 100); doc.rect(M, yTop, W - 2 * M, 7 * k, 'F');
      doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5 * k);
      doc.text('Personnel', M + 2 * k, yTop + 4.8 * k);
      jours.forEach((j, c) => doc.text(pdfTxt(`${maj(nomJour(j))} ${Number(j.slice(8, 10))}`), M + nomW + c * dayW + dayW / 2, yTop + 4.8 * k, { align: 'center' }));
      doc.setTextColor(0);
      return yTop + 7 * k;
    };

    // ---- Première page : titre, mention « à titre indicatif » ----
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18 * k); doc.setTextColor(0);
    doc.text('Planning de la semaine - placement du personnel', M, 13 * k);
    doc.setFontSize(13 * k); doc.text(pdfTxt(libSemaine), W - M, 13 * k, { align: 'right' });
    doc.setFillColor(255, 236, 200); doc.setDrawColor(230, 160, 20); doc.setLineWidth(0.3 * k);
    doc.roundedRect(M, 17 * k, W - 2 * M, 7 * k, 1.2 * k, 1.2 * k, 'FD');
    doc.setFontSize(9.5 * k); doc.setTextColor(120, 70, 0);
    doc.text(pdfTxt("A TITRE INDICATIF - ce planning peut évoluer selon les aléas de production, les absences et les urgences."), M + 3 * k, 21.7 * k);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5 * k); doc.setTextColor(100);
    doc.text(pdfTxt(`Ateliers Babouot  -  ${data.personnes.length} personne(s) affectée(s)  -  édité le ${new Date().toLocaleString('fr-FR')}`), M, 28 * k);
    doc.setTextColor(0);
    y = enteteTable(31 * k);
    if (!data.personnes.length) {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(11 * k); doc.text('Aucun créneau planifié cette semaine-là.', M, y + 8 * k); y += 14 * k;
    }
    data.personnes.forEach((p, idx) => {
      const segs = decouper(p);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(F.nom);
      const lignesNom = doc.splitTextToSize(pdfTxt(p.nom), nomW - 3 * k).slice(0, 2);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(F.poste);
      const lignesPoste = p.poste ? doc.splitTextToSize(pdfTxt(p.poste), nomW - 3 * k).slice(0, 3) : [];
      const yPoste = 5 * k + (lignesNom.length - 1) * F.nom * 0.3528 * 1.15 + 4.4 * k;
      const rowH = Math.max(15 * k, yPoste + (lignesPoste.length ? (lignesPoste.length - 1) * F.poste * 0.3528 * 1.15 + 2.5 * k : 0), ...segs.map((s) => s.h));
      if (idx % 2 === 0) { doc.setFillColor(247, 248, 249); doc.rect(M, y, W - 2 * M, rowH, 'F'); }
      doc.setDrawColor(205); doc.setLineWidth(0.15 * k);
      for (let c = 0; c <= jours.length; c++) { const x = M + nomW + c * dayW; doc.line(x, y, x, y + rowH); }
      doc.line(M, y + rowH, W - M, y + rowH); doc.line(M, y, M, y + rowH);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(F.nom); doc.setTextColor(0);
      doc.text(lignesNom, M + 2 * k, y + 5 * k);
      if (lignesPoste.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(F.poste); doc.setTextColor(100); doc.text(lignesPoste, M + 2 * k, y + yPoste); doc.setTextColor(0); }
      segs.forEach((s) => {
        const bx = M + nomW + s.i * dayW + 1 * k, bw = s.n * dayW - 2 * k;
        if (s.cle === 'ABS') {
          doc.setFillColor(232, 232, 232); doc.setDrawColor(190); doc.setLineWidth(0.2 * k); doc.roundedRect(bx, y + 1 * k, bw, rowH - 2 * k > 8 * k ? 7 * k : rowH - 2 * k, 1 * k, 1 * k, 'FD');
          doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5 * k); doc.setTextColor(110); doc.text('Absent(e)', bx + bw / 2, y + 5.4 * k, { align: 'center' }); doc.setTextColor(0);
          return;
        }
        let by = y + 1 * k;
        s.blocs.forEach((b) => {
          doc.setFillColor(...couleur(b.t)); doc.setDrawColor(120); doc.setLineWidth(0.2 * k); doc.roundedRect(bx, by, bw, b.h, 1.2 * k, 1.2 * k, 'FD');
          let cy = by + 1.4 * k;
          doc.setFont('helvetica', 'bold'); doc.setFontSize(F.titre); doc.setTextColor(0);
          b.lt.forEach((l) => { doc.text(l, bx + 1.6 * k, cy + LH(F.titre) * 0.8); cy += LH(F.titre); });
          if (b.ofTxt) { doc.setFont('helvetica', 'normal'); doc.setFontSize(F.of); doc.setTextColor(95); doc.text(b.ofTxt, bx + 1.6 * k, cy + LH(F.of) * 0.8); cy += LH(F.of); }
          doc.setFont('helvetica', 'normal'); doc.setFontSize(F.mach); doc.setTextColor(25, 55, 65);
          b.lm.forEach((l) => { doc.text(l, bx + 1.6 * k, cy + LH(F.mach) * 0.8); cy += LH(F.mach); });
          doc.setTextColor(0);
          by += b.h + 1 * k;
        });
      });
      y += rowH;
    });
    doc.setDrawColor(150); doc.setLineWidth(0.3 * k);

    // ---- Zones sous le tableau : absents (sans motif) et dates de reprise prévisionnelles, sans affectation, sans personnel ----
    const zone = (titre, lignes, fond, encre) => {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5 * k);
      const toutes = lignes.flatMap((l) => doc.splitTextToSize(pdfTxt(l), W - 2 * M - 6 * k));
      const lh = LH(8.5 * k), hBox = 8 * k + toutes.length * lh;
      y += 4 * k;
      doc.setFillColor(...fond); doc.roundedRect(M, y, W - 2 * M, hBox, 1.5 * k, 1.5 * k, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5 * k); doc.setTextColor(...encre); doc.text(pdfTxt(titre), M + 3 * k, y + 5 * k);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5 * k); doc.setTextColor(30);
      toutes.forEach((l, i) => doc.text(l, M + 3 * k, y + 8.6 * k + i * lh));
      doc.setTextColor(0); y += hBox;
    };
    if (data.absents.length) {
      zone('Absents de la semaine - dates de reprise prévisionnelles', [
        ...data.absents.map((a) => `${a.nom}${a.poste ? ' (' + a.poste + ')' : ''}   -   ${a.reprise_inconnue ? 'absent(e) depuis le ' + longJour(a.du) : (a.du === a.au ? 'absent(e) le ' + longJour(a.du) : 'absent(e) du ' + longJour(a.du) + ' au ' + longJour(a.au))}   -   ${a.reprise ? 'reprise prévue le ' + longJour(a.reprise) : 'date de reprise non communiquée'}`),
        "Dates de reprise données à titre prévisionnel : elles peuvent évoluer.",
      ], [250, 236, 228], [150, 60, 30]);
    }
    if (data.sans_affectation.length) zone('Présents sans affectation cette semaine', [data.sans_affectation.map((x) => x.nom).join(', ')], [236, 244, 238], [40, 110, 70]);
    if (data.sans_personnel.length) {
      zone('Attention - travaux planifiés sans personne affectée', data.sans_personnel.map((t) => `${maj(longJour(t.jour))}   -   ${t.titre || t.of}${t.titre && t.of ? ' (' + t.of + ')' : ''}${t.machines.length ? '   -   ' + t.machines.join(' + ') : ''}`), [253, 232, 224], [180, 60, 30]);
    }

    // ---- Pied de page ----
    doc.setPage(1); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5 * kp); doc.setTextColor(110);
    doc.text(pdfTxt("Document à titre indicatif - planning susceptible d'évoluer.     Chef d'atelier : ____________________"), M, H - 6 * kp);
    if (y <= maxY) break;                  // tout tient sur la page
    k *= 0.96;                             // sinon : on réduit et on recommence
    }
    if (doc.internal.getNumberOfPages() > 1) throw new Error('Mise en page de la feuille de la semaine : plusieurs pages inattendues.');
    doc.save(`planning-semaine-${d0}.pdf`);
  }

  // ───────────── Rapport de production d'un OF (traçabilité + retour d'expérience + plan d'amélioration) ─────────────
  async function genererRapportOf(ofUuid) {
    const res = await fetch(`${API}/rapport-of?of_id=${encodeURIComponent(ofUuid)}`);
    const R = await lireJson(res);
    if (!res.ok) throw new Error(R.error || R.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
    await chargerLibsPdf();
    const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const ML = 12, MR = 12, LARG = W - ML - MR;
    const T = (v) => pdfTxt(String(v == null ? '' : v).replace(/→/g, '->').replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, '$3/$2/$1')).replace(/[—–]/g, '-').replace(/≈/g, '~').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[  ]/g, ' ');
    const hFr = (h) => { if (h === null || h === undefined || !Number.isFinite(Number(h))) return '-'; const m = Math.round(Math.abs(Number(h)) * 60); return (Number(h) < 0 ? '-' : '') + Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
    const sgn = (v, u) => (v === null || v === undefined || !Number.isFinite(Number(v))) ? '-' : (Number(v) > 0 ? '+' : '') + String(Math.round(Number(v) * 10) / 10).replace('.', ',') + (u || '');
    const dc = (iso) => iso ? dateCourte(String(iso).slice(0, 10)) : '-';
    const nb = (v) => (v === null || v === undefined) ? '-' : Number(v).toLocaleString('fr-FR').replace(/[  ]/g, ' ');
    const euro = (v) => (v === null || v === undefined) ? '-' : Math.round(Number(v)).toLocaleString('fr-FR').replace(/[  ]/g, ' ') + ' EUR';
    const VERDICT = { conforme: 'Conforme', depassement: 'Dépassement', avance: 'En avance', en_cours: 'En cours', non_saisi: 'Non saisi' };
    const COUL = { rouge: [185, 28, 28], vert: [21, 128, 61], orange: [194, 100, 10], gris: [100, 110, 125], encre: [30, 41, 59] };
    const ENTETE = { fillColor: [51, 65, 85], textColor: 255, fontSize: 8, fontStyle: 'bold' };
    const BASE = { fontSize: 8, cellPadding: 1.6, lineColor: [215, 220, 228], lineWidth: 0.1, valign: 'top', textColor: 30 };
    const M = { top: 16, bottom: 14, left: ML, right: MR };
    let y = 18;

    const place = (h) => { if (y + h > H - 16) { doc.addPage(); y = 18; } };
    const section = (num, titre) => {
      y += 3; place(16); doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...COUL.encre);
      doc.text(T(`${num}. ${titre}`), ML, y); doc.setDrawColor(51, 65, 85); doc.setLineWidth(0.4); doc.line(ML, y + 1.5, W - MR, y + 1.5);
      y += 5; doc.setFont('helvetica', 'normal'); doc.setTextColor(0);
    };
    const paragraphe = (txt, o = {}) => {
      doc.setFont('helvetica', o.gras ? 'bold' : 'normal'); doc.setFontSize(o.taille || 9); doc.setTextColor(...(o.couleur || [30, 41, 59]));
      const l = doc.splitTextToSize(T(txt), LARG - (o.retrait || 0));
      place(l.length * (o.taille || 9) * 0.42 + 2); doc.text(l, ML + (o.retrait || 0), y + 3);
      y += l.length * (o.taille || 9) * 0.42 + 2.5; doc.setTextColor(0); doc.setFont('helvetica', 'normal');
    };
    const tableau = (tete, corps, o = {}) => {
      if (!corps.length) return;
      doc.autoTable({ startY: y, margin: M, theme: 'grid', head: [tete.map(T)], body: corps.map(r => r.map(c => (c && typeof c === 'object' && 'content' in c) ? { ...c, content: T(c.content) } : T(c))),
        styles: BASE, headStyles: ENTETE, alternateRowStyles: { fillColor: [247, 248, 250] }, columnStyles: o.cols || {}, rowPageBreak: 'avoid', ...(o.extra || {}) });
      y = doc.lastAutoTable.finalY + 4;
    };
    const vide = (txt) => paragraphe(txt, { couleur: COUL.gris });

    const I = R.identite, D = R.delai, K = R.kpi, C = R.cycle;

    // ── En-tête ──
    doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(...COUL.encre);
    doc.text('Rapport de production', ML, y);
    doc.setFontSize(10); doc.setTextColor(...(R.provisoire ? COUL.orange : COUL.vert));
    doc.text(R.provisoire ? 'RAPPORT PROVISOIRE (OF non terminé)' : 'RAPPORT DEFINITIF (OF terminé)', W - MR, y, { align: 'right' });
    y += 6; doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...COUL.gris);
    doc.text(T(`Ateliers Babouot - traçabilité, retour d'expérience et plan d'amélioration - édité le ${dc(R.genere_le)}`), ML, y);
    y += 5; doc.setTextColor(0);

    // ── 1. Identité & verdict délai ──
    section(1, 'Identification et respect du délai');
    doc.autoTable({ startY: y, margin: M, theme: 'grid', styles: BASE, body: [
      [{ content: 'Titre', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, T(I.titre || '-'), { content: 'N° d\'OF', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, T(I.numero)],
      [{ content: 'Client', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, T(I.client || '-'), { content: 'Quantité commandée', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, nb(I.quantite) + ' ex.'],
      [{ content: 'Type de production', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, T(I.type_production || '-'), { content: 'Priorité', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, T(I.priorite || '-')],
      [{ content: 'Créé le', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, dc(I.cree_le), { content: 'Matières reçues le', styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, I.date_reception ? dc(I.date_reception) : 'non renseigné'],
    ], columnStyles: { 0: { cellWidth: 34 }, 1: { cellWidth: 62 }, 2: { cellWidth: 38 } } });
    y = doc.lastAutoTable.finalY + 3;
    const okDelai = D.respecte === true, nonDelai = D.respecte === false;
    const coul = okDelai ? COUL.vert : nonDelai ? COUL.rouge : COUL.orange;
    doc.setFillColor(...coul.map(c => 255 - (255 - c) * 0.12)); doc.setDrawColor(...coul); doc.setLineWidth(0.5);
    const lignesDelai = doc.splitTextToSize(T(`Délai demandé : ${dc(D.delai)}   |   Fin réelle : ${D.fin_reelle ? dc(D.fin_reelle) : 'en cours'}   |   Fin prévue au lancement : ${D.fin_prevue_initiale ? dc(D.fin_prevue_initiale) : 'non journalisée'}`), LARG - 6);
    const hBloc = 11 + lignesDelai.length * 4.2; place(hBloc);
    doc.roundedRect(ML, y, LARG, hBloc, 1.5, 1.5, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...coul); doc.text(T(D.texte), ML + 3, y + 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(30, 41, 59); doc.text(lignesDelai, ML + 3, y + 11);
    y += hBloc + 3; doc.setTextColor(0);
    if (D.ecart_plan_initial_ouvres !== null && D.ecart_plan_initial_ouvres !== undefined) paragraphe(`Écart de la fin réelle par rapport à la fin prévue au lancement : ${sgn(D.ecart_plan_initial_ouvres)} jour(s) ouvré(s).`, { taille: 8.5 });
    if (D.changements && D.changements.length) paragraphe('Le délai de livraison a été modifié ' + D.changements.length + ' fois : ' + D.changements.map(c => `le ${dc(c.date)} de ${dc(c.ancien)} à ${dc(c.nouveau)}${c.origine ? ' (' + c.origine + ')' : ''}`).join(' ; ') + '.', { taille: 8.5 });

    // ── 2. Synthèse chiffrée ──
    section(2, 'Synthèse chiffrée');
    const kv = (a, b) => [{ content: a, styles: { fontStyle: 'bold', fillColor: [241, 244, 248] } }, b];
    doc.autoTable({ startY: y, margin: M, theme: 'grid', styles: BASE, columnStyles: { 0: { cellWidth: 50 }, 1: { cellWidth: 40 }, 2: { cellWidth: 50 } }, body: [
      [...kv('Cycle (1er -> dernier jour)', C && C.debut ? `${dc(C.debut)} -> ${dc(C.fin)}` : '-'), ...kv('Durée du cycle', C && C.debut ? `${C.jours_ouvres} j ouvrés (${C.jours_calendaires} j calendaires)` : '-')],
      [...kv('Jours de production effectifs', C && C.debut ? String(C.jours_production) : '-'), ...kv('Délai entre réception et lancement', C && C.avant_lancement_jours !== null && C.avant_lancement_jours !== undefined ? `${C.avant_lancement_jours} j calendaires (création -> 1er jour)` : '-')],
      [...kv('Heures standard (personnes)', hFr(K.heures_standard)), ...kv('Heures réelles saisies', hFr(K.heures_reelles))],
      [...kv('Écart global (étapes saisies)', K.ecart_global_pct === null || K.ecart_global_pct === undefined ? '-' : sgn(K.ecart_global_pct, ' %')), ...kv('Complétude de la saisie', K.completude_saisie_pct === null || K.completude_saisie_pct === undefined ? '-' : K.completude_saisie_pct + ' % des étapes')],
      [...kv('Coût main-d\'œuvre standard', K.cout_standard !== null && K.cout_standard !== undefined ? euro(K.cout_standard) : '-'), ...kv('Coût main-d\'œuvre réel', K.cout_reel !== null && K.cout_reel !== undefined ? euro(K.cout_reel) + (K.taux_horaire ? ` (à ${K.taux_horaire} EUR/h)` : '') : '-')],
      [...kv('Quantité produite (dernière étape)', K.quantite_produite_derniere_etape !== null && K.quantite_produite_derniere_etape !== undefined ? nb(K.quantite_produite_derniere_etape) + ' / ' + nb(K.quantite_commandee) : '-'), ...kv('Étapes terminées', `${K.nb_etapes_terminees} / ${K.nb_etapes}`)],
      [...kv('Replanifications / recalages', `${K.nb_replanifications} / ${K.nb_recalages}`), ...kv('Interventions machine / jours d\'absence', `${K.nb_interventions} / ${K.nb_absences_jours}`)],
    ] });
    y = doc.lastAutoTable.finalY + 2;
    paragraphe('Les écarts d\'heures sont calculés en heures·personne sur les seules étapes dont les heures ont été saisies ; les temps standards comparés sont les temps standards actuels de la gamme.', { taille: 7.5, couleur: COUL.gris });

    // ── 3. Prévu / réel par étape ──
    section(3, 'Prévu et réel par étape');
    tableau(['Étape', 'Machine', 'Std', 'Réel', 'Écart', 'Cadence std / réelle', 'Début réel', 'Fin prévue (lancement)', 'Fin réelle', 'Verdict'],
      R.etapes.map(e => {
        const col = e.verdict === 'depassement' ? COUL.rouge : e.verdict === 'avance' ? COUL.vert : e.verdict === 'conforme' ? COUL.vert : COUL.gris;
        return [`${e.sequence}. ${e.operation}`, (e.machines && e.machines.length ? e.machines.join(', ') : e.machine_prevue || '-'), hFr(e.std.total_h), hFr(e.reel.total_h),
          e.ecart_h === null || e.ecart_h === undefined ? '-' : `${sgn(e.ecart_h, ' h')}\n${sgn(e.ecart_pct, ' %')}`,
          e.cadence_std ? `${nb(e.cadence_std)} / ${e.cadence_reelle ? nb(e.cadence_reelle) : '-'} par h` : '-', dc(e.debut_reel), e.fin_prevue_initiale ? dc(e.fin_prevue_initiale) + (e.ecart_fin_jours ? `\n(${sgn(e.ecart_fin_jours)} j ouvrés)` : '') : '-', dc(e.fin_reelle),
          { content: VERDICT[e.verdict] || e.verdict, styles: { textColor: col, fontStyle: 'bold' } }];
      }), { cols: { 0: { cellWidth: 24 }, 1: { cellWidth: 16 }, 2: { cellWidth: 14 }, 3: { cellWidth: 14 }, 4: { cellWidth: 14 }, 5: { cellWidth: 20 }, 6: { cellWidth: 18 }, 7: { cellWidth: 20 }, 8: { cellWidth: 18 }, 9: { cellWidth: 22 } }, extra: { styles: { ...BASE, fontSize: 7.5 } } });

    // ── 4. Détail par étape ──
    section(4, 'Détail de chaque étape');
    R.etapes.forEach(e => {
      place(26);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...COUL.encre); doc.text(T(`${e.sequence}. ${e.operation}`) + (e.machines && e.machines.length ? T('  -  ' + e.machines.join(', ')) : ''), ML, y + 3); y += 4.5;
      doc.setTextColor(0);
      const reg = (a) => a === null || a === undefined ? 'non saisi' : hFr(a);
      const lignes = [
        ['Heures standard / réelles', `Standard ${hFr(e.std.total_h)} (réglage ${reg(e.std.reglage_h)}, production ${reg(e.std.production_h)}) - Réel ${e.reel.total_h === null || e.reel.total_h === undefined ? 'non saisi' : hFr(e.reel.total_h)} (réglage ${reg(e.reel.reglage_h)}, production ${reg(e.reel.production_h)}) sur ${e.reel.jours_saisis || 0} jour(s) saisi(s)`],
        ['Quantité', `${e.quantite_realisee > 0 ? nb(e.quantite_realisee) : 'non saisie'} réalisée(s) sur ${nb(e.quantite_etape)}${e.unite_quantite ? ' ' + e.unite_quantite : ''} - avancement ${e.avancement_pct === null || e.avancement_pct === undefined ? '-' : e.avancement_pct + ' %'}`],
        ['Personnes', e.heures_par_personne && Object.keys(e.heures_par_personne).length ? Object.entries(e.heures_par_personne).map(([n, h]) => `${n} (${hFr(h)})`).join(', ') : (e.personnes && e.personnes.length ? e.personnes.join(', ') + ' (heures individuelles non saisies)' : 'non renseigné')],
        ['Créneaux', `${e.nb_creneaux} créneau(x) planifié(s), ${hFr((e.minutes_planifiees || 0) / 60)} de temps machine prévu`],
      ];
      if (e.attente_jours !== null && e.attente_jours !== undefined) lignes.push(['Attente avant l\'étape', `${e.attente_jours} jour(s) ouvré(s) entre la fin de l'étape précédente et le début réel`]);
      if (e.commentaires && e.commentaires.length) lignes.push(['Commentaires saisis', e.commentaires.map(c => `${dc(c.date)} : ${c.texte}`).join('\n')]);
      doc.autoTable({ startY: y, margin: { ...M, left: ML + 3 }, theme: 'plain', styles: { ...BASE, fontSize: 8, cellPadding: 1, lineWidth: 0 }, columnStyles: { 0: { cellWidth: 38, fontStyle: 'bold', textColor: COUL.gris }, 1: { cellWidth: LARG - 41 } },
        body: lignes.map(r => [T(r[0]), T(r[1])]), rowPageBreak: 'avoid' });
      y = doc.lastAutoTable.finalY + 3;
    });

    // ── 5. Chronologie complète ──
    section(5, 'Chronologie complète');
    if (!R.changements.journal_disponible) paragraphe('Le journal de l\'OF n\'existait pas pendant cette production : seules les dates planifiées et saisies sont reconstituées.', { couleur: COUL.orange, taille: 8.5 });
    if (R.chronologie.length) tableau(['Date', 'Heure', 'Catégorie', 'Événement'], R.chronologie.map(c => [dc(c.date), c.heure || '', c.categorie, c.titre + (c.detail ? '\n' + c.detail : '')]), { cols: { 0: { cellWidth: 20 }, 1: { cellWidth: 12 }, 2: { cellWidth: 26 } } });
    else vide('Aucun événement enregistré.');

    // ── 6. Changements ──
    section(6, 'Changements intervenus pendant la production');
    const CH = R.changements;
    paragraphe(`Replanifications : ${CH.replanifications.length}  |  Recalages après retard : ${CH.recalages.length}  |  Changements de délai : ${CH.delais.length}  |  Saisies de production : ${CH.saisies.length}  |  Déplanifications : ${CH.deplanifications.length}  |  Affectations : ${CH.affectations.length}`, { gras: true, taille: 8.5 });
    if (CH.replanifications.length) tableau(['Date', 'Origine', 'Nouvelle fin', 'Délai'], CH.replanifications.map(r => [`${dc(r.date)} ${r.heure || ''}`, r.origine || '-', r.fin ? dc(r.fin) : '-', r.delai_tenu === true ? 'tenu' : r.delai_tenu === false ? 'NON tenu' : '-']), { cols: { 0: { cellWidth: 30 }, 2: { cellWidth: 26 }, 3: { cellWidth: 22 } } });
    if (CH.recalages.length) tableau(['Date', 'Retard constaté sur', 'Ancienne fin -> nouvelle fin', 'Appliqué'], CH.recalages.map(r => [`${dc(r.date)} ${r.heure || ''}`, (r.operations || []).join(', ') || '-', `${r.ancienne_fin ? dc(r.ancienne_fin) : '-'} -> ${r.nouvelle_fin ? dc(r.nouvelle_fin) : '-'}`, r.applique ? 'oui' : 'non']), { cols: { 0: { cellWidth: 30 }, 2: { cellWidth: 48 }, 3: { cellWidth: 18 } } });
    if (CH.deplanifications.length || CH.affectations.length) tableau(['Date', 'Changement'], [...CH.deplanifications, ...CH.affectations].sort((a, b) => String(a.date).localeCompare(String(b.date))).map(c => [`${dc(c.date)} ${c.heure || ''}`, c.resume || c.texte || '']), { cols: { 0: { cellWidth: 30 } } });
    if (CH.saisies.some(s => s.supprime)) paragraphe('Certaines saisies ont été corrigées ou supprimées : ' + CH.saisies.filter(s => s.supprime).map(s => `${dc(s.jour)} ${s.operation}`).join(', ') + '.', { taille: 8.5 });
    if (!CH.replanifications.length && !CH.recalages.length && !CH.delais.length && !CH.deplanifications.length && !CH.affectations.length) vide(CH.journal_disponible ? 'Aucun changement de planning enregistré : le plan initial a été suivi.' : 'Changements non reconstituables (journal absent).');
    if (CH.observations.length) { paragraphe('Observations saisies :', { gras: true, taille: 8.5 }); CH.observations.forEach(o => paragraphe(`${o.date ? dc(o.date) + ' - ' : ''}${o.texte}`, { retrait: 3, taille: 8.5 })); }

    // ── 7. Personnel, machines, interventions, absences ──
    section(7, 'Personnel, machines, interventions et absences');
    if (R.personnel.length) tableau(['Personne', 'Poste', 'Heures saisies', 'Jours saisis / planifiés', 'Étapes'], R.personnel.map(p => [p.nom, p.poste || '-', hFr(p.heures_saisies), `${p.jours_saisis} / ${p.jours_planifies}`, (p.etapes || []).join(', ')]), { cols: { 2: { cellWidth: 22 }, 3: { cellWidth: 30 } } });
    else vide('Aucun personnel identifié sur cet OF.');
    if (R.machines.length) tableau(['Machine', 'Jours planifiés', 'Partagée avec', 'Interventions'], R.machines.map(m => [m.nom, String(m.jours_planifies), m.titres_partageant ? `${m.titres_partageant} autre(s) titre(s) : ${(m.autres_of || []).join(', ')}` : 'aucun autre OF', m.interventions && m.interventions.length ? m.interventions.length + ' (voir ci-dessous)' : 'aucune']), { cols: { 1: { cellWidth: 24 } } });
    if (R.interventions.length) tableau(['Machine', 'Type', 'Période', 'Fin annoncée', 'Bloquante', 'Description'], R.interventions.map(i => [i.machine, i.type || '-', `${dc(i.date_debut)} -> ${i.date_fin ? dc(i.date_fin) : 'en cours'} (${i.duree_jours_ouvres} j ouvrés)`, i.date_fin_prevue ? dc(i.date_fin_prevue) + (i.depassement_jours > 0 ? `\n(dépassée de ${i.depassement_jours} j)` : '') : '-', i.bloquant ? 'oui' : 'non', i.description || '']), { cols: { 2: { cellWidth: 42 }, 3: { cellWidth: 26 }, 4: { cellWidth: 16 } } });
    else vide('Aucune intervention de maintenance sur les machines utilisées pendant la production.');
    if (R.absences.length) {
      tableau(['Personne absente', 'Du', 'Au', 'Jours ouvrés'], R.absences.map(a => [a.nom, dc(a.du), dc(a.au), String(a.jours)]));
      if (R.absences_impact.length) paragraphe('Créneaux affectés par une absence : ' + R.absences_impact.map(a => `${a.nom} le ${dc(a.date)} (${a.operation})`).join(' ; ') + '.', { taille: 8.5 });
      paragraphe('Les motifs d\'absence ne figurent pas dans ce rapport.', { taille: 7.5, couleur: COUL.gris });
    } else vide('Aucune absence parmi le personnel affecté.');

    // ── 8. Retour d'expérience ──
    section(8, 'Retour d\'expérience');
    paragraphe('Points forts', { gras: true, couleur: COUL.vert });
    if (R.rex.points_forts.length) R.rex.points_forts.forEach(p => { paragraphe(`+ ${p.titre}`, { gras: true, retrait: 3, taille: 8.5 }); if (p.detail) paragraphe(p.detail, { retrait: 7, taille: 8, couleur: COUL.gris }); }); else vide('Aucun point fort identifié par les données saisies.');
    paragraphe('Points à améliorer', { gras: true, couleur: COUL.rouge });
    if (R.rex.points_faibles.length) R.rex.points_faibles.forEach(p => { paragraphe(`- ${p.titre}`, { gras: true, retrait: 3, taille: 8.5 }); if (p.detail) paragraphe(p.detail, { retrait: 7, taille: 8, couleur: COUL.gris }); }); else vide('Aucun point faible identifié.');
    if (R.remarques.length) { paragraphe('Remarques saisies par le personnel en production', { gras: true }); tableau(['Date', 'Étape', 'Remarque'], R.remarques.map(r => [dc(r.date), r.operation, r.texte]), { cols: { 0: { cellWidth: 20 }, 1: { cellWidth: 42 } } }); }

    // ── 9. Plan d'amélioration ──
    section(9, 'Plan d\'amélioration pour une prochaine production identique ou similaire');
    const SEV = { haute: ['Haute', COUL.rouge], moyenne: ['Moyenne', COUL.orange], basse: ['Basse', COUL.gris] };
    if (R.plan.actions.length) tableau(['N°', 'Priorité', 'Thème', 'Action recommandée', 'Pourquoi (constat)', 'Indicateur de suivi', 'Pilote / échéance'],
      R.plan.actions.map(a => [String(a.numero), { content: (SEV[a.severite] || [a.severite])[0], styles: { textColor: (SEV[a.severite] || [0, COUL.encre])[1], fontStyle: 'bold' } }, a.theme, a.action, a.pourquoi, a.indicateur, `${a.responsable}\n${a.echeance}`]),
      { cols: { 0: { cellWidth: 8 }, 1: { cellWidth: 15 }, 2: { cellWidth: 19 }, 3: { cellWidth: 42 }, 4: { cellWidth: 33 }, 5: { cellWidth: 29 }, 6: { cellWidth: 28 } }, extra: { styles: { ...BASE, fontSize: 7.5 } } });
    else vide('Aucune action corrective n\'est nécessaire : production conforme au plan.');
    if (R.plan.parametres.etapes.length) {
      paragraphe('Temps standards à retenir pour la prochaine production (pour la même quantité)', { gras: true, taille: 9 });
      tableau(['Étape', 'Quantité', 'Standard actuel', 'Observé', 'Écart', 'Temps proposé', 'Décision'], R.plan.parametres.etapes.map(p => [p.operation, nb(p.quantite), hFr(p.standard_h), hFr(p.observe_h), sgn(p.ecart_pct, ' %'), hFr(p.propose_h), p.decision]), { cols: { 1: { cellWidth: 18 }, 2: { cellWidth: 24 }, 3: { cellWidth: 18 }, 4: { cellWidth: 16 }, 5: { cellWidth: 24 } } });
    }
    const L = R.plan.parametres.lancement;

        const entete = p.indisponible
          ? `<b>${esc(p.nom)}</b> <span style="color:var(--muted);font-size:12px;">${esc(p.poste)}</span> <span style="color:var(--danger);font-size:12px;">— indisponible (${esc(p.indisponible)})</span>`
          : `<label style="display:inline;margin:0;font-size:14px;color:var(--ink-900,#161C2C);cursor:pointer;"><input type="checkbox" class="tl-chk" data-id="${esc(p.id)}" ${sel.has(p.id) ? 'checked' : ''}> <b>${esc(p.nom)}</b></label> <span style="color:var(--muted);font-size:12px;">${esc(p.poste)}</span> <span style="font-size:12px;color:${p.libre_total_min ? '#177F70' : 'var(--muted)'};">— ${p.libre_total_min ? dur(p.libre_total_min) + ' de libre' : 'complet'}</span>`;
        const chips = p.indisponible ? '' : fusionPause(libresDe(p)).map((c) => `<button type="button" class="btn tl-chip" data-id="${esc(p.id)}" data-d="${hh(c.d)}" data-f="${hh(c.f)}" style="padding:2px 8px;font-size:12px;" title="Cliquer pour affecter ce temps libre">${hh(c.d)}–${hh(c.f)} · ${dur(c.net)}</button>`).join(' ');
        const occ = p.occupe.length ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;">Occupé(e) : ${p.occupe.map((o) => `${o.debut}–${o.fin} ${esc(o.libelle)}${o.of ? ' (' + esc(o.of) + ')' : ''}`).join(' · ')}</div>` : '';
        return `<div style="padding:8px 0;border-bottom:1px solid var(--line);">${entete}${barre}<div style="display:flex;gap:6px;flex-wrap:wrap;">${chips}</div>${occ}</div>`;
      }).join('') + `<div style="font-size:11px;color:var(--muted);margin-top:6px;"><span style="color:#2BB5A0;">■</span> libre &nbsp; <span style="color:#8C98AD;">■</span> occupé(e) &nbsp; <span style="color:#7A6FD0;">■</span> ajouté depuis cette fenêtre &nbsp; (hachuré : pause)</div>`;
      liste.querySelectorAll('.tl-chk').forEach((c) => c.addEventListener('change', () => { if (c.checked) sel.add(c.dataset.id); else sel.delete(c.dataset.id); majSelection(); }));
      liste.querySelectorAll('.tl-chip').forEach((b) => b.addEventListener('click', () => {
        sel.add(b.dataset.id); $('tl-d').value = b.dataset.d; $('tl-f').value = b.dataset.f;
        liste.querySelectorAll('.tl-chk').forEach((c) => { if (c.dataset.id === b.dataset.id) c.checked = true; });
        majSelection();
      }));
    }

    // Temps libre commun à toutes les personnes cochées.
    function communes() {
      let cur = null;
      for (const id of sel) {
        const p = D && D.personnes.find((x) => x.id === id); if (!p) return [];
        const l = libresDe(p);
        if (cur === null) cur = l;
        else { const nxt = []; cur.forEach((a) => l.forEach((b) => { const d = Math.max(a[0], b[0]), f = Math.min(a[1], b[1]); if (f - d >= 15) nxt.push([d, f]); })); cur = nxt; }
      }
      return cur ? fusionPause(cur) : [];
    }
    function majSelection() {
      const noms = D ? D.personnes.filter((p) => sel.has(p.id)).map((p) => p.nom) : [];
      $('tl-sel').textContent = noms.length ? noms.join(', ') : 'Aucune';
      const c = communes();
      $('tl-commun').innerHTML = sel.size > 1
        ? (c.length ? `<div style="font-size:12px;margin-bottom:4px;">Libres en même temps :</div>` + c.map((x) => `<button type="button" class="btn tl-comm" data-d="${hh(x.d)}" data-f="${hh(x.f)}" style="padding:2px 8px;font-size:12px;margin:0 4px 4px 0;">${hh(x.d)}–${hh(x.f)} · ${dur(x.net)}</button>`).join('')
            : `<div class="msg error" style="font-size:12px;">Ces personnes n'ont aucun temps libre en commun.</div>`)
        : '';
      $('tl-commun').querySelectorAll('.tl-comm').forEach((b) => b.addEventListener('click', () => { $('tl-d').value = b.dataset.d; $('tl-f').value = b.dataset.f; }));
    }

    function dessinerAjouts() {
      const zone = $('tl-ajouts');
      if (!D || !D.jour_ouvre || !D.ajouts.length) { zone.innerHTML = `<div class="empty" style="padding:8px;">Aucune affectation ajoutée ce jour-là.</div>`; return; }
      zone.innerHTML = D.ajouts.map((a) => `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;">
        <span style="flex:1 1 320px;min-width:0;"><b>${a.debut}–${a.fin}</b> · ${esc(a.libelle)}${a.of ? ' · ' + esc(a.of) : ' · hors OF'} — ${a.personnes.map((p) => esc(p.nom)).join(', ')}${a.commentaire ? ' <i style="color:var(--muted);">(' + esc(a.commentaire) + ')</i>' : ''}</span>
        <button class="btn tl-del" data-ids="${esc(a.ids.join(','))}">Retirer</button></div>`).join('');
      zone.querySelectorAll('.tl-del').forEach((b) => b.addEventListener('click', async () => {
        b.disabled = true;
        try {
          const res = await fetch(`${API}/temps-libres`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'supprimer', ids: b.dataset.ids.split(',') }) });
          const d = await lireJson(res); if (!res.ok || d.error) throw new Error(d.error || 'Suppression impossible.');
          toast('Affectation retirée.'); rafraichirPlanning(); await charger();
        } catch (e) { b.disabled = false; msg(`<div class="msg error">${esc(e.message)}</div>`); }
      }));
    }

    async function charger() {
      const date = $('tl-date').value; const mon = ++seq;
      if (!date) { $('tl-etat').innerHTML = `<div class="msg error">Choisissez un jour.</div>`; return; }
      $('tl-etat').innerHTML = `<div class="msg">Chargement…</div>`; msg('');
      try {
        const res = await fetch(`${API}/temps-libres?date=${encodeURIComponent(date)}&horaires=${mode()}`);
        const d = await lireJson(res); if (mon !== seq) return;
        if (!res.ok || d.error) throw new Error(d.error || 'Chargement impossible.');
        D = d;
        // on ne garde cochées que les personnes encore sélectionnables ce jour-là
        sel = new Set([...sel].filter((id) => D.personnes.some((p) => p.id === id && !p.indisponible)));
        if (!D.jour_ouvre) {
          $('tl-etat').innerHTML = `<div class="msg error">Pas de travail ce jour-là : ${esc(D.motif || 'jour non travaillé')}.</div>`; $('tl-go').disabled = true;
        } else {
          const nb = D.personnes.filter((p) => p.libre_total_min > 0).length;
          $('tl-etat').innerHTML = `<div class="msg">${nb} personne${nb > 1 ? 's' : ''} avec du temps libre — horaires ${D.horaires.debut}–${D.horaires.fin}${D.horaires.pause_debut ? ' (pause ' + D.horaires.pause_debut + '–' + D.horaires.pause_fin + ')' : ' (sans pause)'}.</div>`;
          $('tl-go').disabled = false;
          const of = $('tl-of'), prec = of.value;
          of.innerHTML = `<option value="">— choisir un OF —</option>` + D.ofs.map((o) => `<option value="${esc(o.id)}">${esc(o.numero)}${o.titre ? ' — ' + esc(o.titre) : ''}${o.client ? ' (' + esc(o.client) + ')' : ''}</option>`).join('');
          if (prec && D.ofs.some((o) => o.id === prec)) of.value = prec;
          const cat = $('tl-cat'), cprec = cat.value;
          cat.innerHTML = D.categories.map((c) => `<option>${esc(c)}</option>`).join(''); if (cprec) cat.value = cprec;
        }
        dessinerListe(); majSelection(); dessinerAjouts();
      } catch (e) { if (mon === seq) { D = null; $('tl-etat').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; $('tl-liste').innerHTML = ''; } }
    }

    async function chargerTaches() {
      const id = $('tl-of').value, t = $('tl-tache');
      if (!id) { t.innerHTML = `<option value="">— choisir d'abord un OF —</option>`; return; }
      t.innerHTML = `<option value="">Chargement…</option>`;
      try {
        const res = await fetch(`${API}/temps-libres?etapes_of=${encodeURIComponent(id)}`);
        const d = await lireJson(res); if (!res.ok || d.error) throw new Error(d.error || 'Tâches introuvables.');
        if ($('tl-of').value !== id) return;
        t.innerHTML = `<option value="">— choisir la tâche —</option>` + d.etapes.map((e) => `<option value="${esc(e.operation_id)}">${e.sequence != null ? esc(e.sequence) + '. ' : ''}${esc(e.operation)}${e.statut === 'terminé' ? ' (terminée)' : ''}</option>`).join('');
      } catch (e) { t.innerHTML = `<option value="">—</option>`; msg(`<div class="msg error">${esc(e.message)}</div>`); }
    }

    $('tl-prec').addEventListener('click', () => { let j = ajouterJours($('tl-date').value || dateDef, -1), n = 0; while (!jourOuvrable(j) && n++ < 7) j = ajouterJours(j, -1); $('tl-date').value = j; charger(); });
    $('tl-suiv').addEventListener('click', () => { let j = ajouterJours($('tl-date').value || dateDef, 1), n = 0; while (!jourOuvrable(j) && n++ < 7) j = ajouterJours(j, 1); $('tl-date').value = j; charger(); });
    $('tl-date').addEventListener('change', charger);
    $('tl-horaires').addEventListener('change', charger);
    $('tl-seulement').addEventListener('change', dessinerListe);
    $('tl-of').addEventListener('change', chargerTaches);
    $('tl-type').addEventListener('change', () => { const of = $('tl-type').value === 'of'; $('tl-bloc-of').classList.toggle('hidden', !of); $('tl-bloc-libre').classList.toggle('hidden', of); });

    $('tl-go').addEventListener('click', async () => {
      const type = $('tl-type').value, ids = [...sel];
      if (!ids.length) return msg(`<div class="msg error">Cochez au moins une personne (ou cliquez sur un de ses temps libres).</div>`);
      if (!$('tl-d').value || !$('tl-f').value) return msg(`<div class="msg error">Indiquez l'heure de début et l'heure de fin.</div>`);
      const corps = { date: $('tl-date').value, heure_debut: $('tl-d').value, heure_fin: $('tl-f').value, personnel_ids: ids, commentaire: $('tl-com').value, horaires: mode() };
      if (type === 'of') {
        if (!$('tl-of').value) return msg(`<div class="msg error">Choisissez l'ordre de fabrication.</div>`);
        if (!$('tl-tache').value) return msg(`<div class="msg error">Choisissez la tâche de l'OF.</div>`);
        Object.assign(corps, { action: 'affecter_of', of_id: $('tl-of').value, operation_id: $('tl-tache').value });
      } else {
        Object.assign(corps, { action: 'affecter_libre', categorie: $('tl-cat').value, libelle: $('tl-lib').value });
      }
      $('tl-go').disabled = true; msg(`<div class="msg">Enregistrement…</div>`);
      try {
        const res = await fetch(`${API}/temps-libres`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
        const d = await lireJson(res); if (!res.ok || d.error) throw new Error(d.error || 'Affectation impossible.');
        toast(`${d.personnes} personne${d.personnes > 1 ? 's' : ''} affectée${d.personnes > 1 ? 's' : ''} — ${dur(d.minutes_travail)} de travail.`);
        sel = new Set(); $('tl-d').value = ''; $('tl-f').value = ''; $('tl-lib').value = ''; $('tl-com').value = '';
        rafraichirPlanning(); await charger(); msg('');
      } catch (e) { msg(`<div class="msg error">${esc(e.message)}</div>`); }
      finally { $('tl-go').disabled = !(D && D.jour_ouvre); }
    });

    charger();
  }

  async function ouvrirModaleDisponibilite(personne) {
    afficherModale(`
      <h3>Disponibilité — ${personne.name}</h3>
      <div class="field"><label>Situation à enregistrer</label>
        <select id="d-statut">
          <option value="absent">Absent(e) — congés, absence…</option>
          <option value="en arrêt">En arrêt (arrêt de travail)</option>
          <option value="partiel">Disponible sur une plage horaire réduite</option>
          <option value="disponible">Annuler une absence (redevenir disponible)</option>
        </select>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;"><label>À partir du</label><input id="d-date" type="date" value="${AUJOURDHUI_ISO}"></div>
        <div class="field" style="flex:1;"><label>Jusqu'au (inclus)</label><input id="d-date-fin" type="date" value="${AUJOURDHUI_ISO}"></div>
      </div>
      <div class="field" id="d-inconnue-wrap"><label><input type="checkbox" id="d-fin-inconnue"> Date de fin inconnue (période indéterminée)</label></div>
      <div class="field" id="d-periodes"></div>
      <div class="field hidden" id="d-horaires-wrap">
        <label>Disponible seulement de… à…</label>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1;"><input id="d-heure-debut" type="time" value="08:00"></div>
          <div class="field" style="flex:1;"><input id="d-heure-fin" type="time" value="16:30"></div>
        </div>
      </div>
      <div class="field" id="d-motif-wrap"><label>Motif (facultatif)</label><input id="d-motif" placeholder="ex : congés, arrêt maladie, formation"></div>
      <div id="d-resume" style="padding:10px 12px; border-radius:10px; background:var(--teal-50, #E6F6F3); color:#161C2C; font-size:13px; margin-bottom:8px;"></div>
      <div id="m-msg"></div>
      <div class="actions">
        <button class="btn" id="m-cancel">Annuler</button>
        <button class="btn primary" id="m-submit">Enregistrer</button>
      </div>
    `);

    const statutSelect = document.getElementById('d-statut');
    const dDebut = document.getElementById('d-date'), dFin = document.getElementById('d-date-fin'), dInconnue = document.getElementById('d-fin-inconnue');
    const heureD = document.getElementById('d-heure-debut'), heureF = document.getElementById('d-heure-fin');
    const fr = (iso) => iso ? iso.split('-').reverse().join('/') : '…';
    const prenom = personne.name;
    const fin400 = (d) => new Date(new Date(d + 'T12:00:00Z').getTime() + 400 * 86400000).toISOString().slice(0, 10);
    const nbJours = (d, f) => Math.round((new Date(f + 'T12:00:00Z') - new Date(d + 'T12:00:00Z')) / 86400000) + 1;

    // Périodes déjà enregistrées à partir d'aujourd'hui (absences, arrêts, plages réduites) : affichées et supprimables en entier.
    // Sans cela, « Annuler une absence » sur la seule date du jour laissait l'absence en place les jours suivants.
    let periodes = [];
    const plus1 = (d) => new Date(new Date(d + 'T12:00:00Z').getTime() + 86400000).toISOString().slice(0, 10);
    const h5 = (h) => (h ? String(h).slice(0, 5) : '');
    const libelleType = (p) => (p.type === 'absent' ? 'Absent(e)' : p.type === 'en arrêt' ? 'En arrêt' : `Disponible ${p.h.replace('-', ' à ')} seulement`);
    function afficherPeriodes() {
      const zone = document.getElementById('d-periodes');
      if (!periodes.length) { zone.innerHTML = ''; return; }
      zone.innerHTML = `<label>Situations déjà enregistrées (à partir d'aujourd'hui)</label>` + periodes.map((p, i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border,#e3e6ee);font-size:13px;">
          <span>${libelleType(p)} — ${p.debut === p.fin ? 'le ' + fr(p.debut) : 'du ' + fr(p.debut) + ' au ' + fr(p.fin)}${p.inconnue ? ' <em>(fin inconnue)</em>' : ''}</span>
          <button type="button" class="btn" data-per="${i}">Supprimer</button>
        </div>`).join('');
      zone.querySelectorAll('button[data-per]').forEach((b) => b.addEventListener('click', async () => {
        const p = periodes[Number(b.dataset.per)];
        b.disabled = true;
        try {
          const res = await fetch(`${API}/gerer-disponibilite?personnel_id=${personne.id}&date=${p.debut}&date_fin=${p.fin}`, { method: 'DELETE' });
          if (!res.ok) throw new Error((await res.json()).error || 'Erreur inconnue');
          toast(`${personne.name} : disponible normalement ${p.debut === p.fin ? 'le ' + fr(p.debut) : 'du ' + fr(p.debut) + ' au ' + fr(p.fin)}.`);
          fermerModale(); chargerDonneesReelles();
        } catch (e) { b.disabled = false; document.getElementById('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      }));
    }
    async function chargerPeriodes() {
      try {
        const res = await fetch(`${API}/gerer-disponibilite?personnel_id=${personne.id}&date_debut=${AUJOURDHUI_ISO}&date_fin=${fin400(AUJOURDHUI_ISO)}`);
        const lignes = res.ok ? await res.json() : [];
        periodes = [];
        lignes.filter((x) => x.statut !== 'disponible' || (x.heure_debut && x.heure_fin)).forEach((x) => {
          const type = x.statut === 'disponible' ? 'partiel' : x.statut;
          const h = type === 'partiel' ? `${h5(x.heure_debut)}-${h5(x.heure_fin)}` : '';
          const inc = /fin inconnue/i.test(x.commentaire || '');
          const dernier = periodes[periodes.length - 1];
          if (dernier && dernier.type === type && dernier.h === h && plus1(dernier.fin) === x.date) { dernier.fin = x.date; dernier.inconnue = dernier.inconnue || inc; }
          else periodes.push({ type, h, debut: x.date, fin: x.date, inconnue: inc });
        });
      } catch (_) { periodes = []; }
      afficherPeriodes(); majFormulaire();
    }
    // Période d'absence / d'arrêt qui contient la date donnée (pour « Annuler une absence »).
    const periodeDu = (d) => periodes.find((p) => p.type !== 'partiel' && p.debut <= d && d <= p.fin);

    function majFormulaire() {
      const st = statutSelect.value;
      document.getElementById('d-horaires-wrap').classList.toggle('hidden', st !== 'partiel');
      document.getElementById('d-motif-wrap').classList.toggle('hidden', st === 'disponible');
      dFin.disabled = dInconnue.checked;
      const d = dDebut.value, f = dFin.value;
      const periode = dInconnue.checked ? `à partir du ${fr(d)}, sans date de retour connue`
        : (!d || !f ? '…' : (d === f ? `le ${fr(d)} uniquement` : `du ${fr(d)} au ${fr(f)} inclus (${nbJours(d, f)} jours)`));
      // durée de travail effectif de la plage, pause déjeuner (12h00-12h30) déduite
      const hmin = (h) => { const [a, b] = String(h || '0:0').split(':'); return Number(a) * 60 + Number(b); };
      let effectif = '';
      if (st === 'partiel' && heureD.value && heureF.value && heureF.value > heureD.value) {
        const dm = hmin(heureD.value), fm = hmin(heureF.value);
        const m = fm - dm - Math.max(0, Math.min(fm, 750) - Math.max(dm, 720));
        effectif = ` Soit <b>${Math.floor(m / 60)} h${m % 60 ? String(m % 60).padStart(2, '0') : ''} de travail effectif</b> par jour (pause déjeuner de 12h00 à 12h30 déduite).`;
      }
      let t;
      if (st === 'absent') t = `<b>${esc(prenom)}</b> sera <b>absent(e)</b> ${periode}.`;
      else if (st === 'en arrêt') t = `<b>${esc(prenom)}</b> sera <b>en arrêt</b> ${periode}.`;
      else if (st === 'partiel') t = `<b>${esc(prenom)}</b> sera disponible <b>seulement de ${esc(heureD.value || '…')} à ${esc(heureF.value || '…')}</b> ${periode}.${effectif}`;
      else t = `<b>${esc(prenom)}</b> sera <b>de nouveau disponible</b> ${periode} : les absences ou arrêts enregistrés sur cette période seront supprimés.`;
      // L'absence se poursuit au-delà de la fin choisie : elle resterait enregistrée (et bloquerait les affectations ces jours-là).
      let alerte = '';
      if (st === 'disponible' && d && !dInconnue.checked && f) {
        const reste = periodes.find((p) => p.type !== 'partiel' && p.debut <= f && p.fin > f);
        if (reste) alerte = `<div style="margin-top:6px;color:#B42318;">⚠ L'absence enregistrée se poursuit jusqu'au <b>${fr(reste.fin)}</b> : elle resterait en place du ${fr(plus1(f))} au ${fr(reste.fin)}. <button type="button" class="btn" id="d-etendre" style="margin-left:6px;">Annuler toute l'absence</button></div>`;
      }
      document.getElementById('d-resume').innerHTML = t + alerte;
      const bt = document.getElementById('d-etendre');
      if (bt) bt.addEventListener('click', () => { const r = periodes.find((p) => p.type !== 'partiel' && p.debut <= dFin.value && p.fin > dFin.value); if (r) { dFin.value = r.fin; majFormulaire(); } });
    }
    [statutSelect, dDebut, dFin, dInconnue, heureD, heureF].forEach(i => { i.addEventListener('input', majFormulaire); i.addEventListener('change', majFormulaire); });
    dDebut.addEventListener('change', () => { if (!dFin.value || dFin.value < dDebut.value) { dFin.value = dDebut.value; majFormulaire(); } });

    // pré-remplit avec l'état déjà enregistré pour le jour de début (si une situation existe)
    async function chargerJour() {
      const j = dDebut.value; if (!j) return;
      try {
        const res = await fetch(`${API}/gerer-disponibilite?personnel_id=${personne.id}&date_debut=${j}&date_fin=${j}`);
        const l = res.ok ? (await res.json())[0] : null;
        if (l && !(l.statut === 'disponible' && !(l.heure_debut && l.heure_fin))) {
          const partiel = l.statut === 'disponible' && l.heure_debut && l.heure_fin;
          statutSelect.value = partiel ? 'partiel' : l.statut;
          if (partiel) { heureD.value = l.heure_debut.slice(0, 5); heureF.value = l.heure_fin.slice(0, 5); }
        }
      } catch (_) { /* pré-remplissage facultatif */ }
      majFormulaire();
    }
    dDebut.addEventListener('change', chargerJour);
    // « Annuler une absence » : la fin proposée est celle de l'absence en cours (et non le seul jour de début).
    statutSelect.addEventListener('change', () => {
      if (statutSelect.value !== 'disponible') return;
      const p = periodeDu(dDebut.value);
      if (p) { dInconnue.checked = false; dFin.value = p.fin; majFormulaire(); }
    });
    majFormulaire();
    chargerJour();
    chargerPeriodes();

    document.getElementById('m-cancel').addEventListener('click', fermerModale);

    document.getElementById('m-submit').addEventListener('click', async () => {
      const st = statutSelect.value;
      const date = dDebut.value;
      const msg = document.getElementById('m-msg');
      const finInconnue = dInconnue.checked;
      const dateFin = finInconnue ? null : dFin.value;
      if (!date) { msg.innerHTML = '<div class="msg error">Choisissez la date de début.</div>'; return; }
      if (!finInconnue && (!dateFin || dateFin < date)) { msg.innerHTML = '<div class="msg error">La date de fin doit être postérieure ou égale à la date de début.</div>'; return; }
      if (st === 'partiel' && (!heureD.value || !heureF.value || heureF.value <= heureD.value)) { msg.innerHTML = '<div class="msg error">Indiquez une plage horaire valide (début avant fin).</div>'; return; }
      msg.innerHTML = `<div class="msg">Enregistrement…</div>`;
      try {
        if (st === 'disponible') {
          // retour à la disponibilité normale : on supprime les entrées de la période
          const res = await fetch(`${API}/gerer-disponibilite?personnel_id=${personne.id}&date=${date}&date_fin=${dateFin || fin400(date)}`, { method: 'DELETE' });
          if (!res.ok) throw new Error((await res.json()).error || 'Erreur inconnue');
          toast(`${personne.name} : disponible normalement ${dateFin ? 'du ' + fr(date) + ' au ' + fr(dateFin) : 'à partir du ' + fr(date)}.`);
        } else {
          const res = await fetch(`${API}/gerer-disponibilite`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              personnel_id: personne.id, date, date_fin: dateFin, fin_inconnue: finInconnue,
              motif: document.getElementById('d-motif').value,
              statut: st === 'partiel' ? 'disponible' : st,
              heure_debut: st === 'partiel' ? heureD.value : null, heure_fin: st === 'partiel' ? heureF.value : null,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
          toast(`Disponibilité de ${personne.name} enregistrée.`);
        }
        fermerModale(); chargerDonneesReelles();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }

  async function ouvrirModaleCompetences(personne) {
    let refs, actuelles;

      refs = await getReferentiels();
      const res = await fetch(`${API}/gerer-competences?personnel_id=${personne.id}`);

      actuelles = (await res.json()).operation_codes;
    } catch (e) {
      afficherModale(`<h3>Compétences</h3><div class="msg error">Backend indisponible. (${e.message})</div>`);

    const opsHtml = refs.operations.map(o => `

    afficherModale(`
      <h3>Compétences — ${personne.name}</h3>
      <div class="field"><label>Opérations que cette personne sait réaliser</label><div class="op-list">${opsHtml}</div></div>
      <div id="m-msg"></div>

        });

        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
