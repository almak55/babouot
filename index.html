<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliers Babouot — Planification de production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    /* Coque : toujours sombre, indépendante du thème des cartes */
    --shell-bg: radial-gradient(ellipse 900px 500px at 15% -10%, #16233A 0%, transparent 60%), linear-gradient(160deg, #0A0F1C 0%, #070B14 100%);
    --shell-text: #EAEFF9;
    --shell-line: rgba(255,255,255,0.08);
    --sidebar-bg: #0A0F1D;
    --sidebar-text: #EAEFF9;

    /* Cartes : claires par défaut (bascule possible vers sombre) */
    --paper-raised: #F4F6FA;
    --paper-raised-2: #E9ECF3;
    --field-bg: #E7EAF1;
    --ink-900: #161C2C;
    --ink-700: #4B5468;
    --ink-500: #838BA0;
    --line: #E3E6EE;
    --accent-amber: #F5A623;
    --accent-amber-text: #9A5B0A;
    --accent-amber-soft: #FCEACB;
    --accent-teal: #16B8A6;
    --accent-teal-soft: #D7F3EF;
    --accent-green: #22B573;
    --accent-green-soft: #D8F3E6;
    --danger: #F0564B;
    --danger-text: #C8291F;
    --danger-soft: #FBDBD8;
    --shadow-sm: 0 1px 2px rgba(20,24,40,0.06);
    --shadow-md: 0 8px 24px -6px rgba(20,24,40,0.14), 0 2px 6px rgba(20,24,40,0.08);
    --shadow-lg: 0 24px 60px -16px rgba(10,14,28,0.35), 0 4px 14px rgba(10,14,28,0.18);
    --glow-teal: 0 0 0 1px rgba(22,184,166,0.3), 0 0 20px rgba(22,184,166,0.15);
    --radius-sm: 7px;
    --radius-md: 11px;
    --radius-lg: 16px;
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  /* Cartes sombres — variante bascule (switch dans la sidebar) */
  :root[data-theme="dark"] {
    --paper-raised: #131B2E;
    --paper-raised-2: #1A2438;
    --field-bg: #0E1422;
    --ink-900: #EAEFF9;
    --ink-700: #AEB8CE;
    --ink-500: #7B8499;
    --line: rgba(255,255,255,0.09);
    --accent-amber: #FBBF24;
    --accent-amber-text: #FBBF24;
    --accent-amber-soft: rgba(251,191,36,0.14);
    --accent-teal: #2DD4C7;
    --accent-teal-soft: rgba(45,212,199,0.14);
    --accent-green: #34D399;
    --accent-green-soft: rgba(52,211,153,0.14);
    --danger: #F87171;
    --danger-text: #F87171;
    --danger-soft: rgba(248,113,113,0.14);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 8px 24px -6px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);
    --shadow-lg: 0 24px 60px -16px rgba(0,0,0,0.6), 0 4px 14px rgba(0,0,0,0.35);
    --glow-teal: 0 0 0 1px rgba(45,212,199,0.35), 0 0 20px rgba(45,212,199,0.18);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--shell-bg);
    background-attachment: fixed;
    color: var(--shell-text);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  code, .mono { font-family: "IBM Plex Mono", monospace; }
  h1, h2, h3, .display { font-family: "Space Grotesk", sans-serif; font-weight: 600; letter-spacing: -0.01em; }

  /* À l'intérieur d'une carte, le texte redevient celui du thème carte */
  .panel, .modal, .kpi, table, .donut-center { color: var(--ink-900); }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ---- Layout shell ---- */
  .shell {
    display: grid;
    grid-template-columns: 216px 1fr;
    min-height: 100%;
  }
  @media (max-width: 1024px) {
    .shell { grid-template-columns: 1fr; }
    /* « .shell > » : sans cela, la règle .side { display:flex } plus bas dans le fichier annulait le repli du menu */
    .shell > .side { display: none; }
    .shell > .side.open { display: flex; position: fixed; inset: 0; z-index: 50; width: 260px; box-shadow: 4px 0 24px rgba(0,0,0,.25); overflow-y: auto; }
  }

  .side {
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    padding: 18px 12px;
    gap: 2px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 8px 20px 8px;
  }
  .brand .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(145deg, var(--accent-teal), #0E6F65);
    display: flex; align-items: center; justify-content: center;
    color: #06211D; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 15px;
    flex-shrink: 0; box-shadow: var(--glow-teal);
  }
  .brand .txt { line-height: 1.2; }
  .brand .txt .name { font-family: "Space Grotesk", sans-serif; font-size: 15.5px; font-weight: 700; color: var(--sidebar-text); }
  .brand .txt small { display:block; font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .04em; opacity: .5; font-weight: 400; margin-top: 1px; }
  .navbtn {
    position: relative;
    display: flex; align-items: center; gap: 11px;
    background: transparent; border: none; color: var(--sidebar-text);
    opacity: .62;
    padding: 9px 11px; border-radius: var(--radius-sm); text-align: left;
    font-size: 13.5px; cursor: pointer;
    transition: background .15s var(--ease), opacity .15s var(--ease);
  }
  .navbtn svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .9; }
  .navbtn.active {
    opacity: 1; background: var(--accent-teal-soft); color: var(--accent-teal);
    box-shadow: inset 2.5px 0 0 var(--accent-teal);
  }
  .navbtn.active svg { color: var(--accent-teal); filter: drop-shadow(0 0 6px rgba(45,212,199,0.5)); }
  .navbtn:hover { opacity: 1; background: rgba(255,255,255,0.05); }
  .side-foot { margin-top: auto; padding: 10px 11px 4px; font-size: 10.5px; opacity: .75; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--sidebar-text); }
  .switch { position: relative; width: 34px; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.15); cursor: pointer; flex-shrink: 0; transition: background .18s var(--ease); }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--sidebar-text); transition: transform .18s var(--ease); }
  .switch[aria-checked="true"] { background: var(--accent-teal); }
  .switch[aria-checked="true"] .knob { transform: translateX(16px); }

  .main { min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--shell-line);
    position: sticky; top: env(safe-area-inset-top, 0px); background: rgba(10,15,27,0.55);
    z-index: 5; backdrop-filter: blur(10px);
  }
  .topbar h1 { margin: 0; font-size: 21px; color: var(--shell-text); }
  .topbar .sub { font-size: 12px; color: rgba(234,239,249,0.55); margin-top: 3px; }
  .greeting { font-size: 11.5px; color: var(--accent-teal); font-weight: 600; letter-spacing: .02em; margin-bottom: 2px; }
  .greeting .wave { filter: saturate(1.3); }
  .icon-btn {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink-700); cursor: pointer;
    transition: background .14s var(--ease), color .14s var(--ease), box-shadow .14s var(--ease);
  }
  .icon-btn:hover { color: var(--accent-teal); box-shadow: var(--glow-teal); }
  .icon-btn-dot { position: absolute; top: 8px; right: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--paper-raised); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, var(--accent-teal), #189389); color: #06211D;
    font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 14px; box-shadow: var(--glow-teal);
  }
  .menubtn { display:none; background: var(--paper-raised); color: var(--ink-900); border:1px solid var(--line); border-radius: var(--radius-sm); width:36px; height:36px; align-items:center; justify-content:center; }
  @media (max-width: 1024px) { .menubtn { display:flex; } }

  .content { padding: 22px 24px 64px; max-width: 1180px; }
  @media (max-width: 1024px) { .topbar { padding: 10px 16px; } .content { padding: 16px 14px 64px; } }
  @media (max-height: 600px) { .topbar { position: static; padding: 8px 16px; } .topbar .greeting { display: none; } }

  /* ---- Common bits ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 15px 17px; box-shadow: var(--shadow-sm); transition: box-shadow .18s var(--ease), transform .18s var(--ease);
    border-left: 3px solid var(--accent-teal); position: relative; overflow: hidden;
  }
  .kpi.accent-amber { border-left-color: var(--accent-amber); }
  .kpi.accent-danger { border-left-color: var(--danger); }
  .kpi:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .kpi .v { font-family: "Space Grotesk", sans-serif; font-size: 27px; font-weight: 700; }
  .kpi .l { font-size: 11.5px; color: var(--ink-500); margin-top: 2px; }
  .kpi.warn .v, .kpi.accent-danger .v { color: var(--danger-text); }

  .donut-row { display: flex; align-items: center; gap: 28px; padding: 20px; flex-wrap: wrap; }
  .donut-wrap { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
  .donut { width: 140px; height: 140px; border-radius: 50%; }
  .donut-center {
    position: absolute; inset: 18px; border-radius: 50%; background: var(--paper-raised);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-center .v { font-family: "Space Grotesk", sans-serif; font-size: 22px; font-weight: 700; }
  .donut-center .l { font-size: 9.5px; color: var(--ink-500); text-align: center; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; min-width: 160px; }
  .donut-legend-row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .donut-legend-row .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend-row .label { flex: 1; color: var(--ink-700); }
  .donut-legend-row .pct { color: var(--ink-500); font-size: 12px; }

  .panel {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-md);
    overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .panel-head { display:flex; align-items:center; justify-content:space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 15.5px; }
  .of-actions > .btn:first-child { margin-left: auto; }
  .of-actions .btn { white-space: nowrap; flex: 0 0 auto; }
  .of-actions .btn:not(.primary) { padding: 6px 10px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--ink-500); font-size: 11px; padding: 10px 16px; border-bottom: 1px solid var(--line); letter-spacing: .02em; text-transform: uppercase; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s var(--ease); }
  tbody tr:hover td { background: rgba(62,110,100,0.045); }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .tag.ok { background: var(--accent-teal); color: #fff; }
  .tag.warn { background: var(--accent-amber); color: #4A2E00; }
  .tag.danger { background: var(--danger); color: #fff; }

  /* ---- Page Personnel : cartes compactes ---- */
  .pers-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .pers-bar input[type=search] { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field-bg); color: var(--ink-900); font: inherit; font-size: 13px; }
  .pers-filtres { display: flex; gap: 6px; flex-wrap: wrap; }
  .pers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; padding: 14px 18px 18px; align-items: start; }
  .pers-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; background: var(--paper-raised); display: flex; flex-direction: column; gap: 10px; min-width: 0; box-shadow: var(--shadow-sm); }
  .pers-top { display: flex; align-items: center; gap: 10px; }
  .pers-av { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--accent-teal-soft); color: var(--ink-900); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .pers-id { flex: 1; min-width: 0; }
  .pers-nom { font-weight: 600; font-size: 14px; color: var(--ink-900); }
  .pers-poste { font-size: 12px; color: var(--ink-500); line-height: 1.3; }
  .pers-charge { display: block; width: 100%; cursor: pointer; background: none; border: none; padding: 0; font: inherit; color: inherit; text-align: left; }
  .pers-charge .l { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-500); }
  .pers-comp-t { font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-500); margin-bottom: 4px; }
  .pers-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .pc { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; line-height: 1.35; background: var(--accent-teal-soft); color: var(--ink-900); }
  .pc.m { background: var(--paper-raised-2); color: var(--ink-700); }
  .pc-plus { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; line-height: 1.35; border: 1px dashed var(--ink-500); background: transparent; color: var(--ink-700); cursor: pointer; font-family: inherit; }
  .pc-plus:hover { border-color: var(--accent-teal); color: var(--accent-teal); }
  .pers-foot { display: flex; gap: 8px; margin-top: auto; }
  .pers-foot .btn { flex: 1; justify-content: center; }
  .statut-btn { background: none; border: none; padding: 0; cursor: pointer; }
  .statut-btn .tag { transition: filter .12s var(--ease); }
  .statut-btn:hover .tag { filter: brightness(0.93); }

  /* ---- Lignes de type "production" (accent + icône + menu ···) ---- */
  .row-icon-cell { width: 46px; }
  tr[class^="row-accent-"] td:nth-child(2) { border-left: 3px solid transparent; padding-left: 13px; }
  tr.row-accent-teal td:nth-child(2) { border-left-color: var(--accent-teal); }
  tr.row-accent-amber td:nth-child(2) { border-left-color: var(--accent-amber); }
  tr.row-accent-danger td:nth-child(2) { border-left-color: var(--danger); }
  tr.row-accent-green td:nth-child(2) { border-left-color: var(--accent-green); }
  .row-icon {
    width: 30px; height: 30px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  }
  .row-icon svg { width: 15px; height: 15px; }
  .row-icon.teal { background: var(--accent-teal-soft); color: var(--accent-teal); }
  .row-icon.amber { background: var(--accent-amber-soft); color: var(--accent-amber-text); }
  .row-icon.danger { background: var(--danger-soft); color: var(--danger-text); }
  .row-icon.green { background: var(--accent-green-soft); color: var(--accent-green); }
  .row-icon.muted { background: var(--paper-raised-2); color: var(--ink-500); }
  .row-title { font-weight: 600; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .row-sub { color: var(--ink-500); font-size: 12px; margin-top: 1px; }
  /* OF Pléiade / coffrets : numéro et titre en bleu, comme le bouton « OF Pléiade » */
  .of-pleiade .row-title, .of-pleiade .row-sub { color: #4338ca; }
  :root[data-theme="dark"] .of-pleiade .row-title, :root[data-theme="dark"] .of-pleiade .row-sub { color: #a5b4fc; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; background: var(--paper-raised-2); color: var(--ink-700); }
  .etat { font-size: 12.5px; font-weight: 600; }
  .etat-teal { color: var(--accent-teal); }
  .etat-amber { color: var(--accent-amber-text); }
  .etat-danger { color: var(--danger-text); }
  .etat-green { color: var(--accent-green); }
  .etat-muted { color: var(--ink-500); }
  .row-menu-cell { width: 36px; }
  .row-menu-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; color: var(--ink-500);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .12s var(--ease);
  }
  .row-menu-btn svg { width: 16px; height: 16px; }
  .row-menu-btn:hover { background: var(--paper-raised-2); color: var(--ink-900); }
  .row-menu {
    position: absolute; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg); z-index: 150; overflow: hidden; min-width: 190px; color: var(--ink-900);
  }
  .row-menu button {
    display: block; width: 100%; text-align: left; padding: 9px 13px; background: none; border: none; cursor: pointer;
    font-size: 12.5px; color: var(--ink-900); transition: background .12s var(--ease);
  }
  .row-menu button:hover { background: var(--paper-raised-2); }
  .row-menu button.danger { color: var(--danger-text); border-top: 1px solid var(--line); }
  .btn.danger-btn { background: var(--danger); color: #fff; border-color: transparent; font-weight: 600; }
  .btn.btn-icon-danger { padding: 8px 10px; color: var(--danger-text); }
  .btn.btn-icon-danger:hover { background: var(--danger-soft); }
  .btn.danger-btn:hover { box-shadow: 0 0 0 1px rgba(240,86,75,0.45), 0 0 22px rgba(240,86,75,0.25), var(--shadow-md); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-900);
    padding: 8px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 500; cursor: pointer;
    transition: transform .14s var(--ease), box-shadow .14s var(--ease), background .14s var(--ease);
    box-shadow: var(--shadow-sm);
  }
  .btn svg { width: 14px; height: 14px; }
  .btn.primary {
    background: linear-gradient(145deg, var(--accent-teal), #189389); color: #06211D; border-color: transparent;
    box-shadow: var(--glow-teal); font-weight: 600;
  }
  .btn.primary:hover { box-shadow: 0 0 0 1px rgba(45,212,199,0.45), 0 0 26px rgba(45,212,199,0.3), var(--shadow-md); }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible, .navbtn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-teal); outline-offset: 1px; }

  input, select {
    font-family: inherit; font-size: 13px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--field-bg);
    color: var(--ink-900); transition: border-color .14s var(--ease), box-shadow .14s var(--ease);
  }
  input:focus, select:focus { border-color: var(--accent-teal); box-shadow: 0 0 0 3px var(--accent-teal-soft); outline: none; }
  label { font-size: 11.5px; color: var(--ink-500); display:block; margin-bottom: 4px; font-weight: 500; }
  .field { display:flex; flex-direction: column; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 12px; padding: 16px; border-top: 1px solid var(--line); }

  /* ---- Gantt ---- */
  .gantt-wrap { overflow-x: auto; padding: 4px 0 16px; }
  .gantt { border-collapse: separate; border-spacing: 0; min-width: 760px; width: 100%; }
  .gantt th.day { text-align: center; font-size: 11px; padding: 9px 4px; border-bottom: 1px solid var(--line); color: var(--ink-500); font-weight: 500; letter-spacing: .02em; }
  .gantt th.day.today { color: var(--accent-teal); position: relative; }
  .gantt th.day.today::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 24px; height: 2px; background: var(--accent-teal); border-radius: 2px; }
  .gantt td.machine-cell {

      Utilisateurs &amp; rôles
    </button>

      <span class="switch" id="theme-toggle" role="switch" aria-checked="false" aria-label="Cartes sombres"><span class="knob"></span></span>

        </button>
        <button class="icon-btn" id="bell-btn" title="Notifications" aria-label="Notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="icon-btn-dot hidden" id="bell-dot"></span>

<script>
// Protection générale des appels au serveur : si une fonction répond par une PAGE WEB
// (accès refusé, session expirée, site protégé, panne) au lieu de données, on affiche une
// explication claire à la place de « Unexpected token '<' ... is not valid JSON ».
(function () {
  const original = window.fetch ? window.fetch.bind(window) : null;
  if (!original) return;
  // ---- Connexion (Supabase Auth via la fonction « connexion ») ----
  const CLE_SESSION = 'babouot_session';
  const lireSession = () => { try { return JSON.parse(localStorage.getItem(CLE_SESSION) || 'null'); } catch (e) { return null; } };
  const ecrireSession = (x) => { try { if (x) localStorage.setItem(CLE_SESSION, JSON.stringify(x)); else localStorage.removeItem(CLE_SESSION); } catch (e) { /* stockage indisponible */ } };
  let renouvellement = null;
  async function renouveler(sess) {
    if (!renouvellement) {
      renouvellement = (async () => {
        try {
          const r = await original('/.netlify/functions/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: ((lireSession() || sess).refresh_token) }) });   // toujours le jeton le plus récent (autre onglet, requêtes simultanées)
          if (!r.ok) return null;
          const d = await r.json(); ecrireSession(d); return d;
        } catch (e) { return null; } finally { setTimeout(() => { renouvellement = null; }, 0); }
      })();
    }
    return renouvellement;
  }
  function afficherConnexion(message) {
    if (document.getElementById('login-overlay')) { if (message) document.getElementById('login-msg').textContent = message; return; }
    const o = document.createElement('div'); o.id = 'login-overlay';
    o.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg,#0f1720);display:flex;align-items:center;justify-content:center;padding:16px;';
    o.innerHTML = `<form id="login-form" style="background:var(--card,#fff);color:var(--text,#111);width:min(380px,100%);padding:28px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;">
      <h2 style="margin:0 0 2px;font-size:20px;">Ateliers Babouot</h2><div style="font-size:13px;opacity:.7;margin-bottom:4px;">Connectez-vous pour accéder au planning de production.</div>
      <label style="font-size:13px;">E-mail<input id="login-email" type="email" autocomplete="username" required style="width:100%;padding:9px;margin-top:4px;border-radius:8px;border:1px solid #8884;"></label>
      <label style="font-size:13px;">Mot de passe<input id="login-mdp" type="password" autocomplete="current-password" required style="width:100%;padding:9px;margin-top:4px;border-radius:8px;border:1px solid #8884;"></label>
      <div id="login-msg" style="font-size:13px;color:#c0392b;min-height:18px;"></div>
      <button id="login-go" type="submit" style="padding:10px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer;">Se connecter</button></form>`;
    document.body.appendChild(o);
    if (message) document.getElementById('login-msg').textContent = message;
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault(); const bt = document.getElementById('login-go'); bt.disabled = true;
      try {
        const r = await original('/.netlify/functions/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('login-email').value, mot_de_passe: document.getElementById('login-mdp').value }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Connexion impossible.');
        marquerActivite(true); ecrireSession(d); location.reload();
      } catch (err) { document.getElementById('login-msg').textContent = err.message; bt.disabled = false; }
    });
  }
  function deconnecter() { ecrireSession(null); location.reload(); }
  // Droits du compte connecté (rôle attribué par un administrateur). Tant que l'écran ne les connaît pas encore, on ne masque rien :
  // c'est de toute façon le serveur qui accepte ou refuse chaque action.
  window.babouotDroit = (p) => { const d = (lireSession() || {}).droits; return Array.isArray(d) ? d.includes(p) : true; };
  window.babouotRole = () => { const s = lireSession() || {}; return { role: s.role || '', libelle: s.role_libelle || '' }; };
  function boutonDeconnexion() {
    if (document.getElementById('logout-btn')) return;
    const av = document.getElementById('avatar');
    const b = document.createElement('button'); b.id = 'logout-btn'; b.type = 'button'; b.title = 'Se déconnecter'; b.setAttribute('aria-label', 'Se déconnecter');
    b.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="logout-txt">Déconnexion</span>';
    b.style.cssText = 'display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line,#8886);background:var(--paper-raised,transparent);color:var(--ink-700,inherit);font-size:13px;font-weight:600;cursor:pointer;';
    const st = document.createElement('style'); st.textContent = '@media(max-width:640px){#logout-btn .logout-txt{display:none}#logout-btn{padding:0 10px}}'; document.head.appendChild(st);
    b.addEventListener('click', deconnecter);
    if (av && av.parentNode) av.parentNode.insertBefore(b, av);
    else { b.style.cssText += 'position:fixed;right:12px;top:10px;z-index:50;'; document.body.appendChild(b); }
  }
  function ouvrirChangementMdp() {
    if (document.getElementById('mdp-overlay')) return;
    const o = document.createElement('div'); o.id = 'mdp-overlay';
    o.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
    const champ = 'width:100%;padding:9px;margin-top:4px;border-radius:8px;border:1px solid #8884;';
    o.innerHTML = `<form id="mdp-form" style="background:var(--card,#fff);color:var(--text,#111);width:min(380px,100%);padding:26px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;">
      <h2 style="margin:0;font-size:19px;">Changer mon mot de passe</h2>
      <label style="font-size:13px;">Mot de passe actuel<input id="mdp-actuel" type="password" autocomplete="current-password" required style="${champ}"></label>
      <label style="font-size:13px;">Nouveau mot de passe (8 caractères minimum)<input id="mdp-nouveau" type="password" autocomplete="new-password" minlength="8" required style="${champ}"></label>
      <label style="font-size:13px;">Confirmer le nouveau mot de passe<input id="mdp-confirm" type="password" autocomplete="new-password" minlength="8" required style="${champ}"></label>
      <div id="mdp-msg" style="font-size:13px;color:#c0392b;min-height:18px;"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" id="mdp-annuler" style="padding:9px 14px;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit;cursor:pointer;">Annuler</button>
        <button type="submit" id="mdp-go" style="padding:9px 14px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer;">Enregistrer</button></div></form>`;
    document.body.appendChild(o);
    const fermer = () => o.remove();
    document.getElementById('mdp-annuler').addEventListener('click', fermer);
    o.addEventListener('mousedown', (e) => { if (e.target === o) fermer(); });
    document.getElementById('mdp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('mdp-msg'), bt = document.getElementById('mdp-go');
      const actuel = document.getElementById('mdp-actuel').value, nouveau = document.getElementById('mdp-nouveau').value;
      msg.style.color = '#c0392b';
      if (nouveau !== document.getElementById('mdp-confirm').value) { msg.textContent = 'La confirmation ne correspond pas.'; return; }
      bt.disabled = true;
      try {
        const sess = lireSession();
        const r = await original('/.netlify/functions/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (sess ? sess.access_token : '') }, body: JSON.stringify({ action: 'changer_mot_de_passe', mot_de_passe_actuel: actuel, nouveau_mot_de_passe: nouveau }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Changement impossible.');
        if (d.access_token) ecrireSession({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at, email: d.email, profil: d.profil, role: d.role || (sess && sess.role), role_libelle: d.role_libelle || (sess && sess.role_libelle), droits: d.droits || (sess && sess.droits) });
        else ecrireSession(null);
        msg.style.color = '#0f766e'; msg.textContent = 'Mot de passe modifié.';
        setTimeout(() => { if (d.access_token) fermer(); else location.reload(); }, 1200);
      } catch (err) { msg.textContent = err.message; bt.disabled = false; }
    });
  }
  const esc2 = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function appliquerProfil() {
    const sess = lireSession() || {}, p = sess.profil || {};
    const g = document.getElementById('greeting');
    if (g) g.innerHTML = 'Bonjour' + (p.prenom ? ', ' + esc2(p.prenom) : '') + ' <span class="wave">👋</span>';
    const a = document.getElementById('avatar');
    if (a) {
      const ini = ((p.prenom || '').charAt(0) + (p.nom || '').charAt(0)) || (sess.email || '?').charAt(0);
      a.textContent = ini.toUpperCase();
      a.title = ([p.prenom, p.nom].filter(Boolean).join(' ') || sess.email || 'Mon profil') + (p.fonction ? ' · ' + p.fonction : '') + ' (cliquer pour modifier mon profil)';
    }
  }
  function ouvrirProfil(premiere) {
    if (document.getElementById('profil-overlay')) return;
    const sess = lireSession() || {}, p = sess.profil || {};
    const o = document.createElement('div'); o.id = 'profil-overlay';
    o.style.cssText = 'position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
    const champ = 'width:100%;padding:9px;margin-top:4px;border-radius:8px;border:1px solid #8884;';
    const lab = 'font-size:13px;';
    o.innerHTML = `<form id="profil-form" style="background:var(--card,#fff);color:var(--text,#111);width:min(420px,100%);max-height:92vh;overflow:auto;padding:26px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:11px;">
      <h2 style="margin:0;font-size:19px;">${premiere ? 'Bienvenue — complétez votre profil' : 'Mon profil'}</h2>
      <div style="font-size:13px;opacity:.7;">Compte : ${esc2(sess.email || '')}${sess.role_libelle ? ' · Rôle : <b>' + esc2(sess.role_libelle) + '</b>' : ''}</div>
      <div style="display:flex;gap:10px;">
        <label style="${lab}flex:1;">Prénom *<input id="pf-prenom" value="${esc2(p.prenom)}" required maxlength="80" autocomplete="given-name" style="${champ}"></label>
        <label style="${lab}flex:1;">Nom<input id="pf-nom" value="${esc2(p.nom)}" maxlength="80" autocomplete="family-name" style="${champ}"></label></div>
      <label style="${lab}">Fonction<input id="pf-fonction" value="${esc2(p.fonction)}" maxlength="80" placeholder="ex. Contremaître, Chef d'atelier" style="${champ}"></label>
      <label style="${lab}">Service / équipe<input id="pf-service" value="${esc2(p.service)}" maxlength="80" placeholder="ex. Façonnage, Emboîtage" style="${champ}"></label>
      <label style="${lab}">Téléphone<input id="pf-tel" value="${esc2(p.telephone)}" maxlength="80" type="tel" autocomplete="tel" style="${champ}"></label>
      <div id="pf-msg" style="font-size:13px;color:#c0392b;min-height:18px;"></div>
      <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;">
        <div style="display:flex;gap:6px;flex-wrap:wrap;"><button type="button" id="pf-mdp" style="padding:8px 10px;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit;cursor:pointer;font-size:12px;">Changer mon mot de passe</button>
        <button type="button" id="pf-deco" style="padding:8px 10px;border-radius:8px;border:1px solid #c0392b88;background:transparent;color:#c0392b;cursor:pointer;font-size:12px;">Se déconnecter</button></div>
        <div style="display:flex;gap:8px;"><button type="button" id="pf-annuler" style="padding:9px 14px;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit;cursor:pointer;">${premiere ? 'Plus tard' : 'Annuler'}</button>
        <button type="submit" id="pf-go" style="padding:9px 14px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer;">Enregistrer</button></div></div></form>`;
    document.body.appendChild(o);
    const fermer = () => o.remove();
    document.getElementById('pf-annuler').addEventListener('click', fermer);
    o.addEventListener('mousedown', (e) => { if (e.target === o) fermer(); });
    document.getElementById('pf-mdp').addEventListener('click', () => { fermer(); ouvrirChangementMdp(); });
    document.getElementById('pf-deco').addEventListener('click', deconnecter);
    document.getElementById('profil-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('pf-msg'), bt = document.getElementById('pf-go'); bt.disabled = true; msg.style.color = '#c0392b';
      try {
        const s = lireSession();
        const r = await original('/.netlify/functions/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (s ? s.access_token : '') }, body: JSON.stringify({ action: 'maj_profil', profil: { prenom: document.getElementById('pf-prenom').value, nom: document.getElementById('pf-nom').value, fonction: document.getElementById('pf-fonction').value, service: document.getElementById('pf-service').value, telephone: document.getElementById('pf-tel').value } }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Enregistrement impossible.');
        const cur = lireSession(); if (cur) { cur.profil = d.profil; ecrireSession(cur); }
        appliquerProfil(); msg.style.color = '#0f766e'; msg.textContent = 'Profil enregistré.'; setTimeout(fermer, 700);
      } catch (err) { msg.textContent = err.message; bt.disabled = false; }
    });
  }
  async function chargerProfil() {
    const s = lireSession(); if (!s) return;
    try {
      const r = await original('/.netlify/functions/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token }, body: JSON.stringify({ action: 'lire_profil' }) });
      if (r.status === 403) { const e = await r.json().catch(() => ({})); if (e.code === 'desactive') { ecrireSession(null); afficherConnexion(e.error); } return; }
      if (!r.ok) return;
      const d = await r.json(); const cur = lireSession(); if (!cur) return;
      cur.profil = d.profil || {}; if (d.role) { cur.role = d.role; cur.role_libelle = d.role_libelle; cur.droits = d.droits; }
      ecrireSession(cur); appliquerProfil();
      if (typeof window.__appliquerDroits === 'function') window.__appliquerDroits();
      if (!cur.profil.prenom) ouvrirProfil(true);
    } catch (e) { /* hors ligne : on garde le profil connu */ }
  }
  function demarrer() {
    if (!lireSession()) { afficherConnexion(raisonDeconnexion()); return; }
    // Page rouverte après plus de 30 minutes sans utilisation (session restée enregistrée dans le navigateur) : reconnexion demandée.
    if (inactiviteDepassee()) { ecrireSession(null); try { localStorage.removeItem(CLE_RAISON); } catch (e) { /* ignoré */ } afficherConnexion(MSG_INACTIVITE); return; }
    marquerActivite(true);
    boutonDeconnexion(); appliquerProfil();
    const a = document.getElementById('avatar'); if (a) a.addEventListener('click', () => ouvrirProfil(false));
    chargerProfil();
  }
  // Garde la session ouverte tant que la page est utilisée : renouvellement discret avant l'expiration du jeton,
  // et à chaque retour sur l'onglet (ordinateur en veille, onglet resté en arrière-plan…).
  const entretenirSession = async () => {
    const sess = lireSession();
    if (!sess || !sess.refresh_token) return;
    if (sess.expires_at && sess.expires_at - Date.now() / 1000 < 20 * 60) await renouveler(sess);
  };
  setInterval(entretenirSession, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) entretenirSession(); });
  window.addEventListener('online', entretenirSession);
  // ---- Déconnexion automatique après inactivité ----
  // Aucune action (souris, clavier, toucher, défilement) pendant DELAI_INACTIVITE_MIN minutes : déconnexion et retour à l'écran de connexion.
  // L'activité est partagée entre les onglets (un onglet utilisé garde les autres ouverts). Les appels réseau en arrière-plan ne comptent pas.
  // Un avertissement s'affiche pendant la dernière minute ; il disparaît dès que l'on bouge la souris ou touche l'écran.
  const DELAI_INACTIVITE_MIN = 30, AVERTISSEMENT_S = 60;
  const CLE_ACTIVITE = 'babouot_activite', CLE_RAISON = 'babouot_deco_raison';
  const MSG_INACTIVITE = 'Vous avez été déconnecté après ' + DELAI_INACTIVITE_MIN + ' minutes d\u2019inactivité. Reconnectez-vous.';
  const lireActivite = () => { try { return Number(localStorage.getItem(CLE_ACTIVITE)) || 0; } catch (e) { return 0; } };
  let derniereActivite = 0, derniereEcriture = 0;
  function marquerActivite(force) {
