      ouvrirModaleAvancementOf(ofUuid, ofNumero);

      ouvrirModaleRapportOf(ofUuid, ofNumero, ofStatut);

        <p style="font-size:12.5px; color:var(--ink-500); margin:0;">Les étapes déjà démarrées ou terminées sont conservées.</p>
        <div id="m-msg"></div>
        <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-confirm-deplan">Déplanifier</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale);
      document.getElementById('m-confirm-deplan').addEventListener('click', async () => {
        const msg = document.getElementById('m-msg');
        msg.innerHTML = '<div class="msg">Déplanification…</div>';
        try {
          const res = await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid }) });
          const d = await lireJson(res);
          if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
          toast(d.deplanifiees.length ? `${d.deplanifiees.length} étape(s) déplanifiée(s).${d.conservees.length ? ' ' + d.conservees.length + ' conservée(s) (déjà démarrées).' : ''}` : 'Aucune étape planifiée à retirer.');

      document.getElementById('m-confirm-delete').addEventListener('click', async () => {

        try {
          const res = await fetch(`${API}/supprimer-ordre?of_id=${ofUuid}`, { method: 'DELETE' });

            : '';

          fermerModale(); chargerDonneesReelles();
        } catch (e) {
          msg.innerHTML = `<div class="msg error">${e.message}</div>`;

    menu.querySelector('[data-action="valider"]').addEventListener('click', async () => {
      menu.remove();
      try {
        const res = await fetch(`${API}/valider-of`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ of_id: ofUuid, maintenant: maintenantLocal() }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');

        toast(`Échec de la validation : ${e.message}`, 'error');
      }
    });
    menu.querySelector('[data-action="chiffrage"]').addEventListener('click', () => {
      menu.remove();
      ouvrirModaleChiffrage(ofUuid, ofNumero);
    });
    menu.querySelector('[data-action="gamme"]').addEventListener('click', () => {
      menu.remove();
      ouvrirModaleGamme(ofUuid, ofNumero);
    });

    setTimeout(() => {
      document.addEventListener('click', function fermer(){ menu.remove(); document.removeEventListener('click', fermer); }, { once: true });
    }, 0);
  }

    const { etape, liens, resume, creneaux } = d;

    const parJour = {};
    creneaux.forEach(c => { (parJour[c.date] = parJour[c.date] || []).push(c); });

          <span style="white-space:nowrap;">${c.heure_debut ? c.heure_debut + '–' + c.heure_fin : 'Journée'}</span>

          <span>${fmtDuree(c.minutes)}</span></div>`).join('')}</div>`;
    };
    const kpi = (v, l) => `<span class="occ-chip"><b>${v}</b> ${l}</span>`;
    afficherModale(`
      <h3>${esc(etape.operation)} — ${esc(etape.of_numero)}</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">${esc(etape.titre)} · étape ${etape.sequence} · ${esc(etape.statut)}</div>
      ${creneaux.length ? `
        <div class="occ-kpis">
          ${kpi(`${jourFr(resume.debut.date)} ${resume.debut.heure}`, 'début')}${kpi(`${jourFr(resume.fin.date)} ${resume.fin.heure}`, 'fin')}
          ${kpi(fmtDuree(resume.minutes), 'de travail')}${kpi(resume.jours, 'jour(s)')}${kpi(esc(resume.machines.join(', ')), '')}
        </div>
        <div style="font-size:12.5px; margin-bottom:8px;"><strong>Personnes :</strong> ${resume.personnes.length ? esc(resume.personnes.join(', ')) : '<em>aucune affectée</em>'}</div>` : '<div class="msg">Aucun créneau planifié pour cette étape.</div>'}
      <div style="font-size:12.5px; margin-bottom:10px;"><strong>Dépendances :</strong> ${liens.apres.length ? liens.apres.map(l => `${MODE[l.mode] || 'après'} « ${esc(l.operation)} »`).join(' ; ') : 'aucune (peut démarrer dès que possible)'}</div>
      ${Object.keys(parJour).sort().map(bloc).join('')}
      <div class="plan-note">Consultation seule : rien n'est modifié. Durées en travail effectif (pause 12h00–12h30 déduite). Pour changer l'affectation ou l'horaire d'un créneau, utilisez la page « Charge » de la personne.</div>
      <div id="recal-msg"></div>
      <div class="actions">${creneaux.some(c => !c.heure_debut) ? `<button class="btn primary" id="m-recaler" title="Remplace les créneaux « Journée » par la durée réelle du chiffrage">Recaler sur le chiffrage</button>` : ''}<button class="btn" id="m-cancel">Retour à la gamme</button></div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', retour);
    const bRec = document.getElementById('m-recaler');
    if (bRec) bRec.addEventListener('click', async () => {
      bRec.disabled = true; bRec.textContent = 'Recalage…';
      const zone = document.getElementById('recal-msg');
      try {
        const r = await fetch(`${API}/recaler-durees`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gamme_id: gammeId }) });
        const j = await lireJson(r); if (!r.ok) throw new Error(j.error || 'Erreur serveur (HTTP ' + r.status + ')');
        if (!j.etapes_concernees) { zone.innerHTML = '<div class="msg">Rien à recaler : cette étape n\'a pas de durée chiffrée (ou est déjà à ses heures). Vérifiez le chiffrage de l\'OF.</div>'; bRec.disabled = false; bRec.textContent = 'Recaler sur le chiffrage'; return; }
        ouvrirDetailEtape(gammeId, ofUuid, ofNumero);
      } catch (e) { zone.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; bRec.disabled = false; bRec.textContent = 'Recaler sur le chiffrage'; }
    });
  }

  // Gamme opératoire d'un OF : voir l'état de chaque étape, la planifier, la déplanifier ou la supprimer.
  async function ouvrirModaleGamme(ofUuid, ofNumero) {
    afficherModale(`<h3>Gamme opératoire — ${esc(ofNumero)}</h3><div id="gamme-list" class="empty">Chargement…</div><div id="gamme-msg"></div><div class="actions"><button class="btn" id="gamme-fermer">Fermer</button></div>`, 'large');
    document.getElementById('gamme-fermer').addEventListener('click', fermerModale);
    const zoneMsg = () => document.getElementById('gamme-msg');
    try {
      const res = await fetch(`${API}/gammes-ordre?of_id=${ofUuid}`);
      const gammes = await lireJson(res);
      if (!res.ok || !Array.isArray(gammes)) throw new Error((gammes && gammes.error) || `réponse inattendue du serveur (HTTP ${res.status})`);
      const list = document.getElementById('gamme-list');
      const ETAT = { 'à planifier': 'À planifier', 'planifié': 'Planifié', 'en cours': 'En cours', 'terminé': 'Terminé' };
      const btn = 'padding:3px 9px;font-size:12px;';
      list.className = '';
      list.innerHTML = gammes.map(g => {
        const nom = g.operation ? g.operation.nom : '(opération supprimée)';
        const classe = g.statut === 'à planifier' ? 'warn' : 'ok';
        let actions = '';
        if (g.statut === 'à planifier') {
          actions = `<button class="btn primary" style="${btn}" data-gact="planifier" data-id="${g.id}">Planifier</button>
                     <button class="btn" style="${btn}color:var(--danger,#c0392b);" data-gact="supprimer" data-id="${g.id}" data-nom="${esc(nom)}">Supprimer</button>`;
        } else if (g.statut === 'planifié') {
          actions = `<button class="btn primary" style="${btn}" data-gact="voir" data-id="${g.id}" title="Consulter le planning de cette étape sans rien modifier">Voir</button>
                     <button class="btn" style="${btn}" data-gact="replanifier" data-id="${g.id}" title="Replanifier : le planning actuel de l'étape est retiré puis recalculé">Modifier</button>
                     <button class="btn" style="${btn}" data-gact="deplanifier" data-id="${g.id}">Déplanifier</button>`;
        } else {
          actions = `<button class="btn" style="${btn}" data-gact="voir" data-id="${g.id}" title="Consulter ce qui a été planifié">Voir</button>`;
        }
        const el = g.en_ligne && g.en_ligne.possible ? g.en_ligne : null;
        const modeHtml = !el ? '' : (g.statut === 'à planifier'
          ? `<select data-gmode="${g.id}" title="Fonctionnement par rapport à « ${esc(el.avec)} »" style="font-size:13px;padding:6px 8px;width:auto;max-width:100%;"><option value="en_ligne" ${el.actif ? 'selected' : ''}>En ligne avec ${esc(el.avec)}</option><option value="hors_ligne" ${el.actif ? '' : 'selected'}>Hors ligne (après ${esc(el.avec)})</option></select>`
          : `<span class="tag ${el.actif ? 'ok' : ''}">${el.actif ? 'En ligne' : 'Hors ligne'}</span>`);
        const couleur = g.statut === 'à planifier' ? '#F5A623' : (g.statut === 'terminé' ? '#8A94AB' : '#16B8A6');
        const enLigneActif = !!(el && el.actif);
        return `<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; margin:0 0 8px ${enLigneActif ? '22px' : '0'}; border:1px solid var(--line); border-left:5px solid ${couleur}; border-radius:10px; background:#fff; position:relative;">
            <span style="flex:0 0 28px; height:28px; border-radius:50%; background:${couleur}; color:#0A0F1D; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;">${g.rang || g.sequence}</span>
            <div style="flex:1; min-width:170px;">
              <div style="font-size:15px; font-weight:700; color:#161C2C; line-height:1.25;">${esc(nom)}</div>
              ${el ? `<div style="margin-top:3px; font-size:12px; color:${enLigneActif ? '#0F766E' : '#5B6478'}; font-weight:600;">${enLigneActif ? '↳ en ligne avec ' : 'hors ligne, après '}${esc(el.avec)}</div>` : ''}
              ${(() => {
                const i = g.info; if (!i) return '';
                const l = [];
                if (i.regle || i.quantite_manuelle) l.push(`🔧 <strong>${Number(i.quantite).toLocaleString('fr-FR')} ex.</strong> à traiter — ${i.quantite_manuelle ? 'quantité réglée à la main' : esc(i.regle)}`);
                if (i.regle || i.quantite_manuelle || i.duree_manuelle_h !== null) l.push(i.total_h !== null && i.total_h !== undefined ? `durée <strong>${fmtH(i.total_h)}</strong>${i.duree_manuelle_h !== null ? ' (manuelle)' : ''}` : 'non chiffrée (temps standard à définir)');
                (i.attentes || []).forEach(a => l.push(`⏱ attente mini <strong>${String(a.heures).replace('.', ',')} h</strong> après « ${esc(a.apres)} »`));
                return l.length ? `<div style="margin-top:3px; font-size:12px; color:#5B6478;">${l.join(' · ')}${(i.regle || i.quantite_manuelle) && g.statut === 'à planifier' ? ` <button class="btn g-ajuster" style="padding:1px 8px;font-size:11.5px;" title="Ajuster la quantité ou la durée de cette opération dans le chiffrage de l'OF">Ajuster</button>` : ''}</div>` : '';
              })()}
            </div>
            <span class="tag ${classe}" style="font-size:12px;">${ETAT[g.statut] || esc(g.statut)}</span>
            ${el && g.statut === 'à planifier' ? `<div style="flex:1 1 100%; margin-left:40px;">${modeHtml}</div>` : (el ? modeHtml : '')}
            <span style="display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;">${actions}</span>
          </div>`;
      }).join('') || '<div class="empty">Aucune étape.</div>';
      // Ajout d'une opération manquante au catalogue de l'OF
      try {
        const refs = await getReferentiels();
        const optOps = refs.operations.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(o => `<option value="${esc(o.code)}">${esc(o.nom)}</option>`).join('');
        const optApres = gammes.map(g => `<option value="${g.sequence}">${g.rang || g.sequence}. ${esc(g.operation ? g.operation.nom : '(supprimée)')}</option>`).join('');
        list.insertAdjacentHTML('beforeend', `<div style="margin-top:14px; padding:14px; border:2px dashed var(--teal-2,#16B8A6); border-radius:12px; background:#F7FCFB;">
          <div style="font-size:14px; font-weight:700; color:#161C2C; margin-bottom:8px;">＋ Ajouter une opération manquante</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="field" style="margin:0;"><label>Opération</label><select id="ga-op"><option value="">— choisir —</option>${optOps}</select></div>
            <div class="field" style="margin:0;"><label>Démarre après</label><select id="ga-apres"><option value="">— dès le début (aucune) —</option>${optApres}</select></div>
          </div>
          <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="plan-note">L'opération est ajoutée « à planifier ». Absente de la liste ? Créez-la dans Temps standards &gt; Gérer les opérations.</span>
            <button class="btn primary" id="ga-add">Ajouter à la gamme</button></div></div>`);
        document.getElementById('ga-add').addEventListener('click', async (ev) => {
          const code = document.getElementById('ga-op').value;
          if (!code) { zoneMsg().innerHTML = '<div class="msg error">Choisissez l\'opération à ajouter.</div>'; return; }
          const ap = document.getElementById('ga-apres').value;
          ev.target.disabled = true; zoneMsg().innerHTML = '<div class="msg">Ajout…</div>';
          try {
            const r = await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, ajouter: [code], apres_sequence: ap ? Number(ap) : null }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast('Opération ajoutée à la gamme.'); chargerDonneesReelles(); ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
        });
      } catch (_) { /* catalogue indisponible : l'ajout n'est pas proposé */ }
      list.insertAdjacentHTML('afterbegin', `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 10px; margin-bottom:6px; border-radius:10px; background:var(--paper-raised-2,#F3F5FA); font-size:12.5px;">
        <span style="flex:1; min-width:200px;">Les opérations sont classées selon leurs dépendances (modèle de gamme et opérations en ligne).</span>
        <button class="btn" id="gamme-relier" style="padding:3px 10px;font-size:12px;" title="Refait toutes les dépendances de cet OF d'après le modèle de gamme et les couples en ligne">Recalculer les dépendances</button>
        <button class="btn" id="gamme-recaler" style="padding:3px 10px;font-size:12px;" title="Les créneaux « Journée » des étapes chiffrées sont ramenés à leur durée réelle (libère les personnes et machines)">Recaler les durées</button>
        <button class="btn" id="gamme-recaler-tout" style="padding:3px 10px;font-size:12px;" title="Même opération sur tous les OF">Recaler tous les OF</button></div>`);
      [['gamme-recaler', { of_id: ofUuid }, 'cet OF'], ['gamme-recaler-tout', {}, 'tous les OF']].forEach(([idb, corps, qui]) => {
        document.getElementById(idb).addEventListener('click', async (ev) => {
          if (!confirm(`Ramener les créneaux « Journée » de ${qui} à la durée réelle du chiffrage ?\nSeuls les créneaux planifiés à venir, sans heures, d'étapes chiffrées sont modifiés (machine et personnes conservées).`)) return;
          ev.target.disabled = true;
          try {
            const r = await fetch(`${API}/recaler-durees`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast(d.etapes_concernees ? `${d.etapes_concernees} étape(s) recalée(s) sur leur durée réelle.` : 'Rien à recaler (étapes non chiffrées ou déjà à leurs heures).');
            chargerDonneesReelles(); ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
        });
      });
      document.getElementById('gamme-relier').addEventListener('click', async (ev) => {
        if (!confirm('Recalculer toutes les dépendances de cet OF d\u2019après le modèle de gamme ?\nLes liens saisis à la main seront remplacés. Les créneaux déjà planifiés ne bougent pas.')) return;
        ev.target.disabled = true;
        try {
          const r = await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, recalculer_liens: true }) });
          const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
          toast((d.avertissements && d.avertissements[0]) || 'Dépendances recalculées.'); ouvrirModaleGamme(ofUuid, ofNumero);
        } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
      });
      const possibles = gammes.filter(g => g.en_ligne && g.en_ligne.possible && g.statut === 'à planifier');
      if (possibles.length) {
        list.insertAdjacentHTML('afterbegin', `<div style="padding:8px 10px; margin-bottom:6px; border-radius:10px; background:var(--teal-50,#E6F6F3); font-size:12.5px; color:#161C2C;">
          <strong>En ligne</strong> : la machine démarre avec la précédente et sa production se déroule en même temps (même durée). <strong>Hors ligne</strong> : l'opération se fait plus tard, après la fin de la précédente, avec son propre temps.
          <span style="display:inline-flex; gap:6px; margin-left:8px;"><button class="btn" style="padding:3px 9px;font-size:12px;" data-gmode-tout="en_ligne">Tout en ligne</button><button class="btn" style="padding:3px 9px;font-size:12px;" data-gmode-tout="hors_ligne">Tout hors ligne</button></span></div>`);
        const appliquerMode = async (corps) => {
          try {
            const r = await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, mode_ligne: corps }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast('Mode de fonctionnement enregistré.'); ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
        };
        list.querySelectorAll('[data-gmode]').forEach(sel => sel.addEventListener('change', () => appliquerMode({ gamme_id: sel.dataset.gmode, mode: sel.value })));
        list.querySelectorAll('[data-gmode-tout]').forEach(b => b.addEventListener('click', () => appliquerMode({ mode: b.dataset.gmodeTout })));
      }
      list.querySelectorAll('.g-ajuster').forEach(b => b.addEventListener('click', () => ouvrirModaleChiffrage(ofUuid, ofNumero)));
      list.querySelectorAll('[data-gact]').forEach(b => b.addEventListener('click', async () => {
        const id = b.dataset.id, act = b.dataset.gact;
        if (act === 'voir') { ouvrirDetailEtape(id, ofUuid, ofNumero); return; }
        if (act === 'planifier' || act === 'replanifier') {
          if (act === 'replanifier' && !confirm('« Modifier » replanifie cette étape : son planning actuel est retiré, puis vous choisissez de nouvelles informations.\n\nPour seulement consulter ce qui est planifié, utilisez « Voir ».\n\nContinuer ?')) return;
          if (act === 'replanifier') {
            // déjà planifiée : on la déplanifie d'abord, puis on rouvre l'affectation sur cette étape
            try {
              const r = await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gamme_ids: [id] }) });
              const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
              chargerDonneesReelles();
            } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; return; }
          }
          ouvrirModaleAffectation({ ofUuid, gammeId: id, retour: () => ouvrirModaleGamme(ofUuid, ofNumero) }); return;
        }
        if (act === 'deplanifier' || act === 'supprimer') {
          if (act === 'supprimer' && !confirm(`Supprimer l'opération « ${b.dataset.nom} » de l'OF ${ofNumero} ?`)) return;
          if (act === 'deplanifier' && !confirm('Retirer cette étape du planning ? Elle repassera « à planifier ».')) return;
          b.disabled = true; zoneMsg().innerHTML = '<div class="msg">En cours…</div>';
          try {
            const r = act === 'supprimer'
              ? await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, supprimer: [id] }) })
              : await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gamme_ids: [id] }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast(act === 'supprimer' ? 'Opération supprimée.' : 'Étape déplanifiée.');
            chargerDonneesReelles();
            ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; b.disabled = false; }
        }
      }));
    } catch (e) {
      document.getElementById('gamme-list').innerHTML = `Erreur : ${esc(e.message)}`;
    }
  }

  // Fiche personnel : ajout d'une personne ou modification de sa fiche (identité, poste, contrat, compétences, machines).
  async function ouvrirModalePersonne(personne) {
    const creation = !personne;
    let refs, f = {}, ops = [], machs = [];
    afficherModale(`<h3>${creation ? 'Ajouter une personne' : 'Fiche — ' + esc(personne.name)}</h3><div class="empty">Chargement…</div>`);
    try {
      refs = await getReferentiels();
      if (!creation) {
        const r = await fetch(`${API}/gerer-personnel?id=${personne.id}`);
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        f = d; ops = d.operation_codes || []; machs = d.machine_ids || [];
      }
    } catch (e) {
      afficherModale(`<h3>Personnel</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale); return;

    const select = (id, label, k, options) => `<div class="field" style="margin:0;"><label>${label}</label><select id="${id}">${options.map(([val, txt]) => `<option value="${esc(val)}" ${String(f[k] || '') === val ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select></div>`;

      <h3>${creation ? 'Ajouter une personne' : 'Fiche — ' + esc(personne.name)}</h3>
      ${titreSection('Identité')}
      <div style="${grille}">
        ${champ('pf-prenom', 'Prénom *', 'prenom', 'text', 'required autocomplete="off"')}
        ${champ('pf-nomf', 'Nom de famille', 'nom_famille')}
        ${champ('pf-nom', 'Nom affiché dans le planning', 'nom', 'text', 'placeholder="par défaut : Prénom Nom"')}
        ${champ('pf-matricule', 'Matricule', 'matricule')}
        ${champ('pf-badge', 'N° de badge de pointage', 'numero_badge', 'text', 'placeholder="ex. 210 (unique)" inputmode="numeric"')}
      </div>
      ${titreSection('Poste et contrat')}
      <div style="${grille}">
        ${champ('pf-poste', 'Poste / fonction', 'poste', 'text', 'placeholder="ex. Conducteur relieuse"')}
        ${select('pf-role', 'Rôle', 'role_type', [['opérateur', 'Opérateur'], ['encadrement', 'Encadrement']])}
        ${champ('pf-equipe', 'Équipe / service', 'equipe', 'text', 'placeholder="ex. Équipe A, Façonnage"')}
        ${select('pf-contrat', 'Type de contrat', 'type_contrat', [['', '—'], ['CDI', 'CDI'], ['CDD', 'CDD'], ['Intérim', 'Intérim'], ['Apprenti', 'Apprenti'], ['Stagiaire', 'Stagiaire']])}
        ${champ('pf-heures', 'Heures par semaine', 'heures_semaine', 'number', 'min="0" max="60" step="0.5" placeholder="ex. 35"')}
        ${champ('pf-cout', 'Coût horaire chargé (€/h)', 'cout_horaire', 'number', 'min="0" step="0.01"')}
        ${champ('pf-entree', 'Date d\'entrée', 'date_entree', 'date')}
      </div>
      ${titreSection('Coordonnées')}
      <div style="${grille}">
        ${champ('pf-tel', 'Téléphone', 'telephone', 'tel')}
        ${champ('pf-email', 'E-mail', 'email', 'email')}
      </div>
      ${titreSection('Compétences')}
      <div class="field"><label>Opérations que cette personne sait réaliser</label><div class="op-list" id="pf-ops" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));max-height:200px;">${refs.operations.map(o => `<label><input type="checkbox" value="${esc(o.code)}" ${ops.includes(o.code) ? 'checked' : ''}> ${esc(o.nom)}</label>`).join('')}</div></div>
      <div class="field"><label>Machines qu'elle sait conduire <span class="plan-note">— laissez vide si elle peut travailler sur toutes les machines de ses opérations</span></label><div class="op-list" id="pf-machs" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));max-height:200px;">${refs.machines.map(m => `<label><input type="checkbox" value="${esc(m.id)}" ${machs.includes(m.id) ? 'checked' : ''}> ${esc(m.nom)}</label>`).join('')}</div></div>
      <div class="field"><label>Habilitations et formations <span class="plan-note">— CACES, SST, électrique…</span></label><input id="pf-hab" value="${v('habilitations')}" maxlength="200"></div>

    `, 'large');

    let nomManuel = !creation;

    $('pf-prenom').addEventListener('input', proposer); $('pf-nomf').addEventListener('input', proposer);
    const apres = () => { referentielsCache = null; fermerModale(); chargerDonneesReelles(); };
    $('m-submit').addEventListener('click', async () => {
      const msg = $('m-msg');
      const corps = {
        prenom: $('pf-prenom').value, nom_famille: $('pf-nomf').value, nom: $('pf-nom').value, matricule: $('pf-matricule').value, numero_badge: $('pf-badge').value,
        poste: $('pf-poste').value, role_type: $('pf-role').value, equipe: $('pf-equipe').value, type_contrat: $('pf-contrat').value,
        heures_semaine: $('pf-heures').value, cout_horaire: $('pf-cout').value, date_entree: $('pf-entree').value,
        telephone: $('pf-tel').value, email: $('pf-email').value, habilitations: $('pf-hab').value, notes: $('pf-notes').value,
        operation_codes: Array.from(document.querySelectorAll('#pf-ops input:checked')).map(i => i.value),

      };

      $('m-submit').disabled = true; msg.innerHTML = '<div class="msg">Enregistrement…</div>';
      try {
        const r = await fetch(`${API}/gerer-personnel`, { method: creation ? 'POST' : 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `Erreur serveur (HTTP ${r.status})`);
        toast(creation ? `${d.nom || corps.prenom} ajouté(e) à l'équipe.` : 'Fiche enregistrée.');
        apres();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; $('m-submit').disabled = false; }

    const retirer = $('pf-retirer');

      if (!window.confirm(`Retirer ${personne.name} de l'équipe ? Sa fiche et son historique de planning sont conservés, mais il/elle ne sera plus proposé(e) pour les nouvelles affectations.`)) return;
      try {
        const r = await fetch(`${API}/gerer-personnel?id=${personne.id}`, { method: 'DELETE' });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `Erreur serveur (HTTP ${r.status})`);

  }

  function renderPersonnel(){
    const MAX_CHIPS = 4;   // pastilles visibles par groupe tant que la carte n'est pas dépliée
    const sansAccent = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const wrap = el(`
      <div class="panel">
        <div class="panel-head"><h2>Équipe atelier <span style="font-weight:400;font-size:13px;color:var(--muted);">— ${state.personnel.length} personne${state.personnel.length > 1 ? 's' : ''}</span></h2><button class="btn primary" id="pers-ajout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une personne</button></div>
        <div class="pers-bar">
          <input type="search" id="pers-q" placeholder="Rechercher (nom, poste, machine…)" aria-label="Rechercher une personne">
          <div class="pers-filtres" id="pers-filtres"></div>
        </div>
        <div class="pers-grid" id="pers-grid"></div>
      </div>
    `);
    const grille = wrap.querySelector('#pers-grid');
    const champ = wrap.querySelector('#pers-q');
    const zoneFiltres = wrap.querySelector('#pers-filtres');
    let filtreStatut = 'tous';
    const ouverts = new Set();   // groupes dépliés : « idPersonne|ops » ou « idPersonne|mach »
    const classeStatut = (p) => (String(p.statut).startsWith('Disponible') ? 'dispo' : p.statut === 'En arrêt' ? 'arret' : 'absent');
    const sections = (p) => {
      const comp = p.comp || [];
      return { ops: comp.filter((c) => !String(c).startsWith('machine: ')), mach: comp.filter((c) => String(c).startsWith('machine: ')).map((c) => String(c).slice(9)) };
    };
    const groupe = (p, cle, titre, liste, classe) => {
      if (!liste.length) return '';
      const ouvert = ouverts.has(`${p.id}|${cle}`);
      const visibles = ouvert ? liste : liste.slice(0, MAX_CHIPS);
      const reste = liste.length - MAX_CHIPS;
      return `<div><div class="pers-comp-t">${titre} (${liste.length})</div><div class="pers-chips">${visibles.map((c) => `<span class="pc ${classe}">${esc(c)}</span>`).join('')}${reste > 0 ? `<button type="button" class="pc-plus" data-id="${esc(p.id)}" data-g="${cle}" aria-expanded="${ouvert}">${ouvert ? 'Réduire' : '+' + reste}</button>` : ''}</div></div>`;
    };
    const carte = (p) => {
      const fillClass = p.charge >= 85 ? 'danger' : (p.charge >= 65 ? 'warn' : '');
      const { ops, mach } = sections(p);
      const initiales = String(p.name || '?').trim().split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();
      return `<div class="pers-card" data-id="${esc(p.id)}">
        <div class="pers-top">
          <span class="pers-av">${esc(initiales)}</span>
          <div class="pers-id"><div class="pers-nom">${esc(p.name)}</div><div class="pers-poste">${esc(p.role) || '—'}</div></div>
          <button class="statut-btn" data-id="${esc(p.id)}" data-action="dispo" title="Modifier la disponibilité"><span class="tag ${statutTag(p.statut)}">${esc(p.statut)}</span></button>
        </div>
        <button class="pers-charge charge-btn" data-id="${esc(p.id)}" title="Voir l'occupation de la semaine">
          <div class="l"><span>Charge de la semaine · <strong>${p.charge} %</strong></span><span style="color:var(--teal,#0F766E);font-weight:600;">Détail ›</span></div>
          <div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${Math.min(100, Math.max(0, p.charge))}%"></div></div>
        </button>
        ${groupe(p, 'ops', 'Opérations', ops, '')}${groupe(p, 'mach', 'Machines', mach, 'm')}
        ${!ops.length && !mach.length ? '<div class="plan-note">Aucune compétence enregistrée.</div>' : ''}
        <div class="pers-foot"><button class="btn fiche-pers" data-id="${esc(p.id)}">Fiche</button><button class="btn edit-pers" data-id="${esc(p.id)}">Compétences</button></div>
      </div>`;
    };
    function dessiner() {
      const q = sansAccent(champ.value).trim();
      const visibles = state.personnel.filter((p) => {
        if (filtreStatut !== 'tous' && classeStatut(p) !== filtreStatut) return false;
        if (!q) return true;
        return sansAccent([p.name, p.role, ...(p.comp || [])].join(' ')).includes(q);
      });
      grille.innerHTML = visibles.length ? visibles.map(carte).join('') : '<div class="plan-note" style="grid-column:1/-1;padding:8px 0;">Aucune personne ne correspond à cette recherche.</div>';
      const n = (c) => state.personnel.filter((p) => classeStatut(p) === c).length;
      const filtres = [['tous', `Tous (${state.personnel.length})`], ['dispo', `Disponibles (${n('dispo')})`], ['absent', `Absents (${n('absent')})`], ['arret', `En arrêt (${n('arret')})`]];
      zoneFiltres.innerHTML = filtres.map(([k, l]) => `<button type="button" class="msg-chip ${k === filtreStatut ? 'on' : ''}" data-f="${k}">${l}</button>`).join('');
    }
    dessiner();
    champ.addEventListener('input', dessiner);
    zoneFiltres.addEventListener('click', (ev) => { const b = ev.target.closest('[data-f]'); if (!b) return; filtreStatut = b.dataset.f; dessiner(); });
    wrap.querySelector('#pers-ajout').addEventListener('click', () => ouvrirModalePersonne(null));
    grille.addEventListener('click', (ev) => {
      const plus = ev.target.closest('.pc-plus');
      if (plus) { const cle = `${plus.dataset.id}|${plus.dataset.g}`; if (ouverts.has(cle)) ouverts.delete(cle); else ouverts.add(cle); dessiner(); return; }
      const charge = ev.target.closest('.charge-btn');
      if (charge) { ouvrirOccupationPersonne(charge.dataset.id); return; }
      const fiche = ev.target.closest('.fiche-pers');
      if (fiche) { ouvrirModalePersonne(state.personnel.find((x) => x.id === fiche.dataset.id)); return; }
      const comp = ev.target.closest('.edit-pers');
      if (comp) { ouvrirModaleCompetences(state.personnel.find((x) => x.id === comp.dataset.id)); return; }
      const dispo = ev.target.closest('[data-action="dispo"]');
      if (dispo) { ouvrirModaleDisponibilite(state.personnel.find((x) => x.id === dispo.dataset.id)); }
    });
    return wrap;
  }

  // ---------- Occupation hebdomadaire d'une personne : affectations, heures, absences ----------
  const minutesHM = (t) => { const [h, m] = String(t).split(':'); return Number(h) * 60 + Number(m); };
  const fmtDuree = (min) => { const h = Math.floor(min / 60), m = Math.round(min % 60); return m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`; };
  // Minutes de travail effectif d'un créneau (pause 12h00-12h30 déduite) ; sans heures : journée entière (8 h).
  function minutesCreneau(c) {
    if (!c.heure_debut || !c.heure_fin) return 480;
    const d = minutesHM(c.heure_debut), f = minutesHM(c.heure_fin);
    return Math.max(0, f - d - Math.max(0, Math.min(f, 750) - Math.max(d, 720)));
  }
  // Occupation d'une personne sur une liste de jours (isos), à partir de données de planning (semaine affichée ou plage plus large).
  async function occupationDe(persId, data, isos) {
    const b = data || state.brut; if (!b) return null;
    isos = isos || b.jours;
    const refs = await getReferentiels();
    const nomOp = Object.fromEntries(refs.operations.map(o => [o.id, o.nom]));
    const nomMach = Object.fromEntries(b.machines.map(m => [m.id, m.nom]));
    const ordre = Object.fromEntries(b.ordres.map(o => [o.id, o]));
    const persObj = state.personnel.find(x => x.id === persId) || { comp: [] };
    const compSet = new Set((persObj.comp || []).map(x => String(x).toLowerCase()));
    const parDate = {};
    b.planning.forEach(c => { if ((c.personnel_ids || []).includes(persId)) (parDate[c.date] = parDate[c.date] || []).push(c); });
    const dispoDate = {};
    b.dispo.forEach(d => { if (d.personnel_id === persId) dispoDate[d.date] = d; });
    const jours = isos.map(iso => {
      const dispo = dispoDate[iso] || null;
      const affs = (parDate[iso] || []).slice()
        .sort((x, y) => String(x.heure_debut || '').localeCompare(String(y.heure_debut || '')))
        .map(c => {
          const o = ordre[c.of_id] || {};
          const opN = nomOp[c.operation_id] || '';
          const competent = !opN ? true : compSet.has(opN.toLowerCase());
          return {
            id: c.id, iso, competent, tache: c.gamme_operatoire_id || null, of_id: c.of_id || null, operation_id: c.operation_id || null, machine_id: c.machine_id || null, sansOf: !c.of_id,
            debut: c.heure_debut ? String(c.heure_debut).slice(0, 5) : null, fin: c.heure_fin ? String(c.heure_fin).slice(0, 5) : null,
            of: o.numero || '—', titre: o.titres ? o.titres.nom : '', client: o.titres ? (o.titres.client || '') : '', delai: o.delai || '',
            operation: nomOp[c.operation_id] || c.phase || '—', phase: nomOp[c.operation_id] ? (c.phase || '') : '', machine: c.machine_id ? (nomMach[c.machine_id] || '?') : 'Travail manuel',
            statut: c.statut || '', min: minutesCreneau(c),
          };
        });
      const indispo = !!(dispo && dispo.statut !== 'disponible');
      affs.forEach((a, i) => { a.chevauche = affs.some((o, k) => k !== i && a.debut && o.debut && a.debut < o.fin && o.debut < a.fin); });
      return { iso, dispo, indispo, affs, min: affs.reduce((t, a) => t + a.min, 0) };
    });
    return { jours, refs };
  }

  // Réaffecter un créneau à une autre personne (compétente et libre en tête de liste)
  async function ouvrirReaffectation(p, a, rouvrir, retour) {
    if (!a) return;
    afficherModale(`<h3>Réaffecter — ${esc(a.operation)}</h3><div class="empty">Recherche des personnes disponibles…</div>`, 'large');
    let liste;
    try {
      const r = await fetch(`${API}/gerer-affectation?planning_jour_id=${a.id}&ancien_id=${p.id}`);
      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
      liste = d.candidats;
    } catch (e) { afficherModale(`<h3>Réaffecter</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Retour</button></div>`); document.getElementById('m-cancel').addEventListener('click', retour); return; }
    const badge = (c) => `${c.competent ? '<span class="tag ok">Compétent(e)</span>' : '<span class="tag warn">Hors compétence</span>'} ${c.libre ? '<span class="tag ok">Libre</span>' : `<span class="tag danger">${esc(c.motif)}</span>`}${c.deja_travaille ? ' <span class="tag">a déjà travaillé sur cette tâche</span>' : ''}`;
    afficherModale(`
      <h3>Réaffecter — ${esc(a.operation)}</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">${esc(a.of)} · ${esc(a.titre)} · ${a.debut ? a.debut + '–' + a.fin : 'journée'} · actuellement : <strong>${esc(p.name)}</strong></div>
      <div style="max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:10px;">
        ${liste.map((c, i) => `<label style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); cursor:${c.libre ? 'pointer' : 'not-allowed'}; opacity:${c.libre ? 1 : 0.55};">
          <input type="radio" name="reaff" value="${c.id}" ${c.libre ? '' : 'disabled'} ${i === 0 && c.libre ? 'checked' : ''} style="width:auto;margin:0;">
          <span style="flex:1;"><strong>${esc(c.nom)}</strong> <span style="font-size:11.5px; color:var(--ink-500);">${esc(c.poste)} · ${fmtDuree(c.charge_jour_min)} déjà ce jour</span><div style="margin-top:3px;">${badge(c)}</div></span></label>`).join('')}
        <label style="display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer;"><input type="radio" name="reaff" value="" style="width:auto;margin:0;"> <span><strong>Laisser à affecter</strong> <span style="font-size:11.5px; color:var(--ink-500);">(retirer ${esc(p.name)}, choisir plus tard)</span></span></label>
      </div>
      <div class="field" style="margin-top:10px;"><label>Portée</label>
        <select id="reaff-portee"><option value="creneau">Ce créneau seulement</option>${a.tache ? '<option value="tache">Toute la tâche (créneaux à venir où ' + esc(p.name) + ' est affecté(e))</option>' : ''}</select></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Retour</button><button class="btn primary" id="reaff-ok">Réaffecter</button></div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', retour);
    document.getElementById('reaff-ok').addEventListener('click', async (ev) => {
      const choix = document.querySelector('input[name="reaff"]:checked');

      if (!choix) { msg.innerHTML = '<div class="msg error">Choisissez une personne.</div>'; return; }
      ev.target.disabled = true; msg.innerHTML = '<div class="msg">Enregistrement…</div>';
      try {
        const r = await fetch(`${API}/gerer-affectation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'reaffecter', planning_jour_id: a.id, ancien_id: p.id, nouveau_id: choix.value || null, portee: document.getElementById('reaff-portee').value }) });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
        toast(`${d.remplaces.length} créneau(x) réaffecté(s).${d.ignores && d.ignores.length ? ' ' + d.ignores.length + ' ignoré(s) (indisponibilité).' : ''}`);
        rouvrir();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
    });
  }

  // Affecter une personne à une tâche existante du jour (jours vides ou renfort)
  async function ouvrirAjoutTache(p, iso, libelle, rouvrir, retour) {

    let taches;
    try {

      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
      taches = d.taches;
    } catch (e) { afficherModale(`<h3>Affecter</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Retour</button></div>`); document.getElementById('m-cancel').addEventListener('click', retour); return; }
    const ligne = (t, i) => `<label style="display:flex; align-items:flex-start; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); cursor:${t.libre ? 'pointer' : 'not-allowed'}; opacity:${t.libre ? 1 : 0.55};">

      <div style="font-size:11.5px; color:var(--ink-500);">${esc(t.of)} · ${esc(t.titre)} · ${t.equipe.length ? 'avec ' + esc(t.equipe.join(', ')) : 'aucune personne affectée'}</div>
      <div style="margin-top:3px;">${t.sans_personne ? '<span class="tag warn">À pourvoir</span> ' : ''}${t.competent ? '<span class="tag ok">Compétent(e)</span>' : '<span class="tag warn">Hors compétence</span>'} ${t.libre ? '' : `<span class="tag danger">${esc(t.motif)}</span>`}</div></span></label>`;
    afficherModale(`
      <h3>Affecter ${esc(p.name)} à une tâche — ${esc(libelle)}</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">Tâches planifiées ce jour. Les tâches « à pourvoir » (sans personne) et celles où la personne est compétente sont en tête. La personne est ajoutée, sans retirer les autres.</div>
      ${taches.length ? `<div style="max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px;">${taches.map(ligne).join('')}</div>` : '<div class="empty">Aucune tâche planifiée ce jour. Lancez ou déplacez une planification pour en créer.</div>'}
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Retour</button>${taches.length ? '<button class="btn primary" id="ajt-ok">Affecter</button>' : ''}</div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', retour);
    const ok = document.getElementById('ajt-ok');
    if (ok) ok.addEventListener('click', async (ev) => {
      const choix = document.querySelector('input[name="ajt"]:checked'); const msg = document.getElementById('m-msg');
      if (!choix) { msg.innerHTML = '<div class="msg error">Choisissez une tâche.</div>'; return; }
      ev.target.disabled = true; msg.innerHTML = '<div class="msg">Enregistrement…</div>';
      try {
        const r = await fetch(`${API}/gerer-affectation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'ajouter', planning_jour_id: choix.value, nouveau_id: p.id }) });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
        toast(`${p.name} est affecté(e) à la tâche.`); rouvrir();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
    });
  }

  // Corriger un créneau saisi par erreur : OF, opération, machine ; ou le supprimer
  async function ouvrirCorrection(p, a, rouvrir, retour) {
    if (!a) return;
    const refs = await getReferentiels();
    const ofs = (state.brut && state.brut.ordres) || [];
    const machines = (state.brut && state.brut.machines) || [];
    const opt = (liste, val, vide) => `<option value="">${vide}</option>` + liste.map(x => `<option value="${x.v}" ${x.v === val ? 'selected' : ''}>${esc(x.t)}</option>`).join('');
    afficherModale(`
      <h3>Corriger le créneau</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">${esc(p.name)} · ${a.debut ? a.debut + '–' + a.fin : 'journée entière'} · ${esc(a.operation)} · ${esc(a.machine)}${a.sansOf ? ' · <strong style="color:#B45309;">aucun OF renseigné</strong>' : ''}</div>
      <div class="field"><label>Ordre de fabrication</label><select id="cor-of">${opt(ofs.map(o => ({ v: o.id, t: `${o.numero} — ${o.titres ? o.titres.nom : ''}${o.titres && o.titres.client ? ' (' + o.titres.client + ')' : ''}` })), a.of_id, '— Aucun OF —')}</select></div>
      <div class="field"><label>Opération</label><select id="cor-op">${opt(refs.operations.map(o => ({ v: o.id, t: o.nom })), a.operation_id, '— Aucune opération —')}</select></div>
      <div class="field"><label>Machine</label><select id="cor-mach">${opt(machines.map(m => ({ v: m.id, t: m.nom })), a.machine_id, '— Travail manuel (sans machine) —')}</select></div>
      <small style="color:var(--ink-500); font-size:11.5px;">Pour changer la personne : « Réaffecter ». Pour changer le jour ou l'heure : « Horaire ».</small>
      <div id="m-msg"></div>
      <div class="actions" style="justify-content:space-between;">
        <button class="btn" id="cor-suppr" style="color:var(--danger,#c0392b);">Supprimer ce créneau</button>
        <span><button class="btn" id="m-cancel">Retour</button> <button class="btn primary" id="cor-ok">Enregistrer</button></span>
      </div>`);
    document.getElementById('m-cancel').addEventListener('click', retour);
    const envoyer = async (corps, ev, ok) => {
      const msg = document.getElementById('m-msg'); ev.target.disabled = true; msg.innerHTML = '<div class="msg">Enregistrement…</div>';
      try {
        const r = await fetch(`${API}/gerer-affectation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ planning_jour_id: a.id, ...corps }) });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
        toast(ok); rouvrir();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
    };
    document.getElementById('cor-ok').addEventListener('click', (ev) => envoyer({ action: 'modifier', of_id: document.getElementById('cor-of').value || null, operation_id: document.getElementById('cor-op').value || null, machine_id: document.getElementById('cor-mach').value || null }, ev, 'Créneau corrigé.'));
    document.getElementById('cor-suppr').addEventListener('click', (ev) => { if (confirm('Supprimer définitivement ce créneau (' + a.operation + ', ' + (a.debut ? a.debut + '–' + a.fin : 'journée') + ') ?')) envoyer({ action: 'supprimer' }, ev, 'Créneau supprimé.'); });
  }

  // ---------- Occupation d'une personne : vues Semaine / Mois / Année ----------
  const occEtat = { vue: 'mois', ancre: null, sel: null };
  let occCache = null;
  const isoAdd = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const isoDow = (iso) => (new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7; // 0 = lundi
  const isoLundi = (iso) => isoAdd(iso, -isoDow(iso));
  const isoMoisDebut = (iso) => iso.slice(0, 8) + '01';
  const isoMoisFin = (iso) => { const d = new Date(iso.slice(0, 8) + '01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return d.toISOString().slice(0, 10); };
  const isoPlage = (a, b) => { const r = []; for (let i = a; i <= b; i = isoAdd(i, 1)) r.push(i); return r; };

  async function plageOccupation(forcer) {
    const debut = [DAYS_ISO[0], isoMoisDebut(AUJOURDHUI_ISO)].sort()[0];
    const an = Math.max(Number(AUJOURDHUI_ISO.slice(0, 4)), Number(DAYS_ISO[0].slice(0, 4)));
    const fin = `${an}-12-31`;
    if (!forcer && occCache && occCache.debut === debut && occCache.fin === fin && Date.now() - occCache.t < 60000) return occCache;
    const res = await fetch(`/.netlify/functions/lecture-planning?date_debut=${debut}&date_fin=${fin}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    occCache = { t: Date.now(), debut, fin, data: { planning: d.planning, machines: d.machines, ordres: d.ordres, dispo: d.disponibilites || [], jours: [] } };
    return occCache;
  }

  async function ouvrirOccupationPersonne(persId, garder) {
    const p = state.personnel.find(x => x.id === persId); if (!p) return;
    if (!garder || !occEtat.ancre) { occEtat.vue = 'mois'; occEtat.ancre = DAYS_ISO[0]; occEtat.sel = null; }
    afficherModale(`<h3>Occupation — ${esc(p.name)}</h3><div class="empty">Chargement du planning…</div>`, 'xlarge');
    let occ, plage;
    try {
      plage = await plageOccupation(!garder);
      occ = await occupationDe(persId, plage.data, isoPlage(plage.debut, plage.fin));
    } catch (e) { occ = null; }
    if (!occ) { afficherModale(`<h3>Occupation</h3><div class="msg error">Planning indisponible. Rechargez la page.</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`); document.getElementById('m-cancel').addEventListener('click', fermerModale); return; }

    const jourNom = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const jourCourt = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const lib = (iso) => { const d = new Date(iso + 'T00:00:00Z'); return `${jourNom[d.getUTCDay()]} ${d.getUTCDate()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}`; };
    const parIso = new Map(occ.jours.map(j => [j.iso, j]));
    const tousAffs = new Map(); occ.jours.forEach(j => j.affs.forEach(a => tousAffs.set(String(a.id), a)));
    const ouvre = (j) => isoDow(j.iso) < 5;
    const rouvrir = async () => { occCache = null; try { await chargerDonneesReelles(); } catch (_) { /* affichage de démo */ } ouvrirOccupationPersonne(persId, true); };
    const retour = () => ouvrirOccupationPersonne(persId, true);

    // Capacité d'un jour : 8 h (lun-ven), 10 h si heures supplémentaires (créneau avant 8h ou après 16h30), 6 h un samedi travaillé, 0 le dimanche.
    const capJour = (j) => {
      const d = isoDow(j.iso), sup = j.affs.some(a => a.debut && (a.debut < '08:00' || a.fin > '16:30'));
      return d < 5 ? (sup ? 600 : 480) : (d === 5 && j.affs.length ? 360 : 0);
    };
    const pctJour = (j) => Math.round(j.min / (capJour(j) || 480) * 100);
    const teinte = (j) => {
      if (j.indispo) return { bg: 'repeating-linear-gradient(45deg,#FBE9E7,#FBE9E7 5px,#F6D6D2 5px,#F6D6D2 10px)', fg: '#8E2A1F' };
      const q = pctJour(j);
      if (!j.min) return { bg: '#F4F6FA', fg: '#8A93A8' };
      if (q > 100) return { bg: '#F4B6AE', fg: '#7A1D12' };
      if (q >= 85) return { bg: '#6FD3C5', fg: '#06433B' };
      if (q >= 50) return { bg: '#A8E6DD', fg: '#0B4F46' };
      return { bg: '#D6F3EE', fg: '#0B4F46' };
    };
    const stats = (jours) => {
      const w = jours.filter(ouvre);
      const indispoJ = w.filter(j => j.indispo).length;
      const capa = jours.reduce((t, j) => t + (j.indispo ? 0 : capJour(j)), 0);
      const total = jours.reduce((t, j) => t + j.min, 0);
      const affs = jours.flatMap(j => j.affs);
      return { indispoJ, capa, total, taux: capa > 0 ? Math.round(total / capa * 100) : 0, affs, ofs: new Set(affs.map(a => a.of).filter(x => x !== '—')).size, machines: new Set(affs.map(a => a.machine)).size };
    };
    const couleurTaux = (t) => t >= 85 ? '#C0392B' : (t >= 65 ? '#B45309' : '#0F766E');

    const etatTag = (j) => j.dispo && j.dispo.statut !== 'disponible'
      ? `<span class="tag danger">${j.dispo.statut === 'en arrêt' ? 'En arrêt' : 'Absent(e)'}</span>`
      : (j.dispo && j.dispo.heure_debut ? `<span class="tag warn">Dispo ${j.dispo.heure_debut.slice(0, 5)}–${j.dispo.heure_fin.slice(0, 5)}</span>` : '');
    const ligne = (a) => {
      const alerte = !a.competent || a.chevauche || a.sansOf;
      return `<div class="occ-row${alerte ? ' alerte' : ''}">
        <span class="h">${a.debut ? a.debut + '–' + a.fin : 'Journée'}</span>
        <span class="t"><strong>${a.sansOf ? '<span style="color:#B45309;">⚠ Sans OF</span>' : esc(a.of)}</strong> · ${esc(a.operation)}${a.phase ? ` <span class="s">— ${esc(a.phase)}</span>` : ''}<div class="s" title="${esc(a.titre + (a.client ? ' · ' + a.client : ''))}">${esc(a.titre)}${a.client ? ' · ' + esc(a.client) : ''}</div></span>
        <span class="m">${esc(a.machine)}${!a.competent ? ' <span class="tag warn" title="L\'opération ne figure pas dans les compétences de cette personne">hors comp.</span>' : ''}${a.chevauche ? ' <span class="tag warn">chevauche</span>' : ''}</span>
        <span class="d">${esc(fmtDuree(a.min))}</span>
        <span class="a"><button class="btn occ-reaff" data-id="${a.id}" title="Réaffecter à une autre personne" aria-label="Réaffecter">⇄</button><button class="btn occ-dep" data-id="${a.id}" title="Modifier le jour ou l'horaire" aria-label="Horaire">⏱</button><button class="btn occ-cor ${a.sansOf ? 'primary' : ''}" data-id="${a.id}" title="Corriger l'OF, l'opération ou la machine, ou supprimer" aria-label="Corriger">✎</button></span>
      </div>`;
    };
    const bloc = (j, entete) => `<div class="occ-jour" style="border-left-color:${j.indispo ? '#C0392B' : (j.min ? '#16B8A6' : '#D5D9E3')};">
      <div class="occ-jh"><strong style="text-transform:capitalize;">${lib(j.iso)}</strong>${etatTag(j)}${j.min > 480 ? '<span class="tag danger">Surcharge</span>' : ''}
        <span class="r">${j.min ? fmtDuree(j.min) : ''}</span>${j.indispo ? '' : `<button class="btn occ-add ${j.affs.length ? '' : 'primary'}" data-iso="${j.iso}" style="padding:2px 10px;font-size:12px;">＋ Affecter</button>`}${entete || ''}</div>
      ${j.affs.length ? j.affs.map(ligne).join('') : `<div class="occ-vide">${j.indispo ? 'Indisponible ce jour' : 'Aucune affectation : disponible pour une tâche.'}</div>`}</div>`;

    // ----- calcul de la période affichée -----
    const periode = () => {
      const a = occEtat.ancre;
      if (occEtat.vue === 'semaine') { const l = isoLundi(a); return { debut: l, fin: isoAdd(l, 6), label: `Semaine du ${dateCourte(l)} au ${dateCourte(isoAdd(l, 4))}` }; }
      if (occEtat.vue === 'mois') { const d = new Date(a.slice(0, 8) + '01T00:00:00Z'); return { debut: isoMoisDebut(a), fin: isoMoisFin(a), label: `${MOIS_FR[d.getUTCMonth()][0].toUpperCase() + MOIS_FR[d.getUTCMonth()].slice(1)} ${d.getUTCFullYear()}` }; }
      return { debut: plage.debut > `${plage.fin.slice(0, 4)}-01-01` ? isoMoisDebut(plage.debut) : `${plage.fin.slice(0, 4)}-01-01`, fin: plage.fin, label: `Année ${plage.fin.slice(0, 4)} · mois restants` };
    };

    const rendre = () => {
      const per = periode();
      const jours = isoPlage(per.debut, per.fin).map(i => parIso.get(i)).filter(Boolean);
      const st = stats(jours);
      const toutes = st.affs;
      const horsComp = toutes.filter(a => !a.competent);
      const chevauch = toutes.filter(a => a.chevauche);
      const sansOf = toutes.filter(a => a.sansOf);
      const surch = jours.filter(j => j.min > 480);
      const pendantAbsence = jours.filter(j => j.indispo && j.affs.length);
      const points = [];
      if (horsComp.length) points.push(`<strong>${horsComp.length} affectation(s) hors compétence</strong> : ${Array.from(new Set(horsComp.map(a => a.operation))).slice(0, 8).map(esc).join(', ')}.`);
      if (sansOf.length) points.push(`<strong>${sansOf.length} créneau(x) sans OF</strong> (${fmtDuree(sansOf.reduce((t, a) => t + a.min, 0))}) : probables erreurs de saisie, à corriger ou supprimer.`);
      if (surch.length) points.push(`<strong>Surcharge</strong> (plus de 8 h) : ${surch.slice(0, 8).map(j => lib(j.iso) + ' (' + fmtDuree(j.min) + ')').join(', ')}${surch.length > 8 ? '…' : ''}.`);
      if (chevauch.length) points.push(`<strong>${chevauch.length} créneau(x) qui se chevauchent</strong>.`);
      if (pendantAbsence.length) points.push(`<strong>Affectation(s) pendant une absence</strong> : ${pendantAbsence.slice(0, 8).map(j => lib(j.iso)).join(', ')}${pendantAbsence.length > 8 ? '…' : ''}.`);

      const chip = (v, l) => `<span class="occ-chip"><b>${v}</b> ${l}</span>`;
      const kpis = `<div class="occ-kpis">${chip(`<span style="color:${couleurTaux(st.taux)};">${st.taux} %</span>`, 'occupation')}${chip(fmtDuree(st.total), `sur ${fmtDuree(st.capa)}`)}${chip(st.ofs, 'OF')}${chip(st.machines, 'machine(s)')}${chip(st.indispoJ, 'j. d’absence')}</div>`;
      const attention = `<details class="occ-att${points.length ? ' warn' : ''}" ${points.length && points.length <= 2 ? 'open' : ''}>
        <summary>${points.length ? `⚠ ${points.length} point(s) d'attention sur la période` : '✓ Aucun point d\'attention (compétences, horaires, charge)'}</summary>
        ${points.length ? `<ul>${points.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        <div class="occ-acts">
          ${horsComp.length ? '<button class="btn primary" id="occ-auto-hc">Réaffecter automatiquement le hors-compétence</button>' : ''}
          ${toutes.length ? '<button class="btn" id="occ-auto-tout">Libérer la période : tout réaffecter automatiquement</button>' : ''}
          <button class="btn" id="occ-fiche" title="Modifier les compétences (opérations et machines)">Modifier ses compétences</button>
        </div></details>`;

      // navigation
      const nav = `<div class="occ-nav">
        <div class="occ-seg">${['semaine', 'mois', 'annee'].map(v => `<button class="${occEtat.vue === v ? 'on' : ''}" data-vue="${v}">${v === 'annee' ? 'Année' : v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>
        ${occEtat.vue === 'annee' ? '' : '<button class="btn" id="occ-prec" aria-label="Précédent">‹</button>'}<strong class="occ-lbl">${esc(per.label)}</strong>${occEtat.vue === 'annee' ? '' : '<button class="btn" id="occ-suiv" aria-label="Suivant">›</button>'}
        <button class="btn" id="occ-auj" style="margin-left:auto;">Aujourd'hui</button></div>`;

      let corps = '';
      if (occEtat.vue === 'semaine') {
        corps = jours.filter(j => ouvre(j) || j.affs.length || j.indispo).map(j => bloc(j)).join('');
      } else if (occEtat.vue === 'mois') {
        const decal = isoDow(per.debut);
        const cases = Array.from({ length: decal }, () => '<div></div>').concat(jours.map(j => {
          const t = teinte(j); const sel = occEtat.sel === j.iso; const we = !ouvre(j);
          return `<button class="occ-case${sel ? ' sel' : ''}${we ? ' we' : ''}${j.iso === AUJOURDHUI_ISO ? ' auj' : ''}" data-iso="${j.iso}" style="background:${t.bg}; color:${t.fg};" title="${esc(lib(j.iso))}">
            <span class="n">${Number(j.iso.slice(8))}</span>
            <span class="v">${j.indispo ? (j.dispo.statut === 'en arrêt' ? 'Arrêt' : 'Absent') : (j.min ? fmtDuree(j.min) : (we ? '' : '—'))}</span>
            ${j.affs.some(a => !a.competent || a.sansOf || a.chevauche) ? '<span class="w">⚠</span>' : ''}</button>`;
        }));
        const choisi = occEtat.sel && parIso.get(occEtat.sel) && occEtat.sel >= per.debut && occEtat.sel <= per.fin ? parIso.get(occEtat.sel) : null;
        corps = `<div class="occ-cal"><div class="occ-cal-h">${jourCourt.map(x => `<span>${x}</span>`).join('')}</div><div class="occ-cal-g">${cases.join('')}</div></div>
          <div class="occ-legende"><i style="background:#D6F3EE"></i>&lt; 50 %<i style="background:#A8E6DD"></i>50–84 %<i style="background:#6FD3C5"></i>85–100 %<i style="background:#F4B6AE"></i>surcharge<i style="background:repeating-linear-gradient(45deg,#FBE9E7,#FBE9E7 3px,#F6D6D2 3px,#F6D6D2 6px)"></i>absence / arrêt<span style="margin-left:auto;">Cliquez sur un jour pour le détail et les modifications</span></div>
          ${choisi ? bloc(choisi, '<button class="btn" id="occ-voir-sem" style="padding:2px 10px;font-size:12px;">Voir la semaine</button>') : '<div class="occ-vide" style="border:1px dashed var(--line); border-radius:10px;">Sélectionnez un jour du calendrier pour afficher ses affectations.</div>'}`;
      } else {
        const mois = [];
        for (let m = per.debut; m <= per.fin; m = isoAdd(isoMoisFin(m), 1)) mois.push(m);
        corps = `<div class="occ-annee">${mois.map(m => {
          const js = isoPlage(m, isoMoisFin(m)).map(i => parIso.get(i)).filter(Boolean); const s = stats(js);
          const d = new Date(m + 'T00:00:00Z'); const decal = isoDow(m);
          const pts = s.affs.filter(a => !a.competent || a.sansOf || a.chevauche).length;
          return `<button class="occ-mois" data-mois="${m}">
            <div class="mh"><strong style="text-transform:capitalize;">${MOIS_FR[d.getUTCMonth()]}</strong><span style="color:${couleurTaux(s.taux)}; font-weight:700;">${s.taux} %</span></div>
            <div class="ms">${fmtDuree(s.total)} · ${s.ofs} OF${s.indispoJ ? ` · ${s.indispoJ} j abs.` : ''}${pts ? ` · <span style="color:#B45309;">⚠ ${pts}</span>` : ''}</div>
            <div class="hm">${Array.from({ length: decal }, () => '<i style="visibility:hidden"></i>').join('')}${js.map(j => `<i style="background:${teinte(j).bg}; ${ouvre(j) ? '' : 'opacity:.45;'}" title="${esc(lib(j.iso) + (j.min ? ' : ' + fmtDuree(j.min) : ''))}"></i>`).join('')}</div></button>`;
        }).join('')}</div>`;
      }

      document.getElementById('occ-corps').innerHTML = `${nav}${kpis}${attention}${corps}`;

      // ----- événements -----
      const q = (s) => document.querySelectorAll('#occ-corps ' + s);
      q('[data-vue]').forEach(b => b.addEventListener('click', () => { occEtat.vue = b.dataset.vue; rendre(); }));
      const pas = (sens) => {
        if (occEtat.vue === 'semaine') occEtat.ancre = isoAdd(isoLundi(occEtat.ancre), 7 * sens);
        else { const d = new Date(occEtat.ancre.slice(0, 8) + '01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + sens); occEtat.ancre = d.toISOString().slice(0, 10); occEtat.sel = null; }
        if (occEtat.ancre < plage.debut && isoMoisFin(occEtat.ancre) < plage.debut) { toast('Pas de planning chargé avant cette date.'); occEtat.ancre = plage.debut; }
        if (occEtat.ancre > plage.fin) occEtat.ancre = isoMoisDebut(plage.fin);
        rendre();
      };
      const bp = document.getElementById('occ-prec'); if (bp) bp.addEventListener('click', () => pas(-1));
      const bs = document.getElementById('occ-suiv'); if (bs) bs.addEventListener('click', () => pas(1));
      document.getElementById('occ-auj').addEventListener('click', () => { occEtat.ancre = AUJOURDHUI_ISO; occEtat.sel = AUJOURDHUI_ISO; if (occEtat.vue === 'annee') occEtat.vue = 'mois'; rendre(); });
      q('.occ-case').forEach(b => b.addEventListener('click', () => { occEtat.sel = b.dataset.iso; rendre(); }));
      q('.occ-mois').forEach(b => b.addEventListener('click', () => { occEtat.vue = 'mois'; occEtat.ancre = b.dataset.mois; occEtat.sel = null; rendre(); }));
      const vs = document.getElementById('occ-voir-sem'); if (vs) vs.addEventListener('click', () => { occEtat.vue = 'semaine'; occEtat.ancre = occEtat.sel; rendre(); });
      const trouver = (id) => tousAffs.get(String(id));
      q('.occ-reaff').forEach(b => b.addEventListener('click', () => ouvrirReaffectation(p, trouver(b.dataset.id), rouvrir, retour)));
      q('.occ-dep').forEach(b => b.addEventListener('click', () => ouvrirDeplacement(p, trouver(b.dataset.id), occ.jours, rouvrir, retour)));
      q('.occ-cor').forEach(b => b.addEventListener('click', () => ouvrirCorrection(p, trouver(b.dataset.id), rouvrir, retour)));
      q('.occ-add').forEach(b => b.addEventListener('click', () => ouvrirAjoutTache(p, b.dataset.iso, lib(b.dataset.iso), rouvrir, retour)));
      const lotAuto = async (liste, intitule) => {
        if (!confirm(`${intitule}\n\n${liste.length} affectation(s) seront confiées automatiquement à une personne compétente et libre. Continuer ?`)) return;
        let ok = 0; const ko = [];
        for (const a of liste) {
          try {
            const r = await fetch(`${API}/gerer-affectation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'auto', planning_jour_id: a.id, ancien_id: persId, portee: 'creneau' }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur');
            ok++;
          } catch (e) { ko.push(`${dateCourte(a.iso)} ${a.operation} ${a.debut || ''} : ${e.message}`); }
        }
        toast(`${ok} affectation(s) réaffectée(s)${ko.length ? ', ' + ko.length + ' impossible(s)' : ''}.`, ko.length ? 'error' : undefined);
        if (ko.length) alert('Non réaffectées :\n' + ko.slice(0, 15).join('\n') + (ko.length > 15 ? '\n…' : ''));
        rouvrir();
      };
      const bHc = document.getElementById('occ-auto-hc'); if (bHc) bHc.addEventListener('click', () => lotAuto(horsComp, `Réaffecter les affectations de ${p.name} hors compétence (${per.label}) ?`));
      const bTout = document.getElementById('occ-auto-tout'); if (bTout) bTout.addEventListener('click', () => lotAuto(toutes, `Libérer ${p.name} (${per.label}) ?`));
      document.getElementById('occ-fiche').addEventListener('click', () => ouvrirModalePersonne(p));
      rendre.courant = { per, jours, st };
    };

    afficherModale(`
      <h3>Occupation — ${esc(p.name)}</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">${esc(p.role || '')}</div>
      <div id="occ-corps"></div>
      <div class="plan-note" style="margin-top:6px;">Durées en travail effectif (pause 12h00–12h30 déduite). Sans horaire précis : journée de 8 h. Capacité : 8 h par jour du lundi au vendredi (10 h les jours de heures supplémentaires 7h–17h30, 6 h un samedi exceptionnel travaillé 6h–12h), hors absences.</div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="occ-pdf">Télécharger en PDF</button></div>`, 'xlarge');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    rendre();
    document.getElementById('occ-pdf').addEventListener('click', async (ev) => {
      ev.target.disabled = true;
      try {
        await chargerLibsPdf();
        const { per, jours, st } = rendre.courant;
        const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        doc.setFontSize(16); doc.text(pdfTxt(`Occupation - ${p.name}`), 14, 15);
        doc.setFontSize(10); doc.text(pdfTxt(`${p.role || ''}  |  ${per.label}`), 14, 21);
        doc.text(pdfTxt(`Taux d'occupation : ${st.taux} %  |  ${fmtDuree(st.total)} affectees sur ${fmtDuree(st.capa)} disponibles  |  ${st.ofs} OF  |  ${st.indispoJ} jour(s) d'absence ou d'arret`), 14, 27);
        let tableau;
        if (occEtat.vue === 'annee') {
          const corps = [];
          for (let m = per.debut; m <= per.fin; m = isoAdd(isoMoisFin(m), 1)) {
            const js = isoPlage(m, isoMoisFin(m)).map(i => parIso.get(i)).filter(Boolean); const s = stats(js);
            corps.push([`${MOIS_FR[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`, `${s.taux} %`, fmtDuree(s.total), fmtDuree(s.capa), String(s.ofs), String(s.indispoJ)].map(pdfTxt));
          }
          tableau = { head: [['Mois', 'Occupation', 'Affecte', 'Capacite', 'OF', 'Jours d\'absence']], body: corps };
        } else {
          const corps = [];
          jours.filter(j => j.affs.length || j.indispo).forEach(j => {
            const etat = j.dispo && j.dispo.statut !== 'disponible' ? (j.dispo.statut === 'en arrêt' ? 'EN ARRET' : 'ABSENT(E)') : (j.dispo && j.dispo.heure_debut ? `Disponible ${j.dispo.heure_debut.slice(0, 5)}-${j.dispo.heure_fin.slice(0, 5)}` : '');
            corps.push([{ content: pdfTxt(`${lib(j.iso)}${etat ? '  -  ' + etat : ''}${j.min ? '  -  ' + fmtDuree(j.min) : ''}`), colSpan: 6, styles: { fillColor: [225, 240, 238], fontStyle: 'bold' } }]);
            if (!j.affs.length) corps.push([{ content: 'Indisponible', colSpan: 6, styles: { textColor: [120, 120, 120], fontStyle: 'italic' } }]);
            j.affs.forEach(a => corps.push([a.debut ? `${a.debut}-${a.fin}` : 'Journee', a.of, `${a.titre}${a.client ? ' (' + a.client + ')' : ''}`, `${a.operation}${a.phase ? ' - ' + a.phase : ''}`, a.machine, fmtDuree(a.min)].map(pdfTxt)));
          });
          if (!corps.length) corps.push([{ content: 'Aucune affectation sur la periode', colSpan: 6, styles: { fontStyle: 'italic' } }]);
          tableau = { head: [['Horaire', 'OF', 'Titre', 'Operation', 'Machine', 'Duree']], body: corps };
        }
        doc.autoTable({ startY: 32, ...tableau, styles: { fontSize: 9 }, headStyles: { fillColor: [10, 15, 29] }, margin: { left: 14, right: 14 } });
        doc.save(`occupation-${p.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${occEtat.vue}-${per.debut}.pdf`);
      } catch (e) { toast(`PDF impossible : ${e.message}`, 'error'); }
      ev.target.disabled = false;
    });
  }

  // ---------- Feuille journalière de placement du personnel (PDF) ----------
  function chargerScript(src) {
    return new Promise((resolve, reject) => {
      if ([...document.scripts].some(s => s.src === src)) return resolve();
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Impossible de charger ' + src));
      document.head.appendChild(s);
    });
  }
  async function chargerLibsPdf() {
    if (window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return;
    await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  }
  const pdfTxt = (v) => String(v == null ? '' : v).replace(/[  ]/g, ' ').replace(/[→≥≤]/g, '-');
  function dateFr(iso) {
    const d = new Date(iso + 'T00:00:00Z');
    const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    return `${jours[d.getUTCDay()]} ${d.getUTCDate()} ${MOIS_FR[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  }
  const dateCourte = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';

  async function genererFeuilleJournaliere(date) {
    const res = await fetch(`${API}/feuille-journaliere?date=${date}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
    await chargerLibsPdf();
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth();
    const maj = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('Feuille de placement du personnel', 10, 14);
    doc.setFontSize(12);
    doc.text(pdfTxt(maj(dateFr(date))), W - 10, 14, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
    const nbAff = data.personnes.filter(p => p.creneaux.length).length;
    doc.text(pdfTxt(`Atelier Babouot  -  ${nbAff} personne(s) affectee(s)  -  ${data.nb_creneaux} creneau(x)  -  edite le ${new Date().toLocaleString('fr-FR')}`), 10, 20);
    doc.setTextColor(0);
    let y = 24;

    const absents = data.personnes.filter(p => !p.creneaux.length);
    const absentsTxt = absents.map(p => `${p.nom} (${p.statut}${p.plage ? ' ' + p.plage : ''}${p.commentaire ? ' - ' + p.commentaire : ''})`).join('  ;  ');
    if (absentsTxt) {
      doc.autoTable({ startY: y, theme: 'plain', margin: { left: 10, right: 10 }, styles: { fontSize: 8.5, cellPadding: 1.5, fillColor: [253, 240, 230] },
        body: [[pdfTxt('Indisponibles : ' + absentsTxt)]] });
      y = doc.lastAutoTable.finalY + 3;
    }

    // Le titre du travail est la colonne principale (gras, grande taille) ; le n° d'OF est une petite colonne grisée.
    const COLS = ['Horaire', 'Titre du travail', 'OF', 'Operation', 'Machine', 'Client / Caracteristiques', 'Qte', 'Livraison', 'Equipe', 'Observations', 'Visa'];
    const ligne = (c) => [
      c.debut && c.fin ? `${c.debut}\n${c.fin}` : 'Journee',
      pdfTxt(c.titre || c.operation || c.of),
      pdfTxt(c.of + (c.priorite && c.priorite !== 'normale' ? `\n(${c.priorite})` : '')),
      pdfTxt(c.operation),
      pdfTxt(c.machine),
      pdfTxt([c.client, ...c.caracteristiques].filter(Boolean).join('\n')),
      c.quantite != null ? pdfTxt(Number(c.quantite).toLocaleString('fr-FR')) : '',
      dateCourte(c.delai),
      pdfTxt(c.equipe.join(', ')),
      '', '',
    ];
    const colStyles = { 0: { cellWidth: 15, fontStyle: 'bold' }, 1: { cellWidth: 54 }, 2: { cellWidth: 19 }, 3: { cellWidth: 28 }, 4: { cellWidth: 28 }, 5: { cellWidth: 34, fontSize: 7 }, 6: { cellWidth: 12, halign: 'right' }, 7: { cellWidth: 20 }, 8: { cellWidth: 26 }, 9: { cellWidth: 'auto' }, 10: { cellWidth: 12 } };
    const styleCellule = (h) => {
      if (h.section !== 'body') return;
      if (h.column.index === 1) { h.cell.styles.fontStyle = 'bold'; h.cell.styles.fontSize = 10.5; }
      if (h.column.index === 2) { h.cell.styles.fontSize = 6.5; h.cell.styles.textColor = [110, 110, 110]; }
    };

    data.personnes.filter(p => p.creneaux.length).forEach(p => {
      if (y > 175) { doc.addPage(); y = 12; }
      doc.autoTable({
        startY: y, margin: { left: 10, right: 10 }, theme: 'grid',
        head: [[{ content: pdfTxt(`${p.nom}${p.poste ? '  -  ' + p.poste : ''}${p.plage ? '   (disponible ' + p.plage + ')' : ''}`), colSpan: 11, styles: { fillColor: [30, 90, 100], textColor: 255, fontSize: 10, halign: 'left' } }], COLS],
        body: p.creneaux.map(ligne), showHead: 'everyPage',
        styles: { fontSize: 8, cellPadding: 1.6, valign: 'middle', lineColor: [200, 200, 200] },
        headStyles: { fillColor: [235, 238, 240], textColor: 40, fontStyle: 'bold' },
        columnStyles: colStyles,
        didParseCell: (h) => { if (h.section === 'head' && h.row.index === 0) h.cell.styles.fillColor = [30, 90, 100]; if (h.section === 'head' && h.row.index === 0) h.cell.styles.textColor = 255; styleCellule(h); },
      });
      y = doc.lastAutoTable.finalY + 5;
    });

    if (data.sans_personnel.length) {
      if (y > 165) { doc.addPage(); y = 12; }
      doc.autoTable({
        startY: y, margin: { left: 10, right: 10 }, theme: 'grid',
        head: [[{ content: 'ATTENTION - Creneaux sans personnel affecte', colSpan: 11, styles: { fillColor: [180, 80, 40], textColor: 255, fontSize: 10, halign: 'left' } }], COLS],
        body: data.sans_personnel.map(ligne),
        styles: { fontSize: 8, cellPadding: 1.6, valign: 'middle' }, headStyles: { fillColor: [235, 238, 240], textColor: 40 }, columnStyles: colStyles, didParseCell: styleCellule,
      });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (data.presents_sans_tache.length) {
      if (y > 185) { doc.addPage(); y = 12; }
      doc.autoTable({ startY: y, theme: 'plain', margin: { left: 10, right: 10 }, styles: { fontSize: 8.5, cellPadding: 1.5, fillColor: [238, 244, 238] },
        body: [[pdfTxt('Presents sans tache planifiee : ' + data.presents_sans_tache.map(p => p.nom).join(', '))]] });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (!data.nb_creneaux) {
      doc.setFontSize(11); doc.text('Aucun creneau planifie ce jour-la.', 10, y + 6);
    }

    const n = doc.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(110);
      doc.text(pdfTxt(`Chef d'atelier : ____________________    Date/visa : ____________________`), 10, 205);
      doc.text(`Page ${i} / ${n}`, W - 10, 205, { align: 'right' });
    }
    doc.save(`placement-personnel-${date}.pdf`);
  }

        ];

      for (let i = 0; i < 2; i++) corps.push(['', { content: 'Autre travail (preciser) :', styles: { textColor: 120, fontStyle: 'italic' } }, '', '', '', '', '', '', '', '']);

        body: corps,

        columnStyles: { 0: { cellWidth: 26, fontStyle: 'bold' }, 1: { cellWidth: 54 }, 2: { cellWidth: 20 }, 3: { cellWidth: 44 }, 4: { cellWidth: 14, halign: 'right' }, 5: { cellWidth: 18 }, 6: { cellWidth: 23 }, 7: { cellWidth: 26 }, 8: { cellWidth: 19 }, 9: { cellWidth: 'auto' } },
        didParseCell: (h) => {   // titre du travail en gras et en grand, n° d'OF en petit
