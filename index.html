        <button class="btn" id="pl-pdf">Télécharger la fiche PDF</button>
        <button class="btn primary" id="pl-creer">Créer l'OF</button>
      </div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    const opts = (action) => ({
      action, categorie: $('pl-cat').value, auteur: $('pl-auteur').value.trim(), titre: $('pl-titre').value.trim(),
      quantite: parseInt($('pl-qte').value, 10) || 0, delai: $('pl-delai').value || null, date_reception: $('pl-recep').value || null,
      date_reception_peaux: $('pl-peaux').value || null, priorite: $('pl-prio').value,
      nb_pages: parseInt($('pl-pages').value, 10) || null, nb_cahiers: parseInt($('pl-cahiers').value, 10) || null,
      simple: $('pl-simple').checked,
      reparations_volumes: $('pl-repvol').checked,
    });
    const post = async (o) => {
      const res = await fetch(`${API}/generer-of-pleiade`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) });
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || `Erreur serveur (HTTP ${res.status})`);
      return d;
    };
    let dernier = null;
    async function apercu() {
      const zone = $('pl-apercu');
      try {
        const d = await post(opts('apercu')); dernier = d; const v = d.valeurs;
        const ligne = (k, val) => `<tr><td style="color:var(--muted);padding-right:12px;">${k}</td><td><strong>${esc(val || '—')}</strong></td></tr>`;
        zone.innerHTML = `<div style="display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:16px;align-items:start;">
          <table style="font-size:13px;">${ligne('Couleur de tête', v.couleur_tete)}${ligne('Gardes', v.gardes)}${ligne('Cuir (grain chagrin)', v.couleur_peau)}${ligne('Tranchefile', v.tranchefile)}${ligne('Signets', v.signets)}${ligne('Pavé', v.pave ? 'Oui — ' + v.piece_pave : 'Non')}${ligne('Carton', v.carton)}${ligne('Format du bloc', v.format_bloc ? v.format_bloc + ' mm' : '')}${ligne('Applats', 'Toujours')}</table>

          ${d.avertissements.map((a) => `<div class="msg" style="margin-top:6px;">⚠ ${esc(a)}</div>`).join('')}`;
      } catch (e) { zone.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; dernier = null; }
    }
    ['pl-cat', 'pl-simple', 'pl-repvol'].forEach((id) => $(id).addEventListener('change', apercu));
    apercu();

    $('pl-pdf').addEventListener('click', async () => {
      const msg = $('m-msg'); msg.innerHTML = '<div class="msg">Génération du PDF…</div>';
      try {
        await apercu(); if (!dernier) throw new Error('Aperçu indisponible.');
        const o = opts('apercu');
        const octets = await remplirFichePleiade(dernier, o);
        telecharger(octets, `fiche-fabrication-pleiade-${(o.titre || dernier.valeurs.categorie).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w-]+/g, '_')}.pdf`);
        msg.innerHTML = '<div class="msg ok">Fiche téléchargée.</div>';
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    $('pl-creer').addEventListener('click', async () => {
      const msg = $('m-msg'); const o = opts('creer');
      if (!o.titre || !o.quantite) { msg.innerHTML = '<div class="msg error">Titre et quantité sont requis pour créer l\'OF.</div>'; return; }
      msg.innerHTML = '<div class="msg">Création en cours…</div>';
      try {
        const d = await post(o);
        toast(`OF ${d.numero} créé avec sa gamme Pléiade.`);
        try { telecharger(await remplirFichePleiade(d, o), `fiche-${d.numero}.pdf`); } catch (e) { /* la fiche reste téléchargeable */ }
        fermerModale(); chargerDonneesReelles();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    $('pl-cats').addEventListener('click', () => ouvrirModaleCategoriesPleiade(ouvrirModalePleiade));
  }

  async function ouvrirModaleCategoriesPleiade(retour) {
    let ref;
    try { ref = await appelerPleiade('GET'); } catch (e) { toast(e.message); return; }
    const champs = [['libelle', 'Catégorie'], ['tete', 'Tête'], ['gardes', 'Gardes'], ['cuir', 'Cuir'], ['tranchefile', 'Tranchefile'], ['signets', 'Signets'], ['piece', 'Pièce (pavé)'], ['piece_ref', 'Réf.']];
    const ligne = (c) => `<tr data-code="${esc(c.code)}">${champs.map(([k]) => `<td><input data-k="${k}" value="${esc(c[k] || '')}" style="width:100%;min-width:80px;"></td>`).join('')}<td style="white-space:nowrap;"><button class="btn pc-save" style="padding:2px 8px;">Enregistrer</button> <button class="btn pc-del" style="padding:2px 8px;">Retirer</button></td></tr>`;
    afficherModale(`
      <h3>Catégories Pléiade</h3>
      <div class="plan-note" style="margin-bottom:8px;">Une <strong>pièce (pavé)</strong> renseignée déclenche l'étape « Pavé » dans la gamme ; sans pièce, l'étape est sautée. Les modifications valent pour les prochaines fiches.</div>
      <div style="overflow-x:auto;"><table class="sp-table"><thead><tr>${champs.map(([, l]) => `<th>${l}</th>`).join('')}<th></th></tr></thead><tbody>${ref.categories.filter((c) => c.actif !== false).map(ligne).join('')}</tbody></table></div>
      <div style="margin-top:10px;display:flex;gap:8px;"><input id="pc-new" placeholder="Nouvelle catégorie (ex. XXIe siècle)" style="flex:1;"><button class="btn" id="pc-add">Ajouter</button></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="pc-back">Retour</button></div>`, 'xlarge');
    const msg = document.getElementById('m-msg');
    const retourner = () => (retour ? retour() : fermerModale());
    document.getElementById('pc-back').addEventListener('click', retourner);
    document.querySelectorAll('.pc-save').forEach((b) => b.addEventListener('click', async () => {
      const tr = b.closest('tr'); const corps = { code: tr.dataset.code };
      tr.querySelectorAll('input[data-k]').forEach((i) => { corps[i.dataset.k] = i.value; });
      try { await appelerPleiade('PUT', corps); msg.innerHTML = '<div class="msg ok">Enregistré.</div>'; } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }));
    document.querySelectorAll('.pc-del').forEach((b) => b.addEventListener('click', async () => {
      const tr = b.closest('tr');
      try { await appelerPleiade('DELETE', null, `?code=${encodeURIComponent(tr.dataset.code)}`); tr.remove(); msg.innerHTML = '<div class="msg ok">Catégorie retirée de la liste.</div>'; } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }));
    document.getElementById('pc-add').addEventListener('click', async () => {
      const lib = document.getElementById('pc-new').value.trim(); if (!lib) return;
      try { await appelerPleiade('POST', { libelle: lib }); ouvrirModaleCategoriesPleiade(retour); } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
  }

  // ---------- OF Coffret : 2 volumes Pléiade ou plus dans un coffret ----------
  async function ouvrirModaleCoffret() {
    let ofs;
    try {
      const r = await fetch(`${API}/generer-coffret`); const d = await lireJson(r);
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); ofs = d.ofs;
    } catch (e) { afficherModale(`<h3>Coffret Pléiade</h3><div class="msg error">Indisponible (migration 29 exécutée ?). ${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`); document.getElementById('m-cancel').addEventListener('click', fermerModale); return; }
    const optOf = ofs.map((o) => `<option value="${esc(o.id)}">${esc(o.numero)} — ${esc(o.titre)} (${o.quantite - o.deja_affecte} dispo.)</option>`).join('');
    afficherModale(`
      <h3>OF Coffret Pléiade</h3>
      <div class="plan-note" style="margin-bottom:8px;">Un coffret contient plusieurs volumes. Opérations : découpe et rainage de jaquettes, mise en jaquettes, mise sous rhodoïds, mise en coffrets, mise en caisses et palettes. La part des volumes d'un OF Pléiade <strong>non affectée aux coffrets</strong> suit le conditionnement standard de cet OF.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px;">
        <div class="field"><label>Titre du coffret</label><input id="cf-titre"></div>
        <div class="field"><label>Nombre de coffrets</label><input id="cf-nb" type="number" min="1"></div>
        <div class="field"><label>Volumes par coffret</label><input id="cf-vpc" type="number" min="2" value="2"></div>
        <div class="field"><label>Livraison (date max.)</label><input id="cf-delai" type="date"></div>
      </div>
      <div id="cf-besoin" class="plan-note" style="margin:6px 0;"></div>
      <h4 style="margin:8px 0 4px;">Origine des volumes</h4>
      <table class="sp-table"><thead><tr><th>Source</th><th>OF Pléiade / précision</th><th>Volumes</th><th></th></tr></thead><tbody id="cf-src"></tbody></table>
      <button class="btn" id="cf-add" style="margin-top:6px;">+ Ajouter une source</button>
      <div id="cf-apercu"></div><div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="cf-go">Créer l'OF Coffret</button></div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    function ajouterLigne(source) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><select class="cf-s"><option value="emboitage">Sortie emboîtage 1</option><option value="stock">Stock</option><option value="retour">Retour client</option></select></td>
        <td><select class="cf-of">${optOf}</select><input class="cf-lib" placeholder="Titre / précision" style="display:none;width:100%;"></td>
        <td><input class="cf-q" type="number" min="1" style="width:90px;"></td><td><button class="btn cf-x" style="padding:0 8px;">✕</button></td>`;
      $('cf-src').appendChild(tr);
      const maj = () => { const e = tr.querySelector('.cf-s').value === 'emboitage'; tr.querySelector('.cf-of').style.display = e ? '' : 'none'; tr.querySelector('.cf-lib').style.display = e ? 'none' : ''; };
      tr.querySelector('.cf-s').value = source || 'emboitage'; maj();
      tr.querySelector('.cf-s').addEventListener('change', () => { maj(); apercu(); });
      tr.querySelector('.cf-x').addEventListener('click', () => { tr.remove(); apercu(); });
      tr.querySelectorAll('input,select').forEach((i) => i.addEventListener('change', apercu));
    }
    const corps = (action) => ({
      action, titre: $('cf-titre').value.trim(), nb_coffrets: parseInt($('cf-nb').value, 10) || 0, volumes_par_coffret: parseInt($('cf-vpc').value, 10) || 0, delai: $('cf-delai').value || null,
      sources: Array.from($('cf-src').querySelectorAll('tr')).map((tr) => { const s = tr.querySelector('.cf-s').value; return { source: s, of_source_id: s === 'emboitage' ? tr.querySelector('.cf-of').value : null, libelle: s === 'emboitage' ? null : tr.querySelector('.cf-lib').value, quantite: parseInt(tr.querySelector('.cf-q').value, 10) || 0 }; }),
    });
    const post = async (o) => { const r = await fetch(`${API}/generer-coffret`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) }); const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d; };
    async function apercu() {
      const o = corps('apercu'); const besoin = o.nb_coffrets * o.volumes_par_coffret;
      $('cf-besoin').textContent = besoin ? `Volumes nécessaires : ${o.nb_coffrets} × ${o.volumes_par_coffret} = ${besoin}` : '';
      if (!besoin) { $('cf-apercu').innerHTML = ''; return; }
      try {
        const d = await post(o);
        $('cf-apercu').innerHTML = `<div style="margin-top:8px;font-size:13px;"><strong>Affectés : ${d.total} / ${d.besoin}</strong> — gamme : ${d.gamme.map((g) => esc(g.libelle)).join(' → ')}</div>` + d.avertissements.map((a) => `<div class="msg" style="margin-top:4px;">⚠ ${esc(a)}</div>`).join('');
      } catch (e) { $('cf-apercu').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }
    ['cf-nb', 'cf-vpc'].forEach((id) => $(id).addEventListener('input', apercu));
    $('cf-add').addEventListener('click', () => ajouterLigne());
    ajouterLigne();
    $('cf-go').addEventListener('click', async () => {
      const msg = $('m-msg'); msg.innerHTML = '<div class="msg">Création…</div>';
      try { const d = await post(corps('creer')); toast(`OF ${d.numero} (coffrets) créé.`); fermerModale(); chargerDonneesReelles(); }
      catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
  }

  // ---------- Réorganisation du planning par priorité (Pléiade / urgences d'abord) ----------
  async function ouvrirModaleReorganisation() {
    afficherModale(`
      <h3>Réorganiser le planning par priorité</h3>
      <div class="plan-note" style="margin-bottom:8px;">Les OF <strong>Pléiade / Coffret</strong> et les commandes <strong>urgentes</strong> passent en premier, classés par date de livraison. Les autres commandes sont replanifiées derrière, selon leur propre délai. Les tâches <strong>déjà commencées sont terminées</strong> ; seul ce qui n'a pas démarré est déplacé.<br>
      Le nouveau planning s'applique <strong>à titre provisoire</strong> : vous voyez les OF décalés, puis vous <strong>validez</strong> ou vous <strong>annulez</strong> (retour exact à l'état précédent).</div>
      <div id="ro-corps"></div><div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn" id="ro-annuler" style="display:none;">Annuler la réorganisation</button><button class="btn primary" id="ro-go">Calculer la réorganisation</button></div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    let session = null, termine = false;
    const post = async (corps) => {
      const r = await fetch(`${API}/reorganiser-planning`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d;
    };
    const fmt = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + ' ' + iso.slice(11, 16) : '—';
    const dur = (min) => `${Math.floor(min / 60)} h${String(min % 60).padStart(2, '0')}`;
    $('m-cancel').addEventListener('click', async () => {
      if (session && !termine) { try { await post({ action: 'annuler', session_id: session }); chargerDonneesReelles(); } catch (e) { /* rien */ } }
      fermerModale();
    });
    $('ro-annuler').addEventListener('click', async () => {
      try { await post({ action: 'annuler', session_id: session }); toast('Planning remis comme avant.'); session = null; fermerModale(); chargerDonneesReelles(); }
      catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    $('ro-go').addEventListener('click', async () => {
      if (session) {            // validation
        try { await post({ action: 'valider', session_id: session }); termine = true; toast('Nouvelle organisation validée.'); fermerModale(); chargerDonneesReelles(); }
        catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
        return;
      }
      $('ro-go').disabled = true; $('m-msg').innerHTML = '<div class="msg">Libération des créneaux non commencés…</div>';
      try {
        const prep = await post({ action: 'preparer' }); session = prep.session_id;
        if (!prep.ordre.length) { $('m-msg').innerHTML = '<div class="msg ok">Rien à réorganiser.</div>'; $('ro-go').disabled = false; session = null; return; }
        $('ro-corps').innerHTML = `<div style="overflow-x:auto;"><table class="sp-table"><thead><tr><th>#</th><th>OF</th><th>Titre</th><th>Priorité</th><th>Livraison</th><th>Fin prévue</th><th>Résultat</th></tr></thead><tbody>${prep.ordre.map((o, i) =>
          `<tr id="ro-${i}"><td>${i + 1}</td><td><strong>${esc(o.numero)}</strong></td><td>${esc(o.titre)}</td><td>${o.groupe === 'prioritaire' ? (o.type_production === 'coffret' ? 'Coffret' : o.type_production === 'pleiade' ? 'Pléiade' : 'Urgente') : 'Standard'}</td><td>${o.delai ? dateCourte(o.delai) : '—'}</td><td class="ro-fin">…</td><td class="ro-res">en attente</td></tr>`).join('')}</tbody></table></div><div id="ro-det"></div>`;
        const detail = [];
        let retards = 0;
        for (let i = 0; i < prep.ordre.length; i++) {
          const o = prep.ordre[i]; const tr = $('ro-' + i);
          tr.querySelector('.ro-res').textContent = 'calcul…';
          let r;
          try { r = await post({ action: 'planifier', session_id: session, of_id: o.of_id }); } catch (e) { r = { ok: false, erreur: e.message }; }
          if (!r.ok) { tr.querySelector('.ro-res').innerHTML = `<span style="color:var(--danger,#c0392b);">non planifié : ${esc(r.erreur || (r.bloquants || []).map((b) => b.operation + ' — ' + b.detail).join(' ; '))}</span>`; continue; }
          tr.querySelector('.ro-fin').textContent = fmt(r.fin);
          if (r.respecte_delai === false) {
            retards++;
            tr.querySelector('.ro-res').innerHTML = `<strong style="color:var(--danger,#c0392b);">⚠ retard de ${dur(r.retard_min)}</strong>`;
            const lignes = [];
            if (r.heures_sup) lignes.push(`Heures supplémentaires (07h00–17h30) : ${r.heures_sup.respecte_delai ? '<strong>délai tenu</strong>, fin ' + fmt(r.heures_sup.fin) : 'délai toujours dépassé (fin ' + fmt(r.heures_sup.fin) + ')'}${r.heures_sup.respecte_delai ? ` <button class="btn ro-hs" data-of="${esc(o.of_id)}" style="padding:1px 8px;font-size:12px;">Appliquer</button>` : ''}`);
            (r.renforts || []).forEach((x) => lignes.push(`Renfort : « ${esc(x.operation)} » passe de ${x.effectif_actuel} à ${x.effectif_necessaire} personnes (+${x.supplementaires}) — estimation`));
            detail.push(`<div class="msg" style="margin-top:6px;"><strong>${esc(o.numero)}</strong> — délai ${o.delai ? dateCourte(o.delai) : ''} non tenu :<ul style="margin:4px 0 0 18px;">${lignes.length ? lignes.map((l) => `<li>${l}</li>`).join('') : '<li>aucune solution automatique : vérifier peaux/papier reçus, machines, personnel.</li>'}</ul></div>`);
          } else {
            tr.querySelector('.ro-res').innerHTML = r.respecte_delai === true ? '<span style="color:var(--ok,#1a7f5a);">✓ délai tenu</span>' : 'sans délai';
          }
        }
        $('ro-det').innerHTML = detail.join('');
        $('ro-det').querySelectorAll('.ro-hs').forEach((b) => b.addEventListener('click', async () => {
          b.disabled = true;
          try {
            const r = await fetch(`${API}/planifier-of`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: b.dataset.of, mode: 'avant', horaires: 'heures_sup', replanifier: true, depuis: `${dateLocaleIso()}T${new Date().toTimeString().slice(0, 5)}`, appliquer: true }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
            b.outerHTML = '<span style="color:var(--ok,#1a7f5a);">appliqué</span>';
          } catch (e) { b.disabled = false; $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
        }));
        $('m-msg').innerHTML = `<div class="msg ${retards ? '' : 'ok'}">${prep.ordre.length} OF replanifié(s)${retards ? `, ${retards} délai(s) non tenu(s)` : ', tous les délais sont tenus'}. Le planning est provisoire : validez ou annulez.</div>`;
        $('ro-go').textContent = 'Valider la nouvelle organisation'; $('ro-go').disabled = false; $('ro-annuler').style.display = '';
        chargerDonneesReelles();
      } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; $('ro-go').disabled = false; }
    });
  }

  // ---------- Planning annuel Pléiade ----------
  async function ouvrirModalePlanningAnnuel() {
    const api = async (methode, corps, query) => {
      const r = await fetch(`${API}/planning-annuel${query || ''}`, { method: methode, headers: { 'Content-Type': 'application/json' }, body: corps ? JSON.stringify(corps) : undefined });
      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d;
    };
    let data, prop;
    try { data = await api('GET'); prop = await api('POST', { action: 'proposer' }); }
    catch (e) { afficherModale(`<h3>Planning annuel Pléiade</h3><div class="msg error">Indisponible (migration 31 exécutée ?). ${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`); document.getElementById('m-cancel').addEventListener('click', fermerModale); return; }
    const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    const nomMois = (m) => m ? `${MOIS[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}` : '—';
    // Mois affichés : ceux qui ont des titres à produire + ceux qui n'ont que des titres déjà traités (fabriqués / OF créé).
    const listeMois = () => Array.from(new Set([...prop.mois.map((x) => x.mois), ...data.lignes.filter((l) => l.mois && (l.statut === 'fait' || l.statut === 'of_cree')).map((l) => l.mois)])).sort();
    let courant = listeMois().find((m) => m >= dateLocaleIso().slice(0, 7)) || listeMois()[0];
    afficherModale(`
      <h3>Planning annuel Pléiade <span style="font-size:13px;font-weight:400;color:var(--muted);">— référence Gallimard</span></h3>
      <div class="plan-note" style="margin-bottom:8px;">Classement de chaque mois : <strong>1) carte de dos</strong> (séries de largeurs voisines, écart ≤ ${prop.parametres.ecart} mm : moins de réglages à la couverturière BDM), <strong>2) couleur de tête</strong> dans la série (moins de nettoyages des encres de jaspage). Cadence BDM retenue : ${prop.parametres.parJour} titres par jour. L'emboîtage suit le même ordre (épaisseurs de blocs voisines).
        <br>Légende : <strong>S</strong> solde · <strong>N</strong> nouveauté · <strong>T</strong> train (en cours) · <strong>R</strong> réimpression.</div>
      <div id="pa-onglets" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"></div>
      <div id="pa-corps"></div><div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="pa-creer">Créer les OF de ce mois, dans cet ordre</button></div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    $('m-cancel').addEventListener('click', fermerModale);
    const couleurTete = { 'orange': '#f6c177', 'vert': '#b7d77a', 'gris clair': '#d4d8dc', 'gris foncé': '#9aa1a8', 'bleu': '#8ec5ee', 'sable': '#e8d3a8' };
    const pastille = (t) => t ? `<span style="display:inline-block;padding:1px 8px;border-radius:10px;background:${couleurTete[String(t).toLowerCase()] || '#eee'};color:#222;font-size:12px;">${esc(t)}</span>` : '—';
    const champ = (id, k, v, w) => `<input data-id="${id}" data-k="${k}" value="${esc(v == null ? '' : v)}" style="width:${w}px;padding:2px 4px;">`;

    function rendre() {
      const m = prop.mois.find((x) => x.mois === courant);
      const nbTraites = (mo) => data.lignes.filter((l) => l.mois === mo && (l.statut === 'fait' || l.statut === 'of_cree')).length;
      $('pa-onglets').innerHTML = listeMois().map((mo) => { const pm = prop.mois.find((x) => x.mois === mo); const nt = nbTraites(mo);
        return `<button class="btn pa-mois" data-m="${mo}" style="${mo === courant ? 'background:var(--accent,#0f766e);color:#fff;' : ''}">${nomMois(mo)} (${pm ? pm.total_titres : 0}${nt ? ` · ${nt} ✓` : ''})</button>`; }).join('')
        + `<button class="btn pa-mois" data-m="reste" style="${courant === 'reste' ? 'background:var(--accent,#0f766e);color:#fff;' : ''}">À coudre / à emboîter</button>`;
      $('pa-onglets').querySelectorAll('.pa-mois').forEach((b) => b.addEventListener('click', () => { courant = b.dataset.m; rendre(); }));
      $('pa-creer').style.display = m ? '' : 'none';
      if (courant === 'reste') {
        const liste = (t, l) => `<h4 style="margin:8px 0 4px;">${t} (${l.length})</h4><table class="sp-table"><thead><tr><th>Titre</th><th>Qté</th><th>MP</th><th>Carte</th><th>Tête</th><th>Peau</th></tr></thead><tbody>${l.map((x) => `<tr><td>${esc(x.titre)}</td><td>${x.quantite || '—'}</td><td>${x.mp || '—'}</td><td>${x.carte_dos || '—'}</td><td>${pastille(x.tete)}</td><td>${esc(x.peau || '—')}</td></tr>`).join('')}</tbody></table>`;
        $('pa-corps').innerHTML = liste('Blocs à coudre', prop.a_coudre) + liste('Blocs à emboîter', prop.a_emboiter); return;
      }
      const traites = data.lignes.filter((l) => l.mois === courant && (l.statut === 'fait' || l.statut === 'of_cree'));
      const blocTraites = traites.length ? `<h4 style="margin:14px 0 4px;">Déjà traités ce mois (${traites.length})</h4>
        <table class="sp-table" style="opacity:.8;"><thead><tr><th>Titre</th><th>Qté</th><th>Carte de dos</th><th>Tête</th><th>Peau</th><th>Situation</th><th></th></tr></thead><tbody>
        ${traites.map((l) => `<tr><td style="${l.statut === 'fait' ? 'text-decoration:line-through;' : ''}">${esc(l.titre)} ${l.flags ? `<span style="color:var(--muted);font-size:12px;">${esc(l.flags)}</span>` : ''}</td><td>${l.quantite || '—'}</td><td>${l.carte_dos || '—'}</td><td>${pastille(l.tete)}</td><td>${esc(l.peau || '—')}</td>
          <td>${l.statut === 'fait' ? '<span class="tag ok">Déjà fabriqué</span>' : '<span class="tag ok">OF créé</span>'}</td>
          <td style="text-align:right;">${l.statut === 'fait' ? `<button class="btn pa-remettre" type="button" data-id="${l.id}" style="padding:3px 10px;font-size:12px;">Remettre à produire</button>` : ''}</td></tr>`).join('')}</tbody></table>` : '';
      const brancherTraites = () => $('pa-corps').querySelectorAll('.pa-remettre').forEach((bt) => bt.addEventListener('click', async () => {
        bt.disabled = true;
        try { await api('PUT', { id: bt.dataset.id, statut: 'a_produire' }); data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); }
        catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; bt.disabled = false; }
      }));
      if (!m) { $('pa-corps').innerHTML = '<div class="msg">Aucun titre à produire ce mois-ci.</div>' + blocTraites; brancherTraites(); return; }
      const jours = {}; m.sequence.forEach((s) => { (jours[s.jour_bdm] = jours[s.jour_bdm] || []).push(s); });
      const auj = dateLocaleIso();
      const lignesMois = data.lignes.filter((l) => l.mois === m.mois);
      $('pa-corps').innerHTML = `
        <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;">
          <span><strong>${m.sequence.length}</strong> titres classés</span><span><strong>${m.jours_bdm}</strong> jour(s) de BDM</span>
          <span><strong>${m.series}</strong> série(s) de cartes — <strong>${m.reglages}</strong> changement(s) de réglage</span>
          <span><strong>${m.nettoyages}</strong> changement(s) de tête (nettoyage jaspage)</span></div>
        ${m.sans_carte.length ? `<div class="msg" style="margin-bottom:6px;">⚠ Carte de dos manquante (hors classement) : ${m.sans_carte.map((x) => esc(x.titre)).join(' ; ')}</div>` : ''}
        <div style="overflow-x:auto;"><table class="sp-table"><thead><tr><th>Jour BDM</th><th>#</th><th>Titre</th><th>Qté</th><th>Carte de dos</th><th>Tête</th><th>Peau</th><th>Livraison</th><th>OF</th></tr></thead><tbody>
        ${m.sequence.map((s, i) => { const l = lignesMois.find((x) => x.id === s.id) || {};
          return `<tr style="${s.change_reglage ? 'border-top:2px solid var(--accent,#0f766e);' : ''}">
          <td>${i === 0 || m.sequence[i - 1].jour_bdm !== s.jour_bdm ? 'J' + s.jour_bdm : ''}</td><td>${i + 1}</td>
          <td>${esc(s.titre)} ${s.a_verifier ? '<span title="Modifié récemment" style="color:#c0392b;">●</span>' : ''} ${l.flags ? `<span style="color:var(--muted);font-size:12px;">${esc(l.flags)}</span>` : ''}</td>
          <td>${champ(s.id, 'quantite', s.quantite, 70)}</td><td>${champ(s.id, 'carte_dos', s.carte_dos, 46)}${s.change_reglage ? ' <span title="Nouveau réglage BDM">⚙</span>' : ''}</td>
          <td>${champ(s.id, 'tete', s.tete, 90)}${s.change_tete ? ' <span title="Nettoyage jaspage">🧽</span>' : ''}</td><td>${champ(s.id, 'peau', s.peau, 90)}</td>
          <td style="white-space:nowrap;${l.date_livraison && l.date_livraison < auj ? 'color:#c0392b;' : ''}">${l.date_livraison ? dateCourte(l.date_livraison) : nomMois(m.mois)}</td>
          <td style="white-space:nowrap;text-align:right;">${l.of_id ? '<span style="color:#0f766e;">✓ OF créé</span>' : `<button class="btn pa-of" type="button" data-id="${s.id}" data-rang="${i + 1}" data-titre="${esc(s.titre)}" title="Créer l'OF Pléiade de ce titre uniquement" style="padding:3px 10px;font-size:12px;">Créer l'OF</button> <button class="btn pa-fait" type="button" data-id="${s.id}" data-titre="${esc(s.titre)}" title="Ce titre a déjà été fabriqué : le sortir du planning à produire" style="padding:3px 10px;font-size:12px;">Déjà fabriqué</button>`}</td></tr>`; }).join('')}
        ${m.sans_carte.map((x) => { const l = lignesMois.find((y) => y.id === x.id) || {}; return `<tr style="background:var(--field-bg);"><td></td><td>—</td><td>${esc(x.titre)}</td><td>${champ(x.id, 'quantite', l.quantite, 70)}</td><td>${champ(x.id, 'carte_dos', '', 46)}</td><td>${champ(x.id, 'tete', l.tete, 90)}</td><td>${champ(x.id, 'peau', l.peau, 90)}</td><td>${l.date_livraison ? dateCourte(l.date_livraison) : nomMois(m.mois)}</td><td style="white-space:nowrap;text-align:right;">${l.of_id ? '<span style="color:#0f766e;">✓ OF créé</span>' : `<button class="btn pa-of" type="button" data-id="${x.id}" data-rang="${m.sequence.length + 1}" data-titre="${esc(x.titre)}" title="Créer l'OF Pléiade de ce titre uniquement" style="padding:3px 10px;font-size:12px;">Créer l'OF</button> <button class="btn pa-fait" type="button" data-id="${x.id}" data-titre="${esc(x.titre)}" title="Ce titre a déjà été fabriqué : le sortir du planning à produire" style="padding:3px 10px;font-size:12px;">Déjà fabriqué</button>`}</td></tr>`; }).join('')}
        </tbody></table></div>${blocTraites}`;
      brancherTraites();
      $('pa-corps').querySelectorAll('.pa-fait').forEach((bt) => bt.addEventListener('click', async () => {
        if (!window.confirm(`Marquer « ${bt.dataset.titre} » comme déjà fabriqué ? Le titre sort du planning à produire (vous pourrez le remettre).`)) return;
        bt.disabled = true;
        try { await api('PUT', { id: bt.dataset.id, statut: 'fait' }); data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); }
        catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; bt.disabled = false; }
      }));
      $('pa-corps').querySelectorAll('.pa-of').forEach((bt) => bt.addEventListener('click', async () => {
        if (!window.confirm(`Créer l'OF Pléiade « ${bt.dataset.titre} » (ce titre uniquement) ?`)) return;
        bt.disabled = true; $('m-msg').innerHTML = `<div class="msg">Création de l'OF « ${esc(bt.dataset.titre)} »…</div>`;
        try {
          const r = await api('POST', { action: 'generer', ids: [bt.dataset.id], rang_depart: Number(bt.dataset.rang) || 1 });
          const x = (r.resultats || [])[0] || {};
          if (x.erreur || !x.numero) throw new Error(x.erreur || 'Création impossible.');
          toast(`OF ${x.numero} créé : ${x.titre}.`);
          data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); chargerDonneesReelles();
          $('m-msg').innerHTML = `<div class="msg ok">OF ${esc(x.numero)} créé pour « ${esc(x.titre)} ».${(x.avertissements || []).length ? '<br>⚠ ' + x.avertissements.map(esc).join('<br>⚠ ') : ''}</div>`;
        } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; bt.disabled = false; }
      }));
      $('pa-corps').querySelectorAll('input[data-id]').forEach((inp) => inp.addEventListener('change', async () => {
        const v = inp.value.trim(); const num = ['quantite', 'carte_dos'].includes(inp.dataset.k);
        try {
          await api('PUT', { id: inp.dataset.id, [inp.dataset.k]: num ? (v === '' ? null : parseInt(v, 10)) : (v === '' ? null : v) });
          data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre();
        } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      }));
    }
    $('pa-creer').addEventListener('click', async () => {
      const m = prop.mois.find((x) => x.mois === courant); if (!m) return;
      const lignes = data.lignes.filter((l) => m.sequence.some((s) => s.id === l.id) && !l.of_id);
      if (!lignes.length) { $('m-msg').innerHTML = '<div class="msg">Tous les OF de ce mois sont déjà créés.</div>'; return; }
      if (!window.confirm(`Créer ${lignes.length} OF Pléiade pour ${nomMois(courant)}, dans l'ordre affiché ?`)) return;
      $('pa-creer').disabled = true; const sortie = [];
      const ordre = m.sequence.filter((s) => lignes.some((l) => l.id === s.id));
      for (let i = 0; i < ordre.length; i++) {
        $('m-msg').innerHTML = `<div class="msg">Création ${i + 1} / ${ordre.length} : ${esc(ordre[i].titre)}…</div>`;
        try { const r = await api('POST', { action: 'generer', ids: [ordre[i].id], rang_depart: i + 1 }); sortie.push(r.resultats[0]); }
        catch (e) { sortie.push({ titre: ordre[i].titre, erreur: e.message }); }
      }
      const ok = sortie.filter((x) => x.numero).length;
      $('m-msg').innerHTML = `<div class="msg ${ok === sortie.length ? 'ok' : ''}">${ok} OF créé(s) sur ${sortie.length}.${sortie.filter((x) => x.erreur).map((x) => `<br>⚠ ${esc(x.titre)} : ${esc(x.erreur)}`).join('')}</div>`;
      $('pa-creer').disabled = false; data = await api('GET'); prop = await api('POST', { action: 'proposer' }); rendre(); chargerDonneesReelles();
    });
    rendre();
  }

  async function ouvrirModaleNouvelOf() {
    let refs;
    try { refs = await getReferentiels(); }
    catch (e) {
      afficherModale(`<h3>Nouvel OF</h3><div class="msg error">Backend indisponible : impossible de charger les opérations/titres. (${e.message})</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }

    const opsHtml = refs.operations.map(o => `
      <label><input type="checkbox" value="${o.code}"> ${o.nom}</label>
    `).join('');

    afficherModale(`
      <h3>Nouvel ordre de fabrication</h3>
      <div class="import-box" id="import-box">
        <input type="file" id="m-import" accept=".jpg,.jpeg,.png,.webp,.pdf,.doc,.docx,.xls,.xlsx" class="hidden">
        <label for="m-import" class="import-label">
          ${svgIcon('<path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/>')}
          <span><strong>Importer une fiche</strong> — photo, PDF, Word ou Excel<br>remplit le formulaire automatiquement</span>
        </label>
        <div id="import-status"></div><div id="import-car"></div>
      </div>
      <div class="field"><label>Titre / produit</label><input id="m-titre-nom" placeholder="ex: Trône de Fer 5"></div>
      <div class="field"><label>Client</label><input id="m-titre-client" placeholder="ex: Éditions Pléiade"></div>
      <div class="field"><label>Quantité</label><input id="m-qte" type="number" min="1" placeholder="2000"></div>
      <div class="field"><label>Délai</label><input id="m-delai" type="date"></div>
      <div class="field"><label>Type de production <span class="plan-note">— choisit les temps de machine (Pléiade, Cartonné…)</span></label>
        <select id="m-type"><option value="">— non précisé —</option>${(refs.types_production || []).map(t => `<option value="${esc(t.code)}">${esc(t.libelle)}</option>`).join('')}</select></div>
      <div class="field"><label>Priorité</label>
        <select id="m-priorite"><option value="normale">Normale</option><option value="haute">Haute</option><option value="urgente">Urgente</option></select>
      </div>
      <div class="field"><label>Gamme opératoire (cocher dans l'ordre voulu)</label><div class="op-list">${opsHtml}</div></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">Créer l'OF</button></div>
    `);

    let caracteristiquesFiche = {};
    document.getElementById('m-import').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const statusEl = document.getElementById('import-status');
      statusEl.innerHTML = `<div class="msg">Analyse du document en cours…</div>`;
      try {
        const estImage = file.type.startsWith('image/');
        const { base64, mimeType } = estImage
          ? await compresserImage(file)
          : { base64: await fichierEnBase64(file), mimeType: file.type };
        const res = await fetch(`${API}/analyser-fiche`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file_base64: base64, file_name: file.name, mime_type: mimeType }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');

        if (data.titre) document.getElementById('m-titre-nom').value = data.titre;
        if (data.client) document.getElementById('m-titre-client').value = data.client;
        if (data.quantite) document.getElementById('m-qte').value = data.quantite;
        if (data.delai) document.getElementById('m-delai').value = data.delai;
        if (data.type_production) document.getElementById('m-type').value = data.type_production;
        caracteristiquesFiche = data.caracteristiques || {};
        const lues = Object.entries(caracteristiquesFiche);
        document.getElementById('import-car').innerHTML = lues.length ? `<div class="plan-note">Caractéristiques lues sur la fiche : ${lues.map(([k, v]) => esc(k) + ' = ' + esc(String(v))).join(' · ')} (modifiables ensuite dans le chiffrage).</div>` : '';
        document.querySelectorAll('.op-list input[type="checkbox"]').forEach(cb => {
          cb.checked = (data.operation_codes || []).includes(cb.value);
        });

        const confianceClasse = data.confiance === 'haute' ? 'ok' : data.confiance === 'basse' ? 'error' : '';
        statusEl.innerHTML = `<div class="msg ${confianceClasse}">Extraction ${data.confiance || ''} — relisez les champs avant de créer l'OF.${data.notes ? ' ' + data.notes : ''}</div>`;
        toast('Fiche analysée — vérifiez les champs pré-remplis.');
      } catch (err) {
        statusEl.innerHTML = `<div class="msg error">Échec de l'analyse : ${err.message}</div>`;
      }
    });

    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-submit').addEventListener('click', async () => {
      const nom = document.getElementById('m-titre-nom').value.trim();
      const client = document.getElementById('m-titre-client').value.trim();
      const quantite = parseInt(document.getElementById('m-qte').value, 10);
      const delai = document.getElementById('m-delai').value || null;
      const priorite = document.getElementById('m-priorite').value;
      const operations = Array.from(document.querySelectorAll('.op-list input:checked')).map(i => i.value);
      const msg = document.getElementById('m-msg');

      if (!nom || !quantite || operations.length === 0) {
        msg.innerHTML = `<div class="msg error">Titre, quantité et au moins une opération sont requis.</div>`;
        return;
      }
      msg.innerHTML = `<div class="msg">Création en cours…</div>`;
      try {
        const res = await fetch(`${API}/creer-ordre`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ titre: { nom, client }, quantite, delai, priorite, operations, type_production: document.getElementById('m-type').value || null, caracteristiques: caracteristiquesFiche }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        msg.innerHTML = `<div class="msg ok">OF ${data.numero} créé.</div>`;
        toast(`OF ${data.numero} créé avec succès.`);
        fermerModale(); chargerDonneesReelles();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }

  async function ouvrirModaleAffectation({ machineUuid, machineName, dayIdx, ofUuid, gammeId, retour }) {
    let refs;
    try { refs = await getReferentiels(); }
    catch (e) {
      afficherModale(`<h3>Affecter un OF</h3><div class="msg error">Backend indisponible. (${e.message})</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }

    const dateIso = dayIdx != null ? DAYS_ISO[dayIdx] : DAYS_ISO[0];
    const ofOptions = state.ordres.map(o => `<option value="${o.uuid}" ${o.uuid === ofUuid ? 'selected' : ''}>${o.id} — ${o.produit}</option>`).join('');
    const machineOptions = `<option value="">— Aucune machine (opération manuelle) —</option>` + state.machines.filter(m => m.uuid).map(m => `<option value="${m.uuid}" ${m.uuid===machineUuid?'selected':''}>${m.name}</option>`).join('');
    const persCases = refs.personnel.map(p => `<label><input type="checkbox" value="${p.id}"> ${p.nom}${p.poste ? ' <span style="color:var(--ink-500);">— ' + p.poste + '</span>' : ''}</label>`).join('');

    afficherModale(`
      <h3>Affecter un OF au planning</h3>
      <div class="field"><label>Ordre de fabrication</label><select id="m-of">${ofOptions}</select></div>
      <div class="field"><label>Étape de gamme</label><select id="m-etape"><option>Choisir un OF d'abord…</option></select></div>
      <div id="m-etape-note"></div>
      <div class="field"><label>Machine <span class="plan-note">— laissez « Aucune machine » pour un travail manuel</span></label><select id="m-machine">${machineOptions}</select><div id="m-dispo" class="dispo-strip"></div></div>
      <div class="field"><label>Jour de début <span class="plan-note">— proposé automatiquement selon les dépendances</span></label><input id="m-date" type="date" value="${dateIso}"><div id="m-date-note" class="plan-note" style="margin-top:4px;"></div></div>
      <div class="field"><label>Personnel (optionnel — cocher une ou plusieurs personnes)</label><div class="op-list" id="m-personnel-list">${persCases}</div></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">Affecter</button></div>
    `);

    document.getElementById('m-cancel').addEventListener('click', () => (retour ? retour() : fermerModale()));

    const etapeSelect = document.getElementById('m-etape');
    const noteEtape = document.getElementById('m-etape-note');
    const statutChoisi = () => { const o = etapeSelect.selectedOptions[0]; return o ? o.dataset.statut : null; };

    function majNoteEtape(gammes) {
      const st = statutChoisi();
      if (st === 'planifié') {
        noteEtape.innerHTML = `
          <div class="msg" style="margin:-4px 0 12px;">Cette étape est <strong>déjà planifiée</strong>. Pour l'affecter autrement, déplanifiez-la d'abord.
            <div class="note-actions"><button class="btn" id="dp-etape">Déplanifier cette étape</button><button class="btn" id="dp-of">Déplanifier tout l'OF</button></div></div>`;
        document.getElementById('dp-etape').addEventListener('click', () => deplanifier({ gamme_ids: [etapeSelect.value] }));
        document.getElementById('dp-of').addEventListener('click', () => deplanifier({ of_id: document.getElementById('m-of').value }));
      } else if (gammes && !gammes.some(g => g.statut === 'à planifier' || g.statut === 'planifié')) {
        noteEtape.innerHTML = `<div class="msg" style="margin:-4px 0 12px;">Toutes les étapes de cet OF sont démarrées ou terminées : il n'y a plus rien à planifier.</div>`;
      } else {
        noteEtape.innerHTML = '';
      }
    }

    async function deplanifier(corps) {
      const msg = document.getElementById('m-msg');
      msg.innerHTML = `<div class="msg">Déplanification…</div>`;
      try {
        const res = await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        toast(`${d.deplanifiees.length} étape(s) déplanifiée(s).${d.conservees.length ? ' ' + d.conservees.length + ' conservée(s) (déjà démarrées).' : ''}`);
        msg.innerHTML = '';
        chargerDonneesReelles();
        await chargerEtapes();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }

    async function chargerEtapes() {
      const ofSel = document.getElementById('m-of').value;
      etapeSelect.innerHTML = `<option>Chargement…</option>`;
      noteEtape.innerHTML = '';
      try {
        const res = await fetch(`${API}/gammes-ordre?of_id=${ofSel}`);
        const gammes = await lireJson(res);
        if (!res.ok) { etapeSelect.innerHTML = `<option value="">Erreur : ${esc(gammes.error || 'HTTP ' + res.status)}</option>`; return; }
        if (!Array.isArray(gammes) || gammes.length === 0) {
          etapeSelect.innerHTML = `<option value="">Cet OF n'a aucune étape de gamme</option>`;
          return;
        }
        const SUFFIXE = { 'planifié': ' — déjà planifiée', 'en cours': ' — en cours', 'terminé': ' — terminée' };
        etapeSelect.innerHTML = gammes.map(g => `<option value="${g.id}" data-statut="${g.statut}" data-manuel="${g.sans_machine ? 1 : 0}" ${g.statut === 'en cours' || g.statut === 'terminé' ? 'disabled' : ''}>${esc(g.operation.nom)}${SUFFIXE[g.statut] || ''}</option>`).join('');
        const defaut = (gammeId && gammes.find(g => g.id === gammeId && g.statut !== 'en cours' && g.statut !== 'terminé')) || gammes.find(g => g.statut === 'à planifier') || gammes.find(g => g.statut === 'planifié');
        if (defaut) etapeSelect.value = defaut.id;
        majNoteEtape(gammes);
        ajusterMachine();
        majJourDebut();
      } catch (e) {
        etapeSelect.innerHTML = `<option value="">Erreur de chargement</option>`;
      }
    }
    // Disponibilité de la machine choisie : jours libres / occupés / en maintenance.
    let dateManuelle = false;
    const aujourdhuiLocal = () => new Date().toLocaleDateString('sv-SE');
    async function majDispo(auto) {
      const zone = document.getElementById('m-dispo');
      const machine = document.getElementById('m-machine').value;
      if (!machine) { zone.innerHTML = ''; return; }
      const champ = document.getElementById('m-date');
      const auj = aujourdhuiLocal();
      let du = auj;
      if (champ.value && champ.value > auj) { const d = new Date(champ.value + 'T00:00:00'); d.setDate(d.getDate() - 3); const t = d.toLocaleDateString('sv-SE'); if (t > auj) du = t; }
      zone.innerHTML = '<span class="plan-note">Disponibilités de la machine…</span>';
      try {
        const res = await fetch(`${API}/dispo-machine?machine_id=${machine}&du=${du}&jours=21`);
        const r = await res.json();
        if (!res.ok) throw new Error(r.error || 'Erreur inconnue');
        let note = '';
        const premierLibre = r.jours.find(j => j.etat === 'libre' && j.date >= (champ.value || auj));
        const courant = r.jours.find(j => j.date === champ.value);
        if (auto && !dateManuelle && courant && courant.etat !== 'libre' && premierLibre) {
          note = `La machine est occupée le ${courant.libelle} : premier jour libre proposé (${premierLibre.libelle}).`;
          champ.value = premierLibre.date;
        }
        const choisi = champ.value;
        zone.innerHTML = r.jours.map(j => `<button type="button" class="dispo-chip ${j.etat} ${j.date === choisi ? 'choisi' : ''}" data-date="${j.date}" title="${esc(j.etat === 'libre' ? 'Libre — cliquer pour choisir ce jour' : j.details.join('\n'))}">${esc(j.libelle)}</button>`).join('')
          + `<div class="dispo-legende">${note ? esc(note) + ' · ' : ''}Vert : libre (cliquez pour choisir) · barré : occupé (survolez pour voir par quoi) · orangé : maintenance.</div>`;
        zone.querySelectorAll('.dispo-chip.libre').forEach(b => b.addEventListener('click', () => {
          champ.value = b.dataset.date; dateManuelle = true;
          zone.querySelectorAll('.dispo-chip').forEach(x => x.classList.toggle('choisi', x === b));
        }));
      } catch (e) { zone.innerHTML = `<span class="plan-note">Disponibilités indisponibles (${esc(e.message)}).</span>`; }
    }
    document.getElementById('m-machine').addEventListener('change', () => majDispo(true));
    document.getElementById('m-date').addEventListener('change', () => { dateManuelle = true; majDispo(false); });

    // Jour de début automatique : déduit des dépendances de l'opération choisie.
    let suggestionNum = 0;
    async function majJourDebut() {
      const note = document.getElementById('m-date-note');
      const id = etapeSelect.value;
      if (!id || statutChoisi() === 'planifié') { note.textContent = ''; return; }
      const num = ++suggestionNum;
      note.textContent = 'Calcul du jour de début…';
      try {
        const res = await fetch(`${API}/jour-debut-etape?gamme_id=${id}`);
        const r = await res.json();
        if (num !== suggestionNum) return;   // une autre étape a été choisie entre-temps
        if (!res.ok) throw new Error(r.error || 'Erreur inconnue');
        document.getElementById('m-date').value = r.date;
        majDispo(true);
        if (r.bloques && r.bloques.length) {
          note.innerHTML = `<span style="color:var(--danger);">À planifier d'abord : ${r.bloques.map(esc).join(', ')}.</span>`;
        } else {
          note.textContent = `Début le ${r.libelle} — ${r.raison}.`;
        }
      } catch (e) { if (num === suggestionNum) note.textContent = ''; }
    }
    // Opération manuelle : pas de machine à choisir.
    function ajusterMachine() {
      const opt = etapeSelect.selectedOptions && etapeSelect.selectedOptions[0];
      if (opt && opt.dataset.manuel === '1') document.getElementById('m-machine').value = '';
    }
    etapeSelect.addEventListener('change', () => { dateManuelle = false; majNoteEtape(null); ajusterMachine(); majJourDebut(); });
    document.getElementById('m-of').addEventListener('change', chargerEtapes);
    if (ofOptions) chargerEtapes();

    document.getElementById('m-submit').addEventListener('click', async () => {
      const gamme_operatoire_id = document.getElementById('m-etape').value;
      const machine_id = document.getElementById('m-machine').value;
      const date = document.getElementById('m-date').value;
      const personnel_ids = Array.from(document.querySelectorAll('#m-personnel-list input:checked')).map(i => i.value);
      const msg = document.getElementById('m-msg');

      if (statutChoisi() === 'planifié') {
        msg.innerHTML = `<div class="msg error">Cette étape est déjà planifiée : déplanifiez-la d'abord (boutons ci-dessus).</div>`;
        return;
      }
      if (!gamme_operatoire_id || !date) {
        msg.innerHTML = `<div class="msg error">Étape et jour sont requis.</div>`;
        return;
      }
      const optChoisie = etapeSelect.selectedOptions[0];
      if (!machine_id && optChoisie && optChoisie.dataset.manuel === '0' && !confirm('Cette opération utilise normalement une machine. L\'affecter sans machine ?')) return;
      msg.innerHTML = `<div class="msg">Affectation en cours…</div>`;
      try {
        const res = await fetch(`${API}/affecter-planning`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gamme_operatoire_id, machine_id: machine_id || null, date, personnel_ids }),
        });
        let data = await res.json();
        if (res.status === 409 && data.conflit === 'dependance') {
          if (!confirm(`${data.error}\n\nAffecter quand même à la date choisie ?`)) {
            document.getElementById('m-date').value = data.date_suggeree;
            msg.innerHTML = `<div class="msg">Date remplacée par le premier jour possible. Cliquez sur Affecter pour valider.</div>`;
            return;
          }
          const res2 = await fetch(`${API}/affecter-planning`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gamme_operatoire_id, machine_id: machine_id || null, date, personnel_ids, forcer: true }),
          });
          data = await res2.json();
          if (!res2.ok) throw new Error(data.error || 'Erreur inconnue');
        } else if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        msg.innerHTML = `<div class="msg ok">Affecté.</div>`;
        toast('Affectation enregistrée.');
        chargerDonneesReelles(); if (retour) retour(); else fermerModale();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }

  chargerDonneesReelles();
})();
</script>
</body>
</html>
