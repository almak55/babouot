  function fichierEnBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Redimensionne/recompresse une image côté navigateur avant envoi :
  // une photo de téléphone brute (10-15 Mo, souvent >4000px de large)
  // peut dépasser la limite de taille des Netlify Functions une fois
  // encodée en base64, et sature inutilement la mémoire de l'appareil
  // pendant la capture/l'upload. On redescend à 1800px de long côté
  // et en JPEG qualité 0.82 — largement suffisant pour que l'IA lise
  // le texte d'une fiche.
  async function compresserImage(file, maxCote = 1800, qualite = 0.82) {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = dataUrl;
    });
    let { width, height } = img;
    if (width > maxCote || height > maxCote) {
      const ratio = Math.min(maxCote / width, maxCote / height);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    const compressedDataUrl = canvas.toDataURL('image/jpeg', qualite);
    return { base64: compressedDataUrl.split(',')[1], mimeType: 'image/jpeg' };
  }

  // ---------- Import d'un lot de fiches de fabrication (PDF de plusieurs fiches) ----------
  const PDFJS_VERSION = '3.11.174';
  async function chargerPdfJs() {
    if (window.pdfjsLib) return window.pdfjsLib;
    await chargerScript(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`);
    // Le worker doit venir de la même origine : on le récupère puis on le sert depuis un blob.
    const w = await fetch(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(await w.blob());
    return window.pdfjsLib;
  }
  async function pagesEnImages(file, onPage) {
    const sorties = [];
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      const pdfjs = await chargerPdfJs();
      const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
      for (let n = 1; n <= doc.numPages; n++) {
        const page = await doc.getPage(n);
        const base = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: Math.min(2.2, 1500 / base.width) });
        const canvas = document.createElement('canvas'); canvas.width = vp.width; canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        sorties.push({ page: n, mime_type: 'image/jpeg', image_base64: canvas.toDataURL('image/jpeg', 0.82).split(',')[1] });
        if (onPage) onPage(n, doc.numPages);
      }
    } else {
      const { base64, mimeType } = await compresserImage(file);
      sorties.push({ page: 1, mime_type: mimeType, image_base64: base64 });
    }
    return sorties;
  }

  // Classement automatique : les fiches avec date de livraison d'abord (échéance la plus proche en premier),
  // puis celles sans date, selon la date de réception du papier (« ici » = déjà reçu → date du jour).
  function cleClassement(f, aujourdhui) {
    if (f.delai) return `0|${f.delai}`;
    if (f.reception && f.reception.etat === 'ici') return `1|${aujourdhui}`;
    if (f.reception && f.reception.date) return `1|${f.reception.date}`;
    return '2|9999-12-31';
  }
  function classerFiches(liste, aujourdhui) {
    return liste.slice().sort((a, b) => cleClassement(a, aujourdhui).localeCompare(cleClassement(b, aujourdhui)) || a.page - b.page);
  }

  async function ouvrirModaleImportLot() {
    let refs;
    try { refs = await getReferentiels(); }
    catch (e) { afficherModale(`<h3>Importer des fiches</h3><div class="msg error">Backend indisponible. (${esc(e.message)})</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`); document.getElementById('m-cancel').addEventListener('click', fermerModale); return; }
    afficherModale(`

          <span><strong>Choisir un PDF de plusieurs fiches</strong> (ou une photo)<br>chaque fiche est lue, puis vous vérifiez avant de créer les OF</span></label>

    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    let fiches = [];      // lignes de relecture
    let aujourdhui = dateLocaleIso();
    let ordreManuel = false;

    const libellePriorite = (f) => f.delai ? `livraison ${dateCourte(f.delai)}` : (f.reception.etat === 'ici' ? 'papier reçu (ici)' : f.reception.date ? `réception ${dateCourte(f.reception.date)}` : 'sans date');
    const complete = (f) => f.titre && f.quantite > 0 && f.operation_codes.length > 0;

    function rendre() {
      const corps = document.getElementById('il-corps');

      corps.innerHTML = `
        <div class="plan-note" style="margin:6px 0 8px;">${fiches.length} fiche(s) lue(s). <strong>Ordre de passage</strong> : d'abord les fiches avec une date de livraison (la plus proche en premier), puis celles sans date, selon la réception du papier. Corrigez avec ▲▼ ou en modifiant les dates.
          <button class="btn" id="il-auto" style="padding:2px 10px;font-size:12px;margin-left:6px;">Reclasser automatiquement</button></div>

        ${fiches.map((f, i) => `<tr data-i="${i}" ${complete(f) ? '' : 'style="background:var(--field-bg);"'}>
          <td style="white-space:nowrap;"><strong>${i + 1}</strong> <button class="btn il-up" style="padding:0 7px;" ${i === 0 ? 'disabled' : ''}>▲</button><button class="btn il-down" style="padding:0 7px;" ${i === fiches.length - 1 ? 'disabled' : ''}>▼</button>
            <div class="plan-note">${esc(libellePriorite(f))}</div></td>
          <td style="text-align:center;"><input class="il-ok" type="checkbox" ${f.creer && complete(f) ? 'checked' : ''} ${complete(f) ? '' : 'disabled'} title="Créer cet OF"></td>
          <td><input class="il-titre" type="text" value="${esc(f.titre || '')}" placeholder="Titre" style="min-width:190px;"><br><input class="il-client" type="text" value="${esc(f.client || '')}" placeholder="Client" style="min-width:190px;margin-top:3px;">
            <div class="plan-note">page ${f.page}${f.confiance !== 'haute' ? ' · lecture ' + esc(f.confiance) : ''}${f.notes ? ' · ' + esc(f.notes) : ''}</div></td>
          <td><input class="il-qte" type="number" min="1" value="${f.quantite || ''}" style="width:90px;"></td>
          <td><input class="il-delai" type="date" value="${f.delai || ''}">${f.delai_libelle && !f.delai ? `<div class="plan-note">lu : « ${esc(f.delai_libelle)} »</div>` : ''}</td>
          <td><input class="il-rec" type="date" value="${f.reception.date || (f.reception.etat === 'ici' ? aujourdhui : '')}">${f.reception.etat === 'ici' && !f.reception.date ? '<div class="plan-note">« ici » : déjà reçu</div>' : ''}</td>
          <td><details><summary class="plan-note" style="cursor:pointer;">${f.operation_codes.length} opération(s)${f.operation_codes.length ? '' : ' — à choisir'}</summary>
            <div class="op-list" style="max-height:170px;overflow:auto;min-width:230px;">${refs.operations.map(o => `<label><input type="checkbox" class="il-op" value="${esc(o.code)}" ${f.operation_codes.includes(o.code) ? 'checked' : ''}> ${esc(o.nom)}</label>`).join('')}</div></details></td>
        </tr>`).join('')}</tbody></table></div>`;
      const lire = (tr) => {
        const f = fiches[Number(tr.dataset.i)];
        f.titre = tr.querySelector('.il-titre').value.trim() || null; f.client = tr.querySelector('.il-client').value.trim() || null;
        f.quantite = parseInt(tr.querySelector('.il-qte').value, 10) || null;
        f.delai = tr.querySelector('.il-delai').value || null;
        const rec = tr.querySelector('.il-rec').value || null;
        if (rec !== (f.reception.date || (f.reception.etat === 'ici' ? aujourdhui : null))) f.reception = { etat: rec ? 'date' : 'inconnue', date: rec };
        f.operation_codes = Array.from(tr.querySelectorAll('.il-op:checked')).map(x => x.value);

      const nb = fiches.filter(f => f.creer && complete(f)).length;

    document.getElementById('il-file').addEventListener('change', async (ev) => {

      fiches = []; rendre();
      try {
        st.innerHTML = '<div class="msg">Découpage du document en pages…</div>';
        const pages = await pagesEnImages(file, (n, tot) => { st.innerHTML = `<div class="msg">Préparation de la page ${n} / ${tot}…</div>`; });
        const resultats = new Array(pages.length); let faites = 0;
        const analyser = async (p, idx) => {
          for (let essai = 0; essai < 2; essai++) {
            try {
              const res = await fetch(`${API}/analyser-fiches-lot`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pages: [p] }) });
              const d = await lireJson(res);
              if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
              if (d.aujourdhui) aujourdhui = d.aujourdhui;
              resultats[idx] = { ok: true, fiches: d.fiches }; break;

          faites++; st.innerHTML = `<div class="msg">Lecture des fiches : ${faites} / ${pages.length}…</div>`;
        };
        const file_d = pages.map((p, i) => [p, i]);
        await Promise.all([0, 1, 2].map(async () => { while (file_d.length) { const [p, i] = file_d.shift(); await analyser(p, i); } }));
        const erreurs = resultats.filter(r => !r.ok);
        const lues = [];
        resultats.filter(r => r.ok).forEach(r => r.fiches.forEach(f => {
          if (f.fiche === false) return;
          if (f.suite && lues.length) {
            const p = lues[lues.length - 1]; p.operation_codes = [...new Set([...p.operation_codes, ...f.operation_codes])]; p.notes = [p.notes, f.notes].filter(Boolean).join(' ');
            // Fiche sur plusieurs pages : l'emboîtage par défaut se décide sur l'ensemble (tranchefile/signet sur une page, finitions sur l'autre).
            const sg = p.signes_emboitage || {}, sf = f.signes_emboitage || {};
            const ts = !!(sg.ts || sf.ts), fin = !!(sg.fin || sf.fin), emb = !!(sg.emb || sf.emb);
            const coud = !!(sg.coud || sf.coud), asm = !!(sg.asm || sf.asm);
            p.signes_emboitage = { ts, fin, emb, coud, asm };
            // Couture sur une page, assemblage absent : l'assemblage est ajouté avant la couture (l'ordre exact est rétabli à la création de l'OF).
            const ca = p.assemblage_code || f.assemblage_code;
            if (coud && !asm && ca && !p.operation_codes.includes(ca)) {
              p.operation_codes.unshift(ca); p.signes_emboitage.asm = true;
              p.notes = [p.notes, 'Assemblage ajouté automatiquement (couture sur la fiche : l\'assemblage précède la couture).'].filter(Boolean).join(' ');
            }
            const ce = p.emboitage_code || f.emboitage_code;
            if (ts && fin && !emb && ce && !p.operation_codes.includes(ce) && p.type_production !== 'pleiade' && p.type_production !== 'coffret') {
              p.operation_codes.push(ce); p.signes_emboitage.emb = true;
              p.notes = [p.notes, 'Emboîtage ajouté automatiquement (tranchefile / signet et opérations de finition sur la fiche).'].filter(Boolean).join(' ');
            }
            return;
          }
          lues.push({ ...f, creer: true });
        }));
        fiches = classerFiches(lues, aujourdhui);
        st.innerHTML = `<div class="msg ${erreurs.length ? 'error' : 'ok'}">${lues.length} fiche(s) trouvée(s) dans ${pages.length} page(s).${erreurs.length ? ' Pages non lues : ' + erreurs.map(e => e.page + ' (' + esc(e.erreur) + ')').join(' ; ') + '.' : ' Vérifiez les champs avant de créer les OF.'}</div>`;
        rendre();
      } catch (e) { st.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      ev.target.value = '';
    });

    document.getElementById('il-go').addEventListener('click', async () => {
      const msg = document.getElementById('m-msg');

      document.getElementById('il-go').disabled = true;
      const crees = [], echecs = [];
      for (let i = 0; i < aCreer.length; i++) {
        const f = aCreer[i];
        msg.innerHTML = `<div class="msg">Création des OF : ${i} / ${aCreer.length}…</div>`;
        try {
          const dateRec = f.reception.date || (f.reception.etat === 'ici' ? aujourdhui : null);
          const res = await fetch(`${API}/creer-ordre`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
            titre: { nom: f.titre, client: f.client || '' }, quantite: f.quantite, delai: f.delai, priorite: 'normale', operations: f.operation_codes,
            type_production: f.type_production || null, caracteristiques: f.caracteristiques || {}, date_reception: dateRec, rang_priorite: i + 1 }) });
          const d = await lireJson(res);

      }
      chargerDonneesReelles();

  // ---------- Fiche de fabrication Pléiade : génération automatique ----------
  const PDFLIB_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
  function chargerPdfLib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    return new Promise((ok, ko) => {
      const s = document.createElement('script'); s.src = PDFLIB_URL;
      s.onload = () => ok(window.PDFLib); s.onerror = () => ko(new Error('Bibliothèque PDF indisponible (connexion ?).'));
      document.head.appendChild(s);
    });
  }
  const dateFrPl = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.split('-').reverse().join('/') : '');

  async function remplirFichePleiade(d, o) {
    const PL = await chargerPdfLib();
    const res = await fetch('/fiche-pleiade-modele.pdf');
    if (!res.ok) throw new Error('Modèle de fiche introuvable (fiche-pleiade-modele.pdf).');
    const pdf = await PL.PDFDocument.load(await res.arrayBuffer());
    const form = pdf.getForm();
    const T = (nom, v) => { try { if (v !== undefined && v !== null && v !== '') form.getTextField(nom).setText(String(v)); } catch (e) { /* champ absent ou caractère non géré */ } };
    const C = (nom, on) => { try { const f = form.getCheckBox(nom); if (on) f.check(); else f.uncheck(); } catch (e) { /* champ absent */ } };
    const v = d.valeurs;
    T('auteur', o.auteur); T('titre', o.titre); T('client', v.client); T('reference', o.reference);
    T('date_fiche', dateFrPl(dateLocaleIso())); T('categorie', v.categorie_libelle);
    T('tirage', o.quantite); T('livraison', dateFrPl(o.delai)); T('reception_papier', dateFrPl(o.date_reception));
    T('reception_peaux', dateFrPl(o.date_reception_peaux));
    C('prio_normale', (o.priorite || 'normale') === 'normale'); C('prio_haute', o.priorite === 'haute'); C('prio_urgente', o.priorite === 'urgente');
    C('v_simple', o.simple); C('v_coffret', o.coffret); C('v_rhodoides', o.rhodoides); C('v_etuis', o.etuis);
    T('couleur', v.couleur_peau); T('cuir', v.couleur_peau); T('format', v.format_bloc); T('nb_pages', o.nb_pages); T('nb_cahiers', o.nb_cahiers);
    T('carton', v.carton); T('gardes', v.gardes); T('piece_pave', v.pave ? (v.piece_pave || 'Oui (peau ' + v.couleur_peau + ')') : 'Pas de pavé'); T('couleur_tete', v.couleur_tete);
    C('grainage_oui', true); C('signet_oui', !!v.signets); C('signet_non', !v.signets); T('signet_couleur', v.signets);
    C('tranchefile_oui', !!v.tranchefile); C('tranchefile_non', !v.tranchefile); T('tranchefile_couleur', v.tranchefile);
    d.gamme.forEach((g) => { C('op_' + g.operation_code, true); T('ordre_' + g.operation_code, g.sequence); });
    T('remarques', v.notes);
    form.updateFieldAppearances(await pdf.embedFont(PL.StandardFonts.Helvetica));
    return pdf.save();
  }

  function telecharger(octets, nom) {
    const url = URL.createObjectURL(new Blob([octets], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  async function appelerPleiade(methode, corps, query) {
    const res = await fetch(`${API}/gerer-pleiade${query || ''}`, { method: methode, headers: { 'Content-Type': 'application/json' }, body: corps ? JSON.stringify(corps) : undefined });
    const d = await lireJson(res);
    if (!res.ok) throw new Error(d.error || `Erreur serveur (HTTP ${res.status})`);
    return d;
  }

        <div class="plan-note" style="margin-top:4px;">Les créneaux de cette date et des jours suivants sont <strong>supprimés puis recalculés</strong>, même si la date est déjà passée. Ce qui commence <strong>avant</strong> cette date reste en place. Les étapes dont la <strong>production a été saisie</strong> ne sont jamais touchées.</div></div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px;"><input type="checkbox" id="ro-encours" style="margin-top:3px;"> <span>Libérer aussi les étapes au statut <strong>« en cours »</strong> <span class="plan-note">(sans production saisie)</span></span></label>` : ''}
      ${actualiser ? `<div class="plan-note" style="margin-bottom:8px;">Reprend les <strong>OF validés ou en cours</strong> avec les <strong>derniers réglages</strong> : temps standards, quantités (ratios de réparation), délais de séchage, horaires et dépendances. L'<strong>ordre actuel du planning est conservé</strong>. ${depuisMode ? 'Ce qui est libéré est replacé <strong>au plus tôt, à partir de maintenant</strong> (jamais dans le passé), avec la règle de la journée de machine ; les placements ou affectations faits à la main sont recalculés.' : 'Les tâches <strong>déjà commencées ne bougent pas</strong> ; seul ce qui n\'a pas démarré est replanifié au plus tôt (les placements ou affectations faits à la main sur ces tâches sont recalculés).'} Les OF jamais planifiés ne sont pas touchés.<br>
      Le résultat est <strong>provisoire</strong> : vous voyez les OF décalés, puis vous <strong>validez</strong> ou vous <strong>annulez</strong> (retour exact à l'état précédent).</div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px;"><input type="checkbox" id="ro-liens" style="margin-top:3px;"> <span>Refaire aussi les <strong>dépendances</strong> de chaque OF d'après le modèle <span class="plan-note">(remplace les liens saisis à la main sur ces OF ; à cocher après avoir modifié « Dépendances standards »)</span></span></label>` : ''}
      <div class="plan-note" style="margin-bottom:8px;${actualiser ? 'display:none;' : ''}">Les OF <strong>Pléiade / Coffret</strong> et les commandes <strong>urgentes</strong> passent en premier, classés par date de livraison. Les autres commandes sont replanifiées derrière, selon leur propre délai. Les tâches <strong>déjà commencées sont terminées</strong> ; seul ce qui n'a pas démarré est déplacé.<br>
      Le nouveau planning s'applique <strong>à titre provisoire</strong> : vous voyez les OF décalés, puis vous <strong>validez</strong> ou vous <strong>annulez</strong> (retour exact à l'état précédent).</div>
      <div id="ro-corps"></div><div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn" id="ro-annuler" style="display:none;">Annuler la réorganisation</button><button class="btn primary" id="ro-go">${depuisMode ? 'Replanifier' : actualiser ? 'Recalculer' : 'Calculer la réorganisation'}</button></div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    let session = null, termine = false;
    const post = async (corps) => {
      const r = await fetch(`${API}/reorganiser-planning`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d;
    };
    const fmt = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + ' ' + iso.slice(11, 16) : '—';
    const dur = (min) => `${Math.floor(min / 60)} h${String(min % 60).padStart(2, '0')}`;
    $('m-cancel').addEventListener('click', async () => {
      if (session && !termine) { try { await post({ action: 'annuler', session_id: session }); chargerDonneesReelles(); } catch (e) { /* rien */ } }
      fermerModale();
    });
    $('ro-annuler').addEventListener('click', async () => {
      try { await post({ action: 'annuler', session_id: session }); toast('Planning remis comme avant.'); session = null; fermerModale(); chargerDonneesReelles(); }
      catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    $('ro-go').addEventListener('click', async () => {
      if (session) {            // validation
        try { await post({ action: 'valider', session_id: session }); termine = true; toast(depuisMode ? 'Replanification validée.' : actualiser ? 'Recalcul validé.' : 'Nouvelle organisation validée.'); fermerModale(); chargerDonneesReelles(); }
        catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
        return;
      }
      $('ro-go').disabled = true; $('m-msg').innerHTML = '<div class="msg">Libération des créneaux non commencés…</div>';
      try {
        const refaireLiens = !!($('ro-liens') && $('ro-liens').checked); if ($('ro-liens')) $('ro-liens').disabled = true;
        const dateDepuis = depuisMode ? ($('ro-date').value || '') : '';
        if (depuisMode && !/^\d{4}-\d{2}-\d{2}$/.test(dateDepuis)) { $('m-msg').innerHTML = '<div class="msg error">Choisissez la date à partir de laquelle replanifier.</div>'; $('ro-go').disabled = false; if ($('ro-liens')) $('ro-liens').disabled = false; return; }
        if (depuisMode) { $('ro-date').disabled = true; $('ro-encours').disabled = true; }
        const prep = await post({ action: 'preparer', mode: actualiser ? 'actualiser' : undefined, depuis_date: depuisMode ? dateDepuis : undefined, inclure_en_cours: depuisMode ? !!$('ro-encours').checked : undefined }); session = prep.session_id;
        const protegees = prep.proteges ? ` ${prep.proteges} étape(s) avec production saisie ont été conservées.` : '';
        if (!prep.ordre.length) { $('m-msg').innerHTML = `<div class="msg ok">${depuisMode ? 'Rien à replanifier à partir de cette date.' : actualiser ? 'Rien à recalculer : aucun OF n\'a de tâche à venir non commencée.' : 'Rien à réorganiser.'}${protegees}</div>`; $('ro-go').disabled = false; session = null; if (depuisMode) { $('ro-date').disabled = false; $('ro-encours').disabled = false; } if ($('ro-liens')) $('ro-liens').disabled = false; return; }
        $('ro-corps').innerHTML = `<div style="overflow-x:auto;"><table class="sp-table"><thead><tr><th>#</th><th>OF</th><th>Titre</th><th>Priorité</th><th>Livraison</th><th>Fin prévue</th><th>Résultat</th></tr></thead><tbody>${prep.ordre.map((o, i) =>
          `<tr id="ro-${i}"><td>${i + 1}</td><td><strong>${esc(o.numero)}</strong></td><td>${esc(o.titre)}</td><td>${o.groupe === 'prioritaire' ? (o.type_production === 'coffret' ? 'Coffret' : o.type_production === 'pleiade' ? 'Pléiade' : 'Urgente') : 'Standard'}</td><td>${o.delai ? dateCourte(o.delai) : '—'}</td><td class="ro-fin">…</td><td class="ro-res">en attente</td></tr>`).join('')}</tbody></table></div><div id="ro-det"></div>`;
        // ---- Calcul : les OF soumis à un lot minimum (BDM / pressure en colle Pléiade) sont placés d'abord ; les lots sont formés ; le reste suit ----
        const liensFaits = new Set();                // OF dont les dépendances ont déjà été refaites (une seule fois)
        const resultats = {};                        // i -> dernière réponse de planifier
        const attentes = new Map();                  // gamme_id -> étape en attente d'un lot minimum
        const rangDe = {}; prep.ordre.forEach((o, i) => { rangDe[o.of_id] = i; });
        const planifier = async (i, extra) => {
          const o = prep.ordre[i]; const tr = $('ro-' + i);
          tr.querySelector('.ro-res').textContent = 'calcul…';
          let r;
          try { r = await post({ action: 'planifier', session_id: session, of_id: o.of_id, refaire_liens: refaireLiens && !liensFaits.has(o.of_id), ...(extra || {}) }); liensFaits.add(o.of_id); } catch (e) { r = { ok: false, erreur: e.message }; }
          resultats[i] = r;
          Array.from(attentes.keys()).forEach((k) => { if (attentes.get(k).of_id === o.of_id) attentes.delete(k); });
          if (r.ok) (r.attente_lot || []).forEach((a) => attentes.set(a.gamme_id, a));
          return r;
        };
        const dernierLots = prep.ordre.reduce((m, o, i) => (o.avec_lots ? i : m), -1);
        for (let i = 0; i <= dernierLots; i++) await planifier(i);
        let tour = 0;
        while (attentes.size && tour++ < 12) {
          $('m-msg').innerHTML = `<div class="msg">Formation des lots minimum (tour ${tour})…</div>`;
          let l;
          try { l = await post({ action: 'lots', session_id: session, attentes: Array.from(attentes.values()) }); } catch (e) { $('m-msg').innerHTML = `<div class="msg error">Lots : ${esc(e.message)}</div>`; break; }
          if (!(l.lancements || []).length) break;
          const parOf = {};
          l.lancements.forEach((x) => { (parOf[x.of_id] = parOf[x.of_id] || {})[x.gamme_id] = x.depart; });
          const ids = Object.keys(parOf).sort((x, y) => rangDe[x] - rangDe[y]);
          for (const id of ids) await planifier(rangDe[id], { lots_liberes: parOf[id], lots_seul: true });   // 1) les machines du lot d'abord
          for (const id of ids) await planifier(rangDe[id]);                                                  // 2) puis la suite de chaque OF
        }
        for (let i = dernierLots + 1; i < prep.ordre.length; i++) await planifier(i);

        const nomOp = (a) => a.operation || a.operation_code;
        const mini = (a) => String(a.quantite_min).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        const nbr = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        const rendre = async () => {
          const detail = []; let retards = 0, partiels = 0;
          prep.ordre.forEach((o, i) => {
            const r = resultats[i]; const tr = $('ro-' + i); if (!r) return;
            if (!r.ok) { tr.querySelector('.ro-res').innerHTML = `<span style="color:var(--danger,#c0392b);">non planifié : ${esc(r.erreur || (r.bloquants || []).map((b) => b.operation + ' — ' + b.detail).join(' ; '))}</span>`; return; }
            tr.querySelector('.ro-fin').textContent = fmt(r.fin) + (r.partiel ? ' *' : '');
            const enAttente = Array.from(attentes.values()).filter((a) => a.of_id === o.of_id);
            if (r.respecte_delai === false) {
              retards++;
              tr.querySelector('.ro-res').innerHTML = `<strong style="color:var(--danger,#c0392b);">⚠ retard de ${dur(r.retard_min)}</strong>${enAttente.length ? ' · ⏳ ' + enAttente.length + ' étape(s) en attente de lot' : ''}`;
              const lignes = [];
              if (r.heures_sup) lignes.push(`Heures supplémentaires (07h00–17h30) : ${r.heures_sup.respecte_delai ? '<strong>délai tenu</strong>, fin ' + fmt(r.heures_sup.fin) : 'délai toujours dépassé (fin ' + fmt(r.heures_sup.fin) + ')'}${r.heures_sup.respecte_delai && !r.partiel ? ` <button class="btn ro-hs" data-of="${esc(o.of_id)}" style="padding:1px 8px;font-size:12px;">Appliquer</button>` : ''}`);
              (r.renforts || []).forEach((x) => lignes.push(`Renfort : « ${esc(x.operation)} » passe de ${x.effectif_actuel} à ${x.effectif_necessaire} personnes (+${x.supplementaires}) — estimation`));
              detail.push(`<div class="msg" style="margin-top:6px;"><strong>${esc(o.numero)}</strong> — délai ${o.delai ? dateCourte(o.delai) : ''} non tenu :<ul style="margin:4px 0 0 18px;">${lignes.length ? lignes.map((l) => `<li>${l}</li>`).join('') : '<li>aucune solution automatique : vérifier peaux/papier reçus, machines, personnel.</li>'}</ul></div>`);
            } else if (enAttente.length) {
              partiels++;
              tr.querySelector('.ro-res').innerHTML = `<span style="color:var(--warn,#b9770e);">⏳ ${enAttente.length} étape(s) en attente de lot</span>`;
            } else {
              tr.querySelector('.ro-res').innerHTML = r.respecte_delai === true ? '<span style="color:var(--ok,#1a7f5a);">✓ délai tenu</span>' : 'sans délai';
            }
          });
          let bloc = detail.join('');
          // Étapes qui attendent un lot : un titre qui n'atteint pas le minimum seul n'est pas lancé (pas de report automatique au lendemain).
          const liste = Array.from(attentes.values());
          if (liste.length) {
            const codes = Array.from(new Set(liste.map((a) => a.operation_code)));
            const lignesOp = codes.map((c) => {
              const g = liste.filter((a) => a.operation_code === c); const prets = g.filter((a) => !a.en_amont);
              const total = prets.reduce((t, a) => t + a.quantite, 0); const min = g[0].quantite_min;
              return `<li><strong>${esc(nomOp(g[0]))}</strong> : ${nbr(total)} ex. prêts à fabriquer${total < min ? `, il manque <strong>${nbr(min - total)} ex.</strong> pour déclencher la mise en route (minimum ${mini(g[0])} par journée)` : ''}${(g[0].titres_min || 1) > 1 ? ` · la machine ne démarre pas pour un seul titre (au moins ${g[0].titres_min} titres ensemble${prets.length < g[0].titres_min ? ' — ' + prets.length + ' titre(s) prêt(s) pour l\'instant' : ''})` : ''}${g.length > prets.length ? ` · ${g.length - prets.length} titre(s) pas encore prêt(s) (étape précédente en attente)` : ''}</li>`;
            }).join('');
            const parOf = []; liste.forEach((a) => { if (!parOf.includes(a.of_id)) parOf.push(a.of_id); });
            bloc += `<div class="msg" style="margin-top:8px;display:block;"><strong>⏳ En attente d'un lot minimum</strong> — pas d'exemplaires programmés tant que la journée n'atteint pas le minimum ; la suite attend que d'autres titres soient prêts (aucun report automatique).<ul style="margin:4px 0 6px 18px;">${lignesOp}</ul>
              <div style="overflow-x:auto;"><table class="sp-table"><thead><tr><th>OF</th><th>Titre</th><th>Étape</th><th>Ex.</th><th>Livraison</th><th></th></tr></thead><tbody>${parOf.map((id) => {
                const o = prep.ordre[rangDe[id]]; const g = liste.filter((a) => a.of_id === id);
                return `<tr><td><strong>${esc(o.numero)}</strong></td><td>${esc(o.titre)}</td><td>${g.map((a) => esc(nomOp(a))).join(', ')}</td><td>${g.map((a) => nbr(a.quantite)).join(' / ')}</td><td>${o.delai ? dateCourte(o.delai) : '—'}</td><td><button class="btn ro-lancer" data-of="${esc(id)}" style="padding:1px 8px;font-size:12px;" title="Programmer ce titre sans attendre le minimum">Lancer quand même</button></td></tr>`;
              }).join('')}</tbody></table></div></div>`;
          }
          // Contrôle : quantité réellement programmée par journée de machine.
          let bilan = null;
          try { bilan = await post({ action: 'lots_bilan', session_id: session }); } catch (e) { bilan = null; }
          if (bilan && (bilan.jours || []).length) {
            const mal = bilan.jours.filter((j) => !j.ok);
            bloc += `<details style="margin-top:8px;" ${mal.length ? 'open' : ''}><summary style="cursor:pointer;">${mal.length ? `<strong style="color:var(--danger,#c0392b);">⚠ ${mal.length} journée(s) sous le minimum</strong>` : '<strong style="color:var(--ok,#1a7f5a);">✓ Lots minimum respectés</strong>'} — contrôle des journées Pléiade (BDM, pressure en colle)</summary>
              <table class="sp-table" style="margin-top:4px;"><thead><tr><th>Jour</th><th>Opération</th><th>Machine</th><th>Exemplaires</th><th>Minimum</th><th>OF</th></tr></thead><tbody>${bilan.jours.map((j) => `<tr><td>${dateCourte(j.date)}</td><td>${esc(j.operation_code === 'PRESSURE_COLLE' ? 'Pressure en colle' : j.operation_code === 'MONTAGE_COUVERTURE_PLEAIDE' ? 'Montage couvertures (BDM)' : j.operation_code)}</td><td>${esc(j.machine)}</td><td><strong style="color:${j.ok ? 'var(--ok,#1a7f5a)' : 'var(--danger,#c0392b)'};">${nbr(j.quantite)}</strong></td><td>${nbr(j.quantite_min)}</td><td>${esc(j.ofs.join(', '))}</td></tr>`).join('')}</tbody></table></details>`;
          }
          $('ro-det').innerHTML = bloc;
          $('ro-det').querySelectorAll('.ro-hs').forEach((b) => b.addEventListener('click', async () => {
            b.disabled = true;
            try {
              const r = await fetch(`${API}/planifier-of`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: b.dataset.of, mode: 'avant', horaires: 'heures_sup', replanifier: true, depuis: `${dateLocaleIso()}T${new Date().toTimeString().slice(0, 5)}`, appliquer: true }) });
              const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
              b.outerHTML = '<span style="color:var(--ok,#1a7f5a);">appliqué</span>';
            } catch (e) { b.disabled = false; $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
          }));
          $('ro-det').querySelectorAll('.ro-lancer').forEach((b) => b.addEventListener('click', async () => {
            b.disabled = true; b.textContent = 'calcul…';
            try { await planifier(rangDe[b.dataset.of], { lots: 'liberes' }); await rendre(); chargerDonneesReelles(); }
            catch (e) { b.disabled = false; b.textContent = 'Lancer quand même'; $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
          }));
          $('m-msg').innerHTML = `<div class="msg ${retards || partiels ? '' : 'ok'}">${prep.ordre.length} OF replanifié(s)${retards ? `, ${retards} délai(s) non tenu(s)` : ', tous les délais sont tenus'}${partiels ? `, ${partiels} OF avec des étapes en attente de lot (planning partiel, repéré par *)` : ''}.${protegees} Le planning est provisoire : validez ou annulez.</div>`;
        };
        await rendre();
        $('ro-go').textContent = depuisMode ? 'Valider la replanification' : actualiser ? 'Valider le recalcul' : 'Valider la nouvelle organisation'; $('ro-go').disabled = false; $('ro-annuler').style.display = '';
        chargerDonneesReelles();
      } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; $('ro-go').disabled = false; }
    });
  }

  // ---------- Optimiser la production (Reporting) ----------
  // Choix d'une période et d'OF ; le moteur de planification essaie plusieurs ordres de passage (règles métier + proposition de l'IA),
  // mesure chaque résultat (retards, réglages, nettoyages, temps morts, heures supplémentaires, charge du personnel) puis remet le planning
  // EXACTEMENT comme avant chaque essai. La meilleure organisation n'est appliquée que sur demande, à titre provisoire (valider ou annuler).
  function ouvrirModaleOptimisation() {
    const $ = (id) => document.getElementById(id) || document.createElement('div');   // fenêtre fermée pendant un calcul : écritures sans effet
    const modaleOuverte = () => !!document.getElementById('op-go');
    const MAX_OF = 15;
    const aujourdhui = dateLocaleIso();
    const plus = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const lundiDe = (iso) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
    const dur = (min) => { const m = Math.round(Math.abs(min)); return `${Math.floor(m / 60)} h${String(m % 60).padStart(2, '0')}`; };
    const fmtDt = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + (iso.length > 10 ? ' ' + iso.slice(11, 16) : '') : '—';
    const typeLib = (o) => (o.type_production === 'pleiade' ? 'Pléiade' : o.type_production === 'coffret' ? 'Coffret' : o.priorite === 'urgente' ? 'Urgente' : 'Standard');
    const pt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const postOpt = async (corps) => { const r = await fetch(`${API}/optimiser-production`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) }); const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d; };
    const postReorg = async (corps) => { const r = await fetch(`${API}/reorganiser-planning`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) }); const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d; };

    let periode = null, liste = [], choisis = [], base = null, essais = [], comparaison = null, session = null, enCours = false, arret = false, termine = false, ia = null, iaRaison = '', travail = null;
    const suivre = async (fn) => { travail = fn(); try { await travail; } finally { travail = null; } };

    afficherModale(`
      <h3>Optimiser la production</h3>
      <div class="plan-note" style="margin-bottom:8px;">Choisissez une <strong>période</strong> puis les <strong>OF</strong> à optimiser. L'outil <strong>essaie plusieurs organisations</strong> (échéances, priorités, marges, regroupement des machines, proposition de l'IA) avec le vrai moteur de planification, <strong>mesure</strong> chacune (retards, réglages et nettoyages, temps morts des machines, heures supplémentaires, charge du personnel) et vous <strong>propose la meilleure</strong>. Rien n'est modifié sans votre accord : vous comparez, puis vous appliquez à titre provisoire (valider ou annuler).</div>
      <div id="op-choix">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px;">
          <label style="display:flex;flex-direction:column;font-size:12px;color:var(--muted);">Période
            <select id="op-mode" style="padding:5px 8px;color:var(--ink,#222);"><option value="jour">1 jour</option><option value="semaine" selected>Une semaine</option><option value="mois">Un mois</option><option value="plage">Plage de dates</option></select></label>
          <label id="op-l-jour" style="display:flex;flex-direction:column;font-size:12px;color:var(--muted);">Jour<input type="date" id="op-jour" value="${aujourdhui}" style="padding:4px 6px;color:var(--ink,#222);"></label>
          <label id="op-l-sem" style="display:flex;flex-direction:column;font-size:12px;color:var(--muted);">Semaine contenant le<input type="date" id="op-sem" value="${aujourdhui}" style="padding:4px 6px;color:var(--ink,#222);"></label>
          <label id="op-l-mois" style="display:none;flex-direction:column;font-size:12px;color:var(--muted);">Mois<input type="month" id="op-mois" value="${aujourdhui.slice(0, 7)}" style="padding:4px 6px;color:var(--ink,#222);"></label>
          <label id="op-l-du" style="display:none;flex-direction:column;font-size:12px;color:var(--muted);">Du<input type="date" id="op-du" value="${aujourdhui}" style="padding:4px 6px;color:var(--ink,#222);"></label>
          <label id="op-l-au" style="display:none;flex-direction:column;font-size:12px;color:var(--muted);">Au<input type="date" id="op-au" value="${plus(aujourdhui, 13)}" style="padding:4px 6px;color:var(--ink,#222);"></label>
          <button class="btn" id="op-chercher">Rechercher les OF</button>
          <span id="op-bornes" style="font-size:12.5px;color:var(--ink-500);"></span>
        </div>
        <div id="op-liste"></div>
      </div>
      <div id="op-corps"></div><div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn" id="op-annuler" style="display:none;">Annuler l'application</button><button class="btn primary" id="op-go" disabled>Lancer l'optimisation</button></div>`, 'xlarge');

    // ── Fermeture : si un essai est en cours, le planning est remis comme avant ──
    const nettoyer = async () => { if (session && !termine) { const s = session; session = null; try { await postReorg({ action: 'annuler', session_id: s }); chargerDonneesReelles(); } catch (e) { /* rien */ } } };

    // ── Période ──

      if (m === 'mois') { const v = $('op-mois').value; if (!/^\d{4}-\d{2}$/.test(v)) return null; const fin = new Date(Date.UTC(Number(v.slice(0, 4)), Number(v.slice(5, 7)), 0)).getUTCDate(); return [`${v}-01`, `${v}-${String(fin).padStart(2, '0')}`]; }

    const majBornes = () => {

      const b = bornes(); $('op-bornes').textContent = b ? (b[0] === b[1] ? `Le ${dateCourte(b[0])}` : `Du ${dateCourte(b[0])} au ${dateCourte(b[1])}`) : 'Période incomplète';

    $('op-chercher').addEventListener('click', async () => {

        if (!liste.length) { $('op-liste').innerHTML = '<div class="msg">Aucun OF à optimiser sur cette période (aucun créneau, aucune livraison ni aucune étape restant à planifier).</div>'; return; }

          <div style="overflow-x:auto;max-height:260px;overflow-y:auto;"><table class="sp-table"><thead><tr><th></th><th>OF</th><th>Titre</th><th>Type</th><th>Qté</th><th>Livraison</th><th>Fin planifiée</th><th>État</th><th>Étapes restantes</th><th>Machines</th></tr></thead><tbody>${liste.map((o) => {

          <div class="plan-note">Pendant l'analyse (1 à 3 minutes), le planning de ces OF est <strong>modifié temporairement puis remis exactement comme avant</strong> après chaque essai : évitez de modifier le planning en même temps. Seul ce qui n'a pas démarré est replanifié, au plus tôt, à partir de ${periode.debut > aujourdhui ? dateCourte(periode.debut) : 'maintenant'}.</div>`;

    // ── Calcul d'une organisation : libère les créneaux non commencés, replanifie dans l'ordre donné (avec formation des lots minimum) ──
    const calculer = async (ordreIds, essai, progres) => {
      const prep = await postReorg({ action: 'preparer', mode: 'actualiser', of_ids: choisis, depuis_date: periode.debut > aujourdhui ? periode.debut : undefined });
      session = prep.session_id;
      const place = {}; ordreIds.forEach((id, i) => { place[id] = i; });

        resultats[o.of_id] = r;
        Array.from(attentes.keys()).forEach((k) => { if (attentes.get(k).of_id === o.of_id) attentes.delete(k); });
        if (r.ok) (r.attente_lot || []).forEach((a) => attentes.set(a.gamme_id, a));

      };

      for (let i = 0; i <= dernierLots; i++) await planifier(i);
      let tour = 0;
      while (attentes.size && tour++ < 12) {
        if (arret || !modaleOuverte()) { arret = true; throw new Error('ARRET'); }
        let l; try { l = await postReorg({ action: 'lots', session_id: session, attentes: Array.from(attentes.values()) }); } catch (e) { break; }
        if (!(l.lancements || []).length) break;
        const parOf = {}; l.lancements.forEach((x) => { (parOf[x.of_id] = parOf[x.of_id] || {})[x.gamme_id] = x.depart; });
        const ids = Object.keys(parOf).sort((x, y) => rangDe[x] - rangDe[y]);
        for (const id of ids) await planifier(rangDe[id], { lots_liberes: parOf[id], lots_seul: true });
        for (const id of ids) await planifier(rangDe[id]);
      }
      for (let i = dernierLots + 1; i < ordre.length; i++) await planifier(i);
      const mes = await postOpt({ action: 'mesurer', of_ids: choisis, debut: periode.debut, fin: periode.fin });
      return { mesure: mes.mesure, resultats, attentes_lot: attentes.size, echecs: Object.values(resultats).filter((r) => !r.ok).length, nb: ordre.length, session_id: prep.session_id };
    };

    // ── Affichage du comparatif ──

  // ---------- Planning annuel Pléiade ----------
  async function ouvrirModalePlanningAnnuel() {
    const api = async (methode, corps, query, fonction) => {
      const r = await fetch(`${API}/${fonction || 'planning-annuel'}${query || ''}`, { method: methode, headers: { 'Content-Type': 'application/json' }, body: corps ? JSON.stringify(corps) : undefined });
      const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d;

    const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    const nomMois = (m) => m ? `${MOIS[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}` : '—';
    // Mois affichés : ceux qui ont des titres à produire + ceux qui n'ont que des titres déjà traités (fabriqués / OF créé).
    const listeMois = () => Array.from(new Set([...prop.mois.map((x) => x.mois), ...data.lignes.filter((l) => l.mois && (l.statut === 'fait' || l.statut === 'of_cree')).map((l) => l.mois)])).sort();
    let courant = listeMois().find((m) => m >= dateLocaleIso().slice(0, 7)) || listeMois()[0];
    afficherModale(`
      <h3>Planning annuel Pléiade <span style="font-size:13px;font-weight:400;color:var(--muted);">— référence Gallimard</span></h3>
      <div class="plan-note" style="margin-bottom:8px;">Classement de chaque mois : <strong>1) carte de dos décroissante</strong> (de la plus large à la plus étroite, par séries de largeurs voisines, écart ≤ ${prop.parametres.ecart} mm : moins de réglages à la couverturière BDM), <strong>2) couleur de tête</strong> dans la série (moins de nettoyages des encres de jaspage), puis carte de dos décroissante à couleur égale. Cadence BDM retenue : ${prop.parametres.parJour} titres par jour. L'emboîtage suit le même ordre (épaisseurs de blocs voisines).
        <br>Légende : <strong>S</strong> solde · <strong>N</strong> nouveauté · <strong>T</strong> train (en cours) · <strong>R</strong> réimpression.</div>
      <div id="pa-onglets" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"></div>

      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn" id="pa-import" title="Charger le nouveau planning du client (PDF, photo, Excel) : le logiciel le compare à l'existant">Importer un nouveau planning…</button><button class="btn" id="pa-ajout">+ Ajouter un titre</button><button class="btn" id="pa-imprimer" title="Imprimer la liste des titres du mois, dans l'ordre de passage en production" style="display:none;">Imprimer la liste du mois</button><input type="file" id="pa-fichier" accept="image/*,.pdf,.xlsx,.xls,.docx" style="display:none"><button class="btn" id="pa-coches" style="display:none;">Créer les OF cochés</button><button class="btn primary" id="pa-creer">Créer tous les OF de ce mois, dans cet ordre</button></div>`, 'xlarge');
    const $ = (id) => document.getElementById(id);
    $('m-cancel').addEventListener('click', fermerModale);
    // Ajout d'un titre imprévu (nouveau titre, ou titre déjà connu à replacer).
    $('pa-ajout').addEventListener('click', () => {
      const zone = $('m-msg');
      const f = (id, lib, type, w, ph) => `<label style="display:flex;flex-direction:column;font-size:12px;color:var(--muted);">${lib}<input id="${id}" type="${type}" ${ph ? `placeholder="${ph}"` : ''} style="width:${w}px;padding:4px 6px;color:var(--ink,#222);"></label>`;
      zone.innerHTML = `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff;">
        <strong>Ajouter un titre au planning annuel</strong>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:flex-end;">
          ${f('aj-titre', 'Titre *', 'text', 260, 'ex. FLAUBERT Œuvres 1')}${f('aj-qte', 'Quantité', 'number', 80)}${f('aj-mp', 'Cahiers', 'number', 70)}${f('aj-carte', 'Carte de dos (mm)', 'number', 90)}
          ${f('aj-tete', 'Tête', 'text', 100, 'orange')}${f('aj-peau', 'Peau', 'text', 100, 'havane')}${f('aj-date', 'Livraison *', 'date', 140)}
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;"><button class="btn" id="aj-non" type="button">Annuler</button><button class="btn primary" id="aj-ok" type="button">Ajouter</button></div></div>`;
      $('aj-titre').focus();
      $('aj-non').onclick = () => { zone.innerHTML = ''; };
      $('aj-ok').onclick = async () => {
        const titre = $('aj-titre').value.trim(), date = $('aj-date').value;
        if (!titre || !date) { toast('Titre et date de livraison requis.', 'error'); return; }
        const n = (id) => { const v = $(id).value; return v === '' ? undefined : parseInt(v, 10); };
        try {
          await api('POST', { action: 'ajouter', titre, quantite: n('aj-qte'), mp: n('aj-mp'), carte_dos: n('aj-carte'), tete: $('aj-tete').value.trim() || undefined, peau: $('aj-peau').value.trim() || undefined, date_livraison: date });
          data = await api('GET'); prop = await api('POST', { action: 'proposer' }); courant = date.slice(0, 7); zone.innerHTML = ''; rendre();
          toast(`« ${titre} » ajouté en ${nomMois(courant)} (signalé en rouge : à vérifier).`);
        } catch (e) { zone.insertAdjacentHTML('beforeend', `<div class="msg error">${esc(e.message)}</div>`); }
      };
    });
    // Import d'un nouveau planning (PDF / photo / scan / Excel) : aperçu des différences, puis application de la sélection cochée.
    const CHAMP_LIB = { quantite: 'Qté', mp: 'Cahiers', carte_dos: 'Carte de dos', tete: 'Tête', peau: 'Peau', mois: 'Mois', date_livraison: 'Livraison' };
    const valLib = (k, v) => (v === null || v === undefined || v === '' ? '—' : (k === 'mois' ? nomMois(v) : (k === 'date_livraison' ? dateCourte(v) : esc(v))));
    $('pa-import').addEventListener('click', () => $('pa-fichier').click());
    // ----- Lecture du planning en TRANCHES COURTES : une fonction Netlify est limitée à ~10 s, or lire tout un planning
    // d'un coup avec l'IA est trop long (erreur 504). On lit page par page ; si une tranche est encore trop longue,
    // elle est coupée en deux (avec recouvrement) et relue, jusqu'à 3 fois.
    const URL_IMPORT = `${API}/importer-planning-annuel`;
    const NB_BANDES = 8, TRANCHES_EN_PARALLELE = 6;
    const postImport = async (corps) => {
      const res = await fetch(URL_IMPORT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
      let d = null; try { d = await lireJson(res); } catch (e) { d = null; }
      return { ok: res.ok, status: res.status, d };
    };
    const normTitre = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/œ/g, 'oe').replace(/[^a-z0-9]+/g, ' ').trim();
    const chargerImageFichier = (file) => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); resolve(im); }; im.onerror = () => reject(new Error('Image illisible.')); im.src = url;
    });
    const canvasDePage = async (file, info) => {
      const cvs = [];
      if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
        const pdfjs = await chargerPdfJs();
        const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
        for (let n = 1; n <= doc.numPages; n++) {
          const page = await doc.getPage(n); const base = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: Math.min(2.6, 2000 / base.width) });
          const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
          await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
          cvs.push(cv); info(`Préparation du document : page ${n} sur ${doc.numPages}…`);
        }
      } else {
        const im = await chargerImageFichier(file);
        const k = Math.min(1, 2600 / Math.max(im.naturalWidth, im.naturalHeight));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); cvs.push(cv);
      }
      return cvs;
    };
    const tacheImage = (page, cv, y0, y1, niveau) => ({
      ordre: [page, y0], niveau,
      envoyer: () => {
        const sy = Math.round(y0 * cv.height), sh = Math.max(40, Math.round((y1 - y0) * cv.height));
        const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = sh;
        c2.getContext('2d').drawImage(cv, 0, sy, cv.width, sh, 0, 0, cv.width, sh);
        return postImport({ action: 'lire', image_base64: c2.toDataURL('image/jpeg', 0.85).split(',')[1], mime_type: 'image/jpeg', haut_coupe: y0 > 0, bas_coupe: y1 < 1 });
      },
      couper: () => { if (niveau >= 2) return null; const mid = (y0 + y1) / 2, rec = 0.02;
        return [tacheImage(page, cv, y0, Math.min(1, mid + rec), niveau + 1), tacheImage(page, cv, Math.max(0, mid - rec), y1, niveau + 1)]; },
    });
    const tacheTexte = (entete, lignes, rang, niveau) => ({
      ordre: [0, rang], niveau,
      envoyer: () => postImport({ action: 'lire', texte: entete + '\n' + lignes.join('\n') }),
      couper: () => { if (niveau >= 3 || lignes.length < 2) return null; const m = Math.ceil(lignes.length / 2);
        return [tacheTexte(entete, lignes.slice(0, m), rang, niveau + 1), tacheTexte(entete, lignes.slice(m), rang + m / 1000, niveau + 1)]; },
    });
    const lirePlanningParTranches = async (file, info) => {
      const attente = [];
      if (/^image\//.test(file.type) || file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
        (await canvasDePage(file, info)).forEach((cv, i) => {
          // 8 bandes par page (avec recouvrement) : des tranches courtes se lisent en quelques secondes et en parallèle.
          for (let k = 0; k < NB_BANDES; k++) attente.push(tacheImage(i + 1, cv, Math.max(0, k / NB_BANDES - 0.03), Math.min(1, (k + 1) / NB_BANDES + 0.03), 0));
        });
      } else {
        const r0 = await postImport({ action: 'decouper', file_base64: await fichierEnBase64(file), file_name: file.name, mime_type: file.type });
        if (!r0.ok) throw new Error((r0.d && r0.d.error) || `HTTP ${r0.status}`);
        for (let i = 0; i < r0.d.lignes.length; i += 6) attente.push(tacheTexte(r0.d.entete, r0.d.lignes.slice(i, i + 6), i, 0));
      }
      const resultats = []; let total = attente.length, faites = 0, niveauDepart = 0, actifs = 0, fini = false;
      const afficher = () => info(`Lecture du planning « ${esc(file.name)} » : ${faites} tranche(s) lue(s) sur ${total}… `);
      const traiter = async (t) => {
        if (t.niveau < niveauDepart) { const ch = t.couper(); if (ch) { total += ch.length - 1; attente.push(...ch); return; } }
        const r = await t.envoyer();
        if (r.ok) { resultats.push({ ordre: t.ordre, lues: (r.d && r.d.lues) || [] }); faites++; afficher(); return; }
        if (r.d && r.d.occupe) {
          t.essais = (t.essais || 0) + 1;
          if (t.essais > 4) throw new Error('Le service de lecture est surchargé. Réessayez dans une minute.');
          await new Promise((ok) => setTimeout(ok, 2500 * t.essais)); attente.unshift(t); return;
        }
        const tropLong = r.d === null || (r.d && r.d.trop_long) || [502, 503, 504].includes(r.status);
        if (!tropLong) throw new Error((r.d && (r.d.error || r.d.errorMessage)) || `HTTP ${r.status}`);
        niveauDepart = Math.max(niveauDepart, t.niveau + 1);
        const ch = t.couper();
        if (!ch) throw new Error('Une partie du planning reste trop longue à lire. Essayez un fichier plus net (PDF d\'origine ou Excel) ou une photo mieux cadrée.');
        total += ch.length - 1; attente.push(...ch); afficher();
      };
      afficher();
      await new Promise((resolve, reject) => {
        const pomper = () => {
          if (fini) return;
          if (!attente.length && actifs === 0) { fini = true; resolve(); return; }
          while (actifs < TRANCHES_EN_PARALLELE && attente.length) {
            const t = attente.shift(); actifs++;
            traiter(t).then(() => { actifs--; pomper(); }).catch((e) => { fini = true; reject(e); });
          }
        };
        pomper();
      });
      // Assemblage : ordre du document, doublons des zones de recouvrement fusionnés, mois repris de la ligne précédente si absent.
      resultats.sort((x, y) => x.ordre[0] - y.ordre[0] || x.ordre[1] - y.ordre[1]);
      const vus = new Map(), lues = [];
      resultats.forEach((r) => r.lues.forEach((l) => {
        const cle = normTitre(l.titre) + '|' + (l.quantite == null ? '' : l.quantite);
        const deja = vus.get(cle);
        if (deja) { Object.keys(l).forEach((k) => { if ((deja[k] === null || deja[k] === undefined) && l[k] != null) deja[k] = l[k]; }); return; }
        vus.set(cle, l); lues.push(l);
      }));
      let precedent = null;
      lues.forEach((l) => {
        if (!l.mois && !l.date_livraison && precedent) l.mois = precedent.mois || (precedent.date_livraison ? precedent.date_livraison.slice(0, 7) : null);
        precedent = l;
      });
      if (!lues.length) throw new Error('Aucun titre n\'a pu être lu dans ce document.');
      return lues;
    };
    const analyserPlanning = async (file) => {
      const zone = $('m-msg');
      const info = (t) => { zone.innerHTML = `<div class="msg">${t}</div>`; };
      info(`Lecture du planning « ${esc(file.name)} » en cours…`);
      let r;
      try {
        const lues = await lirePlanningParTranches(file, info);
        info(`${lues.length} titre(s) lus. Comparaison avec le planning enregistré…`);
        const rc = await postImport({ action: 'comparer', lues });
        if (!rc.ok) throw new Error((rc.d && (rc.d.error || rc.d.errorMessage)) || `HTTP ${rc.status}`);
        r = rc.d;
      } catch (e) { zone.innerHTML = `<div class="msg error">Lecture impossible : ${esc(e.message)}</div>`; return; }
      const lignesN = r.nouveaux.map((n, i) => `<tr><td><input type="checkbox" class="im-chk" data-t="n" data-i="${i}" ${n.sans_date ? '' : 'checked'}></td><td><span style="color:#0f766e;">Nouveau</span></td><td>${esc(n.titre)}</td><td>${['quantite', 'mp', 'carte_dos', 'tete', 'peau'].map((k) => n.champs[k] != null ? `${CHAMP_LIB[k]} ${esc(n.champs[k])}` : '').filter(Boolean).join(' · ')} · livraison ${n.champs.date_livraison ? dateCourte(n.champs.date_livraison) : (n.champs.mois ? nomMois(n.champs.mois) : '<span style="color:#c0392b;">date inconnue</span>')}</td></tr>`).join('');
      const lignesM = r.modifies.map((x, i) => `<tr><td><input type="checkbox" class="im-chk" data-t="m" data-i="${i}" checked></td><td><span style="color:#b45309;">Modifié</span></td><td>${esc(x.titre)}${x.statut === 'of_cree' ? ' <span class="plan-note">(OF déjà créé)</span>' : ''}</td><td>${x.diffs.map((d) => `${CHAMP_LIB[d.champ]} : ${valLib(d.champ, d.ancien)} → <strong>${valLib(d.champ, d.nouveau)}</strong>`).join(' · ')}</td></tr>`).join('');
      zone.innerHTML = `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff;">
        <strong>Nouveau planning lu : ${r.lues} titre(s)</strong> — ${r.nouveaux.length} nouveau(x), ${r.modifies.length} modifié(s), ${r.inchanges} inchangé(s)${r.ignores.length ? `, ${r.ignores.length} déjà fabriqué(s) ignoré(s)` : ''}.
        <div class="plan-note" style="margin:4px 0;">Vérifiez la lecture (surtout les chiffres), décochez ce que vous ne voulez pas appliquer. Rien n'est supprimé.</div>
        ${lignesN || lignesM ? `<div style="max-height:260px;overflow:auto;"><table class="sp-table"><tbody>${lignesN}${lignesM}</tbody></table></div>` : '<div class="msg ok">Aucune différence : le planning enregistré est déjà à jour.</div>'}
        ${r.absents.length ? `<div class="msg" style="margin-top:6px;">⚠ Enregistrés mais <strong>absents</strong> du nouveau planning (annulés ou reportés ?) : ${r.absents.map((a) => esc(a.titre) + ' (' + nomMois(a.mois) + ')').join(' ; ')}. Retirez-les avec ✕ ou changez leur date si besoin.</div>` : ''}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;"><button class="btn" id="im-non" type="button">Fermer</button>${lignesN || lignesM ? '<button class="btn primary" id="im-ok" type="button">Appliquer la sélection</button>' : ''}</div></div>`;
      $('im-non').onclick = () => { zone.innerHTML = ''; };
      if ($('im-ok')) $('im-ok').onclick = async () => {
        const chg = Array.from(zone.querySelectorAll('.im-chk:checked')).map((c) => (c.dataset.t === 'n' ? { type: 'creer', champs: r.nouveaux[+c.dataset.i].champs } : { type: 'maj', id: r.modifies[+c.dataset.i].id, champs: r.modifies[+c.dataset.i].champs }));
        if (!chg.length) { toast('Rien de coché.', 'error'); return; }
        $('im-ok').disabled = true;
        try {
          const a = await api('POST', { action: undefined, appliquer: true, changements: chg }, '', 'importer-planning-annuel');
          data = await api('GET'); prop = await api('POST', { action: 'proposer' }); zone.innerHTML = ''; rendre();
          toast(`Planning mis à jour : ${a.crees} ajouté(s), ${a.maj} modifié(s) — signalés en rouge ●.`); chargerDonneesReelles();
        } catch (e) { zone.insertAdjacentHTML('beforeend', `<div class="msg error">${esc(e.message)}</div>`); $('im-ok').disabled = false; }
      };
