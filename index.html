  // ---------- Occupation d'une personne : vues Semaine / Mois / Année ----------
  const occEtat = { vue: 'mois', ancre: null, sel: null };
  let occCache = null;
  const isoAdd = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const isoDow = (iso) => (new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7; // 0 = lundi
  const isoLundi = (iso) => isoAdd(iso, -isoDow(iso));
  const isoMoisDebut = (iso) => iso.slice(0, 8) + '01';
  const isoMoisFin = (iso) => { const d = new Date(iso.slice(0, 8) + '01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return d.toISOString().slice(0, 10); };
  const isoPlage = (a, b) => { const r = []; for (let i = a; i <= b; i = isoAdd(i, 1)) r.push(i); return r; };

  async function plageOccupation(forcer) {
    const debut = [DAYS_ISO[0], isoMoisDebut(AUJOURDHUI_ISO)].sort()[0];
    const an = Math.max(Number(AUJOURDHUI_ISO.slice(0, 4)), Number(DAYS_ISO[0].slice(0, 4)));
    const fin = `${an}-12-31`;
    if (!forcer && occCache && occCache.debut === debut && occCache.fin === fin && Date.now() - occCache.t < 60000) return occCache;
    const res = await fetch(`/.netlify/functions/lecture-planning?date_debut=${debut}&date_fin=${fin}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    occCache = { t: Date.now(), debut, fin, data: { planning: d.planning, machines: d.machines, ordres: d.ordres, dispo: d.disponibilites || [], jours: [] } };
    return occCache;
  }

  async function ouvrirOccupationPersonne(persId, garder) {
    const p = state.personnel.find(x => x.id === persId); if (!p) return;
    if (!garder || !occEtat.ancre) { occEtat.vue = 'mois'; occEtat.ancre = DAYS_ISO[0]; occEtat.sel = null; }
    afficherModale(`<h3>Occupation — ${esc(p.name)}</h3><div class="empty">Chargement du planning…</div>`, 'xlarge');
    let occ, plage;
    try {
      plage = await plageOccupation(!garder);
      occ = await occupationDe(persId, plage.data, isoPlage(plage.debut, plage.fin));
    } catch (e) { occ = null; }
    if (!occ) { afficherModale(`<h3>Occupation</h3><div class="msg error">Planning indisponible. Rechargez la page.</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`); document.getElementById('m-cancel').addEventListener('click', fermerModale); return; }

    const jourNom = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
    const jourCourt = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    const lib = (iso) => { const d = new Date(iso + 'T00:00:00Z'); return `${jourNom[d.getUTCDay()]} ${d.getUTCDate()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}`; };
    const parIso = new Map(occ.jours.map(j => [j.iso, j]));
    const tousAffs = new Map(); occ.jours.forEach(j => j.affs.forEach(a => tousAffs.set(String(a.id), a)));
    const ouvre = (j) => isoDow(j.iso) < 5;
    const rouvrir = async () => { occCache = null; try { await chargerDonneesReelles(); } catch (_) { /* affichage de démo */ } ouvrirOccupationPersonne(persId, true); };
    const retour = () => ouvrirOccupationPersonne(persId, true);

    const pctJour = (j) => Math.round(j.min / 480 * 100);
    const teinte = (j) => {
      if (j.indispo) return { bg: 'repeating-linear-gradient(45deg,#FBE9E7,#FBE9E7 5px,#F6D6D2 5px,#F6D6D2 10px)', fg: '#8E2A1F' };
      const q = pctJour(j);
      if (!j.min) return { bg: '#F4F6FA', fg: '#8A93A8' };
      if (q > 100) return { bg: '#F4B6AE', fg: '#7A1D12' };
      if (q >= 85) return { bg: '#6FD3C5', fg: '#06433B' };
      if (q >= 50) return { bg: '#A8E6DD', fg: '#0B4F46' };
      return { bg: '#D6F3EE', fg: '#0B4F46' };
    };
    const stats = (jours) => {
      const w = jours.filter(ouvre);
      const indispoJ = w.filter(j => j.indispo).length;
      const capa = (w.length - indispoJ) * 480;
      const total = jours.reduce((t, j) => t + j.min, 0);
      const affs = jours.flatMap(j => j.affs);
      return { indispoJ, capa, total, taux: capa > 0 ? Math.round(total / capa * 100) : 0, affs, ofs: new Set(affs.map(a => a.of).filter(x => x !== '—')).size, machines: new Set(affs.map(a => a.machine)).size };
    };
    const couleurTaux = (t) => t >= 85 ? '#C0392B' : (t >= 65 ? '#B45309' : '#0F766E');

    const etatTag = (j) => j.dispo && j.dispo.statut !== 'disponible'
      ? `<span class="tag danger">${j.dispo.statut === 'en arrêt' ? 'En arrêt' : 'Absent(e)'}</span>`
      : (j.dispo && j.dispo.heure_debut ? `<span class="tag warn">Dispo ${j.dispo.heure_debut.slice(0, 5)}–${j.dispo.heure_fin.slice(0, 5)}</span>` : '');
    const ligne = (a) => {
      const alerte = !a.competent || a.chevauche || a.sansOf;
      return `<div class="occ-row${alerte ? ' alerte' : ''}">
        <span class="h">${a.debut ? a.debut + '–' + a.fin : 'Journée'}</span>
        <span class="t"><strong>${a.sansOf ? '<span style="color:#B45309;">⚠ Sans OF</span>' : esc(a.of)}</strong> · ${esc(a.operation)}${a.phase ? ` <span class="s">— ${esc(a.phase)}</span>` : ''}<div class="s" title="${esc(a.titre + (a.client ? ' · ' + a.client : ''))}">${esc(a.titre)}${a.client ? ' · ' + esc(a.client) : ''}</div></span>
        <span class="m">${esc(a.machine)}${!a.competent ? ' <span class="tag warn" title="L\'opération ne figure pas dans les compétences de cette personne">hors comp.</span>' : ''}${a.chevauche ? ' <span class="tag warn">chevauche</span>' : ''}</span>
        <span class="d">${esc(fmtDuree(a.min))}</span>
        <span class="a"><button class="btn occ-reaff" data-id="${a.id}" title="Réaffecter à une autre personne" aria-label="Réaffecter">⇄</button><button class="btn occ-dep" data-id="${a.id}" title="Modifier le jour ou l'horaire" aria-label="Horaire">⏱</button><button class="btn occ-cor ${a.sansOf ? 'primary' : ''}" data-id="${a.id}" title="Corriger l'OF, l'opération ou la machine, ou supprimer" aria-label="Corriger">✎</button></span>
      </div>`;
    };
    const bloc = (j, entete) => `<div class="occ-jour" style="border-left-color:${j.indispo ? '#C0392B' : (j.min ? '#16B8A6' : '#D5D9E3')};">
      <div class="occ-jh"><strong style="text-transform:capitalize;">${lib(j.iso)}</strong>${etatTag(j)}${j.min > 480 ? '<span class="tag danger">Surcharge</span>' : ''}
        <span class="r">${j.min ? fmtDuree(j.min) : ''}</span>${j.indispo ? '' : `<button class="btn occ-add ${j.affs.length ? '' : 'primary'}" data-iso="${j.iso}" style="padding:2px 10px;font-size:12px;">＋ Affecter</button>`}${entete || ''}</div>
      ${j.affs.length ? j.affs.map(ligne).join('') : `<div class="occ-vide">${j.indispo ? 'Indisponible ce jour' : 'Aucune affectation : disponible pour une tâche.'}</div>`}</div>`;

    // ----- calcul de la période affichée -----
    const periode = () => {
      const a = occEtat.ancre;
      if (occEtat.vue === 'semaine') { const l = isoLundi(a); return { debut: l, fin: isoAdd(l, 6), label: `Semaine du ${dateCourte(l)} au ${dateCourte(isoAdd(l, 4))}` }; }
      if (occEtat.vue === 'mois') { const d = new Date(a.slice(0, 8) + '01T00:00:00Z'); return { debut: isoMoisDebut(a), fin: isoMoisFin(a), label: `${MOIS_FR[d.getUTCMonth()][0].toUpperCase() + MOIS_FR[d.getUTCMonth()].slice(1)} ${d.getUTCFullYear()}` }; }
      return { debut: plage.debut > `${plage.fin.slice(0, 4)}-01-01` ? isoMoisDebut(plage.debut) : `${plage.fin.slice(0, 4)}-01-01`, fin: plage.fin, label: `Année ${plage.fin.slice(0, 4)} · mois restants` };
    };

    const rendre = () => {
      const per = periode();
      const jours = isoPlage(per.debut, per.fin).map(i => parIso.get(i)).filter(Boolean);
      const st = stats(jours);
      const toutes = st.affs;
      const horsComp = toutes.filter(a => !a.competent);
      const chevauch = toutes.filter(a => a.chevauche);
      const sansOf = toutes.filter(a => a.sansOf);
      const surch = jours.filter(j => j.min > 480);
      const pendantAbsence = jours.filter(j => j.indispo && j.affs.length);
      const points = [];
      if (horsComp.length) points.push(`<strong>${horsComp.length} affectation(s) hors compétence</strong> : ${Array.from(new Set(horsComp.map(a => a.operation))).slice(0, 8).map(esc).join(', ')}.`);
      if (sansOf.length) points.push(`<strong>${sansOf.length} créneau(x) sans OF</strong> (${fmtDuree(sansOf.reduce((t, a) => t + a.min, 0))}) : probables erreurs de saisie, à corriger ou supprimer.`);
      if (surch.length) points.push(`<strong>Surcharge</strong> (plus de 8 h) : ${surch.slice(0, 8).map(j => lib(j.iso) + ' (' + fmtDuree(j.min) + ')').join(', ')}${surch.length > 8 ? '…' : ''}.`);
      if (chevauch.length) points.push(`<strong>${chevauch.length} créneau(x) qui se chevauchent</strong>.`);
      if (pendantAbsence.length) points.push(`<strong>Affectation(s) pendant une absence</strong> : ${pendantAbsence.slice(0, 8).map(j => lib(j.iso)).join(', ')}${pendantAbsence.length > 8 ? '…' : ''}.`);

      const chip = (v, l) => `<span class="occ-chip"><b>${v}</b> ${l}</span>`;
      const kpis = `<div class="occ-kpis">${chip(`<span style="color:${couleurTaux(st.taux)};">${st.taux} %</span>`, 'occupation')}${chip(fmtDuree(st.total), `sur ${fmtDuree(st.capa)}`)}${chip(st.ofs, 'OF')}${chip(st.machines, 'machine(s)')}${chip(st.indispoJ, 'j. d’absence')}</div>`;
      const attention = `<details class="occ-att${points.length ? ' warn' : ''}" ${points.length && points.length <= 2 ? 'open' : ''}>
        <summary>${points.length ? `⚠ ${points.length} point(s) d'attention sur la période` : '✓ Aucun point d\'attention (compétences, horaires, charge)'}</summary>
        ${points.length ? `<ul>${points.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        <div class="occ-acts">
          ${horsComp.length ? '<button class="btn primary" id="occ-auto-hc">Réaffecter automatiquement le hors-compétence</button>' : ''}
          ${toutes.length ? '<button class="btn" id="occ-auto-tout">Libérer la période : tout réaffecter automatiquement</button>' : ''}
          <button class="btn" id="occ-fiche" title="Modifier les compétences (opérations et machines)">Modifier ses compétences</button>
        </div></details>`;

      // navigation
      const nav = `<div class="occ-nav">
        <div class="occ-seg">${['semaine', 'mois', 'annee'].map(v => `<button class="${occEtat.vue === v ? 'on' : ''}" data-vue="${v}">${v === 'annee' ? 'Année' : v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>
        ${occEtat.vue === 'annee' ? '' : '<button class="btn" id="occ-prec" aria-label="Précédent">‹</button>'}<strong class="occ-lbl">${esc(per.label)}</strong>${occEtat.vue === 'annee' ? '' : '<button class="btn" id="occ-suiv" aria-label="Suivant">›</button>'}
        <button class="btn" id="occ-auj" style="margin-left:auto;">Aujourd'hui</button></div>`;

      let corps = '';
      if (occEtat.vue === 'semaine') {
        corps = jours.filter(j => ouvre(j) || j.affs.length || j.indispo).map(j => bloc(j)).join('');
      } else if (occEtat.vue === 'mois') {
        const decal = isoDow(per.debut);
        const cases = Array.from({ length: decal }, () => '<div></div>').concat(jours.map(j => {
          const t = teinte(j); const sel = occEtat.sel === j.iso; const we = !ouvre(j);
          return `<button class="occ-case${sel ? ' sel' : ''}${we ? ' we' : ''}${j.iso === AUJOURDHUI_ISO ? ' auj' : ''}" data-iso="${j.iso}" style="background:${t.bg}; color:${t.fg};" title="${esc(lib(j.iso))}">
            <span class="n">${Number(j.iso.slice(8))}</span>
            <span class="v">${j.indispo ? (j.dispo.statut === 'en arrêt' ? 'Arrêt' : 'Absent') : (j.min ? fmtDuree(j.min) : (we ? '' : '—'))}</span>
            ${j.affs.some(a => !a.competent || a.sansOf || a.chevauche) ? '<span class="w">⚠</span>' : ''}</button>`;
        }));
        const choisi = occEtat.sel && parIso.get(occEtat.sel) && occEtat.sel >= per.debut && occEtat.sel <= per.fin ? parIso.get(occEtat.sel) : null;
        corps = `<div class="occ-cal"><div class="occ-cal-h">${jourCourt.map(x => `<span>${x}</span>`).join('')}</div><div class="occ-cal-g">${cases.join('')}</div></div>
          <div class="occ-legende"><i style="background:#D6F3EE"></i>&lt; 50 %<i style="background:#A8E6DD"></i>50–84 %<i style="background:#6FD3C5"></i>85–100 %<i style="background:#F4B6AE"></i>surcharge<i style="background:repeating-linear-gradient(45deg,#FBE9E7,#FBE9E7 3px,#F6D6D2 3px,#F6D6D2 6px)"></i>absence / arrêt<span style="margin-left:auto;">Cliquez sur un jour pour le détail et les modifications</span></div>
          ${choisi ? bloc(choisi, '<button class="btn" id="occ-voir-sem" style="padding:2px 10px;font-size:12px;">Voir la semaine</button>') : '<div class="occ-vide" style="border:1px dashed var(--line); border-radius:10px;">Sélectionnez un jour du calendrier pour afficher ses affectations.</div>'}`;
      } else {
        const mois = [];
        for (let m = per.debut; m <= per.fin; m = isoAdd(isoMoisFin(m), 1)) mois.push(m);
        corps = `<div class="occ-annee">${mois.map(m => {
          const js = isoPlage(m, isoMoisFin(m)).map(i => parIso.get(i)).filter(Boolean); const s = stats(js);
          const d = new Date(m + 'T00:00:00Z'); const decal = isoDow(m);
          const pts = s.affs.filter(a => !a.competent || a.sansOf || a.chevauche).length;
          return `<button class="occ-mois" data-mois="${m}">
            <div class="mh"><strong style="text-transform:capitalize;">${MOIS_FR[d.getUTCMonth()]}</strong><span style="color:${couleurTaux(s.taux)}; font-weight:700;">${s.taux} %</span></div>
            <div class="ms">${fmtDuree(s.total)} · ${s.ofs} OF${s.indispoJ ? ` · ${s.indispoJ} j abs.` : ''}${pts ? ` · <span style="color:#B45309;">⚠ ${pts}</span>` : ''}</div>
            <div class="hm">${Array.from({ length: decal }, () => '<i style="visibility:hidden"></i>').join('')}${js.map(j => `<i style="background:${teinte(j).bg}; ${ouvre(j) ? '' : 'opacity:.45;'}" title="${esc(lib(j.iso) + (j.min ? ' : ' + fmtDuree(j.min) : ''))}"></i>`).join('')}</div></button>`;
        }).join('')}</div>`;
      }

      document.getElementById('occ-corps').innerHTML = `${nav}${kpis}${attention}${corps}`;

      // ----- événements -----
      const q = (s) => document.querySelectorAll('#occ-corps ' + s);
      q('[data-vue]').forEach(b => b.addEventListener('click', () => { occEtat.vue = b.dataset.vue; rendre(); }));
      const pas = (sens) => {
        if (occEtat.vue === 'semaine') occEtat.ancre = isoAdd(isoLundi(occEtat.ancre), 7 * sens);
        else { const d = new Date(occEtat.ancre.slice(0, 8) + '01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + sens); occEtat.ancre = d.toISOString().slice(0, 10); occEtat.sel = null; }
        if (occEtat.ancre < plage.debut && isoMoisFin(occEtat.ancre) < plage.debut) { toast('Pas de planning chargé avant cette date.'); occEtat.ancre = plage.debut; }
        if (occEtat.ancre > plage.fin) occEtat.ancre = isoMoisDebut(plage.fin);
        rendre();
      };
      const bp = document.getElementById('occ-prec'); if (bp) bp.addEventListener('click', () => pas(-1));
      const bs = document.getElementById('occ-suiv'); if (bs) bs.addEventListener('click', () => pas(1));
      document.getElementById('occ-auj').addEventListener('click', () => { occEtat.ancre = AUJOURDHUI_ISO; occEtat.sel = AUJOURDHUI_ISO; if (occEtat.vue === 'annee') occEtat.vue = 'mois'; rendre(); });
      q('.occ-case').forEach(b => b.addEventListener('click', () => { occEtat.sel = b.dataset.iso; rendre(); }));
      q('.occ-mois').forEach(b => b.addEventListener('click', () => { occEtat.vue = 'mois'; occEtat.ancre = b.dataset.mois; occEtat.sel = null; rendre(); }));
      const vs = document.getElementById('occ-voir-sem'); if (vs) vs.addEventListener('click', () => { occEtat.vue = 'semaine'; occEtat.ancre = occEtat.sel; rendre(); });
      const trouver = (id) => tousAffs.get(String(id));
      q('.occ-reaff').forEach(b => b.addEventListener('click', () => ouvrirReaffectation(p, trouver(b.dataset.id), rouvrir, retour)));
      q('.occ-dep').forEach(b => b.addEventListener('click', () => ouvrirDeplacement(p, trouver(b.dataset.id), occ.jours, rouvrir, retour)));
      q('.occ-cor').forEach(b => b.addEventListener('click', () => ouvrirCorrection(p, trouver(b.dataset.id), rouvrir, retour)));
      q('.occ-add').forEach(b => b.addEventListener('click', () => ouvrirAjoutTache(p, b.dataset.iso, lib(b.dataset.iso), rouvrir, retour)));
      const lotAuto = async (liste, intitule) => {
        if (!confirm(`${intitule}\n\n${liste.length} affectation(s) seront confiées automatiquement à une personne compétente et libre. Continuer ?`)) return;
        let ok = 0; const ko = [];
        for (const a of liste) {
          try {
            const r = await fetch(`${API}/gerer-affectation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'auto', planning_jour_id: a.id, ancien_id: persId, portee: 'creneau' }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur');
            ok++;
          } catch (e) { ko.push(`${dateCourte(a.iso)} ${a.operation} ${a.debut || ''} : ${e.message}`); }
        }
        toast(`${ok} affectation(s) réaffectée(s)${ko.length ? ', ' + ko.length + ' impossible(s)' : ''}.`, ko.length ? 'error' : undefined);
        if (ko.length) alert('Non réaffectées :\n' + ko.slice(0, 15).join('\n') + (ko.length > 15 ? '\n…' : ''));
        rouvrir();
      };
      const bHc = document.getElementById('occ-auto-hc'); if (bHc) bHc.addEventListener('click', () => lotAuto(horsComp, `Réaffecter les affectations de ${p.name} hors compétence (${per.label}) ?`));
      const bTout = document.getElementById('occ-auto-tout'); if (bTout) bTout.addEventListener('click', () => lotAuto(toutes, `Libérer ${p.name} (${per.label}) ?`));
      document.getElementById('occ-fiche').addEventListener('click', () => ouvrirModalePersonne(p));
      rendre.courant = { per, jours, st };
    };

    afficherModale(`
      <h3>Occupation — ${esc(p.name)}</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">${esc(p.role || '')}</div>
      <div id="occ-corps"></div>
      <div class="plan-note" style="margin-top:6px;">Durées en travail effectif (pause 12h00–12h30 déduite). Sans horaire précis : journée de 8 h. Capacité : 8 h par jour ouvré (lundi–vendredi), hors absences.</div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="occ-pdf">Télécharger en PDF</button></div>`, 'xlarge');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    rendre();
    document.getElementById('occ-pdf').addEventListener('click', async (ev) => {
      ev.target.disabled = true;
      try {
        await chargerLibsPdf();
        const { per, jours, st } = rendre.courant;
        const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        doc.setFontSize(16); doc.text(pdfTxt(`Occupation - ${p.name}`), 14, 15);
        doc.setFontSize(10); doc.text(pdfTxt(`${p.role || ''}  |  ${per.label}`), 14, 21);
        doc.text(pdfTxt(`Taux d'occupation : ${st.taux} %  |  ${fmtDuree(st.total)} affectees sur ${fmtDuree(st.capa)} disponibles  |  ${st.ofs} OF  |  ${st.indispoJ} jour(s) d'absence ou d'arret`), 14, 27);
        let tableau;
        if (occEtat.vue === 'annee') {
          const corps = [];
          for (let m = per.debut; m <= per.fin; m = isoAdd(isoMoisFin(m), 1)) {
            const js = isoPlage(m, isoMoisFin(m)).map(i => parIso.get(i)).filter(Boolean); const s = stats(js);
            corps.push([`${MOIS_FR[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`, `${s.taux} %`, fmtDuree(s.total), fmtDuree(s.capa), String(s.ofs), String(s.indispoJ)].map(pdfTxt));
          }
          tableau = { head: [['Mois', 'Occupation', 'Affecte', 'Capacite', 'OF', 'Jours d\'absence']], body: corps };
        } else {
          const corps = [];
          jours.filter(j => j.affs.length || j.indispo).forEach(j => {
            const etat = j.dispo && j.dispo.statut !== 'disponible' ? (j.dispo.statut === 'en arrêt' ? 'EN ARRET' : 'ABSENT(E)') : (j.dispo && j.dispo.heure_debut ? `Disponible ${j.dispo.heure_debut.slice(0, 5)}-${j.dispo.heure_fin.slice(0, 5)}` : '');
            corps.push([{ content: pdfTxt(`${lib(j.iso)}${etat ? '  -  ' + etat : ''}${j.min ? '  -  ' + fmtDuree(j.min) : ''}`), colSpan: 6, styles: { fillColor: [225, 240, 238], fontStyle: 'bold' } }]);
            if (!j.affs.length) corps.push([{ content: 'Indisponible', colSpan: 6, styles: { textColor: [120, 120, 120], fontStyle: 'italic' } }]);
            j.affs.forEach(a => corps.push([a.debut ? `${a.debut}-${a.fin}` : 'Journee', a.of, `${a.titre}${a.client ? ' (' + a.client + ')' : ''}`, `${a.operation}${a.phase ? ' - ' + a.phase : ''}`, a.machine, fmtDuree(a.min)].map(pdfTxt)));
          });
          if (!corps.length) corps.push([{ content: 'Aucune affectation sur la periode', colSpan: 6, styles: { fontStyle: 'italic' } }]);
          tableau = { head: [['Horaire', 'OF', 'Titre', 'Operation', 'Machine', 'Duree']], body: corps };
        }
        doc.autoTable({ startY: 32, ...tableau, styles: { fontSize: 9 }, headStyles: { fillColor: [10, 15, 29] }, margin: { left: 14, right: 14 } });
        doc.save(`occupation-${p.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${occEtat.vue}-${per.debut}.pdf`);
      } catch (e) { toast(`PDF impossible : ${e.message}`, 'error'); }
      ev.target.disabled = false;
    });
  }

  // ---------- Feuille journalière de placement du personnel (PDF) ----------
  function chargerScript(src) {
    return new Promise((resolve, reject) => {
      if ([...document.scripts].some(s => s.src === src)) return resolve();
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Impossible de charger ' + src));
      document.head.appendChild(s);
    });
  }
  async function chargerLibsPdf() {
    if (window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return;
    await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  }
  const pdfTxt = (v) => String(v == null ? '' : v).replace(/[  ]/g, ' ').replace(/[→≥≤]/g, '-');
  function dateFr(iso) {
    const d = new Date(iso + 'T00:00:00Z');
    const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    return `${jours[d.getUTCDay()]} ${d.getUTCDate()} ${MOIS_FR[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  }
  const dateCourte = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';

  async function genererFeuilleJournaliere(date) {
    const res = await fetch(`${API}/feuille-journaliere?date=${date}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
    await chargerLibsPdf();
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth();
    const maj = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    doc.text('Feuille de placement du personnel', 10, 14);
    doc.setFontSize(12);
    doc.text(pdfTxt(maj(dateFr(date))), W - 10, 14, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90);
    const nbAff = data.personnes.filter(p => p.creneaux.length).length;
    doc.text(pdfTxt(`Atelier Babouot  -  ${nbAff} personne(s) affectee(s)  -  ${data.nb_creneaux} creneau(x)  -  edite le ${new Date().toLocaleString('fr-FR')}`), 10, 20);
    doc.setTextColor(0);
    let y = 24;

    const absents = data.personnes.filter(p => !p.creneaux.length);
    const absentsTxt = absents.map(p => `${p.nom} (${p.statut}${p.plage ? ' ' + p.plage : ''}${p.commentaire ? ' - ' + p.commentaire : ''})`).join('  ;  ');
    if (absentsTxt) {
      doc.autoTable({ startY: y, theme: 'plain', margin: { left: 10, right: 10 }, styles: { fontSize: 8.5, cellPadding: 1.5, fillColor: [253, 240, 230] },
        body: [[pdfTxt('Indisponibles : ' + absentsTxt)]] });
      y = doc.lastAutoTable.finalY + 3;
    }

    const COLS = ['Horaire', 'Operation', 'Machine', 'OF', 'Titre / Client / Caracteristiques', 'Qte', 'Livraison', 'Equipe', 'Observations', 'Visa'];
    const ligne = (c) => [
      c.debut && c.fin ? `${c.debut}\n${c.fin}` : 'Journee',
      pdfTxt(c.operation),
      pdfTxt(c.machine),
      pdfTxt(c.of + (c.priorite && c.priorite !== 'normale' ? `\n(${c.priorite})` : '')),
      pdfTxt([c.titre, c.client].filter(Boolean).join(' - ') + (c.caracteristiques.length ? '\n' + c.caracteristiques.join('  |  ') : '')),
      c.quantite != null ? pdfTxt(Number(c.quantite).toLocaleString('fr-FR')) : '',
      dateCourte(c.delai),
      pdfTxt(c.equipe.join(', ')),
      '', '',
    ];
    const colStyles = { 0: { cellWidth: 16, fontStyle: 'bold' }, 1: { cellWidth: 32 }, 2: { cellWidth: 34 }, 3: { cellWidth: 22 }, 4: { cellWidth: 58 }, 5: { cellWidth: 14, halign: 'right' }, 6: { cellWidth: 18 }, 7: { cellWidth: 36 }, 8: { cellWidth: 'auto' }, 9: { cellWidth: 14 } };

    data.personnes.filter(p => p.creneaux.length).forEach(p => {
      if (y > 175) { doc.addPage(); y = 12; }
      doc.autoTable({
        startY: y, margin: { left: 10, right: 10 }, theme: 'grid',
        head: [[{ content: pdfTxt(`${p.nom}${p.poste ? '  -  ' + p.poste : ''}${p.plage ? '   (disponible ' + p.plage + ')' : ''}`), colSpan: 10, styles: { fillColor: [30, 90, 100], textColor: 255, fontSize: 10, halign: 'left' } }], COLS],
        body: p.creneaux.map(ligne), showHead: 'everyPage',
        styles: { fontSize: 8, cellPadding: 1.6, valign: 'middle', lineColor: [200, 200, 200] },
        headStyles: { fillColor: [235, 238, 240], textColor: 40, fontStyle: 'bold' },
        columnStyles: colStyles,
        didParseCell: (h) => { if (h.section === 'head' && h.row.index === 0) h.cell.styles.fillColor = [30, 90, 100]; if (h.section === 'head' && h.row.index === 0) h.cell.styles.textColor = 255; },
      });
      y = doc.lastAutoTable.finalY + 5;
    });

    if (data.sans_personnel.length) {
      if (y > 165) { doc.addPage(); y = 12; }
      doc.autoTable({
        startY: y, margin: { left: 10, right: 10 }, theme: 'grid',
        head: [[{ content: 'ATTENTION - Creneaux sans personnel affecte', colSpan: 10, styles: { fillColor: [180, 80, 40], textColor: 255, fontSize: 10, halign: 'left' } }], COLS],
        body: data.sans_personnel.map(ligne),
        styles: { fontSize: 8, cellPadding: 1.6, valign: 'middle' }, headStyles: { fillColor: [235, 238, 240], textColor: 40 }, columnStyles: colStyles,
      });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (data.presents_sans_tache.length) {
      if (y > 185) { doc.addPage(); y = 12; }
      doc.autoTable({ startY: y, theme: 'plain', margin: { left: 10, right: 10 }, styles: { fontSize: 8.5, cellPadding: 1.5, fillColor: [238, 244, 238] },
        body: [[pdfTxt('Presents sans tache planifiee : ' + data.presents_sans_tache.map(p => p.nom).join(', '))]] });
      y = doc.lastAutoTable.finalY + 5;
    }
    if (!data.nb_creneaux) {
      doc.setFontSize(11); doc.text('Aucun creneau planifie ce jour-la.', 10, y + 6);
    }

    const n = doc.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFontSize(8); doc.setTextColor(110);
      doc.text(pdfTxt(`Chef d'atelier : ____________________    Date/visa : ____________________`), 10, 205);
      doc.text(`Page ${i} / ${n}`, W - 10, 205, { align: 'right' });
    }
    doc.save(`placement-personnel-${date}.pdf`);
  }

  // ---------- Affichage collectif : tout le personnel sur une page, en grille horaire ----------
  async function genererAffichageCollectif(date) {
    const res = await fetch(`${API}/feuille-journaliere?date=${date}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
    await chargerLibsPdf();

    const mn = (t) => { const [h, m] = String(t).split(':'); return Number(h) * 60 + Number(m); };
    const gens = [
      ...data.personnes.map(p => ({ nom: p.nom, poste: p.poste, statut: p.statut, plage: p.plage, commentaire: p.commentaire, creneaux: p.creneaux })),
      ...data.presents_sans_tache.map(p => ({ nom: p.nom, poste: p.poste, statut: 'présent', plage: '', commentaire: '', creneaux: [] })),
    ].sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    // Créneaux planifiés mais sans personne : une ligne « NON AFFECTÉ » par machine, pour que rien ne manque sur l'affichage.
    const parMachine = {};
    data.sans_personnel.forEach(c => { (parMachine[c.machine] = parMachine[c.machine] || []).push(c); });
    Object.entries(parMachine).forEach(([mach, cs]) => gens.push({ nom: 'NON AFFECTE', poste: mach.replace(/\s*\(.*\)$/, ''), statut: 'présent', plage: '', commentaire: '', creneaux: cs, sansPers: true }));

    // Axe horaire : 7h-17h au minimum, élargi si besoin
    let h0 = 7 * 60, h1 = 17 * 60;
    gens.forEach(g => g.creneaux.forEach(c => { if (c.debut) h0 = Math.min(h0, mn(c.debut)); if (c.fin) h1 = Math.max(h1, mn(c.fin)); }));
    h0 = Math.floor(h0 / 60) * 60; h1 = Math.ceil(h1 / 60) * 60;

    // Couleur par OF
    const PALETTE = [[200,230,225],[250,220,190],[210,220,245],[245,210,225],[225,240,190],[235,215,250],[255,240,170],[200,235,245],[250,205,200],[215,235,215],[240,225,205],[220,220,235]];
    const ofs = [...new Set(data.personnes.flatMap(p => p.creneaux).concat(data.sans_personnel).map(c => c.of))];
    const couleurOf = Object.fromEntries(ofs.map((o, i) => [o, PALETTE[i % PALETTE.length]]));

    const grand = gens.length > 13;
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: grand ? 'a3' : 'a4' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const maj = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const M = 8, nomW = 42, x0 = M + nomW, gw = W - M - x0;
    const px = (min) => x0 + ((min - h0) / (h1 - h0)) * gw;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(grand ? 24 : 18);
    doc.text('Affectation du personnel', M, 13);
    doc.text(pdfTxt(maj(dateFr(date))), W - M, 13, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(100);
    doc.text(pdfTxt(`Atelier Babouot - edite le ${new Date().toLocaleString('fr-FR')}`), M, 18);
    doc.setTextColor(0);

    // Lecture des lignes : lanes si chevauchement
    gens.forEach(g => {
      const tri = g.creneaux.slice().sort((a, b) => (a.debut ? mn(a.debut) : h0) - (b.debut ? mn(b.debut) : h0));
      const fins = [];
      tri.forEach(c => {
        const d = c.debut ? mn(c.debut) : h0, f = c.fin ? mn(c.fin) : h1;
        let l = fins.findIndex(x => x <= d); if (l < 0) { l = fins.length; fins.push(0); }
        fins[l] = f; c._l = l; c._d = d; c._f = f;
      });
      g.lanes = Math.max(1, fins.length);
    });

    const yHead = 22, hHead = 7;
    const legendeH = Math.min(40, 8 + Math.ceil(ofs.length / 2) * 5);
    const dispo = H - yHead - hHead - legendeH - 14;
    const totLanes = gens.reduce((s, g) => s + g.lanes, 0) || 1;
    const hLane = Math.max(11, Math.min(26, dispo / totLanes));

    // En-tête horaire
    doc.setFillColor(30, 90, 100); doc.rect(M, yHead, W - 2 * M, hHead, 'F');
    doc.setTextColor(255); doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
    doc.text('Personnel', M + 2, yHead + 4.8);
    for (let t = h0; t <= h1; t += 60) {
      const x = px(t);
      if (t < h1) doc.text(`${String(t / 60).padStart(2, '0')}h`, x + 1.5, yHead + 4.8);
    }
    doc.setTextColor(0);

    let y = yHead + hHead;
    gens.forEach((g, i) => {
      const hRow = g.lanes * hLane;
      if (i % 2 === 0) { doc.setFillColor(247, 248, 249); doc.rect(M, y, W - 2 * M, hRow, 'F'); }
      // pause
      doc.setFillColor(232, 232, 232); doc.rect(px(12 * 60), y, px(12 * 60 + 30) - px(12 * 60), hRow, 'F');
      // grille verticale
      doc.setDrawColor(215); doc.setLineWidth(0.15);
      for (let t = h0; t <= h1; t += 60) doc.line(px(t), y, px(t), y + hRow);
      doc.line(M, y + hRow, W - M, y + hRow);

      // nom
      doc.setFont('helvetica', 'bold'); doc.setFontSize(grand ? 11 : 10);
      if (g.sansPers) { doc.setFillColor(253, 232, 224); doc.rect(M, y, nomW, hRow, 'F'); doc.setTextColor(180, 60, 30); }
      doc.text(pdfTxt(g.nom), M + 2, y + hRow / 2 - (g.poste ? 0.5 : -1.2), { maxWidth: nomW - 3 });
      doc.setTextColor(0);
      if (g.poste) { doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(g.sansPers ? 180 : 100, g.sansPers ? 60 : 100, g.sansPers ? 30 : 100); doc.text(pdfTxt(g.poste), M + 2, y + hRow / 2 + 3.2, { maxWidth: nomW - 3 }); doc.setTextColor(0); }

      if (!g.creneaux.length) {
        const indispo = !['présent', 'disponible'].includes(g.statut);
        doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(indispo ? 180 : 130, indispo ? 60 : 130, indispo ? 40 : 130);
        doc.text(pdfTxt(indispo ? `${g.statut.toUpperCase()}${g.plage ? ' ' + g.plage : ''}${g.commentaire ? ' - ' + g.commentaire : ''}` : 'Disponible - sans affectation'), x0 + 3, y + hRow / 2 + 1);
        doc.setTextColor(0);
      }
      g.creneaux.forEach(c => {
        const bx = px(c._d), bw = px(c._f) - bx - 0.4, by = y + c._l * hLane + 0.8, bh = hLane - 1.6;
        const col = couleurOf[c.of] || [230, 230, 230];
        doc.setFillColor(...col); doc.setDrawColor(90); doc.setLineWidth(0.25);
        if (g.sansPers) { doc.setDrawColor(180, 60, 30); doc.setLineDashPattern([1.2, 0.8], 0); }
        doc.roundedRect(bx + 0.2, by, bw, bh, 1, 1, 'FD');
        doc.setLineDashPattern([], 0);
        const base = grand ? 8.5 : 7.5;
        const grandBloc = bh >= 17;
        const nbL = grandBloc ? 4 : 3;
        const fs = Math.max(5.8, Math.min(base, (bh - 1.2) / (nbL * 0.43)));
        const pas = fs * 0.43;
        const nomMachine = c.machine.replace(/\s*\(.*\)$/, '');
        const horaire = c.debut ? `${c.debut}-${c.fin}` : '';
        const titre = [c.titre, c.client].filter(Boolean).join(' - ') || c.of;
        const items = grandBloc
          ? [['b', c.operation], ['bi', titre], ['n', nomMachine], ['n', `${c.of}  ${horaire}`]]
          : [['b', c.operation], ['bi', titre], ['n', `${nomMachine} | ${c.of} ${horaire}`]];
        doc.setFontSize(fs);
        items.forEach(([st, txt], k) => {
          doc.setFont('helvetica', st === 'b' ? 'bold' : st === 'bi' ? 'bolditalic' : 'normal');
          const l = doc.splitTextToSize(pdfTxt(txt), bw - 2)[0] || '';
          doc.text(l, bx + 1.2, by + 0.8 + (k + 1) * pas);
        });
      });
      y += hRow;
    });
    doc.setDrawColor(150); doc.setLineWidth(0.3); doc.rect(M, yHead, W - 2 * M, y - yHead);

    // Légende des OF
    y += 5;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text('Ordres de fabrication du jour', M, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
    const detail = {};
    data.personnes.flatMap(p => p.creneaux).concat(data.sans_personnel).forEach(c => { detail[c.of] = c; });
    const colW = (W - 2 * M) / 2;
    ofs.forEach((o, i) => {
      const c = detail[o]; const cx = M + (i % 2) * colW, cy = y + 5 + Math.floor(i / 2) * 5;
      doc.setFillColor(...couleurOf[o]); doc.setDrawColor(90); doc.rect(cx, cy - 3, 6, 3.6, 'FD');
      doc.text(pdfTxt(`${o} - ${c.titre || ''}${c.client ? ' (' + c.client + ')' : ''}${c.quantite != null ? ' - ' + Number(c.quantite).toLocaleString('fr-FR') + ' ex.' : ''}${c.delai ? ' - livraison ' + dateCourte(c.delai) : ''}`), cx + 8, cy, { maxWidth: colW - 10 });
    });
    if (data.sans_personnel.length) {
      doc.setTextColor(180, 60, 30); doc.setFont('helvetica', 'bold');
      doc.text(pdfTxt(`Attention : ${data.sans_personnel.length} creneau(x) planifie(s) sans personnel affecte (lignes NON AFFECTE).`), W - M, H - 7, { align: 'right' });
      doc.setTextColor(0);
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(110);
    doc.text('Zone grisee : pause', M, H - 7); doc.setTextColor(0);
    doc.save(`affichage-personnel-${date}.pdf`);
  }

      ? `Jours planifiés cette semaine : ${joursPlanifies.map(iso => DAYS[DAYS_ISO.indexOf(iso)]).join(', ')}`

  async function ouvrirModaleDisponibilite(personne) {
    afficherModale(`
      <h3>Disponibilité — ${personne.name}</h3>
      <div class="field"><label>Situation à enregistrer</label>
        <select id="d-statut">
          <option value="absent">Absent(e) — congés, absence…</option>
          <option value="en arrêt">En arrêt (arrêt de travail)</option>
          <option value="partiel">Disponible sur une plage horaire réduite</option>
          <option value="disponible">Annuler une absence (redevenir disponible)</option>
        </select>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;"><label>À partir du</label><input id="d-date" type="date" value="${AUJOURDHUI_ISO}"></div>
        <div class="field" style="flex:1;"><label>Jusqu'au (inclus)</label><input id="d-date-fin" type="date" value="${AUJOURDHUI_ISO}"></div>
      </div>
      <div class="field" id="d-inconnue-wrap"><label><input type="checkbox" id="d-fin-inconnue"> Date de fin inconnue (période indéterminée)</label></div>
      <div class="field hidden" id="d-horaires-wrap">
        <label>Disponible seulement de… à…</label>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1;"><input id="d-heure-debut" type="time" value="08:00"></div>
          <div class="field" style="flex:1;"><input id="d-heure-fin" type="time" value="16:30"></div>
        </div>
      </div>
      <div class="field" id="d-motif-wrap"><label>Motif (facultatif)</label><input id="d-motif" placeholder="ex : congés, arrêt maladie, formation"></div>
      <div id="d-resume" style="padding:10px 12px; border-radius:10px; background:var(--teal-50, #E6F6F3); color:#161C2C; font-size:13px; margin-bottom:8px;"></div>
      <div id="m-msg"></div>
      <div class="actions">
        <button class="btn" id="m-cancel">Annuler</button>
        <button class="btn primary" id="m-submit">Enregistrer</button>
      </div>
    `);

    const statutSelect = document.getElementById('d-statut');
    const dDebut = document.getElementById('d-date'), dFin = document.getElementById('d-date-fin'), dInconnue = document.getElementById('d-fin-inconnue');
    const heureD = document.getElementById('d-heure-debut'), heureF = document.getElementById('d-heure-fin');
    const fr = (iso) => iso ? iso.split('-').reverse().join('/') : '…';
    const prenom = personne.name;
    const fin400 = (d) => new Date(new Date(d + 'T12:00:00Z').getTime() + 400 * 86400000).toISOString().slice(0, 10);
    const nbJours = (d, f) => Math.round((new Date(f + 'T12:00:00Z') - new Date(d + 'T12:00:00Z')) / 86400000) + 1;

    function majFormulaire() {
      const st = statutSelect.value;
      document.getElementById('d-horaires-wrap').classList.toggle('hidden', st !== 'partiel');
      document.getElementById('d-motif-wrap').classList.toggle('hidden', st === 'disponible');
      dFin.disabled = dInconnue.checked;
      const d = dDebut.value, f = dFin.value;
      const periode = dInconnue.checked ? `à partir du ${fr(d)}, sans date de retour connue`
        : (!d || !f ? '…' : (d === f ? `le ${fr(d)} uniquement` : `du ${fr(d)} au ${fr(f)} inclus (${nbJours(d, f)} jours)`));
      // durée de travail effectif de la plage, pause déjeuner (12h00-12h30) déduite
      const hmin = (h) => { const [a, b] = String(h || '0:0').split(':'); return Number(a) * 60 + Number(b); };
      let effectif = '';
      if (st === 'partiel' && heureD.value && heureF.value && heureF.value > heureD.value) {
        const dm = hmin(heureD.value), fm = hmin(heureF.value);
        const m = fm - dm - Math.max(0, Math.min(fm, 750) - Math.max(dm, 720));
        effectif = ` Soit <b>${Math.floor(m / 60)} h${m % 60 ? String(m % 60).padStart(2, '0') : ''} de travail effectif</b> par jour (pause déjeuner de 12h00 à 12h30 déduite).`;
      }
      let t;
      if (st === 'absent') t = `<b>${esc(prenom)}</b> sera <b>absent(e)</b> ${periode}.`;
      else if (st === 'en arrêt') t = `<b>${esc(prenom)}</b> sera <b>en arrêt</b> ${periode}.`;
      else if (st === 'partiel') t = `<b>${esc(prenom)}</b> sera disponible <b>seulement de ${esc(heureD.value || '…')} à ${esc(heureF.value || '…')}</b> ${periode}.${effectif}`;
      else t = `<b>${esc(prenom)}</b> sera <b>de nouveau disponible</b> ${periode} : les absences ou arrêts enregistrés sur cette période seront supprimés.`;
      document.getElementById('d-resume').innerHTML = t;
    }
    [statutSelect, dDebut, dFin, dInconnue, heureD, heureF].forEach(i => { i.addEventListener('input', majFormulaire); i.addEventListener('change', majFormulaire); });
    dDebut.addEventListener('change', () => { if (!dFin.value || dFin.value < dDebut.value) { dFin.value = dDebut.value; majFormulaire(); } });

    // pré-remplit avec l'état déjà enregistré pour le jour de début (si une situation existe)
    async function chargerJour() {
      const j = dDebut.value; if (!j) return;
      try {
        const res = await fetch(`${API}/gerer-disponibilite?personnel_id=${personne.id}&date_debut=${j}&date_fin=${j}`);
        const l = res.ok ? (await res.json())[0] : null;
        if (l && !(l.statut === 'disponible' && !(l.heure_debut && l.heure_fin))) {
          const partiel = l.statut === 'disponible' && l.heure_debut && l.heure_fin;
          statutSelect.value = partiel ? 'partiel' : l.statut;
          if (partiel) { heureD.value = l.heure_debut.slice(0, 5); heureF.value = l.heure_fin.slice(0, 5); }
        }
      } catch (_) { /* pré-remplissage facultatif */ }
      majFormulaire();
    }
    dDebut.addEventListener('change', chargerJour);
    majFormulaire();
    chargerJour();

    document.getElementById('m-cancel').addEventListener('click', fermerModale);

    document.getElementById('m-submit').addEventListener('click', async () => {
      const st = statutSelect.value;
      const date = dDebut.value;
      const msg = document.getElementById('m-msg');
      const finInconnue = dInconnue.checked;
      const dateFin = finInconnue ? null : dFin.value;
      if (!date) { msg.innerHTML = '<div class="msg error">Choisissez la date de début.</div>'; return; }
      if (!finInconnue && (!dateFin || dateFin < date)) { msg.innerHTML = '<div class="msg error">La date de fin doit être postérieure ou égale à la date de début.</div>'; return; }
      if (st === 'partiel' && (!heureD.value || !heureF.value || heureF.value <= heureD.value)) { msg.innerHTML = '<div class="msg error">Indiquez une plage horaire valide (début avant fin).</div>'; return; }
      msg.innerHTML = `<div class="msg">Enregistrement…</div>`;
      try {
        if (st === 'disponible') {
          // retour à la disponibilité normale : on supprime les entrées de la période
          const res = await fetch(`${API}/gerer-disponibilite?personnel_id=${personne.id}&date=${date}&date_fin=${dateFin || fin400(date)}`, { method: 'DELETE' });
          if (!res.ok) throw new Error((await res.json()).error || 'Erreur inconnue');
          toast(`${personne.name} : disponible normalement ${dateFin ? 'du ' + fr(date) + ' au ' + fr(dateFin) : 'à partir du ' + fr(date)}.`);
        } else {
          const res = await fetch(`${API}/gerer-disponibilite`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              personnel_id: personne.id, date, date_fin: dateFin, fin_inconnue: finInconnue,
              motif: document.getElementById('d-motif').value,
              statut: st === 'partiel' ? 'disponible' : st,
              heure_debut: st === 'partiel' ? heureD.value : null, heure_fin: st === 'partiel' ? heureF.value : null,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
          toast(`Disponibilité de ${personne.name} enregistrée.`);
        }
        fermerModale(); chargerDonneesReelles();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }

  async function ouvrirModaleCompetences(personne) {
    let refs, actuelles;
    try {
      refs = await getReferentiels();
      const res = await fetch(`${API}/gerer-competences?personnel_id=${personne.id}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      actuelles = (await res.json()).operation_codes;
    } catch (e) {
      afficherModale(`<h3>Compétences</h3><div class="msg error">Backend indisponible. (${e.message})</div>`);
      return;
    }

    const opsHtml = refs.operations.map(o => `
      <label><input type="checkbox" value="${o.code}" ${actuelles.includes(o.code) ? 'checked' : ''}> ${o.nom}</label>
    `).join('');

    afficherModale(`
      <h3>Compétences — ${personne.name}</h3>
      <div class="field"><label>Opérations que cette personne sait réaliser</label><div class="op-list">${opsHtml}</div></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">Enregistrer</button></div>
    `);

    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-submit').addEventListener('click', async () => {
      const operation_codes = Array.from(document.querySelectorAll('.modal .op-list input:checked')).map(i => i.value);
      const msg = document.getElementById('m-msg');
      msg.innerHTML = `<div class="msg">Enregistrement en cours…</div>`;
      try {
        const res = await fetch(`${API}/gerer-competences`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personnel_id: personne.id, operation_codes }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        toast(`Compétences de ${personne.name} mises à jour.`);
        fermerModale(); chargerDonneesReelles();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }

  function renderMachines(){
    const wrap = el(`
      <div class="panel">
        <div class="panel-head"><h2>Parc machine</h2><button class="btn primary" id="new-machine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle machine</button></div>
        <table>
          <thead><tr><th>Nom</th><th>Code</th><th>Opération principale</th><th>Statut</th><th></th></tr></thead>
          <tbody id="machines-tbody"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
    `);

    chargerListeMachines(wrap);

    wrap.querySelector('#new-machine').addEventListener('click', () => ouvrirModaleMachine(null));
    return wrap;
  }

  async function chargerListeMachines(wrap) {
    const tbody = wrap.querySelector('#machines-tbody');
    try {
      const res = await fetch(`${API}/gerer-machines`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const machines = await res.json();
      tbody.innerHTML = '';
      machines.forEach(m => {
        tbody.appendChild(el(`
          <tr>
            <td>${m.nom}</td>
            <td class="mono">${m.code}</td>
            <td>${(m.operations && m.operations.length) ? m.operations.map(o=>`<span class="tag ok" style="margin-right:4px;">${o.nom}</span>`).join('') : '<span style="color:var(--ink-500)">— aucune —</span>'}</td>
            <td><span class="tag ${m.actif ? 'ok' : 'danger'}">${m.actif ? 'Active' : 'Inactive'}</span></td>
            <td style="white-space:nowrap;">
              <button class="btn edit-machine" data-id="${m.id}">Modifier</button>
              <button class="btn btn-icon-danger delete-machine" data-id="${m.id}" title="Supprimer cette machine" aria-label="Supprimer ${m.nom}">${svgIcon('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>')}</button>
            </td>
          </tr>
        `));
      });
      tbody.querySelectorAll('.edit-machine').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = machines.find(x => x.id === btn.dataset.id);
          ouvrirModaleMachine(m);
        });
      });
      tbody.querySelectorAll('.delete-machine').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = machines.find(x => x.id === btn.dataset.id);
          ouvrirModaleSuppressionMachine(m);
        });
      });
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">Backend indisponible — impossible de charger le parc machine réel. (${e.message})</td></tr>`;
    }
  }

  function ouvrirModaleSuppressionMachine(machine) {
    afficherModale(`
      <h3>Supprimer ${machine.nom} ?</h3>
      <p style="font-size:13px; color:var(--ink-700); margin:0;">Cette action est <strong>définitive</strong>. La machine sera retirée du parc, de la liste des opérations qu'elle réalise et des compétences machine du personnel.</p>
      <div id="m-msg"></div>
      <div class="actions">
        <button class="btn" id="m-cancel">Annuler</button>
        <button class="btn danger-btn" id="m-confirm-delete">Supprimer</button>
      </div>
    `);
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-confirm-delete').addEventListener('click', () => supprimerMachine(machine, false));
  }

  async function supprimerMachine(machine, force) {
    const msg = document.getElementById('m-msg');
    msg.innerHTML = `<div class="msg">Suppression en cours…</div>`;
    try {
      const res = await fetch(`${API}/gerer-machines?id=${machine.id}${force ? '&force=true' : ''}`, { method: 'DELETE' });
      const data = await res.json();

      if (res.status === 409 && data.utilisee) {
        // Machine encore utilisée : proposer la désactivation, ou la suppression forcée.
        const { affectations, etapes_gamme } = data.utilisee;
        afficherModale(`
          <h3>${machine.nom} est encore utilisée</h3>
          <p style="font-size:13px; color:var(--ink-700); margin:0 0 8px;">
            Elle est référencée par <strong>${affectations} affectation(s) planning</strong>
            et <strong>${etapes_gamme} étape(s) de gamme</strong>.
          </p>
          <p style="font-size:13px; color:var(--ink-700); margin:0 0 4px;"><strong>Désactiver</strong> la machine la retire des plannings sans rien perdre — c'est l'option la plus sûre.</p>
          <p style="font-size:13px; color:var(--ink-700); margin:0;"><strong>Supprimer quand même</strong> retire ses affectations du planning ; les étapes de gamme concernées repasseront « à planifier ».</p>
          <div id="m-msg"></div>
          <div class="actions">
            <button class="btn" id="m-cancel">Annuler</button>
            <button class="btn" id="m-desactiver">Désactiver à la place</button>
            <button class="btn danger-btn" id="m-force-delete">Supprimer quand même</button>
          </div>
        `);
        document.getElementById('m-cancel').addEventListener('click', fermerModale);
        document.getElementById('m-force-delete').addEventListener('click', () => supprimerMachine(machine, true));
        document.getElementById('m-desactiver').addEventListener('click', async () => {
          const m2 = document.getElementById('m-msg');
          try {
            const r = await fetch(`${API}/gerer-machines`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: machine.id, actif: false }),
            });
            if (!r.ok) throw new Error((await r.json()).error || 'Erreur inconnue');
            toast(`${machine.nom} désactivée.`);
            fermerModale(); chargerDonneesReelles();
          } catch (e) { m2.innerHTML = `<div class="msg error">${e.message}</div>`; }
        });
        return;
      }

      if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
      const suffixe = data.affectations_retirees > 0 ? ` (${data.affectations_retirees} affectation(s) retirée(s))` : '';
      toast(`${data.nom} supprimée${suffixe}.`);
      fermerModale(); chargerDonneesReelles();
    } catch (e) {
      msg.innerHTML = `<div class="msg error">${e.message}</div>`;
    }
  }

  async function ouvrirModaleMachine(machine) {
    let refs;
    try { refs = await getReferentiels(); }
    catch (e) {
      afficherModale(`<h3>Machine</h3><div class="msg error">Backend indisponible. (${e.message})</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }

    const estEdition = !!machine;
    const codesActuels = machine ? (machine.operations || []).map(o => o.code) : [];
    const opsHtml = refs.operations.map(o => `
      <label><input type="checkbox" value="${o.code}" ${codesActuels.includes(o.code) ? 'checked' : ''}> ${o.nom}</label>
    `).join('');

    afficherModale(`
      <h3>${estEdition ? 'Modifier la machine' : 'Nouvelle machine'}</h3>
      <div class="field"><label>Code</label><input id="m-code" value="${machine ? machine.code : ''}" placeholder="ex: SIGLOCH"></div>
      <div class="field"><label>Nom</label><input id="m-nom" value="${machine ? machine.nom : ''}" placeholder="ex: Sigloch"></div>
      <div class="field"><label>Opérations (cocher toutes celles que cette machine peut faire)</label><div class="op-list">${opsHtml}</div></div>
      ${estEdition ? `<div class="field"><label><input type="checkbox" id="m-actif" ${machine.actif ? 'checked' : ''}> Machine active</label></div>
      <div class="field"><label>Temps de production de cette machine <span class="plan-note">— mise en route, réglage, cadence, nettoyage (par type de production)</span></label><button class="btn" type="button" id="m-profils">Configurer les temps de production…</button></div>` : ''}
      <div class="field"><label>Notes</label><input id="m-notes" value="${machine && machine.notes ? machine.notes : ''}" placeholder="optionnel"></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">${estEdition ? 'Enregistrer' : 'Créer'}</button></div>
    `);

    if (estEdition) document.getElementById('m-profils').addEventListener('click', () => ouvrirProfilsMachine(machine, refs));
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-submit').addEventListener('click', async () => {
      const code = document.getElementById('m-code').value.trim();
      const nom = document.getElementById('m-nom').value.trim();
      const operation_codes = Array.from(document.querySelectorAll('.modal .op-list input:checked')).map(i => i.value);
      const notes = document.getElementById('m-notes').value.trim();
      const msg = document.getElementById('m-msg');

      if (!code || !nom) {
        msg.innerHTML = `<div class="msg error">Code et nom sont requis.</div>`;
        return;
      }
      msg.innerHTML = `<div class="msg">Enregistrement en cours…</div>`;
      try {
        const payload = estEdition
          ? { id: machine.id, code, nom, operation_codes, notes, actif: document.getElementById('m-actif').checked }
