        toast('Coûts et tarifs enregistrés.');
        fermerModale();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
  }

  async function ouvrirModaleDevis(ofUuid, ofNumero) {
    afficherModale(`<h3>Devis — ${esc(ofNumero)}</h3><div id="dv-corps"><div class="msg">Calcul du devis d'après le chiffrage…</div></div>`, 'xlarge');
    let S, R, info, devisId = null, devisNumero = null;
    const post = async (corps) => {
      const res = await fetch(`${API}/calculer-devis`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
      return d;
    };
    try {
      const [d, listeRes] = await Promise.all([post({ of_id: ofUuid }), fetch(`${API}/gerer-devis?of_id=${ofUuid}`).then(r => r.json()).catch(() => ({ devis: [] }))]);
      info = { of: d.of, matieres: d.matieres_disponibles, avertissements: d.avertissements, saisis: listeRes.devis || [] };
      S = d.saisie; R = d.resultat;
    } catch (e) { document.getElementById('dv-corps').innerHTML = `<div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`; document.getElementById('m-cancel').addEventListener('click', fermerModale); return; }
    let client = info.of.client || '', titre = info.of.titre || '', notes = '', statut = 'brouillon';

    const pf = (k) => S.parametres[k];
    function structure() {
      const dispo = info.matieres;
      document.getElementById('dv-corps').innerHTML = `
        ${info.saisis.length ? `<div class="field" style="max-width:520px;"><label>Devis déjà enregistrés pour cet OF</label><div style="display:flex;gap:8px;"><select id="dv-ouvrir">${info.saisis.map(x => `<option value="${x.id}">${esc(x.numero)} — ${eur(x.total_ht)} HT — ${esc(x.statut)}</option>`).join('')}</select><button class="btn" id="dv-charger">Ouvrir</button></div></div>` : ''}
        ${devisNumero ? `<div class="plan-note" style="margin-bottom:6px;">Devis <strong>${esc(devisNumero)}</strong> — statut : <select id="dv-statut">${['brouillon', 'envoyé', 'accepté', 'refusé'].map(s => `<option ${s === statut ? 'selected' : ''}>${s}</option>`).join('')}</select></div>` : ''}
        ${info.avertissements.length ? `<div class="msg" style="color:var(--accent-amber-text);">${info.avertissements.map(a => '⚠️ ' + esc(a)).join('<br>')} <a href="#" id="dv-couts" style="margin-left:6px;">Ouvrir Coûts & tarifs</a></div>` : ''}
        <div class="step-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
          <div class="field"><label>Client</label><input id="dv-client" value="${esc(client)}"></div>
          <div class="field"><label>Titre</label><input id="dv-titre" value="${esc(titre)}"></div>
          <div class="field"><label>Quantité (exemplaires)</label><input id="dv-qte" type="number" min="1" value="${S.quantite}"></div>
          <div class="field"><label>Main d'œuvre facturée (€/h)</label><input class="dv-p" data-k="taux_horaire_client" type="number" step="any" min="0" value="${pf('taux_horaire_client')}"></div>
          <div class="field"><label>Marge matières (%)</label><input class="dv-p" data-k="marge_matiere_pct" type="number" step="any" min="0" value="${pf('marge_matiere_pct')}"></div>
          <div class="field"><label>Marge machines (%)</label><input class="dv-p" data-k="marge_machine_pct" type="number" step="any" min="0" value="${pf('marge_machine_pct')}"></div>
          <div class="field"><label>TVA (%)</label><input class="dv-p" data-k="tva_pct" type="number" step="any" min="0" value="${pf('tva_pct')}"></div>
          <div class="field"><label>Remise (%)</label><input id="dv-remise" type="number" step="any" min="0" max="100" value="${S.remise_pct || 0}"></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 10px;"><input type="checkbox" id="dv-fm" ${Number(pf('facturer_machine')) === 1 ? 'checked' : ''}> Facturer l'utilisation des machines en plus de la main d'œuvre (sinon elle est incluse dans le taux horaire)</label>

        <h4 class="dv-h">Main d'œuvre</h4>
        <table class="sp-table"><thead><tr><th>Opération</th><th>Heures</th><th>Coût horaire</th><th>Coût de revient</th><th>Prix de vente</th></tr></thead><tbody>
        ${S.mo.map((l, i) => `<tr><td>${esc(l.operation)}</td><td><input class="dv-l" data-g="mo" data-i="${i}" data-k="heures" type="number" step="any" min="0" style="width:80px;" value="${l.heures}"></td><td>${eur(l.cout_horaire)}</td><td class="dv-c" data-g="mo" data-i="${i}" data-k="cout"></td><td class="dv-c" data-g="mo" data-i="${i}" data-k="vente"></td></tr>`).join('') || '<tr><td colspan="5" class="plan-note">Aucune opération chiffrée.</td></tr>'}</tbody></table>

        <h4 class="dv-h">Utilisation des machines (amortissement)</h4>
        <table class="sp-table"><thead><tr><th>Opération — machine</th><th>Heures</th><th>Coût horaire (€/h)</th><th>Coût de revient</th><th>Prix de vente</th></tr></thead><tbody>
        ${S.machine.map((l, i) => `<tr><td>${esc(l.operation)} — ${esc(l.machine)}</td><td><input class="dv-l" data-g="machine" data-i="${i}" data-k="heures" type="number" step="any" min="0" style="width:80px;" value="${l.heures}"></td><td><input class="dv-l" data-g="machine" data-i="${i}" data-k="cout_horaire" type="number" step="any" min="0" style="width:80px;" value="${l.cout_horaire}"></td><td class="dv-c" data-g="machine" data-i="${i}" data-k="cout"></td><td class="dv-c" data-g="machine" data-i="${i}" data-k="vente"></td></tr>`).join('') || '<tr><td colspan="5" class="plan-note">Aucune utilisation machine.</td></tr>'}</tbody></table>

        <h4 class="dv-h">Matières premières <button class="btn" id="dv-add-mat" style="margin-left:8px;">+ Ajouter</button></h4>
        <table class="sp-table"><thead><tr><th>Matière</th><th>Unité</th><th>Quantité</th><th>Prix unitaire (€)</th><th>Coût d'achat</th><th>Prix de vente</th><th></th></tr></thead><tbody>
        ${S.matieres.map((l, i) => `<tr><td><input class="dv-l" data-g="matieres" data-i="${i}" data-k="nom" list="dv-mats" style="width:190px;" value="${esc(l.nom || '')}"></td><td><input class="dv-l" data-g="matieres" data-i="${i}" data-k="unite" style="width:60px;" value="${esc(l.unite || '')}"></td><td><input class="dv-l" data-g="matieres" data-i="${i}" data-k="quantite" type="number" step="any" min="0" style="width:90px;" value="${l.quantite}"></td><td><input class="dv-l" data-g="matieres" data-i="${i}" data-k="prix_unitaire" type="number" step="any" min="0" style="width:90px;" value="${l.prix_unitaire}"></td><td class="dv-c" data-g="matieres" data-i="${i}" data-k="cout"></td><td class="dv-c" data-g="matieres" data-i="${i}" data-k="vente"></td><td><button class="btn dv-del" data-g="matieres" data-i="${i}">✕</button></td></tr>`).join('') || '<tr><td colspan="7" class="plan-note">Aucune matière : ajoutez le papier, la colle, le fil, la couverture…</td></tr>'}</tbody></table>
        <datalist id="dv-mats">${dispo.map(m => `<option value="${esc(m.nom)}"></option>`).join('')}</datalist>

        <h4 class="dv-h">Autres frais (transport, sous-traitance…) <button class="btn" id="dv-add-aut" style="margin-left:8px;">+ Ajouter</button></h4>
        <table class="sp-table"><thead><tr><th>Libellé</th><th>Coût (€)</th><th>Prix de vente (€)</th><th></th></tr></thead><tbody>
        ${S.autres.map((l, i) => `<tr><td><input class="dv-l" data-g="autres" data-i="${i}" data-k="libelle" style="width:260px;" value="${esc(l.libelle || '')}"></td><td><input class="dv-l" data-g="autres" data-i="${i}" data-k="cout" type="number" step="any" min="0" style="width:100px;" value="${l.cout}"></td><td><input class="dv-l" data-g="autres" data-i="${i}" data-k="vente" type="number" step="any" min="0" style="width:100px;" value="${l.vente}"></td><td><button class="btn dv-del" data-g="autres" data-i="${i}">✕</button></td></tr>`).join('') || '<tr><td colspan="4" class="plan-note">Aucun autre frais.</td></tr>'}</tbody></table>

        <div id="dv-totaux"></div>
        <div class="field" style="margin-top:8px;"><label>Notes / conditions</label><input id="dv-notes" value="${esc(notes)}" placeholder="ex. délai de livraison, conditions de paiement"></div>
        <div id="m-msg"></div>
        <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn" id="dv-pdf-int">PDF interne (marge)</button><button class="btn" id="dv-save">Enregistrer</button><button class="btn primary" id="dv-pdf">PDF client</button></div>`;
      brancher(); majAffichage();
    }

    let minuterie = null;
    function lire() {
      client = document.getElementById('dv-client').value; titre = document.getElementById('dv-titre').value; notes = document.getElementById('dv-notes').value;
      S.quantite = Number(document.getElementById('dv-qte').value) || 0;
      S.remise_pct = Number(document.getElementById('dv-remise').value) || 0;
      document.querySelectorAll('.dv-p').forEach(i => { S.parametres[i.dataset.k] = Number(i.value) || 0; });
      S.parametres.facturer_machine = document.getElementById('dv-fm').checked ? 1 : 0;
      document.querySelectorAll('.dv-l').forEach(i => { S[i.dataset.g][Number(i.dataset.i)][i.dataset.k] = i.type === 'number' ? i.value : i.value; });
    }
    async function recalculer() {
      lire();
      try { R = (await post({ saisie: S })).resultat; majAffichage(); } catch (e) { document.getElementById('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }
    function majAffichage() {
      document.querySelectorAll('.dv-c').forEach(td => { const v = R[td.dataset.g][Number(td.dataset.i)]; td.textContent = v ? eur(v[td.dataset.k]) : ''; });
      const t = R.totaux;
      const ligne = (l, v, cls) => `<tr class="${cls || ''}"><td>${l}</td><td style="text-align:right;">${v}</td></tr>`;
      document.getElementById('dv-totaux').innerHTML = `<div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;">
        <table class="sp-table" style="max-width:420px;"><tbody>
          ${ligne(`Main d'œuvre (${t.mo_heures} h)`, eur(t.mo_vente))}${ligne('Utilisation machines', eur(t.machine_vente))}${ligne('Matières premières', eur(t.matieres_vente))}${ligne('Autres frais', eur(t.autres_vente))}
          ${t.remise ? ligne(`Remise (${R.remise_pct} %)`, '− ' + eur(t.remise)) : ''}
          ${ligne('<strong>Total HT</strong>', '<strong>' + eur(t.ht) + '</strong>')}${ligne('TVA ' + R.parametres.tva_pct + ' %', eur(t.tva))}${ligne('<strong>Total TTC</strong>', '<strong>' + eur(t.ttc) + '</strong>')}
          ${t.prix_unitaire_ht !== null ? ligne('Prix par exemplaire HT', (t.prix_unitaire_ht).toLocaleString('fr-FR', { minimumFractionDigits: 3 }) + ' €') + ligne('Prix pour 1 000 HT', eur(t.prix_mille_ht)) : ''}
        </tbody></table>
        <table class="sp-table" style="max-width:340px;background:var(--field-bg);"><tbody>
          <tr><td colspan="2" class="plan-note"><strong>Interne (jamais montré au client)</strong></td></tr>
          ${ligne('Coût de revient', eur(t.cout_revient))}${ligne('Marge', '<strong style="color:' + (t.marge >= 0 ? 'inherit' : 'var(--danger-text)') + ';">' + eur(t.marge) + '</strong>')}${ligne('Taux de marge', t.marge_pct + ' %')}
        </tbody></table></div>`;
    }
    function planifier() { clearTimeout(minuterie); minuterie = setTimeout(recalculer, 250); }

    async function enregistrer() {
      lire();
      const statutSel = document.getElementById('dv-statut');
      const res = await fetch(`${API}/gerer-devis`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: devisId || undefined, of_id: ofUuid, client, titre, notes, statut: statutSel ? statutSel.value : undefined, saisie: S }) });
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
      R = d.resultat;
      if (!devisId) { devisId = d.id; devisNumero = d.numero; info.saisis.unshift({ id: d.id, numero: d.numero, total_ht: R.totaux.ht, statut: 'brouillon' }); structure(); }
      return { numero: devisNumero || d.numero };
    }
    function brancher() {
      document.getElementById('m-cancel').addEventListener('click', fermerModale);
      document.querySelectorAll('#dv-corps input:not(#dv-notes), #dv-fm').forEach(i => i.addEventListener('input', planifier));
      document.getElementById('dv-couts') && document.getElementById('dv-couts').addEventListener('click', (e) => { e.preventDefault(); ouvrirModaleCouts(); });
      document.getElementById('dv-add-mat').addEventListener('click', () => { lire(); S.matieres.push({ nom: '', unite: '', quantite: 0, prix_unitaire: 0 }); structure(); recalculer(); });
      document.getElementById('dv-add-aut').addEventListener('click', () => { lire(); S.autres.push({ libelle: '', cout: 0, vente: 0 }); structure(); recalculer(); });
      document.querySelectorAll('.dv-del').forEach(b => b.addEventListener('click', () => { lire(); S[b.dataset.g].splice(Number(b.dataset.i), 1); structure(); recalculer(); }));
      // Choisir une matière du stock : unité, prix et quantité type sont repris.
      document.querySelectorAll('.dv-l[data-k="nom"]').forEach(inp => inp.addEventListener('change', () => {
        const m = info.matieres.find(x => x.nom === inp.value);
        if (!m) return;
        lire();
        const l = S.matieres[Number(inp.dataset.i)];
        l.nom = m.nom; l.unite = m.unite; l.prix_unitaire = m.prix_unitaire ?? 0; if (m.quantite_proposee !== null && !Number(l.quantite)) l.quantite = m.quantite_proposee;
        structure(); recalculer();
      }));
      const ouvrir = document.getElementById('dv-charger');
      if (ouvrir) ouvrir.addEventListener('click', async () => {
        try {
          const d = await (await fetch(`${API}/gerer-devis?id=${document.getElementById('dv-ouvrir').value}`)).json();
          const { totaux, ...saisie } = d.contenu; S = saisie; R = d.contenu;
          client = d.client || ''; titre = d.titre || ''; notes = d.notes || ''; statut = d.statut; devisId = d.id; devisNumero = d.numero;
          structure();
        } catch (e) { document.getElementById('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      });
      document.getElementById('dv-save').addEventListener('click', async () => {
        const msg = document.getElementById('m-msg'); msg.innerHTML = '<div class="msg">Enregistrement…</div>';
        try { const r = await enregistrer(); toast(`Devis ${r.numero} enregistré.`); document.getElementById('m-msg').innerHTML = ''; } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      });
      const pdf = (interne) => async () => {
        const msg = document.getElementById('m-msg'); msg.innerHTML = '<div class="msg">Génération du PDF…</div>';
        try { const r = await enregistrer(); await genererPdfDevis({ numero: r.numero, client, titre, notes, R, interne }); document.getElementById('m-msg').innerHTML = ''; } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      };
      document.getElementById('dv-pdf').addEventListener('click', pdf(false));
      document.getElementById('dv-pdf-int').addEventListener('click', pdf(true));
    }
    structure();
  }

  async function genererPdfDevis({ numero, client, titre, notes, R, interne }) {
    await chargerLibsPdf();
    const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth(), M = 14;
    const t = R.totaux, p = R.parametres;
    const ajd = new Date();
    const dateTxt = ajd.toLocaleDateString('fr-FR');
    const fin = new Date(ajd.getTime() + (Number(p.validite_jours) || 30) * 86400000).toLocaleDateString('fr-FR');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text('Ateliers Babouot', M, 20);
    doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.setTextColor(110); doc.text('Reliure industrielle et industrie graphique', M, 26); doc.setTextColor(0);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(interne ? 'DEVIS - VERSION INTERNE' : 'DEVIS', W - M, 20, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(pdfTxt(`N° ${numero}`), W - M, 26, { align: 'right' });
    doc.text(pdfTxt(`Date : ${dateTxt}`), W - M, 31, { align: 'right' });
    doc.text(pdfTxt(`Valable jusqu'au ${fin}`), W - M, 36, { align: 'right' });
    let y = 46;
    doc.setFont('helvetica', 'bold'); doc.text('Client', M, y); doc.setFont('helvetica', 'normal'); doc.text(pdfTxt(client || '-'), M + 28, y); y += 6;
    doc.setFont('helvetica', 'bold'); doc.text('Ouvrage', M, y); doc.setFont('helvetica', 'normal'); doc.text(pdfTxt(titre || '-'), M + 28, y); y += 6;
    doc.setFont('helvetica', 'bold'); doc.text('Quantite', M, y); doc.setFont('helvetica', 'normal'); doc.text(pdfTxt(`${Number(R.quantite).toLocaleString('fr-FR')} exemplaires`), M + 28, y); y += 8;

    const E = (n) => pdfTxt(eur(n));
    const corps = [];
    const vide = (v) => Number(v) === 0;
    if (interne) {
      R.mo.filter(l => !vide(l.heures)).forEach(l => corps.push([pdfTxt(`Main d'oeuvre - ${l.operation}`), `${l.heures} h`, `${E(l.cout_horaire)}/h`, E(l.cout), E(l.vente)]));
      R.machine.filter(l => !vide(l.heures)).forEach(l => corps.push([pdfTxt(`Machine - ${l.machine} (${l.operation})`), `${l.heures} h`, `${E(l.cout_horaire)}/h`, E(l.cout), E(l.vente)]));
      R.matieres.filter(l => l.nom || l.cout).forEach(l => corps.push([pdfTxt(`Matiere - ${l.nom}`), pdfTxt(`${l.quantite} ${l.unite || ''}`), `${E(l.prix_unitaire)}`, E(l.cout), E(l.vente)]));
      R.autres.filter(l => l.libelle || l.cout || l.vente).forEach(l => corps.push([pdfTxt(l.libelle), '', '', E(l.cout), E(l.vente)]));
      doc.autoTable({ startY: y, margin: { left: M, right: M }, head: [['Poste', 'Quantite', 'Cout unitaire', 'Cout de revient', 'Prix de vente']], body: corps, styles: { fontSize: 8.5, cellPadding: 1.8 }, headStyles: { fillColor: [30, 90, 100] }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } } });
    } else {
      // Version client : main d'oeuvre détaillée par opération (heures x taux), machines regroupées, matières, autres frais. Aucun coût de revient.
      R.mo.filter(l => !vide(l.heures)).forEach(l => corps.push([pdfTxt(`Main d'oeuvre - ${l.operation}`), `${l.heures} h`, `${E(p.taux_horaire_client)}/h`, E(l.vente)]));
      if (t.machine_vente > 0) corps.push(['Utilisation des machines', `${t.machine_heures} h`, '', E(t.machine_vente)]);
      R.matieres.filter(l => l.nom || l.vente).forEach(l => corps.push([pdfTxt(`Matiere - ${l.nom}`), pdfTxt(`${l.quantite} ${l.unite || ''}`), '', E(l.vente)]));
      R.autres.filter(l => l.libelle || l.vente).forEach(l => corps.push([pdfTxt(l.libelle), '', '', E(l.vente)]));
      doc.autoTable({ startY: y, margin: { left: M, right: M }, head: [['Designation', 'Quantite', 'Prix unitaire', 'Montant HT']], body: corps, styles: { fontSize: 9, cellPadding: 2 }, headStyles: { fillColor: [30, 90, 100] }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } } });
    }
    y = doc.lastAutoTable.finalY + 6;
    const tot = [];
    if (t.remise) tot.push(['Sous-total HT', E(t.brut_ht)], [`Remise ${R.remise_pct} %`, '- ' + E(t.remise)]);
    tot.push(['Total HT', E(t.ht)], [`TVA ${p.tva_pct} %`, E(t.tva)], ['Total TTC', E(t.ttc)]);
    if (t.prix_unitaire_ht !== null) tot.push(['Prix par exemplaire HT', pdfTxt(t.prix_unitaire_ht.toLocaleString('fr-FR', { minimumFractionDigits: 3 }) + ' EUR')], ['Prix pour 1 000 HT', E(t.prix_mille_ht)]);
    if (interne) tot.push(['Cout de revient', E(t.cout_revient)], ['Marge', E(t.marge)], ['Taux de marge', `${t.marge_pct} %`]);
    doc.autoTable({ startY: y, margin: { left: W - M - 90, right: M }, body: tot, theme: 'plain', styles: { fontSize: 9.5, cellPadding: 1.6 }, columnStyles: { 1: { halign: 'right' } },
      didParseCell: (h) => { if (['Total HT', 'Total TTC'].includes(h.row.raw[0])) h.cell.styles.fontStyle = 'bold'; } });
    y = doc.lastAutoTable.finalY + 8;
    if (notes) { doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.text(doc.splitTextToSize(pdfTxt(notes), W - 2 * M), M, y); y += 10; }
    if (!interne) { doc.setFontSize(8.5); doc.setTextColor(110); doc.text(pdfTxt(`Devis valable ${p.validite_jours} jours. Bon pour accord (date, signature et cachet) :`), M, y + 4); doc.rect(M, y + 7, 80, 24); doc.setTextColor(0); }
    doc.save(`${interne ? 'devis-interne' : 'devis'}-${numero}.pdf`);
  }

  // Détail de ce qui est planifié pour une étape de gamme (consultation, rien n'est modifié)
  async function ouvrirDetailEtape(gammeId, ofUuid, ofNumero) {
    const retour = () => ouvrirModaleGamme(ofUuid, ofNumero);
    afficherModale(`<h3>Planning de l'étape — ${esc(ofNumero)}</h3><div class="empty">Chargement…</div>`, 'large');
    let d;
    try {
      const r = await fetch(`${API}/detail-etape?gamme_id=${gammeId}`);
      d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
    } catch (e) { afficherModale(`<h3>Planning de l'étape</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Retour</button></div>`); document.getElementById('m-cancel').addEventListener('click', retour); return; }
    const { etape, liens, resume, creneaux } = d;
    const jourFr = (iso) => { const x = new Date(iso + 'T00:00:00Z'); return `${['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'][x.getUTCDay()]} ${dateCourte(iso).slice(0, 5)}`; };
    const MODE = { fin: 'après la fin de', en_ligne: 'en ligne avec', debut: 'dès le démarrage de', progressif: 'dès démarrage progressif de' };
    const parJour = {};
    creneaux.forEach(c => { (parJour[c.date] = parJour[c.date] || []).push(c); });
    const bloc = (iso) => {
      const cs = parJour[iso]; const tot = cs.reduce((t, c) => t + c.minutes, 0);
      return `<div style="border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fff; overflow:hidden;">
        <div style="display:flex; gap:8px; padding:6px 10px; background:var(--paper-raised-2,#F3F5FA); font-size:13px;"><strong style="text-transform:capitalize;">${jourFr(iso)}</strong><span style="margin-left:auto; color:var(--ink-700);">${fmtDuree(tot)}</span></div>
        ${cs.map(c => `<div style="display:grid; grid-template-columns:92px minmax(0,1fr) minmax(0,1fr) 54px; gap:8px; padding:5px 10px; border-top:1px solid var(--line); font-size:12.5px; align-items:center;">
          <span style="white-space:nowrap;">${c.heure_debut ? c.heure_debut + '–' + c.heure_fin : 'Journée'}</span>
          <span>${esc(c.phase || etape.operation)}<div style="font-size:11px; color:var(--ink-500);">${esc(c.machine)}</div></span>
          <span>${c.personnes.length ? esc(c.personnes.join(', ')) : '<em style="color:var(--ink-500);">aucune personne affectée</em>'}</span>
          <span>${fmtDuree(c.minutes)}</span></div>`).join('')}</div>`;
    };
    const kpi = (v, l) => `<span class="occ-chip"><b>${v}</b> ${l}</span>`;
    afficherModale(`
      <h3>${esc(etape.operation)} — ${esc(etape.of_numero)}</h3>
      <div style="font-size:12.5px; color:var(--ink-700); margin:-4px 0 10px;">${esc(etape.titre)} · étape ${etape.sequence} · ${esc(etape.statut)}</div>
      ${creneaux.length ? `
        <div class="occ-kpis">
          ${kpi(`${jourFr(resume.debut.date)} ${resume.debut.heure}`, 'début')}${kpi(`${jourFr(resume.fin.date)} ${resume.fin.heure}`, 'fin')}
          ${kpi(fmtDuree(resume.minutes), 'de travail')}${kpi(resume.jours, 'jour(s)')}${kpi(esc(resume.machines.join(', ')), '')}
        </div>
        <div style="font-size:12.5px; margin-bottom:8px;"><strong>Personnes :</strong> ${resume.personnes.length ? esc(resume.personnes.join(', ')) : '<em>aucune affectée</em>'}</div>` : '<div class="msg">Aucun créneau planifié pour cette étape.</div>'}
      <div style="font-size:12.5px; margin-bottom:10px;"><strong>Dépendances :</strong> ${liens.apres.length ? liens.apres.map(l => `${MODE[l.mode] || 'après'} « ${esc(l.operation)} »`).join(' ; ') : 'aucune (peut démarrer dès que possible)'}</div>
      ${Object.keys(parJour).sort().map(bloc).join('')}
      <div class="plan-note">Consultation seule : rien n'est modifié. Durées en travail effectif (pause 12h00–12h30 déduite). Pour changer l'affectation ou l'horaire d'un créneau, utilisez la page « Charge » de la personne.</div>
      <div id="recal-msg"></div>
      <div class="actions">${creneaux.some(c => !c.heure_debut) ? `<button class="btn primary" id="m-recaler" title="Remplace les créneaux « Journée » par la durée réelle du chiffrage">Recaler sur le chiffrage</button>` : ''}<button class="btn" id="m-cancel">Retour à la gamme</button></div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', retour);

      bRec.disabled = true; bRec.textContent = 'Recalage…';

  // Gamme opératoire d'un OF : voir l'état de chaque étape, la planifier, la déplanifier ou la supprimer.
  async function ouvrirModaleGamme(ofUuid, ofNumero) {
    afficherModale(`<h3>Gamme opératoire — ${esc(ofNumero)}</h3><div id="gamme-list" class="empty">Chargement…</div><div id="gamme-msg"></div><div class="actions"><button class="btn" id="gamme-fermer">Fermer</button></div>`, 'large');
    document.getElementById('gamme-fermer').addEventListener('click', fermerModale);
    const zoneMsg = () => document.getElementById('gamme-msg');
    try {
      const res = await fetch(`${API}/gammes-ordre?of_id=${ofUuid}`);
      const gammes = await lireJson(res);
      if (!res.ok || !Array.isArray(gammes)) throw new Error((gammes && gammes.error) || `réponse inattendue du serveur (HTTP ${res.status})`);
      const list = document.getElementById('gamme-list');
      const ETAT = { 'à planifier': 'À planifier', 'planifié': 'Planifié', 'en cours': 'En cours', 'terminé': 'Terminé' };
      const btn = 'padding:3px 9px;font-size:12px;';
      list.className = '';
      list.innerHTML = gammes.map(g => {
        const nom = g.operation ? g.operation.nom : '(opération supprimée)';
        const classe = g.statut === 'à planifier' ? 'warn' : 'ok';
        let actions = '';
        if (g.statut === 'à planifier') {
          actions = `<button class="btn primary" style="${btn}" data-gact="planifier" data-id="${g.id}">Planifier</button>
                     <button class="btn" style="${btn}color:var(--danger,#c0392b);" data-gact="supprimer" data-id="${g.id}" data-nom="${esc(nom)}">Supprimer</button>`;
        } else if (g.statut === 'planifié') {
          actions = `<button class="btn primary" style="${btn}" data-gact="voir" data-id="${g.id}" title="Consulter le planning de cette étape sans rien modifier">Voir</button>
                     <button class="btn" style="${btn}" data-gact="replanifier" data-id="${g.id}" title="Replanifier : le planning actuel de l'étape est retiré puis recalculé">Modifier</button>
                     <button class="btn" style="${btn}" data-gact="deplanifier" data-id="${g.id}">Déplanifier</button>`;
        } else {
          actions = `<button class="btn" style="${btn}" data-gact="voir" data-id="${g.id}" title="Consulter ce qui a été planifié">Voir</button>`;
        }
        const el = g.en_ligne && g.en_ligne.possible ? g.en_ligne : null;
        const modeHtml = !el ? '' : (g.statut === 'à planifier'
          ? `<select data-gmode="${g.id}" title="Fonctionnement par rapport à « ${esc(el.avec)} »" style="font-size:13px;padding:6px 8px;width:auto;max-width:100%;"><option value="en_ligne" ${el.actif ? 'selected' : ''}>En ligne avec ${esc(el.avec)}</option><option value="hors_ligne" ${el.actif ? '' : 'selected'}>Hors ligne (après ${esc(el.avec)})</option></select>`
          : `<span class="tag ${el.actif ? 'ok' : ''}">${el.actif ? 'En ligne' : 'Hors ligne'}</span>`);
        const couleur = g.statut === 'à planifier' ? '#F5A623' : (g.statut === 'terminé' ? '#8A94AB' : '#16B8A6');
        const enLigneActif = !!(el && el.actif);
        return `<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; margin:0 0 8px ${enLigneActif ? '22px' : '0'}; border:1px solid var(--line); border-left:5px solid ${couleur}; border-radius:10px; background:#fff; position:relative;">

            <div style="flex:1; min-width:170px;">
              <div style="font-size:15px; font-weight:700; color:#161C2C; line-height:1.25;">${esc(nom)}</div>
              ${el ? `<div style="margin-top:3px; font-size:12px; color:${enLigneActif ? '#0F766E' : '#5B6478'}; font-weight:600;">${enLigneActif ? '↳ en ligne avec ' : 'hors ligne, après '}${esc(el.avec)}</div>` : ''}
            </div>
            <span class="tag ${classe}" style="font-size:12px;">${ETAT[g.statut] || esc(g.statut)}</span>

        const refs = await getReferentiels();

        const optApres = gammes.map(g => `<option value="${g.sequence}">${g.rang || g.sequence}. ${esc(g.operation ? g.operation.nom : '(supprimée)')}</option>`).join('');
        list.insertAdjacentHTML('beforeend', `<div style="margin-top:14px; padding:14px; border:2px dashed var(--teal-2,#16B8A6); border-radius:12px; background:#F7FCFB;">
          <div style="font-size:14px; font-weight:700; color:#161C2C; margin-bottom:8px;">＋ Ajouter une opération manquante</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="field" style="margin:0;"><label>Opération</label><select id="ga-op"><option value="">— choisir —</option>${optOps}</select></div>
            <div class="field" style="margin:0;"><label>Démarre après</label><select id="ga-apres"><option value="">— dès le début (aucune) —</option>${optApres}</select></div>
          </div>
          <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="plan-note">L'opération est ajoutée « à planifier ». Absente de la liste ? Créez-la dans Temps standards &gt; Gérer les opérations.</span>
            <button class="btn primary" id="ga-add">Ajouter à la gamme</button></div></div>`);
        document.getElementById('ga-add').addEventListener('click', async (ev) => {
          const code = document.getElementById('ga-op').value;
          if (!code) { zoneMsg().innerHTML = '<div class="msg error">Choisissez l\'opération à ajouter.</div>'; return; }
          const ap = document.getElementById('ga-apres').value;
          ev.target.disabled = true; zoneMsg().innerHTML = '<div class="msg">Ajout…</div>';
          try {
            const r = await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, ajouter: [code], apres_sequence: ap ? Number(ap) : null }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast('Opération ajoutée à la gamme.'); chargerDonneesReelles(); ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
        });
      } catch (_) { /* catalogue indisponible : l'ajout n'est pas proposé */ }
      list.insertAdjacentHTML('afterbegin', `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 10px; margin-bottom:6px; border-radius:10px; background:var(--paper-raised-2,#F3F5FA); font-size:12.5px;">
        <span style="flex:1; min-width:200px;">Les opérations sont classées selon leurs dépendances (modèle de gamme et opérations en ligne).</span>
        <button class="btn" id="gamme-relier" style="padding:3px 10px;font-size:12px;" title="Refait toutes les dépendances de cet OF d'après le modèle de gamme et les couples en ligne">Recalculer les dépendances</button>
        <button class="btn" id="gamme-recaler" style="padding:3px 10px;font-size:12px;" title="Les créneaux « Journée » des étapes chiffrées sont ramenés à leur durée réelle (libère les personnes et machines)">Recaler les durées</button>
        <button class="btn" id="gamme-recaler-tout" style="padding:3px 10px;font-size:12px;" title="Même opération sur tous les OF">Recaler tous les OF</button></div>`);
      [['gamme-recaler', { of_id: ofUuid }, 'cet OF'], ['gamme-recaler-tout', {}, 'tous les OF']].forEach(([idb, corps, qui]) => {
        document.getElementById(idb).addEventListener('click', async (ev) => {
          if (!confirm(`Ramener les créneaux « Journée » de ${qui} à la durée réelle du chiffrage ?\nSeuls les créneaux planifiés à venir, sans heures, d'étapes chiffrées sont modifiés (machine et personnes conservées).`)) return;
          ev.target.disabled = true;
          try {
            const r = await fetch(`${API}/recaler-durees`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast(d.etapes_concernees ? `${d.etapes_concernees} étape(s) recalée(s) sur leur durée réelle.` : 'Rien à recaler (étapes non chiffrées ou déjà à leurs heures).');
            chargerDonneesReelles(); ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
        });
      });
      document.getElementById('gamme-relier').addEventListener('click', async (ev) => {
        if (!confirm('Recalculer toutes les dépendances de cet OF d\u2019après le modèle de gamme ?\nLes liens saisis à la main seront remplacés. Les créneaux déjà planifiés ne bougent pas.')) return;
        ev.target.disabled = true;
        try {
          const r = await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, recalculer_liens: true }) });
          const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
          toast((d.avertissements && d.avertissements[0]) || 'Dépendances recalculées.'); ouvrirModaleGamme(ofUuid, ofNumero);
        } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; ev.target.disabled = false; }
      });
      const possibles = gammes.filter(g => g.en_ligne && g.en_ligne.possible && g.statut === 'à planifier');
      if (possibles.length) {
        list.insertAdjacentHTML('afterbegin', `<div style="padding:8px 10px; margin-bottom:6px; border-radius:10px; background:var(--teal-50,#E6F6F3); font-size:12.5px; color:#161C2C;">
          <strong>En ligne</strong> : la machine démarre avec la précédente et sa production se déroule en même temps (même durée). <strong>Hors ligne</strong> : l'opération se fait plus tard, après la fin de la précédente, avec son propre temps.
          <span style="display:inline-flex; gap:6px; margin-left:8px;"><button class="btn" style="padding:3px 9px;font-size:12px;" data-gmode-tout="en_ligne">Tout en ligne</button><button class="btn" style="padding:3px 9px;font-size:12px;" data-gmode-tout="hors_ligne">Tout hors ligne</button></span></div>`);
        const appliquerMode = async (corps) => {
          try {
            const r = await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, mode_ligne: corps }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast('Mode de fonctionnement enregistré.'); ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
        };
        list.querySelectorAll('[data-gmode]').forEach(sel => sel.addEventListener('change', () => appliquerMode({ gamme_id: sel.dataset.gmode, mode: sel.value })));
        list.querySelectorAll('[data-gmode-tout]').forEach(b => b.addEventListener('click', () => appliquerMode({ mode: b.dataset.gmodeTout })));
      }
      list.querySelectorAll('[data-gact]').forEach(b => b.addEventListener('click', async () => {
        const id = b.dataset.id, act = b.dataset.gact;
        if (act === 'voir') { ouvrirDetailEtape(id, ofUuid, ofNumero); return; }
        if (act === 'planifier' || act === 'replanifier') {
          if (act === 'replanifier' && !confirm('« Modifier » replanifie cette étape : son planning actuel est retiré, puis vous choisissez de nouvelles informations.\n\nPour seulement consulter ce qui est planifié, utilisez « Voir ».\n\nContinuer ?')) return;
          if (act === 'replanifier') {
            // déjà planifiée : on la déplanifie d'abord, puis on rouvre l'affectation sur cette étape
            try {
              const r = await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gamme_ids: [id] }) });
              const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
              chargerDonneesReelles();
            } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; return; }
          }
          ouvrirModaleAffectation({ ofUuid, gammeId: id, retour: () => ouvrirModaleGamme(ofUuid, ofNumero) }); return;
        }
        if (act === 'deplanifier' || act === 'supprimer') {
          if (act === 'supprimer' && !confirm(`Supprimer l'opération « ${b.dataset.nom} » de l'OF ${ofNumero} ?`)) return;
          if (act === 'deplanifier' && !confirm('Retirer cette étape du planning ? Elle repassera « à planifier ».')) return;
          b.disabled = true; zoneMsg().innerHTML = '<div class="msg">En cours…</div>';
          try {
            const r = act === 'supprimer'
              ? await fetch(`${API}/modifier-gamme`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, supprimer: [id] }) })
              : await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gamme_ids: [id] }) });
            const d = await lireJson(r); if (!r.ok) throw new Error(d.error || 'Erreur serveur (HTTP ' + r.status + ')');
            toast(act === 'supprimer' ? 'Opération supprimée.' : 'Étape déplanifiée.');
            chargerDonneesReelles();
            ouvrirModaleGamme(ofUuid, ofNumero);
          } catch (e) { zoneMsg().innerHTML = `<div class="msg error">${esc(e.message)}</div>`; b.disabled = false; }
        }
      }));
    } catch (e) {
      document.getElementById('gamme-list').innerHTML = `Erreur : ${esc(e.message)}`;
    }
  }

  // Fiche personnel : ajout d'une personne ou modification de sa fiche (identité, poste, contrat, compétences, machines).
  async function ouvrirModalePersonne(personne) {
    const creation = !personne;
    let refs, f = {}, ops = [], machs = [];
    afficherModale(`<h3>${creation ? 'Ajouter une personne' : 'Fiche — ' + esc(personne.name)}</h3><div class="empty">Chargement…</div>`);
    try {
      refs = await getReferentiels();
      if (!creation) {
        const r = await fetch(`${API}/gerer-personnel?id=${personne.id}`);
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
        f = d; ops = d.operation_codes || []; machs = d.machine_ids || [];
      }
    } catch (e) {
      afficherModale(`<h3>Personnel</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`);

    }

    const champ = (id, label, k, type, extra) => `<div class="field" style="margin:0;"><label>${label}</label><input id="${id}" type="${type || 'text'}" value="${v(k)}" ${extra || ''}></div>`;
    const select = (id, label, k, options) => `<div class="field" style="margin:0;"><label>${label}</label><select id="${id}">${options.map(([val, txt]) => `<option value="${esc(val)}" ${String(f[k] || '') === val ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select></div>`;
    const grille = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;margin-bottom:10px;';
    const titreSection = (t) => `<div class="produit-titre" style="margin:12px 0 6px;">${t}</div>`;
    afficherModale(`
      <h3>${creation ? 'Ajouter une personne' : 'Fiche — ' + esc(personne.name)}</h3>

        ${champ('pf-prenom', 'Prénom *', 'prenom', 'text', 'required autocomplete="off"')}
        ${champ('pf-nomf', 'Nom de famille', 'nom_famille')}
        ${champ('pf-nom', 'Nom affiché dans le planning', 'nom', 'text', 'placeholder="par défaut : Prénom Nom"')}
        ${champ('pf-matricule', 'Matricule', 'matricule')}
      </div>
      ${titreSection('Poste et contrat')}
      <div style="${grille}">
        ${champ('pf-poste', 'Poste / fonction', 'poste', 'text', 'placeholder="ex. Conducteur relieuse"')}
        ${select('pf-role', 'Rôle', 'role_type', [['opérateur', 'Opérateur'], ['encadrement', 'Encadrement']])}
        ${champ('pf-equipe', 'Équipe / service', 'equipe', 'text', 'placeholder="ex. Équipe A, Façonnage"')}
        ${select('pf-contrat', 'Type de contrat', 'type_contrat', [['', '—'], ['CDI', 'CDI'], ['CDD', 'CDD'], ['Intérim', 'Intérim'], ['Apprenti', 'Apprenti'], ['Stagiaire', 'Stagiaire']])}
        ${champ('pf-heures', 'Heures par semaine', 'heures_semaine', 'number', 'min="0" max="60" step="0.5" placeholder="ex. 35"')}
        ${champ('pf-cout', 'Coût horaire chargé (€/h)', 'cout_horaire', 'number', 'min="0" step="0.01"')}
        ${champ('pf-entree', 'Date d\'entrée', 'date_entree', 'date')}
      </div>
      ${titreSection('Coordonnées')}
      <div style="${grille}">
        ${champ('pf-tel', 'Téléphone', 'telephone', 'tel')}

    let nomManuel = !creation;

        telephone: $('pf-tel').value, email: $('pf-email').value, habilitations: $('pf-hab').value, notes: $('pf-notes').value,
        operation_codes: Array.from(document.querySelectorAll('#pf-ops input:checked')).map(i => i.value),
        machine_ids: Array.from(document.querySelectorAll('#pf-machs input:checked')).map(i => i.value),
      };
      if (!corps.prenom.trim()) { msg.innerHTML = '<div class="msg error">Le prénom est obligatoire.</div>'; return; }
      if (!creation) corps.id = personne.id;
      $('m-submit').disabled = true; msg.innerHTML = '<div class="msg">Enregistrement…</div>';
      try {
        const r = await fetch(`${API}/gerer-personnel`, { method: creation ? 'POST' : 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `Erreur serveur (HTTP ${r.status})`);
        toast(creation ? `${d.nom || corps.prenom} ajouté(e) à l'équipe.` : 'Fiche enregistrée.');
        apres();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; $('m-submit').disabled = false; }
    });
    const retirer = $('pf-retirer');
    if (retirer) retirer.addEventListener('click', async () => {
      if (!window.confirm(`Retirer ${personne.name} de l'équipe ? Sa fiche et son historique de planning sont conservés, mais il/elle ne sera plus proposé(e) pour les nouvelles affectations.`)) return;
      try {
        const r = await fetch(`${API}/gerer-personnel?id=${personne.id}`, { method: 'DELETE' });
        const d = await lireJson(r); if (!r.ok) throw new Error(d.error || `Erreur serveur (HTTP ${r.status})`);
        toast(`${personne.name} retiré(e) de l'équipe.`); apres();
      } catch (e) { $('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
  }

        <table>

            <button class="charge-btn" data-id="${p.id}" title="Voir l'occupation de la semaine" style="all:unset; cursor:pointer; display:block; width:100%;">
              <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-500);"><span>${p.charge}%</span><span style="color:var(--teal,#0F766E); font-weight:600;">Détail ›</span></div>
              <div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${p.charge}%"></div></div>
            </button>
          </td>
          <td style="white-space:nowrap;"><button class="btn fiche-pers" data-id="${p.id}">Fiche</button> <button class="btn edit-pers" data-id="${p.id}">Compétences</button></td>
        </tr>

    wrap.querySelector('#pers-ajout').addEventListener('click', () => ouvrirModalePersonne(null));

    tbody.querySelectorAll('.fiche-pers').forEach(btn => btn.addEventListener('click', () => ouvrirModalePersonne(state.personnel.find(x => x.id === btn.dataset.id))));
    tbody.querySelectorAll('.edit-pers').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = state.personnel.find(x => x.id === btn.dataset.id);
        ouvrirModaleCompetences(p);
      });
    });
    tbody.querySelectorAll('[data-action="dispo"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = state.personnel.find(x => x.id === btn.dataset.id);
        ouvrirModaleDisponibilite(p);
      });
    });
    return wrap;
  }

  // ---------- Occupation hebdomadaire d'une personne : affectations, heures, absences ----------
  const minutesHM = (t) => { const [h, m] = String(t).split(':'); return Number(h) * 60 + Number(m); };
  const fmtDuree = (min) => { const h = Math.floor(min / 60), m = Math.round(min % 60); return m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`; };
  // Minutes de travail effectif d'un créneau (pause 12h00-12h30 déduite) ; sans heures : journée entière (8 h).
  function minutesCreneau(c) {
    if (!c.heure_debut || !c.heure_fin) return 480;
    const d = minutesHM(c.heure_debut), f = minutesHM(c.heure_fin);
    return Math.max(0, f - d - Math.max(0, Math.min(f, 750) - Math.max(d, 720)));
  }
  // Occupation d'une personne sur une liste de jours (isos), à partir de données de planning (semaine affichée ou plage plus large).
  async function occupationDe(persId, data, isos) {
    const b = data || state.brut; if (!b) return null;
    isos = isos || b.jours;
    const refs = await getReferentiels();
    const nomOp = Object.fromEntries(refs.operations.map(o => [o.id, o.nom]));
    const nomMach = Object.fromEntries(b.machines.map(m => [m.id, m.nom]));
    const ordre = Object.fromEntries(b.ordres.map(o => [o.id, o]));
    const persObj = state.personnel.find(x => x.id === persId) || { comp: [] };
    const compSet = new Set((persObj.comp || []).map(x => String(x).toLowerCase()));
    const parDate = {};
    b.planning.forEach(c => { if ((c.personnel_ids || []).includes(persId)) (parDate[c.date] = parDate[c.date] || []).push(c); });
    const dispoDate = {};
    b.dispo.forEach(d => { if (d.personnel_id === persId) dispoDate[d.date] = d; });
    const jours = isos.map(iso => {
      const dispo = dispoDate[iso] || null;
      const affs = (parDate[iso] || []).slice()
        .sort((x, y) => String(x.heure_debut || '').localeCompare(String(y.heure_debut || '')))
        .map(c => {
          const o = ordre[c.of_id] || {};
          const opN = nomOp[c.operation_id] || '';
          const competent = !opN ? true : compSet.has(opN.toLowerCase());
          return {
            id: c.id, iso, competent, tache: c.gamme_operatoire_id || null, of_id: c.of_id || null, operation_id: c.operation_id || null, machine_id: c.machine_id || null, sansOf: !c.of_id,
            debut: c.heure_debut ? String(c.heure_debut).slice(0, 5) : null, fin: c.heure_fin ? String(c.heure_fin).slice(0, 5) : null,
            of: o.numero || '—', titre: o.titres ? o.titres.nom : '', client: o.titres ? (o.titres.client || '') : '', delai: o.delai || '',
            operation: nomOp[c.operation_id] || c.phase || '—', phase: nomOp[c.operation_id] ? (c.phase || '') : '', machine: c.machine_id ? (nomMach[c.machine_id] || '?') : 'Travail manuel',
            statut: c.statut || '', min: minutesCreneau(c),
          };
        });
      const indispo = !!(dispo && dispo.statut !== 'disponible');
      affs.forEach((a, i) => { a.chevauche = affs.some((o, k) => k !== i && a.debut && o.debut && a.debut < o.fin && o.debut < a.fin); });
      return { iso, dispo, indispo, affs, min: affs.reduce((t, a) => t + a.min, 0) };
    });
    return { jours, refs };
  }
