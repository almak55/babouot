  function renderMachines(){
    const wrap = el(`
      <div class="panel">
        <div class="panel-head"><h2>Parc machine</h2><button class="btn primary" id="new-machine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvelle machine</button></div>
        <table>
          <thead><tr><th>Nom</th><th>Code</th><th>Opération principale</th><th>État</th><th></th></tr></thead>
          <tbody id="machines-tbody"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
    `);

    chargerListeMachines(wrap);

    wrap.querySelector('#new-machine').addEventListener('click', () => ouvrirModaleMachine(null));
    return wrap;
  }

  async function chargerListeMachines(wrap) {
    const tbody = wrap.querySelector('#machines-tbody');
    try {
      const res = await fetch(`${API}/gerer-machines`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const machines = await res.json();
      tbody.innerHTML = '';
      machines.forEach(m => {
        tbody.appendChild(el(`
          <tr>
            <td>${m.nom}</td>
            <td class="mono">${m.code}</td>
            <td>${(m.operations && m.operations.length) ? m.operations.map(o=>`<span class="tag ok" style="margin-right:4px;">${o.nom}</span>`).join('') : '<span style="color:var(--ink-500)">— aucune —</span>'}</td>
            <td>${m.actif ? tagEtatMachine(m.etat) : '<span class="tag danger">Inactive</span>'}</td>
            <td style="white-space:nowrap;">
              <button class="btn interv-machine" data-id="${m.id}" title="Pannes, maintenance, retours constructeur">Interventions</button>
              <button class="btn edit-machine" data-id="${m.id}">Modifier</button>
              <button class="btn btn-icon-danger delete-machine" data-id="${m.id}" title="Supprimer cette machine" aria-label="Supprimer ${m.nom}">${svgIcon('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>')}</button>
            </td>
          </tr>
        `));
      });
      tbody.querySelectorAll('.interv-machine').forEach(btn => {
        btn.addEventListener('click', () => { const m = machines.find(x => x.id === btn.dataset.id); ouvrirModaleInterventions({ id: m.id, nom: m.nom }, () => chargerListeMachines(wrap)); });
      });
      tbody.querySelectorAll('.edit-machine').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = machines.find(x => x.id === btn.dataset.id);
          ouvrirModaleMachine(m);
        });
      });
      tbody.querySelectorAll('.delete-machine').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = machines.find(x => x.id === btn.dataset.id);
          ouvrirModaleSuppressionMachine(m);
        });
      });
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">Backend indisponible — impossible de charger le parc machine réel. (${e.message})</td></tr>`;
    }
  }


  // ---------- États et interventions des machines ----------
  const jjmmCourt = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
  // Intervention bloquante (ou en marche dégradée) qui touche ce jour pour cette machine, d'après les données du planning.
  function interventionDuJour(machineUuid, iso) {
    if (!machineUuid) return null;
    const l = (state.interventions || []).filter(x => x.machine_id === machineUuid && x.date_debut <= iso && (!x.date_fin || x.date_fin >= iso));
    return l.find(x => x.bloquant) || null;
  }
  const ETAT_TAG = { hors_service: ['danger', '⛔ Hors service'], maintenance: ['warn', '🔧 Intervention en cours'], degradee: ['warn', '⚠ Marche dégradée'], programmee: ['', '📅 Intervention programmée'], ok: ['ok', '✔ Opérationnelle'] };
  function tagEtatMachine(e) {
    if (!e) return '<span class="tag ok">Opérationnelle</span>';
    const [cl, txt] = ETAT_TAG[e.etat] || ETAT_TAG.ok;
    const detail = e.etat === 'programmee' && e.prochaine ? ` le ${jjmmCourt(e.prochaine.date_debut)}` : (e.jusqu_au ? ` jusqu'au ${jjmmCourt(e.jusqu_au)}` : (e.etat !== 'ok' && e.etat !== 'programmee' ? ' (fin non connue)' : ''));
    return `<span class="tag ${cl}">${txt}${detail}</span>${e.etat !== 'programmee' && e.prochaine ? `<div class="plan-note">Prochaine : ${esc(e.prochaine.type_libelle)} le ${jjmmCourt(e.prochaine.date_debut)}</div>` : ''}${e.intervention && e.intervention.description ? `<div class="plan-note">${esc(e.intervention.description)}</div>` : ''}`;
  }

  async function ouvrirModaleInterventions(machine, apres) {
    afficherModale(`
      <h3>État et interventions — ${esc(machine.nom)}</h3>
      <div id="iv-etat" style="margin-bottom:8px;"><span class="plan-note">Chargement…</span></div>
      <details id="iv-form" class="panel" style="padding:10px 12px;margin:0 0 10px;" open><summary style="cursor:pointer;font-weight:600;">Déclarer une intervention</summary>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px;">
          <div class="field"><label>Nature</label><select id="iv-type"></select></div>
          <div class="field"><label>Début</label><input id="iv-d1" type="date" value="${dateLocaleIso()}"></div>
          <div class="field"><label>Heure de début (facultatif)</label><input id="iv-h1" type="time"></div>
          <div class="field"><label>Fin prévue (vide = inconnue)</label><input id="iv-d2" type="date"></div>
          <div class="field"><label>Heure de fin (facultatif)</label><input id="iv-h2" type="time"></div>
          <div class="field"><label>Intervenant (technicien, société…)</label><input id="iv-qui" type="text" placeholder="ex. SAV Kolbus"></div>
        </div>
        <div class="field" style="margin-top:6px;"><label>Description / cause</label><input id="iv-desc" type="text" placeholder="ex. courroie cassée, changement de rouleau…"></div>
        <label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px;"><input type="checkbox" id="iv-bloq" checked> La machine ne peut pas être utilisée pendant l'intervention <span class="plan-note">(décocher = marche dégradée : elle reste affectable)</span></label>
        <div id="iv-msg"></div>
        <div style="text-align:right;"><button class="btn primary" id="iv-ajout" type="button">Enregistrer l'intervention</button></div>
      </details>
      <div id="iv-impacts"></div>
      <div id="iv-liste"></div>
      <div class="actions"><button class="btn primary" id="m-cancel">Fermer</button></div>
    `, 'large');
    document.getElementById('m-cancel').addEventListener('click', () => { fermerModale(); if (apres) apres(); });
    const API_I = `${API}/gerer-interventions`;
    let types = {};
    const ETAT_IV = { 'programmée': ['', '📅 Programmée'], 'en cours': ['warn', '🔧 En cours'], 'terminée': ['ok', '✔ Terminée'] };
    async function charger() {
      const res = await fetch(`${API_I}?machine_id=${machine.id}`); const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status));
      types = d.types;
      const sel = document.getElementById('iv-type'); if (!sel.options.length) sel.innerHTML = Object.entries(types).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
      document.getElementById('iv-etat').innerHTML = `<strong>État actuel :</strong> ${tagEtatMachine(d.etat)}${d.machine.actif ? '' : ' <span class="tag danger">Machine désactivée</span>'}`;
      const l = d.interventions;
      document.getElementById('iv-liste').innerHTML = l.length ? `<h4 style="margin:6px 0;">Historique et interventions à venir</h4><table class="sp-table"><thead><tr><th>Nature</th><th>Période</th><th>État</th><th></th></tr></thead><tbody>${l.map(i => `<tr data-id="${i.id}">
          <td><strong>${esc(i.type_libelle)}</strong>${i.bloquant ? '' : ' <span class="plan-note">(marche dégradée)</span>'}<br><span class="plan-note">${esc(i.description || '')}${i.intervenant ? ' · ' + esc(i.intervenant) : ''}</span></td>
          <td>${dateCourte(i.date_debut)}${i.heure_debut ? ' ' + i.heure_debut : ''} → ${i.date_fin ? dateCourte(i.date_fin) + (i.heure_fin ? ' ' + i.heure_fin : '') : '<em>fin non connue</em>'}${i.date_fin_prevue && i.date_fin && i.date_fin > i.date_fin_prevue ? `<div class="plan-note" style="color:var(--danger-text);">prévu le ${dateCourte(i.date_fin_prevue)}</div>` : ''}</td>
          <td><span class="tag ${ETAT_IV[i.etat][0]}">${ETAT_IV[i.etat][1]}</span></td>
          <td style="white-space:nowrap;">${i.etat === 'terminée' ? '' : `<input class="iv-fin" type="date" value="${i.date_fin || ''}" title="Nouvelle date de fin prévue" style="width:130px;"> <button class="btn iv-datefin" type="button" title="Enregistrer la nouvelle date de fin" style="padding:2px 8px;">OK</button> <button class="btn iv-term" type="button" data-prog="${i.etat === 'programmée' ? 1 : 0}" style="padding:2px 8px;">${i.etat === 'programmée' ? 'Annuler' : 'Terminer'}</button> `}<button class="btn btn-icon-danger iv-del" type="button" title="Supprimer cette ligne" style="padding:2px 8px;">✕</button></td></tr>`).join('')}</tbody></table>` : '<div class="plan-note">Aucune intervention enregistrée pour cette machine.</div>';
    }
    function afficherImpacts(impacts) {
      const z = document.getElementById('iv-impacts');
      if (!impacts || !impacts.length) { z.innerHTML = ''; return; }
      const gids = [...new Set(impacts.map(x => x.gamme_id).filter(Boolean))];
      z.innerHTML = `<div class="msg error" style="margin:0 0 10px;"><strong>⚠ ${impacts.length} créneau(x) déjà planifié(s) sur cette machine pendant l'intervention :</strong>
        <ul style="margin:6px 0 8px 18px;">${impacts.slice(0, 12).map(x => `<li>${dateCourte(x.date)}${x.heure_debut ? ' ' + x.heure_debut + '–' + x.heure_fin : ''} — <strong>${esc(x.of)}</strong> ${esc(x.titre)} · ${esc(x.operation)}</li>`).join('')}${impacts.length > 12 ? `<li>… et ${impacts.length - 12} autre(s)</li>` : ''}</ul>
        <button class="btn" id="iv-liberer" type="button">Libérer ces tâches pour les replanifier</button> <span class="plan-note">Elles repassent « à planifier » ; replanifiez-les sur une autre machine ou après l'intervention (les étapes déjà commencées sont conservées).</span><div id="iv-lib-msg"></div></div>`;
      document.getElementById('iv-liberer').addEventListener('click', async () => {
        const m = document.getElementById('iv-lib-msg'); m.textContent = 'Libération…';
        try {
          const res = await fetch(`${API}/deplanifier-etape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ gamme_ids: gids }) }); const d = await lireJson(res);
          if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status));
          m.innerHTML = `<div class="plan-note" style="color:var(--accent-teal);">${d.deplanifiees.length} étape(s) libérée(s)${d.conservees && d.conservees.length ? ' · ' + d.conservees.length + ' conservée(s) (déjà commencées)' : ''}.</div>`;
          chargerDonneesReelles();
        } catch (e) { m.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      });
    }
    async function appeler(methode, corps, qs) {
      const res = await fetch(`${API_I}${qs || ''}`, { method: methode, headers: { 'Content-Type': 'application/json' }, body: corps ? JSON.stringify(corps) : undefined });
      const d = await lireJson(res); if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status)); return d;
    }
    document.getElementById('iv-ajout').addEventListener('click', async () => {
      const msg = document.getElementById('iv-msg');
      try {
        const d = await appeler('POST', { machine_id: machine.id, type: document.getElementById('iv-type').value, date_debut: document.getElementById('iv-d1').value, heure_debut: document.getElementById('iv-h1').value, date_fin: document.getElementById('iv-d2').value, heure_fin: document.getElementById('iv-h2').value, bloquant: document.getElementById('iv-bloq').checked, description: document.getElementById('iv-desc').value, intervenant: document.getElementById('iv-qui').value });
        msg.innerHTML = '<div class="plan-note" style="color:var(--accent-teal);">Intervention enregistrée.</div>';
        document.getElementById('iv-desc').value = ''; document.getElementById('iv-qui').value = ''; document.getElementById('iv-d2').value = '';
        afficherImpacts(d.impacts); await charger(); chargerDonneesReelles();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    document.getElementById('iv-liste').addEventListener('click', async (ev) => {
      const tr = ev.target.closest('tr[data-id]'); if (!tr) return; const id = tr.dataset.id;
      try {
        if (ev.target.closest('.iv-term')) {
          if (ev.target.closest('.iv-term').dataset.prog === '1') { if (!confirm('Annuler cette intervention programmée ?')) return; await appeler('DELETE', null, `?id=${id}`); }
          else await appeler('PUT', { id, action: 'terminer' });
          afficherImpacts([]); }
        else if (ev.target.closest('.iv-datefin')) { const d = await appeler('PUT', { id, date_fin: tr.querySelector('.iv-fin').value }); afficherImpacts(d.impacts); }
        else if (ev.target.closest('.iv-del')) { if (!confirm('Supprimer cette ligne (erreur de saisie) ? Pour clore une intervention, utilisez plutôt « Terminer ».')) return; await appeler('DELETE', null, `?id=${id}`); }
        else return;
        await charger(); chargerDonneesReelles();
      } catch (e) { document.getElementById('iv-liste').insertAdjacentHTML('afterbegin', `<div class="msg error">${esc(e.message)}</div>`); }
    });
    try { await charger(); } catch (e) { document.getElementById('iv-etat').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
  }

  function ouvrirModaleSuppressionMachine(machine) {
    afficherModale(`
      <h3>Supprimer ${machine.nom} ?</h3>
      <p style="font-size:13px; color:var(--ink-700); margin:0;">Cette action est <strong>définitive</strong>. La machine sera retirée du parc, de la liste des opérations qu'elle réalise et des compétences machine du personnel.</p>
      <div id="m-msg"></div>
      <div class="actions">
        <button class="btn" id="m-cancel">Annuler</button>
        <button class="btn danger-btn" id="m-confirm-delete">Supprimer</button>
      </div>
    `);
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-confirm-delete').addEventListener('click', () => supprimerMachine(machine, false));
  }

  async function supprimerMachine(machine, force) {
    const msg = document.getElementById('m-msg');
    msg.innerHTML = `<div class="msg">Suppression en cours…</div>`;
    try {
      const res = await fetch(`${API}/gerer-machines?id=${machine.id}${force ? '&force=true' : ''}`, { method: 'DELETE' });
      const data = await res.json();

      if (res.status === 409 && data.utilisee) {
        // Machine encore utilisée : proposer la désactivation, ou la suppression forcée.
        const { affectations, etapes_gamme } = data.utilisee;
        afficherModale(`
          <h3>${machine.nom} est encore utilisée</h3>
          <p style="font-size:13px; color:var(--ink-700); margin:0 0 8px;">
            Elle est référencée par <strong>${affectations} affectation(s) planning</strong>
            et <strong>${etapes_gamme} étape(s) de gamme</strong>.
          </p>
          <p style="font-size:13px; color:var(--ink-700); margin:0 0 4px;"><strong>Désactiver</strong> la machine la retire des plannings sans rien perdre — c'est l'option la plus sûre.</p>
          <p style="font-size:13px; color:var(--ink-700); margin:0;"><strong>Supprimer quand même</strong> retire ses affectations du planning ; les étapes de gamme concernées repasseront « à planifier ».</p>
          <div id="m-msg"></div>
          <div class="actions">
            <button class="btn" id="m-cancel">Annuler</button>
            <button class="btn" id="m-desactiver">Désactiver à la place</button>
            <button class="btn danger-btn" id="m-force-delete">Supprimer quand même</button>
          </div>
        `);
        document.getElementById('m-cancel').addEventListener('click', fermerModale);
        document.getElementById('m-force-delete').addEventListener('click', () => supprimerMachine(machine, true));
        document.getElementById('m-desactiver').addEventListener('click', async () => {
          const m2 = document.getElementById('m-msg');
          try {
            const r = await fetch(`${API}/gerer-machines`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: machine.id, actif: false }),
            });
            if (!r.ok) throw new Error((await r.json()).error || 'Erreur inconnue');
            toast(`${machine.nom} désactivée.`);
            fermerModale(); chargerDonneesReelles();
          } catch (e) { m2.innerHTML = `<div class="msg error">${e.message}</div>`; }
        });
        return;
      }

      if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
      const suffixe = data.affectations_retirees > 0 ? ` (${data.affectations_retirees} affectation(s) retirée(s))` : '';
      toast(`${data.nom} supprimée${suffixe}.`);
      fermerModale(); chargerDonneesReelles();
    } catch (e) {
      msg.innerHTML = `<div class="msg error">${e.message}</div>`;
    }
  }

      ${estEdition ? `<div class="field" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;"><label><strong>1) Conducteurs de la machine</strong> <span class="plan-note">— le 1er est le conducteur principal ; les suivants (secondaires) le remplacent s'il n'est pas disponible</span></label>
        <div id="m-cond"></div>
        <div style="display:flex;gap:8px;margin-top:6px;"><select id="m-cond-add" style="flex:1;"></select><button class="btn" type="button" id="m-cond-btn">Ajouter un conducteur</button></div></div>
      <div class="field" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;"><label><strong>2) Aides potentiels</strong> <span class="plan-note">— personnes qui peuvent assister cette machine ; le planning en choisit parmi elles, selon leur disponibilité</span></label>
        <div id="m-aides"></div>
        <div style="display:flex;gap:8px;margin-top:6px;"><select id="m-aide-add" style="flex:1;"></select><button class="btn" type="button" id="m-aide-btn">Ajouter une aide</button></div></div>` : ''}
      ${estEdition ? `<div class="field"><label><input type="checkbox" id="m-actif" ${machine.actif ? 'checked' : ''}> Machine active</label></div>
      <div class="field"><label>Temps de production de cette machine <span class="plan-note">— mise en route, réglage, cadence, nettoyage (par type de production)</span></label><button class="btn" type="button" id="m-profils">Configurer les temps de production…</button></div>` : ''}
      <div class="field"><label>Notes</label><input id="m-notes" value="${machine && machine.notes ? machine.notes : ''}" placeholder="optionnel"></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">${estEdition ? 'Enregistrer' : 'Créer'}</button></div>
    `);

    if (estEdition) document.getElementById('m-profils').addEventListener('click', () => ouvrirProfilsMachine(machine, refs));
    // Conducteurs : liste ordonnée (titulaire en premier)
    let conds = estEdition ? (machine.conducteurs || []).map(c => ({ id: c.personnel_id, nom: c.nom })) : [];
    const condsAvant = conds.map(c => c.id).join(',');
    let aidesM = estEdition ? (machine.aides || []).map(c => ({ id: c.personnel_id, nom: c.nom })) : [];
    const aidesAvant = aidesM.map(c => c.id).sort().join(',');
    const dessinerConds = () => {
      const zone = document.getElementById('m-cond'); if (!zone) return;
      zone.innerHTML = conds.length ? conds.map((c, i) => `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);">
          <span style="width:84px;font-size:12px;color:var(--muted);">${i === 0 ? 'Titulaire' : 'Suppléant ' + i}</span><span style="flex:1;">${esc(c.nom)}</span>
          <button class="btn" type="button" data-cond-haut="${i}" ${i === 0 ? 'disabled' : ''} style="padding:1px 8px;">▲</button>
          <button class="btn" type="button" data-cond-bas="${i}" ${i === conds.length - 1 ? 'disabled' : ''} style="padding:1px 8px;">▼</button>
          <button class="btn" type="button" data-cond-ret="${i}" style="padding:1px 8px;color:var(--danger,#c0392b);">✕</button></div>`).join('')
        : '<div class="plan-note">Aucun conducteur défini : l\'affectation automatique ne pourra pas proposer de conducteur.</div>';
      zone.querySelectorAll('[data-cond-haut]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.condHaut; [conds[i - 1], conds[i]] = [conds[i], conds[i - 1]]; dessinerConds(); }));
      zone.querySelectorAll('[data-cond-bas]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.condBas; [conds[i + 1], conds[i]] = [conds[i], conds[i + 1]]; dessinerConds(); }));
      zone.querySelectorAll('[data-cond-ret]').forEach(b => b.addEventListener('click', () => { conds.splice(+b.dataset.condRet, 1); dessinerConds(); }));
      const sel = document.getElementById('m-cond-add');
      const optionsPers = (exclus) => '<option value="">— choisir une personne —</option>' + refs.personnel.filter(p => !exclus.some(c => c.id === p.id)).map(p => `<option value="${p.id}">${esc(p.nom)}${p.poste ? ' — ' + esc(p.poste) : ''}</option>`).join('');
      sel.innerHTML = optionsPers([...conds, ...aidesM]);
      const za = document.getElementById('m-aides');
      if (za) {
        za.innerHTML = aidesM.length ? aidesM.map((c, i) => `<div style="display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);"><span style="flex:1;">${esc(c.nom)}</span><button class="btn" type="button" data-aide-ret="${i}" style="padding:1px 8px;color:var(--danger,#c0392b);">✕</button></div>`).join('')
          : '<div class="plan-note">Aucune aide définie : le planning ne pourra pas proposer d\'aides pour cette machine.</div>';
        za.querySelectorAll('[data-aide-ret]').forEach(b => b.addEventListener('click', () => { aidesM.splice(+b.dataset.aideRet, 1); dessinerConds(); }));
        document.getElementById('m-aide-add').innerHTML = optionsPers([...conds, ...aidesM]);
      }
    };
    if (estEdition) {
      dessinerConds();
      document.getElementById('m-aide-btn').addEventListener('click', () => {
        const sel = document.getElementById('m-aide-add'); if (!sel.value) return;
        const p = refs.personnel.find(x => x.id === sel.value); if (p) aidesM.push({ id: p.id, nom: p.nom }); dessinerConds();
      });
      document.getElementById('m-cond-btn').addEventListener('click', () => {
        const sel = document.getElementById('m-cond-add'); if (!sel.value) return;
        const p = refs.personnel.find(x => x.id === sel.value); if (p) conds.push({ id: p.id, nom: p.nom }); dessinerConds();
      });
    }
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-submit').addEventListener('click', async () => {
      const code = document.getElementById('m-code').value.trim();
      const nom = document.getElementById('m-nom').value.trim();
      const operation_codes = Array.from(document.querySelectorAll('.modal .op-list input:checked')).map(i => i.value);
      const notes = document.getElementById('m-notes').value.trim();
      const msg = document.getElementById('m-msg');

      if (!code || !nom) {
        msg.innerHTML = `<div class="msg error">Code et nom sont requis.</div>`;
        return;
      }
      msg.innerHTML = `<div class="msg">Enregistrement en cours…</div>`;
      try {
        const nbPers = Math.max(1, parseInt(document.getElementById('m-nbpers').value, 10) || 1);
        const payload = estEdition
          ? { id: machine.id, code, nom, operation_codes, notes, actif: document.getElementById('m-actif').checked }
          : { code, nom, operation_codes, notes };
        if (nbPers !== (estEdition ? (machine.nb_personnes || 1) : 1)) payload.nb_personnes = nbPers;
        if (estEdition && (conds.map(c => c.id).join(',') !== condsAvant || aidesM.map(c => c.id).sort().join(',') !== aidesAvant)) { payload.conducteurs = conds.map(c => c.id); payload.aides = aidesM.map(c => c.id); }
        const res = await fetch(`${API}/gerer-machines`, {
          method: estEdition ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        msg.innerHTML = `<div class="msg ok">Enregistré.</div>`;
        toast(estEdition ? 'Machine mise à jour.' : 'Machine créée.');
        fermerModale(); render();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${e.message}</div>`;
      }
    });
  }


  // ---------- Profils de temps d'une machine (par type de production) ----------
  // Un profil = mise en route + réglage + roulage (cadence en ex./h) + nettoyage.
  // Le chiffrage l'applique automatiquement : MER + réglage + quantité ÷ cadence + nettoyage.
  async function ouvrirProfilsMachine(machine, refs) {
    const codes = (machine.operations || []).map(o => o.code);
    const ops = refs.operations.filter(o => codes.includes(o.code));
    let donnees;
    const charger = async () => {
      const res = await fetch(`${API}/profils-machine?machine_id=${machine.id}`);
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
      return d;
    };
    try { donnees = await charger(); }
    catch (e) {
      afficherModale(`<h3>Temps de production — ${esc(machine.nom)}</h3><div class="msg error">${esc(e.message)}${/type_production|types_production|relation/i.test(e.message) ? ' — exécutez d\'abord la migration 23 dans Supabase.' : ''}</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }
    if (!ops.length) {
      afficherModale(`<h3>Temps de production — ${esc(machine.nom)}</h3><div class="msg">Cochez d'abord au moins une opération pour cette machine (et enregistrez), puis revenez ici.</div><div class="actions"><button class="btn" id="m-close">Fermer</button></div>`);
      document.getElementById('m-close').addEventListener('click', fermerModale);
      return;
    }
    const nomType = (c) => c ? ((donnees.types.find(t => t.code === c) || { libelle: c }).libelle) : 'Tous types';
    const nbm = (v) => (v === null || v === undefined ? '—' : `${v} min`);
    const dessiner = () => {
      const lignes = donnees.profils.map((p, i) => `
        <div class="profil-ligne"><div><strong>${esc(p.operation)}</strong> · ${esc(nomType(p.type_production))}<br>
          ${p.mutualiser ? '<span class="tag ok" title="Une seule mise en route et un seul nettoyage par journée">1 MER / 1 nettoyage par jour</span> ' : ''}<span class="plan-note">mise en route ${nbm(p.mise_en_route_min)} · réglage ${nbm(p.reglage_min)}${p.reglage_fer_min ? ' + ' + nbm(p.reglage_fer_min) + '/fer' : ''} · roulage ${p.cadence_par_h ? p.cadence_par_h + ' ' + (p.unite_cadence || 'ex.') + '/h' : '—'}${p.quantite_formule ? ' (sur ' + esc(p.quantite_formule) + ')' : ''} · nettoyage ${nbm(p.nettoyage_min)}</span></div>
          <span><button class="btn" data-modif="${i}">Modifier</button> <button class="btn" data-suppr="${i}">Supprimer</button></span></div>`).join('');
      $('pf-liste').innerHTML = lignes || '<div class="empty">Aucun profil enregistré pour cette machine.</div>';
      $('pf-liste').querySelectorAll('[data-modif]').forEach(b => b.addEventListener('click', () => {
        const p = donnees.profils[Number(b.dataset.modif)];
        $('pf-op').value = p.operation_id; $('pf-type').value = p.type_production || '';
        $('pf-mer').value = p.mise_en_route_min ?? ''; $('pf-reg').value = p.reglage_min ?? ''; $('pf-regfer').value = p.reglage_fer_min ?? '';
        $('pf-cad').value = p.cadence_par_h ?? ''; $('pf-net').value = p.nettoyage_min ?? ''; $('pf-pers').value = p.nb_personnes || 1; $('pf-pp').value = p.par_passage || 1;
        $('pf-unite').value = p.unite_cadence || ''; $('pf-formule').value = p.quantite_formule || ''; $('pf-mut').checked = !!p.mutualiser; $('pf-mut').dataset.touche = ''; majUnite();
        calcul();
      }));
      $('pf-liste').querySelectorAll('[data-suppr]').forEach(b => b.addEventListener('click', async () => {
        const p = donnees.profils[Number(b.dataset.suppr)];
        if (!confirm(`Supprimer ce profil (${p.operation} · ${nomType(p.type_production)}) ?`)) return;
        try {
          const res = await fetch(`${API}/profils-machine?machine_id=${machine.id}&operation_id=${p.operation_id}&type_production=${p.type_production || 'tous'}`, { method: 'DELETE' });
          if (!res.ok) throw new Error((await res.json()).error || 'Erreur inconnue');
          donnees = await charger(); dessiner();
        } catch (e) { $('pf-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      }));
    };
    const $ = (id) => document.getElementById(id);
    afficherModale(`
      <h3>Temps de production — ${esc(machine.nom)}</h3>
      <div id="pf-liste"></div>
      <div class="produit-box">
        <div class="produit-titre">Ajouter ou modifier un profil <span class="plan-note">— un profil par opération et par type de production ; le même enregistrement le remplace</span></div>
        <div class="step-grid">
          <div class="field"><label>Opération</label><select id="pf-op">${ops.map(o => `<option value="${o.id}">${esc(o.nom)}</option>`).join('')}</select></div>
          <div class="field"><label>Type de production</label><select id="pf-type"><option value="">Tous types</option>${donnees.types.map(t => `<option value="${esc(t.code)}">${esc(t.libelle)}</option>`).join('')}</select>
            <button class="btn" type="button" id="pf-newtype" style="margin-top:6px;">+ Nouveau type…</button></div>
          <div class="field"><label>Mise en route (min)</label><input id="pf-mer" type="number" min="0" step="any"></div>
          <div class="field"><label>Réglage du passage (min)</label><input id="pf-reg" type="number" min="0" step="any"></div>
          <div class="field"><label>Réglage par fer (min) <span class="plan-note">— tracé, empreintes, collage, positionnement, pression/température ; × « Nombre de fers » de l'OF</span></label><input id="pf-regfer" type="number" min="0" step="any"></div>
          <div class="field"><label>Cadence portant sur…</label>
            <select id="pf-preset">
              <option value="exemplaires">Des exemplaires (par défaut)</option>
              <option value="cahiers">Des cahiers (couture, pliage)</option>
              <option value="feuilles">Des feuilles coupées (massicot droit : feuilles × coupes)</option>
              <option value="coupes">Des coupes (massicot : piles de 7 cm × coupes)</option>
              <option value="autre">Autre unité…</option>
            </select></div>
          <div class="field"><label>Unité de la cadence</label><input id="pf-unite" placeholder="exemplaires"></div>
          <div class="field" style="grid-column: 1 / -1;"><label>Quantité à traiter <span class="plan-note">— formule d'après la fiche ; vide = quantité de l'OF</span></label><input id="pf-formule" class="mono" placeholder="quantite"></div>
          <div class="field"><label id="pf-cad-label">Roulage : cadence moyenne (exemplaires / h)</label><input id="pf-cad" type="number" min="0" step="any"></div>
          <div class="field"><label>Nettoyage (min)</label><input id="pf-net" type="number" min="0" step="any"></div>
          <label style="grid-column: 1 / -1;display:flex;gap:8px;align-items:flex-start;font-size:13px;"><input type="checkbox" id="pf-mut" style="margin-top:3px;"><span><strong>Une seule mise en route et un seul nettoyage par journée</strong> — quand plusieurs travaux de cette opération se suivent sur la même machine, seul le premier garde sa mise en route et seul le dernier garde son nettoyage ; chaque travail garde son réglage et sa production. <span class="plan-note">(réglage propre à l'opération : valable pour toutes ses machines)</span></span></label>
          <div class="field"><label>Personnes au roulage</label><input id="pf-pers" type="number" min="1" step="1" value="1"></div>
          <div class="field"><label>Exemplaires par passage <span class="plan-note">— 1 = un à la fois ; 2 = deux en même temps (la cadence compte alors des passages/h)</span></label><input id="pf-pp" type="number" min="1" step="1" value="1"></div>
          <div class="field"><label>Aperçu : nombre de fers</label><input id="pf-fers" type="number" min="0" step="1" value="3"></div>
          <div class="field" style="grid-column: 1 / -1;"><label>Aperçu du temps total <span class="plan-note">— simulation pour vérifier le réglage ; rien n'est enregistré</span></label><div id="pf-apercu" style="display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;"></div><div id="pf-total" class="mono" style="padding:8px 0;">—</div></div>
        </div>
      </div>
      <div class="field hidden" id="pf-autres-box" style="margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;">
        <label><strong>Appliquer aussi ce profil à d'autres machines</strong> <span class="plan-note">— celles qui font la même opération (ex. les autres massicots droits). Leur profil existant pour cette opération et ce type de production sera remplacé par celui-ci (mise en route, réglage, cadence, nettoyage).</span></label>
        <div id="pf-autres" style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;"></div>
      </div>
      <div id="pf-msg"></div>
      <div class="actions"><button class="btn" id="m-close">Fermer</button><button class="btn primary" id="pf-save">Enregistrer le profil</button></div>
    `, 'large');
    const nv = (id) => { const v = $(id).value; return v === '' ? null : Number(String(v).replace(',', '.')); };
    const PRESETS = {
      exemplaires: { unite: 'exemplaires', formule: '' },
      cahiers: { unite: 'cahiers', formule: 'quantite * nb_cahiers' },
      // Piles de 7 cm maximum : feuilles par pile = 70 mm ÷ épaisseur d'une feuille (≈ 0,00125 mm par g/m²).
      // Massicot droit : la cadence officielle (ex. 3000 feuilles/h) est celle d'UNE coupe ; chaque coupe supplémentaire repasse toute la pile.
      feuilles: { unite: 'feuilles coupées', formule: 'nb_feuilles * nb_coupes_pile' },
      coupes: { unite: 'coupes', formule: 'plafond(nb_feuilles / plancher(70 / (grammage_g * 0.00125); 1); 1) * nb_coupes_pile' },
    };
    function majUnite() {
      const u = $('pf-unite').value.trim() || 'exemplaires';
      const n = Math.max(1, parseInt($('pf-pp').value, 10) || 1);
      $('pf-cad-label').textContent = n > 1 ? 'Roulage : cadence moyenne (passages / h)' : `Roulage : cadence moyenne (${u} / h)`;
      dessinerApercu(); calcul();
    }
    $('pf-preset').addEventListener('change', () => {
      const pr = PRESETS[$('pf-preset').value];
      if (pr) { $('pf-unite').value = pr.unite === 'exemplaires' ? '' : pr.unite; $('pf-formule').value = pr.formule; }
      majUnite();
    });
    $('pf-unite').addEventListener('input', majUnite);
    // Aperçu : une case par donnée de la formule (ex. feuilles × coupes par pile) ; formule complexe ou vide : une seule quantité.
    const LIB_VAR = { quantite: 'exemplaires', nb_cahiers: 'cahiers par exemplaire', nb_feuilles: 'feuilles à couper', nb_coupes_pile: 'coupes par pile', nb_fers: 'fers', grammage_g: 'grammage (g/m²)' };
    const DEF_VAR = { quantite: 1000, nb_cahiers: 20, nb_feuilles: 1000, nb_coupes_pile: 1 };
    const valApercu = {};
    function variablesApercu() {
      const f = $('pf-formule').value.trim() || 'quantite';
      return /^[a-z][a-z0-9_]*(\s*\*\s*[a-z][a-z0-9_]*)*$/i.test(f) ? Array.from(new Set(f.toLowerCase().split('*').map(x => x.trim()))) : null;
    }
    function dessinerApercu() {
      document.querySelectorAll('#pf-apercu .pf-var').forEach(i => { valApercu[i.dataset.cle] = i.value; });
      const q0 = $('pf-qte'); if (q0) valApercu.__q = q0.value;
      const vars = variablesApercu();
      const u = $('pf-unite').value.trim() || 'exemplaires';
      const champ = (cle, lib, val) => `<label style="font-size:13px;display:flex;flex-direction:column;gap:2px;">${esc(lib)}<input class="pf-var" data-cle="${esc(cle)}" type="number" min="0" step="any" value="${esc(val)}" style="width:110px;"></label>`;
      $('pf-apercu').innerHTML = vars
        ? vars.map(v => champ(v, LIB_VAR[v] || v, valApercu[v] ?? DEF_VAR[v] ?? 1)).join('<span style="padding-bottom:8px;">×</span>')
        : `<label style="font-size:13px;display:flex;flex-direction:column;gap:2px;">Quantité à traiter (${esc(u)}) <span class="plan-note">— formule complexe : saisissez directement la quantité</span><input id="pf-qte" type="number" min="0" step="any" value="${esc(valApercu.__q ?? 1000)}" style="width:130px;"></label>`;
    }
    function quantiteApercu() {
      const vars = variablesApercu();
      if (!vars) return { q: nv('pf-qte') || 0, detail: '' };
      const vals = vars.map(v => ({ v, n: Number(String(document.querySelector(`#pf-apercu .pf-var[data-cle="${v}"]`).value).replace(',', '.')) || 0 }));
      const q = vals.reduce((t, x) => t * x.n, 1);
      return { q, detail: vals.length > 1 || vals[0].v !== 'quantite' ? vals.map(x => `${x.n.toLocaleString('fr-FR')} ${LIB_VAR[x.v] || x.v}`).join(' × ') + ' = ' : '' };
    }
    function calcul() {
      const ap = quantiteApercu(); const q = ap.q; const cad = nv('pf-cad');
      const n = Math.max(1, parseInt($('pf-pp').value, 10) || 1);
      const passages = Math.ceil(q / n - 1e-9);
      const nbFers = Number($('pf-fers').value) || 0;
      const min = (nv('pf-mer') || 0) + (nv('pf-reg') || 0) + (nv('pf-regfer') || 0) * nbFers + (nv('pf-net') || 0) + (cad ? passages / cad * 60 : 0);
      const u = $('pf-unite').value.trim() || 'exemplaires';
      $('pf-total').textContent = min ? `${fmtH(min / 60)} au total (${ap.detail}${Math.round(q * 100) / 100} ${u} à traiter${n > 1 ? ` = ${passages} passages de ${n}` : ''})` : '—';
    }
    ['pf-mer', 'pf-reg', 'pf-regfer', 'pf-fers', 'pf-cad', 'pf-net'].forEach(id => $(id).addEventListener('input', calcul));
    $('pf-apercu').addEventListener('input', calcul);
    $('pf-formule').addEventListener('input', () => { dessinerApercu(); calcul(); });
    $('pf-pp').addEventListener('input', majUnite);
    // Le réglage « une seule mise en route / un seul nettoyage » est propre à l'opération : on ne l'envoie que si vous l'avez modifié.
    $('pf-mut').addEventListener('change', () => { $('pf-mut').dataset.touche = '1'; });
    // Autres machines faisant la même opération (pour y copier le profil en une fois).
    let autresMachines = [];
    const majAutres = () => {
      const code = (ops.find(o => o.id === $('pf-op').value) || {}).code;
      const liste = autresMachines.filter(m => (m.operations || []).some(o => o.code === code));
      $('pf-autres-box').classList.toggle('hidden', !liste.length);
      $('pf-autres').innerHTML = liste.map(m => `<label style="font-size:13px;"><input type="checkbox" class="pf-autre" value="${esc(m.id)}"> ${esc(m.nom)}</label>`).join('');
    };
    fetch(`${API}/gerer-machines`).then(r => r.ok ? r.json() : []).then(l => { autresMachines = (l || []).filter(m => m.actif !== false && m.id !== machine.id); majAutres(); }).catch(() => {});
    $('pf-op').addEventListener('change', () => { const q = donnees.profils.find(x => x.operation_id === $('pf-op').value); $('pf-mut').checked = !!(q && q.mutualiser); $('pf-mut').dataset.touche = ''; majAutres(); });
    $('pf-newtype').addEventListener('click', async () => {
      const libelle = prompt('Nom du nouveau type de production (ex. Brochure) :');
      if (!libelle || !libelle.trim()) return;
      try {
        const res = await fetch(`${API}/profils-machine`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'ajouter_type', libelle }) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        donnees.types.push({ code: d.code, libelle: d.libelle });
        $('pf-type').insertAdjacentHTML('beforeend', `<option value="${esc(d.code)}">${esc(d.libelle)}</option>`);
        $('pf-type').value = d.code;
        referentielsCache = null;
      } catch (e) { $('pf-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    $('m-close').addEventListener('click', fermerModale);
    $('pf-save').addEventListener('click', async () => {
      const cibles = Array.from(document.querySelectorAll('.pf-autre:checked')).map(c => c.value);
      if (cibles.length && !confirm(`Ce profil va aussi remplacer celui de ${cibles.length} autre(s) machine(s) pour cette opération et ce type de production. Continuer ?`)) return;
      $('pf-msg').innerHTML = '<div class="msg">Enregistrement…</div>';
      try {
        const corps = {
          machine_id: machine.id, operation_id: $('pf-op').value, type_production: $('pf-type').value || null,
          mise_en_route_min: nv('pf-mer'), reglage_min: nv('pf-reg'), reglage_fer_min: nv('pf-regfer'), cadence_par_h: nv('pf-cad'), nettoyage_min: nv('pf-net'), nb_personnes: nv('pf-pers') || 1, exemplaires_par_passage: nv('pf-pp') || 1, ...($('pf-mut').dataset.touche ? { mutualiser: $('pf-mut').checked } : {}),
          unite_cadence: $('pf-unite').value.trim() || null, quantite_formule: $('pf-formule').value.trim() || null,
        };
        const envoyer = async (c) => {
          const res = await fetch(`${API}/profils-machine`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c) });
          const d = await lireJson(res);
          if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        };
        await envoyer(corps);
        const echecs = [];
        for (const id of cibles) {
          const { mutualiser, ...sansMut } = corps;   // le réglage « une seule MER par jour » est propre à l'opération : déjà enregistré
          try { await envoyer({ ...sansMut, machine_id: id }); }
          catch (e) { echecs.push(`${(autresMachines.find(m => m.id === id) || {}).nom || id} : ${e.message}`); }
        }
        toast(cibles.length ? `Profil enregistré (+ ${cibles.length - echecs.length} autre(s) machine(s)).` : 'Profil enregistré.');
        donnees = await charger(); dessiner();
        $('pf-msg').innerHTML = echecs.length ? `<div class="msg error">Non appliqué à : ${esc(echecs.join(' ; '))}</div>` : '';
        document.querySelectorAll('.pf-autre').forEach(c => { c.checked = false; });
      } catch (e) { $('pf-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    dessiner(); dessinerApercu(); calcul();
  }

  // ---------- Temps standards & chiffrage ----------
  function fmtH(h) {
    if (h === null || h === undefined || isNaN(h)) return '—';
    const m = Math.round(h * 60);
    const hh = Math.floor(m / 60), mm = m % 60;
    if (hh === 0) return `${mm} min`;
    return mm === 0 ? `${hh} h` : `${hh} h ${String(mm).padStart(2, '0')}`;
  }
  function decrirePhase(p) {
    if (p.type_calcul === 'fixe') return `Forfait ${fmtH(Number(p.duree_h))}`;
    if (p.type_calcul === 'par_element') return `${fmtH(Number(p.duree_h))} × ${p.element_label || p.element_param}`;
    if (p.type_calcul === 'formule') return `<span class="mono formule-cell" title="${esc(p.formule)}">${esc(tronque(p.formule, 46))}</span>`;
    return `${Number(p.cadence_par_h)} / heure`;
  }
  const etatTS = { phases: [] };   // phases affichées dans « Temps standards » (pour la copie de réglages)

  function renderTempsStandards() {
    const wrap = el(`
      <div>
      <div class="panel">
        <div class="panel-head">
          <h2>Phases de travail standard</h2>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
            <select id="ts-filtre" style="min-width:170px;"><option value="">Toutes les opérations</option></select>
            <button class="btn" id="ts-dep" title="Quelle opération attend quelle autre, par défaut, dans la gamme d'un OF">Dépendances standards</button>
            <button class="btn" id="ts-ligne" title="Opérations qui fonctionnent en ligne (production simultanée)">Opérations en ligne</button>
            <button class="btn" id="ts-ops" title="Ajouter ou modifier des opérations du catalogue">Gérer les opérations</button>
            <button class="btn" id="ts-copie" title="Copier les réglages d'une machine vers d'autres machines">Copier vers…</button>
            <button class="btn" id="ts-export" title="Exporter au format Excel (sert aussi de modèle à remplir)">Exporter Excel</button>
            <button class="btn" id="ts-import" title="Importer un fichier Excel">Importer Excel</button>
            <input type="file" id="ts-import-file" accept=".xlsx" class="hidden">
            <button class="btn primary" id="ts-new">${svgIcon('<path d="M12 5v14M5 12h14"/>')}Nouvelle phase</button>
          </div>
        </div>
        <div style="padding:12px 18px; font-size:12px; color:var(--ink-500); border-bottom:1px solid var(--line);">
          Une phase <strong>sans machine</strong> est le standard de l'opération. Une phase <strong>rattachée à une machine</strong> la remplace pour cette machine. Chaque phase se calcule en <strong>forfait</strong>, <strong>durée × un nombre</strong>, <strong>cadence</strong> ou par <strong>formule</strong> selon les caractéristiques du produit (largeur, nombre de pages, grammage…).
        </div>
        <div id="ts-bulk" style="display:none; align-items:center; gap:10px; padding:8px 18px; background:var(--paper-raised-2,#F3F5FA); border-bottom:1px solid var(--line); font-size:13px;"><span id="ts-bulk-n"></span><button class="btn danger-btn" id="ts-bulk-del" style="margin-left:auto;">Supprimer la sélection</button></div>
        <table>
          <thead><tr><th style="width:28px;"><input type="checkbox" id="ts-all" title="Tout cocher / décocher (lignes affichées)"></th><th>Opération</th><th>Machine</th><th>Phase</th><th>Calcul</th><th>Occupe la machine</th><th>Pers.</th><th></th></tr></thead>
          <tbody id="ts-tbody"><tr><td colspan="8" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h2>Caractéristiques produit <span class="plan-note">— variables utilisables dans les formules</span></h2>
          <button class="btn primary" id="car-new">${svgIcon('<path d="M12 5v14M5 12h14"/>')}Nouvelle caractéristique</button>
        </div>
        <table>
          <thead><tr><th>Clé (dans les formules)</th><th>Libellé</th><th>Type</th><th>Unité</th><th></th></tr></thead>
          <tbody id="car-tbody"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>

    `);
    wrap.querySelector('#ts-new').addEventListener('click', () => ouvrirModalePhase(null));
    wrap.querySelector('#ts-ops').addEventListener('click', () => ouvrirModaleOperations());
    wrap.querySelector('#ts-ligne').addEventListener('click', () => ouvrirModaleEnLigne());
    wrap.querySelector('#ts-dep').addEventListener('click', () => ouvrirModaleDependances());
    wrap.querySelector('#ts-copie').addEventListener('click', () => ouvrirModaleCopie());
    wrap.querySelector('#ts-export').addEventListener('click', () => exporterExcel());
    const fichier = wrap.querySelector('#ts-import-file');
    wrap.querySelector('#ts-import').addEventListener('click', () => fichier.click());

  async function chargerPhases(wrap) {
    const tbody = wrap.querySelector('#ts-tbody');
    const filtre = wrap.querySelector('#ts-filtre');
    try {
      const res = await fetch(`${API}/gerer-temps-standards`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const phases = await res.json();
      etatTS.phases = phases;

      // Toutes les opérations du catalogue, y compris celles qui n'ont encore aucune phase (pour pouvoir les configurer).
      const avecPhases = new Set(phases.map(p => p.operation_id));
      const tousOps = new Map(phases.map(p => [p.operation_id, p.operations.nom]));
      try { (await getReferentiels()).operations.forEach(o => { if (!tousOps.has(o.id)) tousOps.set(o.id, o.nom); }); } catch (_) { /* catalogue indisponible : seules les opérations déjà chiffrées sont listées */ }
      const ops = Array.from(tousOps.entries()).sort((a, b) => a[1].localeCompare(b[1], 'fr'));
      const valeurFiltre = filtre.value;
      filtre.innerHTML = `<option value="">Toutes les opérations</option>` + ops.map(([id, nom]) => `<option value="${id}">${esc(nom)}${avecPhases.has(id) ? '' : ' — (aucune phase)'}</option>`).join('');
      filtre.value = valeurFiltre;

      const afficher = () => {
        const sel = filtre.value;
        const lignes = phases.filter(p => !sel || p.operation_id === sel);
        const majSelection = () => {
          const cochees = Array.from(tbody.querySelectorAll('.ts-chk:checked'));
          const barre = wrap.querySelector('#ts-bulk'); barre.style.display = cochees.length ? 'flex' : 'none';
          wrap.querySelector('#ts-bulk-n').textContent = `${cochees.length} phase(s) sélectionnée(s)`;
          const tous = wrap.querySelector('#ts-all'); const tot = tbody.querySelectorAll('.ts-chk').length;
          tous.checked = tot > 0 && cochees.length === tot;
        };
        if (lignes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="empty">${phases.length ? `Aucune phase pour cette opération. <button class="btn primary" id="ts-def" type="button" style="margin-left:8px;">Définir ses temps standards</button>` : 'Aucune phase définie pour l\'instant. Cliquez sur « Nouvelle phase » pour saisir vos premiers temps standards.'}</td></tr>`;
          majSelection();
          const bd = tbody.querySelector('#ts-def'); if (bd) bd.addEventListener('click', () => ouvrirModalePhase(null, sel));
          return;
        }
        tbody.innerHTML = '';
        lignes.forEach(p => {
          tbody.appendChild(el(`
            <tr>
              <td><input type="checkbox" class="ts-chk" data-id="${p.id}"></td>
              <td>${p.operations.nom}</td>
              <td>${p.machines ? p.machines.nom : '<span class="chip">Standard</span>'}</td>
              <td><span class="mono" style="color:var(--ink-500); margin-right:6px;">${p.ordre}.</span>${p.nom}</td>
              <td>${decrirePhase(p)}</td>
              <td>${p.occupe_machine ? 'Oui' : '<span style="color:var(--ink-500)">Non</span>'}</td>
              <td>${p.nb_personnes}</td>
              <td style="white-space:nowrap;">
                <button class="btn ts-edit" data-id="${p.id}">Modifier</button>
                <button class="btn btn-icon-danger ts-del" data-id="${p.id}" aria-label="Supprimer">${svgIcon('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>')}</button>
              </td>
            </tr>
          `));
        });
        tbody.querySelectorAll('.ts-chk').forEach(c => c.addEventListener('change', majSelection));
        wrap.querySelector('#ts-all').onchange = (ev) => { tbody.querySelectorAll('.ts-chk').forEach(c => { c.checked = ev.target.checked; }); majSelection(); };
        wrap.querySelector('#ts-bulk-del').onclick = () => {
          const ids = Array.from(tbody.querySelectorAll('.ts-chk:checked')).map(c => c.dataset.id);
          if (!ids.length) return;
          afficherModale(`
            <h3>Supprimer ${ids.length} phase(s) ?</h3>
            <p style="font-size:13px; color:var(--ink-700); margin:0;">Les phases cochées seront supprimées définitivement. Les OF déjà chiffrés ne seront recalculés qu'à leur prochain chiffrage.</p>
            <div id="m-msg"></div>
            <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn danger-btn" id="m-confirm-delete">Supprimer ${ids.length} phase(s)</button></div>`);
          document.getElementById('m-cancel').addEventListener('click', fermerModale);
          document.getElementById('m-confirm-delete').addEventListener('click', async (ev) => {
            ev.target.disabled = true; const msg = document.getElementById('m-msg'); let ko = 0;
            for (const id of ids) {
              try { const r = await fetch(`${API}/gerer-temps-standards?id=${id}`, { method: 'DELETE' }); if (!r.ok) ko++; } catch (_) { ko++; }
            }
            if (ko) { msg.innerHTML = `<div class="msg error">${ko} suppression(s) en échec sur ${ids.length}.</div>`; ev.target.disabled = false; render(); return; }
            toast(`${ids.length} phase(s) supprimée(s).`); fermerModale(); render();
          });
        };
        majSelection();
        tbody.querySelectorAll('.ts-edit').forEach(b => b.addEventListener('click', () => ouvrirModalePhase(phases.find(x => x.id === b.dataset.id))));
        tbody.querySelectorAll('.ts-del').forEach(b => b.addEventListener('click', () => {
          const p = phases.find(x => x.id === b.dataset.id);
          afficherModale(`
            <h3>Supprimer cette phase ?</h3>
            <p style="font-size:13px; color:var(--ink-700); margin:0;">« ${p.nom} » — ${p.operations.nom}${p.machines ? ' (' + p.machines.nom + ')' : ' (standard de l\'opération)'}. Les OF déjà chiffrés ne seront recalculés qu'à leur prochain chiffrage.</p>
            <div id="m-msg"></div>
            <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn danger-btn" id="m-confirm-delete">Supprimer</button></div>
          `);
          document.getElementById('m-cancel').addEventListener('click', fermerModale);
          document.getElementById('m-confirm-delete').addEventListener('click', async () => {
            const msg = document.getElementById('m-msg');
            try {
              const r = await fetch(`${API}/gerer-temps-standards?id=${p.id}`, { method: 'DELETE' });
              if (!r.ok) throw new Error((await r.json()).error || 'Erreur inconnue');
              toast('Phase supprimée.');
              fermerModale(); render();
            } catch (e) { msg.innerHTML = `<div class="msg error">${e.message}</div>`; }
          });
        }));
      };
      filtre.addEventListener('change', afficher);
      afficher();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty">Backend indisponible. (${e.message})</td></tr>`;
    }
  }

  async function ouvrirModalePhase(phase, opPreset) {
    let refs; let catalogue = [];
    try {
      refs = await getReferentiels();
      const rc = await fetch(`${API}/gerer-caracteristiques`);
      if (rc.ok) { const j = await rc.json(); catalogue = Array.isArray(j) ? j : []; }
    } catch (e) { toast(`Backend indisponible : ${e.message}`, 'error'); return; }

    const estEdition = !!phase;
    const opOptions = refs.operations.map(o => `<option value="${o.id}" ${(phase && phase.operation_id === o.id) || (!phase && opPreset === o.id) ? 'selected' : ''}>${esc(o.nom)}</option>`).join('');
    const machOptions = `<option value="">— Standard de l'opération (toutes machines) —</option>` +
      refs.machines.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr'))
        .map(m => `<option value="${m.id}" ${phase && phase.machine_id === m.id ? 'selected' : ''}>${esc(m.nom)}</option>`).join('');
    const type = phase ? phase.type_calcul : 'fixe';

    const chipsVariables = [{ cle: 'quantite', libelle: 'Quantité (exemplaires)', unite: null }, ...catalogue]
      .map(v => `<button type="button" class="chip-btn" data-ins="${v.cle}" title="${esc(v.libelle)}${v.unite ? ' (' + esc(v.unite) + ')' : ''}">${v.cle}</button>`).join('');
    const chipsFonctions = [['si(condition; si_vrai; si_faux)', 'si'], ['min(a; b)', 'min'], ['max(a; b)', 'max'], ['arrondi(x; 2)', 'arrondi'], ['plafond(x; 0,25)', 'plafond'], ['plancher(x; 1)', 'plancher']]
      .map(([t, n]) => `<button type="button" class="chip-btn fn" data-ins="${esc(t)}" title="${esc(t)}">${n}( )</button>`).join('');
    const exemples = [['0,5 + 0,002 * largeur_mm', 'forfait + par mm'], ['si(largeur_mm > 300; 1; 0,75)', 'selon une condition'], ['quantite / si(grammage_g > 150; 6000; 9000)', 'cadence variable'], ['max(0,5; quantite / 2000)', 'avec un minimum']]
      .map(([t, n]) => `<button type="button" class="chip-btn ex" data-ex="${esc(t)}" title="${esc(t)}">${n}</button>`).join('');

    afficherModale(`
      <h3>${estEdition ? 'Modifier la phase' : 'Nouvelle phase de travail'}</h3>
      <div class="field"><label>Opération</label><select id="ph-op">${opOptions}</select></div>
      <div class="field"><label>Machine concernée</label><select id="ph-machine">${machOptions}</select></div>
      <div class="field"><label>Nom de la phase</label><input id="ph-nom" value="${esc(phase ? phase.nom : '')}" placeholder="ex: Mise en route, Réglage, Roulage, Nettoyage"></div>
      <div class="field"><label>Ordre dans l'opération</label><input id="ph-ordre" type="number" min="1" value="${phase ? phase.ordre : 1}"></div>
      <div class="field"><label>Mode de calcul</label>
        <select id="ph-type">
          <option value="fixe" ${type === 'fixe' ? 'selected' : ''}>Forfait (durée fixe)</option>
          <option value="par_element" ${type === 'par_element' ? 'selected' : ''}>Durée × un nombre (ex: par fer)</option>
          <option value="cadence" ${type === 'cadence' ? 'selected' : ''}>Cadence (unités par heure)</option>
          <option value="formule" ${type === 'formule' ? 'selected' : ''}>Formule (selon les caractéristiques du produit)</option>
        </select>
      </div>
      <div class="field" id="ph-duree-wrap"><label id="ph-duree-label">Durée (heures)</label><input id="ph-duree" type="number" min="0" step="any" value="${phase && phase.duree_h !== null ? phase.duree_h : ''}" placeholder="ex: 0.5 pour 30 min"></div>
      <div class="field" id="ph-element-wrap"><label>Ce que l'on compte</label><input id="ph-element" value="${esc(phase && phase.element_label ? phase.element_label : '')}" placeholder="ex: Nombre de fers"></div>
      <div class="field" id="ph-cadence-wrap"><label>Cadence (unités par heure)</label><input id="ph-cadence" type="number" min="0" step="any" value="${phase && phase.cadence_par_h !== null ? phase.cadence_par_h : ''}" placeholder="ex: 400"></div>
      <div class="field" id="ph-formule-wrap">
        <label>Formule — le résultat est une durée en <strong>heures</strong></label>
        <textarea id="ph-formule" rows="3" spellcheck="false" placeholder="ex : 0,5 + 0,002 * largeur_mm">${esc(phase && phase.formule ? phase.formule : '')}</textarea>
        <div class="chips"><span class="chips-label">Caractéristiques :</span>${chipsVariables}</div>
        <div class="chips"><span class="chips-label">Fonctions :</span>${chipsFonctions}</div>
        <div class="chips"><span class="chips-label">Exemples :</span>${exemples}</div>
        <details class="aide-formule"><summary>Aide sur les formules</summary>
          <p>Opérateurs <code>+ - * / %</code>, comparaisons <code>== != &lt; &lt;= &gt; &gt;=</code>, logique <code>et ou non</code>. Les arguments se séparent par <code>;</code>. Le texte se met entre guillemets : <code>si(papier == "couché"; 1; 0,5)</code> (casse et accents ignorés).</p>
          <p><code>si(condition; si_vrai; si_faux)</code> · <code>min(…)</code> · <code>max(…)</code> · <code>abs(x)</code> · <code>arrondi(x; décimales)</code> · <code>plafond(x; pas)</code> · <code>plancher(x; pas)</code></p>
          <p>Les caractéristiques (largeur, grammage…) se créent dans le panneau « Caractéristiques produit » ; <code>quantite</code> est le nombre d'exemplaires.</p>
        </details>
        <div class="apercu"><div class="apercu-titre">Aperçu — essayez des valeurs</div><div id="ph-apercu-champs" class="apercu-champs"></div><div id="ph-resultat"></div></div>
      </div>
      <div class="field"><label>Nombre de personnes requises</label><input id="ph-pers" type="number" min="1" value="${phase ? phase.nb_personnes : 1}"></div>
      <div class="field"><label><input type="checkbox" id="ph-occupe" ${!phase || phase.occupe_machine ? 'checked' : ''}> Cette phase occupe la machine</label></div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">${estEdition ? 'Enregistrer' : 'Créer'}</button></div>
    `, 'large');

    const $ = (id) => document.getElementById(id);
    const typeSel = $('ph-type');
    const ta = $('ph-formule');
    function majChamps() {
      const t = typeSel.value;
      $('ph-duree-wrap').classList.toggle('hidden', t === 'cadence' || t === 'formule');
      $('ph-element-wrap').classList.toggle('hidden', t !== 'par_element');
      $('ph-cadence-wrap').classList.toggle('hidden', t !== 'cadence');
      $('ph-formule-wrap').classList.toggle('hidden', t !== 'formule');
      $('ph-duree-label').textContent = t === 'par_element' ? 'Durée pour chaque élément (heures)' : 'Durée (heures)';
      if (t === 'formule') planifierApercu();
    }

    // ----- Aperçu en direct de la formule -----
    const valeursApercu = {};
    let clesAffichees = null; let minuterie = null; let compteur = 0;
    function planifierApercu() { clearTimeout(minuterie); minuterie = setTimeout(majApercu, 300); }
    async function majApercu() {
      if (!document.getElementById('ph-formule')) return;
      const f = ta.value.trim();
      const champs = $('ph-apercu-champs'); const resultat = $('ph-resultat');
      if (!f) { champs.innerHTML = ''; clesAffichees = null; resultat.innerHTML = '<div class="apercu-note">Saisissez une formule pour voir le résultat.</div>'; return; }
      const mon = ++compteur;
      let d;
      try {
        const res = await fetch(`${API}/evaluer-formule`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ formule: f, valeurs: valeursApercu }) });
        d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Erreur');
      } catch (e) { if (mon === compteur) resultat.innerHTML = `<div class="msg error">Aperçu indisponible : ${esc(e.message)}</div>`; return; }
      if (mon !== compteur || !document.getElementById('ph-formule')) return;   // réponse périmée
      const cles = d.variables.map(v => v.cle).join();
      if (cles !== clesAffichees) {
        clesAffichees = cles;
        champs.innerHTML = d.variables.map(v => `
          <label class="apercu-champ">${esc(v.libelle)}${v.unite ? ' (' + esc(v.unite) + ')' : ''}${v.connue ? '' : ' <em>— inconnue</em>'}
            <input data-cle="${v.cle}" type="${v.type === 'texte' ? 'text' : 'text'}" inputmode="${v.type === 'texte' ? 'text' : 'decimal'}" value="${esc(valeursApercu[v.cle] ?? '')}"></label>`).join('');
        champs.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { valeursApercu[inp.dataset.cle] = inp.value; planifierApercu(); }));
      }
      if (d.erreur) resultat.innerHTML = `<div class="msg error">${esc(d.erreur)}</div>`;
      else if (d.valeur_h === null) resultat.innerHTML = '<div class="apercu-note">Renseignez les valeurs ci-dessus pour voir le résultat.</div>';
      else resultat.innerHTML = `<div class="apercu-res">= <strong>${fmtH(d.valeur_h)}</strong> <span>(${d.valeur_h.toLocaleString('fr-FR')} h)</span></div>`;
    }
    ta.addEventListener('input', planifierApercu);
    document.querySelectorAll('.chip-btn[data-ins]').forEach(b => b.addEventListener('click', () => {
      const t = b.dataset.ins; const d = ta.selectionStart ?? ta.value.length; const f = ta.selectionEnd ?? d;
      ta.value = ta.value.slice(0, d) + t + ta.value.slice(f);
      ta.focus(); ta.selectionStart = ta.selectionEnd = d + t.length; planifierApercu();
    }));
    document.querySelectorAll('.chip-btn[data-ex]').forEach(b => b.addEventListener('click', () => { ta.value = b.dataset.ex; ta.focus(); planifierApercu(); }));

    typeSel.addEventListener('change', majChamps);
    majChamps();

    $('m-cancel').addEventListener('click', fermerModale);
    $('m-submit').addEventListener('click', async () => {
      const msg = $('m-msg');
      const payload = {
        id: phase ? phase.id : undefined,
        operation_id: $('ph-op').value,
        machine_id: $('ph-machine').value || null,
        nom: $('ph-nom').value.trim(),
        ordre: $('ph-ordre').value,
        type_calcul: typeSel.value,
        duree_h: $('ph-duree').value,
        cadence_par_h: $('ph-cadence').value,
        element_label: $('ph-element').value.trim(),
        formule: ta.value.trim(),
        nb_personnes: $('ph-pers').value,
        occupe_machine: $('ph-occupe').checked,
      };
      msg.innerHTML = `<div class="msg">Enregistrement…</div>`;
      try {
        const res = await fetch(`${API}/gerer-temps-standards`, {
          method: estEdition ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur inconnue');
        toast(estEdition ? 'Phase mise à jour.' : 'Phase créée.');
        fermerModale(); render();
      } catch (e) {
        msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
      }
    });
  }

  // ----- Caractéristiques produit -----

    const tbody = wrap.querySelector('#car-tbody');
    try {
      const res = await fetch(`${API}/gerer-caracteristiques`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const liste = await res.json();
      if (liste.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty">Aucune caractéristique. Créez-en pour pouvoir les utiliser dans des formules.</td></tr>'; return; }
      tbody.innerHTML = '';
      liste.forEach(c => {
        tbody.appendChild(el(`
          <tr>
            <td class="mono">${esc(c.cle)}</td><td>${esc(c.libelle)}</td>
            <td><span class="chip">${c.type === 'texte' ? 'Texte' : 'Nombre'}</span></td><td>${esc(c.unite || '—')}</td>
            <td style="white-space:nowrap;">
              <button class="btn car-edit" data-cle="${c.cle}">Modifier</button>
              <button class="btn btn-icon-danger car-del" data-cle="${c.cle}" aria-label="Supprimer ${esc(c.libelle)}">${svgIcon('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>')}</button>
            </td>
          </tr>`));
      });
      tbody.querySelectorAll('.car-edit').forEach(b => b.addEventListener('click', () => ouvrirModaleCaracteristique(liste.find(x => x.cle === b.dataset.cle))));
