  // ---------- Vue globale de la charge de travail (Reporting) ----------
  // Calendrier jour / semaine / mois / année, OF en cours avec progression colorée, échéances, charge par machine.
  // Les chiffres viennent de la fonction « vue-globale » (lecture seule).
  const VG_JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const vg = { mode: 'semaine', ref: new Date().toLocaleDateString('sv-SE'), cal: null, of: null, erreur: null, jeton: 0 };
  const vgIso = (d) => d.toLocaleDateString('sv-SE');
  const vgDate = (iso) => new Date(iso + 'T12:00:00');
  const vgAdd = (iso, n) => vgIso(new Date(vgDate(iso).getTime() + n * 86400000));
  const vgLundi = (iso) => vgAdd(iso, -((vgDate(iso).getDay() + 6) % 7));
  const vgFmt = (iso, o) => vgDate(iso).toLocaleDateString('fr-FR', o);
  const vgJJMM = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const vgH = (x) => (Math.round((x || 0) * 10) / 10).toLocaleString('fr-FR');
  const vgPct = (c) => (c === null || c === undefined ? null : Math.round(c * 100));
  function vgSemaine(iso) {
    const d = vgDate(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);
    const j4 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - j4) / 86400000 - 3 + ((j4.getDay() + 6) % 7)) / 7);
  }
  function vgClasse(c) {
    if (c === null || c === undefined) return 'vg-cna';
    if (c <= 0) return 'vg-c0';
    return c < 0.5 ? 'vg-c1' : (c < 0.85 ? 'vg-c2' : (c <= 1 ? 'vg-c3' : 'vg-c4'));
  }
  function vgPeriode() {
    const r = vg.ref;
    if (vg.mode === 'jour') return { debut: r, fin: r };
    if (vg.mode === 'semaine') { const l = vgLundi(r); return { debut: l, fin: vgAdd(l, 6) }; }
    if (vg.mode === 'mois') {
      const d = vgDate(r), p = vgIso(new Date(d.getFullYear(), d.getMonth(), 1)), z = vgIso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
      return { debut: vgLundi(p), fin: vgAdd(vgLundi(z), 6), premier: p, dernier: z };
    }
    const a = vgDate(r).getFullYear(); return { debut: `${a}-01-01`, fin: `${a}-12-31` };
  }
  function vgTitre() {
    const p = vgPeriode();
    if (vg.mode === 'jour') return vgFmt(vg.ref, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    if (vg.mode === 'semaine') return `Semaine ${vgSemaine(p.debut)} — du ${vgJJMM(p.debut)} au ${vgJJMM(p.fin)}/${p.fin.slice(0, 4)}`;
    if (vg.mode === 'mois') return vgFmt(vg.ref, { month: 'long', year: 'numeric' });
    return String(vgDate(vg.ref).getFullYear());
  }
  function vgNaviguer(sens) {
    const d = vgDate(vg.ref);
    if (vg.mode === 'jour') vg.ref = vgAdd(vg.ref, sens);
    else if (vg.mode === 'semaine') vg.ref = vgAdd(vg.ref, 7 * sens);
    else if (vg.mode === 'mois') vg.ref = vgIso(new Date(d.getFullYear(), d.getMonth() + sens, 1));
    else vg.ref = vgIso(new Date(d.getFullYear() + sens, 0, 1));
    chargerVg(false);
  }
  async function vgAppel(q) {
    const res = await fetch(`${API}/vue-globale?${q}`);
    const d = await lireJson(res);
    if (!res.ok) throw new Error(d.error || d.errorMessage || `Erreur serveur (HTTP ${res.status})`);
    return d;
  }
  async function chargerVg(avecOf) {
    const jeton = ++vg.jeton, p = vgPeriode();
    vg.erreur = null; dessinerVg();
    try {
      const [cal, of] = await Promise.all([vgAppel(`section=calendrier&debut=${p.debut}&fin=${p.fin}`), (avecOf || !vg.of) ? vgAppel('section=of') : Promise.resolve(null)]);
      if (jeton !== vg.jeton) return;
      vg.cal = cal; if (of) vg.of = of;
    } catch (e) { if (jeton !== vg.jeton) return; vg.erreur = e.message; }
    dessinerVg();
  }

  function renderVueGlobale() {
    const wrap = el(`<div>
      <div class="vg-bar">
        <button class="btn" id="vg-retour">← Retour au reporting</button>
        <div class="vg-seg" id="vg-modes">${[['jour', 'Jour'], ['semaine', 'Semaine'], ['mois', 'Mois'], ['annee', 'Année']].map(([k, l]) => `<button data-m="${k}">${l}</button>`).join('')}</div>
        <div class="vg-nav"><button class="btn" id="vg-prec" aria-label="Précédent">‹</button><div class="vg-titre" id="vg-titre"></div><button class="btn" id="vg-suiv" aria-label="Suivant">›</button><button class="btn" id="vg-auj">Aujourd'hui</button><button class="btn" id="vg-maj" title="Actualiser les données">↻</button></div>
      </div>
      <div class="kpis" id="vg-tuiles"></div>
      <div class="panel"><div class="panel-head"><h2 id="vg-cal-titre">Calendrier de la charge</h2></div><div id="vg-cal" class="vg-cal"><div class="empty">Chargement…</div></div><div class="vg-leg" id="vg-leg"></div></div>
      <div class="panel"><div class="panel-head"><h2>OF en cours — progression</h2><span class="plan-note" id="vg-of-resume"></span></div><div id="vg-of"><div class="empty">Chargement…</div></div><div class="vg-leg" id="vg-of-leg"></div></div>
      <div class="vg-2col"><div class="panel" style="margin:0 0 20px;"><div class="panel-head"><h2>Points d'attention</h2></div><div id="vg-att" class="vg-liste"></div></div>
        <div class="panel" style="margin:0 0 20px;"><div class="panel-head"><h2>Échéances des 14 prochains jours</h2></div><div id="vg-ech" class="vg-liste"></div></div></div>
      <div class="panel"><div class="panel-head"><h2>Charge par machine sur la période</h2></div><div id="vg-mach" style="padding:14px 18px; display:flex; flex-direction:column; gap:11px;"></div></div>
    </div>`);
    wrap.querySelector('#vg-retour').addEventListener('click', () => { state.repVue = null; render(); });
    wrap.querySelectorAll('#vg-modes button').forEach(b => b.addEventListener('click', () => { vg.mode = b.dataset.m; chargerVg(false); }));
    wrap.querySelector('#vg-prec').addEventListener('click', () => vgNaviguer(-1));
    wrap.querySelector('#vg-suiv').addEventListener('click', () => vgNaviguer(1));
    wrap.querySelector('#vg-auj').addEventListener('click', () => { vg.ref = new Date().toLocaleDateString('sv-SE'); chargerVg(false); });
    wrap.querySelector('#vg-maj').addEventListener('click', () => chargerVg(true));
    wrap.querySelector('#vg-cal').addEventListener('click', (ev) => {
      const j = ev.target.closest('[data-j]'), m = ev.target.closest('[data-mois]');
      if (j) { vg.mode = 'jour'; vg.ref = j.dataset.j; chargerVg(false); }
      else if (m) { vg.mode = 'mois'; vg.ref = m.dataset.mois; chargerVg(false); }
    });
    setTimeout(() => chargerVg(true), 0);
    return wrap;
  }

  function dessinerVg() {
    const g = (id) => document.getElementById(id);
    if (!g('vg-cal')) return;
    document.querySelectorAll('#vg-modes button').forEach(b => b.classList.toggle('on', b.dataset.m === vg.mode));
    { const t = vgTitre(); g('vg-titre').textContent = t.charAt(0).toUpperCase() + t.slice(1); }
    const p = vgPeriode(), cal = vg.cal && vg.cal.periode.debut === p.debut && vg.cal.periode.fin === p.fin ? vg.cal : null;
    g('vg-cal-titre').textContent = { jour: 'Journée', semaine: 'Semaine — machines × jours', mois: 'Mois', annee: 'Année' }[vg.mode];
    if (vg.erreur) { g('vg-cal').innerHTML = `<div class="msg error">${esc(vg.erreur)}</div>`; }
    else if (!cal) { g('vg-cal').innerHTML = '<div class="empty">Chargement…</div>'; }
    else { vgTuiles(cal, p); vgCalendrier(cal, p); vgMachines(cal, p); vgAttention(cal, p); }
    g('vg-leg').innerHTML = [['vg-c0', 'Rien de planifié'], ['vg-c1', 'Moins de 50 %'], ['vg-c2', '50 à 85 %'], ['vg-c3', '85 à 100 %'], ['vg-c4', 'Surcharge (plus de 100 %)'], ['vg-cna', 'Week-end fermé / sans capacité']].map(([c, l]) => `<span><i class="${c}"></i>${l}</span>`).join('')
      + `<span style="flex-basis:100%;">Charge d'un jour = le plus élevé de : heures-personnes planifiées ÷ capacité de l'équipe (présents × heures ouvertes du jour) et heures-machines planifiées ÷ capacité du parc (machines actives, hors arrêt, × heures ouvertes). Heures ouvertes : 8 h du lundi au vendredi, 10 h un jour de heures supplémentaires, 6 h un samedi exceptionnel travaillé.</span>`;
    vgOf();
  }

  function vgTuiles(cal, p) {
    const jours = Object.entries(cal.jours).filter(([d]) => d >= (vg.mode === 'mois' ? p.premier : p.debut) && d <= (vg.mode === 'mois' ? p.dernier : p.fin));
    const somme = (f) => jours.reduce((t, [, j]) => t + f(j), 0);
    const charges = jours.map(([, j]) => j.charge).filter(c => c !== null);
    const moy = charges.length ? charges.reduce((a, b) => a + b, 0) / charges.length : null;
    const sur = charges.filter(c => c > 1).length, haute = charges.filter(c => c > 0.85 && c <= 1).length;
    const ap = vg.of ? vg.of.a_planifier : null;
    const tuile = (cls, v, l) => `<div class="kpi ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    document.getElementById('vg-tuiles').innerHTML =
      tuile('accent-teal', `${vgH(somme(j => j.machine_h))} h`, 'Heures machine planifiées')
      + tuile('accent-teal', `${vgH(somme(j => j.pers_h))} h`, 'Heures-personnes planifiées')
      + tuile(moy !== null && moy > 1 ? 'accent-danger' : (moy !== null && moy > 0.85 ? 'accent-amber' : 'accent-teal'), moy === null ? '—' : `${vgPct(moy)}%`, 'Charge moyenne (jours ouvrés)')
      + tuile(sur ? 'accent-danger' : (haute ? 'accent-amber' : 'accent-teal'), `${sur}<span style="font-size:15px;font-weight:500;color:var(--ink-500);"> + ${haute}</span>`, 'Jours en surcharge (+ jours à plus de 85 %)')
      + tuile(somme(j => j.absents) ? 'accent-amber' : 'accent-teal', somme(j => j.absents), 'Absences (jours-personnes)')
      + (ap ? tuile(ap.heures > 0 ? 'accent-amber' : 'accent-teal', `${vgH(ap.heures)} h`, `Reste à planifier (${ap.nb_of} OF, étapes chiffrées)`) : '');
  }

  function vgInfoJour(iso, j) {
    const pc = vgPct(j.charge);
    return `${vgFmt(iso, { weekday: 'long', day: 'numeric', month: 'long' })} — ${vgH(j.machine_h)} h machine, ${vgH(j.pers_h)} h-personnes${pc !== null ? `, charge ${pc} %` : ''}${j.absents ? `, ${j.absents} absent(s)` : ''}${j.machines_arret ? `, ${j.machines_arret} machine(s) à l'arrêt` : ''}`;
  }

  function vgCalendrier(cal, p) {
    const zone = document.getElementById('vg-cal'), auj = new Date().toLocaleDateString('sv-SE');
    if (vg.mode === 'mois') {
      let h = `<div class="vg-mois">${VG_JOURS.map(j => `<div class="vg-jsem">${j}</div>`).join('')}`;
      for (let d = p.debut; d <= p.fin; d = vgAdd(d, 1)) {
        const j = cal.jours[d]; if (!j) continue;
        const dans = d >= p.premier && d <= p.dernier, pc = vgPct(j.charge);
        h += `<div class="vg-cell ${vgClasse(j.charge)} ${dans ? '' : 'vg-hors'} ${d === auj ? 'vg-auj' : ''}" data-j="${d}" title="${esc(vgInfoJour(d, j))}">
          <div class="vg-top"><span class="n">${Number(d.slice(8, 10))}</span><span>${pc !== null && (j.machine_h || j.pers_h) ? pc + '%' : ''}</span></div>
          <div>${j.machine_h ? vgH(j.machine_h) + ' h machine' : ''}</div>
          <div class="vg-chips">${j.nb_of ? `<span>📋 ${j.nb_of} OF</span>` : ''}${j.absents ? `<span>👤 ${j.absents}</span>` : ''}${j.machines_arret ? `<span>🔧 ${j.machines_arret}</span>` : ''}</div></div>`;

      const an = Number(p.debut.slice(0, 4));

        const premier = vgIso(new Date(an, m, 1)), dernier = vgIso(new Date(an, m + 1, 0));
        const vides = (vgDate(premier).getDay() + 6) % 7;
        const charges = []; let cases = '';
        for (let i = 0; i < vides; i++) cases += '<div class="vide"></div>';
        for (let d = premier; d <= dernier; d = vgAdd(d, 1)) {
          const j = cal.jours[d]; charges.push(j ? j.charge : null);
          cases += `<div class="${vgClasse(j ? j.charge : null)}" data-j="${d}" title="${esc(j ? vgInfoJour(d, j) : d)}">${Number(d.slice(8, 10))}</div>`;
        }
        const util = charges.filter(c => c !== null), moy = util.length ? util.reduce((a, b) => a + b, 0) / util.length : null;
        h += `<div><div class="vg-mini-t" data-mois="${premier}"><span>${vgFmt(premier, { month: 'long' })}</span><span class="plan-note">${moy !== null && moy > 0 ? vgPct(moy) + ' %' : ''}</span></div>
          <div class="vg-mini">${VG_JOURS.map(j => `<div class="vide" style="font-size:9px;color:var(--ink-500);">${j[0]}</div>`).join('')}${cases}</div></div>`;
      }
      zone.innerHTML = h + '</div>';
    } else if (vg.mode === 'semaine') {
      const jours = Array.from({ length: 7 }, (_, i) => vgAdd(p.debut, i));
      const arret = (nom, d) => (cal.interventions || []).some(x => x.machine === nom && x.bloquant && x.date_debut <= d && (!x.date_fin || x.date_fin >= d));
      const celClasse = (hh, d) => vgClasse(hh <= 0 ? 0 : hh / ((cal.jours[d] && cal.jours[d].heures_jour) || 8));
      let h = `<table class="vg-sem"><thead><tr><th>Machine</th>${jours.map(d => { const md = cal.jours[d] && cal.jours[d].mode; return `<th data-j="${d}">${VG_JOURS[(vgDate(d).getDay() + 6) % 7]}<br>${vgJJMM(d)}${md === 'heures_sup' ? '<br><span class="plan-note">heures sup</span>' : (md === 'samedi' ? '<br><span class="plan-note">exceptionnel</span>' : '')}</th>`; }).join('')}<th>Total</th></tr></thead><tbody>`;
      cal.par_machine.forEach(m => {
        h += `<tr><td>${esc(m.nom)}</td>${jours.map(d => { const x = (m.par_jour || {})[d] || 0, st = arret(m.nom, d); return `<td class="${celClasse(x, d)}" data-j="${d}" title="${esc(m.nom + ' — ' + vgFmt(d, { weekday: 'long', day: 'numeric', month: 'long' }) + (st ? ' — à l\'arrêt' : ''))}">${st ? '🔧 ' : ''}${x ? vgH(x) + ' h' : ''}</td>`; }).join('')}<td class="mono">${vgH(m.heures)} h</td></tr>`;
      });
      h += `</tbody><tfoot><tr><td><strong>Équipe</strong> <span class="plan-note">heures-personnes</span></td>${jours.map(d => { const j = cal.jours[d]; return `<td class="${j.cap_pers_h ? vgClasse(j.pers_h / j.cap_pers_h) : 'vg-cna'}" data-j="${d}">${j.pers_h ? vgH(j.pers_h) + ' h' : ''}${j.cap_pers_h ? `<br><span class="plan-note">/ ${vgH(j.cap_pers_h)} h</span>` : ''}</td>`; }).join('')}<td></td></tr>
        <tr><td><strong>Charge du jour</strong></td>${jours.map(d => { const j = cal.jours[d], pc = vgPct(j.charge); return `<td class="${vgClasse(j.charge)}" data-j="${d}"><strong>${pc !== null ? pc + ' %' : ''}</strong></td>`; }).join('')}<td></td></tr>
        <tr><td>Absents</td>${jours.map(d => { const j = cal.jours[d], noms = (cal.absences || []).filter(a => a.date === d).map(a => a.personnel).join(', '); return `<td data-j="${d}" title="${esc(noms)}">${j.absents ? '👤 ' + j.absents : ''}</td>`; }).join('')}<td></td></tr></tfoot></table>`;
      zone.innerHTML = cal.par_machine.length ? h : '<div class="empty">Aucune machine active.</div>';
    } else {
      const j = cal.jours[vg.ref], pc = vgPct(j.charge);
      const parMachine = {};
      (cal.creneaux || []).forEach(c => { (parMachine[c.machine || '—'] ??= []).push(c); });
      const arretM = (nom) => (cal.interventions || []).find(x => x.machine === nom && x.bloquant && x.date_debut <= vg.ref && (!x.date_fin || x.date_fin >= vg.ref));
      let h = `<div style="margin-bottom:12px;font-size:13px;"><span class="tag ${pc !== null && pc > 100 ? 'danger' : (pc !== null && pc > 85 ? 'warn' : 'ok')}">Charge ${pc !== null ? pc + ' %' : '—'}</span>${j.mode === 'heures_sup' ? ' <span class="tag warn">Heures supplémentaires 7h–17h30</span>' : (j.mode === 'samedi' ? ' <span class="tag warn">Samedi exceptionnel 6h–12h</span>' : '')} ${vgH(j.machine_h)} h machine · ${vgH(j.pers_h)} h-personnes (capacité équipe ${vgH(j.cap_pers_h)} h)</div>`;
      const noms = cal.par_machine.map(m => m.nom);
      noms.concat(parMachine['—'] ? ['—'] : []).forEach(nom => {
        const liste = parMachine[nom] || [], inter = nom === '—' ? null : arretM(nom);
        if (!liste.length && !inter) return;
        h += `<div class="vg-jour-m"><h4><span>${nom === '—' ? 'Travail manuel (sans machine)' : esc(nom)}</span>${inter ? `<span class="tag danger">⛔ À l'arrêt — ${esc(inter.type || 'intervention')}${inter.description ? ' : ' + esc(inter.description) : ''}</span>` : `<span class="plan-note">${vgH(liste.reduce((t, c) => t + c.heures, 0))} h</span>`}</h4>
          ${liste.map(c => `<div class="vg-cren"><span class="mono">${c.heure_debut ? c.heure_debut + '–' + c.heure_fin : 'Journée'}</span><span><strong>${esc(c.of_numero || '')}</strong> ${esc(c.titre || '')} <span class="plan-note">· ${esc(c.phase || '')} · ${vgH(c.heures)} h</span><br><span class="plan-note">${c.personnel.length ? '👤 ' + esc(c.personnel.join(', ')) : 'Personne non affectée'}</span></span></div>`).join('')}</div>`;
      });
      const libres = noms.filter(n => !parMachine[n] && !arretM(n));
      if (!(cal.creneaux || []).length) h += '<div class="empty">Rien n\'est planifié ce jour-là.</div>';
      else if (libres.length) h += `<div class="plan-note">Machines sans travail planifié : ${esc(libres.join(', '))}.</div>`;
      if ((cal.absences || []).length) h += `<div style="margin-top:10px;font-size:13px;">👤 Absents : ${cal.absences.map(a => `${esc(a.personnel)} <span class="plan-note">(${esc(a.statut)})</span>`).join(', ')}</div>`;
      zone.innerHTML = h;
    }
  }

  function vgOf() {
    const zone = document.getElementById('vg-of'), leg = document.getElementById('vg-of-leg'), res = document.getElementById('vg-of-resume');
    if (!zone) return;
    if (!vg.of) { zone.innerHTML = vg.erreur ? '' : '<div class="empty">Chargement…</div>'; return; }
    const o = vg.of, S = o.seuils;
    const n = (k) => o.of_en_cours.filter(x => x.niveau === k).length;
    res.textContent = o.of_en_cours.length ? `${o.of_en_cours.length} OF — ${n('vert')} dans les temps · ${n('orange')} léger retard · ${n('rouge')} retard important` : '';
    const lettre = { vert: 'v', orange: 'o', rouge: 'r' };
    zone.innerHTML = o.of_en_cours.length ? o.of_en_cours.map(x => `
      <div class="vg-of">
        <div><strong class="mono">${esc(x.numero)}</strong> ${x.statut === 'en pause' ? '<span class="tag warn">En pause</span>' : ''}${x.priorite && x.priorite !== 'normale' ? ` <span class="tag ${x.priorite === 'urgente' ? 'danger' : 'warn'}">${esc(x.priorite)}</span>` : ''}<br>${esc(x.titre)}${x.client ? ` <span class="plan-note">— ${esc(x.client)}</span>` : ''}</div>
        <div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;"><span class="mono">${x.avancement} %</span><span class="plan-note">${x.attendu !== null ? 'attendu ' + x.attendu + ' %' : ''}</span></div>
          <div class="vg-prog" title="${esc(x.raison)}"><span class="vg-${lettre[x.niveau]}" style="width:${Math.max(2, Math.min(100, x.avancement))}%"></span>${x.attendu !== null ? `<i class="att" style="left:${Math.min(99, x.attendu)}%"></i>` : ''}</div></div>
        <div><span class="vg-raison-${lettre[x.niveau]}">${esc(x.raison)}</span><br><span class="plan-note">${x.delai ? 'Délai ' + vgJJMM(x.delai) + '/' + x.delai.slice(0, 4) : 'Sans délai'}${x.fin_prevue ? ' · fin planifiée ' + vgJJMM(x.fin_prevue) : ''}</span></div>
        <button class="btn" data-msg="${esc(x.id)}" title="Écrire à propos de cet OF">✉</button>
      </div>`).join('') : '<div class="empty">Aucun OF en cours.</div>';
    zone.querySelectorAll('[data-msg]').forEach(b => b.addEventListener('click', () => ouvrirNouveauMessage({ type: 'of', id: b.dataset.msg })));
    leg.innerHTML = `<span><i class="vg-v"></i>Vert : dans les temps</span><span><i class="vg-o"></i>Orange : léger retard (plus de ${S.orange_pts} points sous l'attendu, ou fin planifiée après le délai)</span><span><i class="vg-r"></i>Rouge : retard important (plus de ${S.rouge_pts} points, fin planifiée à plus de ${S.fin_rouge_j} j après le délai, ou délai dépassé)</span>
      <span style="flex-basis:100%;">Le trait noir marque l'avancement attendu à ce jour, d'après les créneaux déjà planifiés de l'OF ; l'avancement réel vient des saisies de production.</span>`;
    const ech = document.getElementById('vg-ech');
    if (ech) ech.innerHTML = o.echeances.length ? o.echeances.map(x => `<div><span><strong class="mono">${esc(x.numero)}</strong> ${esc(x.titre)}</span><span class="mono">${vgJJMM(x.delai)} · ${x.avancement} % <span class="vg-raison-${lettre[x.niveau]}">●</span></span></div>`).join('') : '<div class="plan-note">Aucune échéance dans les 14 prochains jours.</div>';
  }

  function vgMachines(cal, p) {
    const zone = document.getElementById('vg-mach'); if (!zone) return;
    const debut = vg.mode === 'mois' ? p.premier : p.debut, fin = vg.mode === 'mois' ? p.dernier : p.fin;
    const joursOuverts = Object.keys(cal.jours).filter(d => d >= debut && d <= fin && cal.jours[d].heures_jour > 0);
    const ouvres = joursOuverts.length;
    const cap = Math.max(cal.capacite.heures_jour, joursOuverts.reduce((t, d) => t + cal.jours[d].heures_jour, 0));
    const lignes = cal.par_machine.filter(m => m.heures > 0 || vg.mode === 'jour' || vg.mode === 'semaine').slice(0, 15);
    zone.innerHTML = lignes.length ? lignes.map(m => {
      const pc = Math.round(m.heures / cap * 100), cls = pc > 100 ? 'danger' : (pc >= 85 ? 'warn' : '');
      return `<div><div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px;"><span>${esc(m.nom)}</span><span class="mono">${vgH(m.heures)} h sur ${m.jours_actifs} j · ${pc}%</span></div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.min(100, pc)}%"></div></div></div>`;
    }).join('') + `<div class="plan-note">Taux = heures planifiées ÷ (heures ouvertes de la période : 8 h par jour ouvré, 10 h en heures sup, 6 h un samedi travaillé) ; ${ouvres} jour(s) ouvert(s) sur la période.</div>` : '<div class="plan-note">Aucune machine planifiée sur cette période.</div>';
  }

  function vgAttention(cal, p) {
    const zone = document.getElementById('vg-att'); if (!zone) return;
    const debut = vg.mode === 'mois' ? p.premier : p.debut, fin = vg.mode === 'mois' ? p.dernier : p.fin;
    const jours = Object.entries(cal.jours).filter(([d]) => d >= debut && d <= fin);
    const sur = jours.filter(([, j]) => j.charge !== null && j.charge > 1).map(([d]) => vgJJMM(d));
    const lignes = [];
    if (sur.length) lignes.push(['danger', `${sur.length} jour(s) en surcharge`, sur.slice(0, 8).join(', ') + (sur.length > 8 ? '…' : '')]);
    const bloq = (cal.interventions || []).filter(x => x.bloquant);
    bloq.slice(0, 6).forEach(x => lignes.push(['warn', `🔧 ${esc(x.machine)} à l'arrêt`, `${x.date_debut ? vgJJMM(x.date_debut) : ''}${x.date_fin ? ' → ' + vgJJMM(x.date_fin) : ' → fin non connue'}`]));
    const abs = {}; (cal.absences || []).forEach(a => { abs[a.personnel] = (abs[a.personnel] || 0) + 1; });
    Object.entries(abs).slice(0, 6).forEach(([nom, nb]) => lignes.push(['', `👤 ${esc(nom)} absent(e)`, `${nb} jour(s)`]));
    const rouges = vg.of ? vg.of.of_en_cours.filter(x => x.niveau === 'rouge') : [];
    if (rouges.length) lignes.push(['danger', `${rouges.length} OF en retard important`, rouges.slice(0, 4).map(x => esc(x.numero)).join(', ')]);
    zone.innerHTML = lignes.length ? lignes.map(([c, a, b]) => `<div><span>${c ? `<span class="tag ${c}">${a}</span>` : a}</span><span class="plan-note">${b}</span></div>`).join('') : '<div class="plan-note">Rien à signaler sur cette période.</div>';
  }

  function renderReporting(){
    if (state.repVue === 'globale') return renderVueGlobale();
    // Tous les chiffres viennent des données réelles de l'application (OF, planning, machines, personnel, stocks).
    const aujourdhui = new Date().toLocaleDateString('sv-SE');
    const enCours = state.ordres.filter(o=>o.statut==='en cours').length;
    const retards = state.ordres
      .filter(o => (o.avancement || 0) < 100 && o.delai && String(o.delai).slice(0, 10) < aujourdhui)
      .sort((x, y) => String(x.delai).localeCompare(String(y.delai)));
    const matieresCritiques = state.stocks.filter(s=>s.statut==='danger').length;
    const personnelActif = state.personnel.filter(p=>p.charge>0);
    const chargeMoy = personnelActif.length > 0
      ? Math.round(personnelActif.reduce((a,p)=>a+p.charge,0) / personnelActif.length)
      : 0;
    const machines = state.machines.filter(m => m.uuid);
    const etatDe = (m) => (state.etatsMachines || {})[m.uuid] || { etat: 'ok' };
    const alArret = (m) => ['hors_service', 'maintenance'].includes(etatDe(m).etat);
    const nbArret = machines.filter(alArret).length;

    const wrap = el(`<div></div>`);
    const barreVg = el(`<div style="display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-bottom:14px;"><button class="btn" id="rm-courant" title="PDF de réunion : situation du mois en cours">Rapport mensuel — mois en cours</button><button class="btn" id="rm-suivant" title="PDF de réunion : prévisions du mois prochain">Rapport mensuel — mois suivant</button><button class="btn" id="op-ouvrir">Optimiser la Production</button><button class="btn primary" id="vg-ouvrir">Vue globale de la charge</button></div>`);
    const moisRel = (decal) => { const d = new Date(); const t = new Date(Date.UTC(Number(d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }).slice(0, 4)), Number(d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }).slice(5, 7)) - 1 + decal, 1)); return t.toISOString().slice(0, 7); };
    [['#rm-courant', 0, 'Rapport mensuel — mois en cours'], ['#rm-suivant', 1, 'Rapport mensuel — mois suivant']].forEach(([sel, decal, libelle]) => {
      const bt = barreVg.querySelector(sel);
      bt.addEventListener('click', async () => {
        bt.disabled = true; bt.textContent = 'Génération du PDF…';
        try { await genererRapportMensuel(moisRel(decal)); toast('Rapport mensuel téléchargé.'); }
        catch (e) { toast(`Rapport impossible : ${e.message}`, 'error'); }
        finally { bt.disabled = false; bt.textContent = libelle; }
      });
    });
    barreVg.querySelector('#vg-ouvrir').addEventListener('click', () => { state.repVue = 'globale'; render(); });
    barreVg.querySelector('#op-ouvrir').addEventListener('click', () => ouvrirModaleOptimisation());
    wrap.appendChild(barreVg);
    const kpis = el(`
      <div class="kpis">
        <div class="kpi accent-amber"><div class="v">${enCours}</div><div class="l">OF en cours</div></div>
        <div class="kpi ${retards.length?'accent-danger':'accent-teal'}"><div class="v">${retards.length}</div><div class="l">OF en retard</div></div>
        <div class="kpi accent-teal"><div class="v">${chargeMoy}%</div><div class="l">Charge moyenne équipe (semaine)</div></div>
        <div class="kpi ${nbArret?'accent-danger':'accent-teal'}"><div class="v">${nbArret}<span style="font-size:15px;font-weight:500;color:var(--ink-500);"> / ${machines.length}</span></div><div class="l">Machines à l'arrêt aujourd'hui</div></div>
        <div class="kpi ${matieresCritiques?'accent-danger':'accent-teal'}"><div class="v">${matieresCritiques}</div><div class="l">Matières sous seuil critique</div></div>
      </div>
    `);
    wrap.appendChild(kpis);

    // ---- Donut : répartition des OF par priorité ----
    const parPriorite = { urgente: 0, haute: 0, normale: 0 };
    state.ordres.forEach(o => { if (parPriorite[o.priorite] !== undefined) parPriorite[o.priorite]++; });
    const total = state.ordres.length || 1;
    const segments = [
      { label: 'Urgente', n: parPriorite.urgente, color: 'var(--danger)' },
      { label: 'Haute',   n: parPriorite.haute,   color: 'var(--accent-amber)' },
      { label: 'Normale', n: parPriorite.normale, color: 'var(--accent-teal)' },
    ];
    let cumul = 0;
    const stops = segments.map(s => {
      const pct = (s.n / total) * 100;
      const start = cumul;
      cumul += pct;
      return `${s.color} ${start}% ${cumul}%`;
    }).join(', ');

    const donutPanel = el(`
      <div class="panel">
        <div class="panel-head"><h2>Répartition des OF par priorité</h2></div>
        <div class="donut-row">
          <div class="donut-wrap">
            <div class="donut" style="background: conic-gradient(${stops});"></div>
            <div class="donut-center"><div class="v">${state.ordres.length}</div><div class="l">OF actifs</div></div>
          </div>
          <div class="donut-legend">
            ${segments.map(s => `
              <div class="donut-legend-row">
                <span class="dot" style="background:${s.color}"></span>
                <span class="label">${s.label}</span>
                <span class="pct mono">${total ? Math.round((s.n/total)*100) : 0}%</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `);
    wrap.appendChild(donutPanel);

    // ---- Charge des machines : heures planifiées sur la semaine affichée ÷ capacité de la semaine (40 h ; 10 h par jour de heures sup, 6 h un samedi travaillé) ----
    const minutesDe = (t) => { const [h, m] = String(t).split(':'); return Number(h) * 60 + Number(m); };
    const heuresCreneau = (c) => {
      if (!c.heure_debut || !c.heure_fin) return 8;   // sans horaire = journée entière
      const d = minutesDe(c.heure_debut), f = minutesDe(c.heure_fin);
      return (f - d - Math.max(0, Math.min(f, 750) - Math.max(d, 720))) / 60;   // pause 12h00-12h30
    };
    const planifie = (state.brut && state.brut.planning) || [];
    const lignesMachines = machines.map(m => {
      const cr = planifie.filter(c => c.machine_id === m.uuid);
      const h = cr.reduce((t, c) => t + heuresCreneau(c), 0), cap = capaciteHeuresSemaine(cr);
      return { m, h, cap, pct: Math.round(h / cap * 100), arret: alArret(m), etat: etatDe(m) };
    }).sort((x, y) => (x.arret - y.arret) || (y.h - x.h) || x.m.name.localeCompare(y.m.name, 'fr'));
    const jjmm = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
    const periode = state.brut && state.brut.jours && state.brut.jours.length ? `du ${jjmm(state.brut.jours[0])} au ${jjmm(state.brut.jours[6])}` : '';
    const panel = el(`<div class="panel"><div class="panel-head"><h2>Charge des machines — semaine ${periode}</h2></div></div>`);
    const body = el(`<div style="padding:16px; display:flex; flex-direction:column; gap:12px;"></div>`);
    if (!lignesMachines.length) body.appendChild(el(`<div class="empty">Aucune machine active. Créez vos machines dans l'onglet « Machines ».</div>`));
    lignesMachines.forEach(({ m, h, cap, pct, arret, etat }) => {
      const cls = pct > 100 ? 'danger' : (pct >= 85 ? 'warn' : '');
      const hTxt = Math.round(h * 10) / 10;
      body.appendChild(el(`
        <div style="${arret ? 'opacity:.7;' : ''}">
          <div style="display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-bottom:4px;">
            <span>${esc(m.name)} ${etat.etat !== 'ok' ? tagEtatMachine(etat) : ''}</span><span class="mono">${hTxt} h / ${cap} h · ${pct}%</span>
          </div>
          <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div>
        </div>
      `));
    });
    if (lignesMachines.length) body.appendChild(el(`<div class="plan-note">Charge = heures planifiées sur la semaine ÷ capacité de la semaine : 40 h (5 jours × 8 h), 10 h un jour de heures supplémentaires, 6 h un samedi travaillé. Les machines à l'arrêt (hors service ou intervention en cours) sont signalées et placées en fin de liste.</div>`));
    panel.appendChild(body);
    wrap.appendChild(panel);

    // ---- OF en retard : délai dépassé et avancement < 100 % ----
    const retardPanel = el(`<div class="panel"><div class="panel-head"><h2>OF en retard</h2><span class="plan-note">${retards.length ? retards.length + ' OF — du plus ancien au plus récent' : ''}</span></div></div>`);
    if (!retards.length) {
      retardPanel.appendChild(el(`<div class="empty">Aucun OF en retard.</div>`));
    } else {
      const jours = (d) => Math.max(1, Math.round((new Date(aujourdhui) - new Date(String(d).slice(0, 10))) / 86400000));
      retardPanel.appendChild(el(`
        <table>
          <thead><tr><th>OF</th><th>Titre</th><th>Délai</th><th>Retard</th><th>Avancement</th></tr></thead>
          <tbody>${retards.slice(0, 12).map(o => `
            <tr><td class="mono">${esc(o.id)}</td><td>${esc(o.produit)}${o.client ? ` <span class="plan-note">— ${esc(o.client)}</span>` : ''}</td>
              <td class="mono">${esc(String(o.delai).slice(0, 10).split('-').reverse().join('/'))}</td>
              <td><span class="tag danger">${jours(o.delai)} j</span></td><td class="mono">${Math.round(o.avancement || 0)}%</td></tr>`).join('')}
          </tbody>
        </table>
        ${retards.length > 12 ? `<div class="plan-note" style="padding:10px 16px;">… et ${retards.length - 12} autre(s).</div>` : ''}`));
    }
    wrap.appendChild(retardPanel);
    return wrap;
  }


  // ---------- Messagerie interne ----------
  // Conversations entre les comptes de connexion, rattachées à un sujet (OF, titre, machine, matière, planning annuel, général).
  const MSG_TYPES = { of: 'Ordre de fabrication', titre: 'Titre', machine: 'Machine', stock: 'Matière / stock', planning_annuel: 'Planning annuel', general: 'Général' };
  const msg = { fils: [], filId: null, filtre: 'tous', type: '', clos: false, nonLus: 0 };
  const TITRE_PAGE = document.title;

  const msgDate = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  };
  async function msgAppel(requete, corps) {
    const res = corps
      ? await fetch(`${API}/messagerie`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) })
      : await fetch(`${API}/messagerie?${requete}`);
    const d = await lireJson(res);
    if (!res.ok) throw new Error(d.error || d.errorMessage || `Erreur serveur (HTTP ${res.status})`);
    return d;
  }
  function msgMajBadge(n) {
    msg.nonLus = n;
    const b = document.getElementById('msg-badge'); if (b) { b.textContent = n > 99 ? '99+' : String(n); b.classList.toggle('hidden', !n); }
    const dot = document.getElementById('bell-dot'); if (dot) dot.classList.toggle('hidden', !n);
    const bell = document.getElementById('bell-btn'); if (bell) bell.title = n ? `Messagerie : ${n} conversation(s) non lue(s)` : 'Notifications';
    document.title = (n ? `(${n}) ` : '') + TITRE_PAGE;
  }
  function msgToastMail(m, base) {
    if (!m || m.desactive) return toast(base + (m ? ' (sans e-mail)' : ''));
    if (!m.configure) return toast(`${base} Notification par e-mail non configurée.`);
    if (m.echecs && m.echecs.length) return toast(`${base} E-mail non envoyé à : ${m.echecs.map(e => esc(e.email)).join(', ')}.`, 'error');
    toast(`${base} ${m.envoyes} e-mail(s) envoyé(s).`);
  }
  const msgHtmlUsers = (users, cls) => `<div class="msg-users">${users.map(u => `<label class="msg-user"><input type="checkbox" class="${cls}" value="${esc(u.id)}"> <span>${esc(u.nom)}</span>${u.fonction ? `<small>${esc(u.fonction)}</small>` : ''}</label>`).join('')}</div>
    <button class="btn" type="button" data-tout="${cls}" style="margin-top:6px;">Tout cocher / décocher</button>`;
  function msgBranchTout() {
    document.querySelectorAll('[data-tout]').forEach(b => b.addEventListener('click', () => {
      const cases = Array.from(document.querySelectorAll('.' + b.dataset.tout));
      const tout = cases.every(c => c.checked); cases.forEach(c => { c.checked = !tout; });
    }));
  }

  function renderMessagerie() {
    const wrap = el(`<div class="msg-layout">
      <div class="panel" style="margin:0;">
        <div class="panel-head"><h2>Conversations</h2><button class="btn primary" id="msg-nouveau">Nouveau message</button></div>
        <div class="msg-filtres">
          <button class="msg-chip" data-f="tous">Toutes</button><button class="msg-chip" data-f="nonlu">Non lues</button>
          <select id="msg-type"><option value="">Tous les sujets</option>${Object.entries(MSG_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
          <label style="display:flex;gap:4px;align-items:center;"><input type="checkbox" id="msg-clos"> Closes</label>
        </div>
        <div id="msg-liste"><div class="empty">Chargement…</div></div>
      </div>
      <div class="panel" style="margin:0;"><div id="msg-fil" class="empty">Sélectionnez une conversation, ou cliquez sur « Nouveau message ».</div></div>
    </div>`);
    wrap.querySelector('#msg-nouveau').addEventListener('click', () => ouvrirNouveauMessage({}));
    wrap.querySelectorAll('.msg-chip').forEach(c => c.addEventListener('click', () => { msg.filtre = c.dataset.f; dessinerListeMsg(); }));
    wrap.querySelector('#msg-type').value = msg.type;
    wrap.querySelector('#msg-type').addEventListener('change', (e) => { msg.type = e.target.value; dessinerListeMsg(); });
    wrap.querySelector('#msg-clos').checked = msg.clos;
    wrap.querySelector('#msg-clos').addEventListener('change', (e) => { msg.clos = e.target.checked; chargerFilsMsg(); });
    setTimeout(chargerFilsMsg, 0);
    return wrap;
  }

  async function chargerFilsMsg() {
    try {
      const d = await msgAppel(`action=liste${msg.clos ? '&clos=1' : ''}`);
      msg.fils = d.fils || [];
      msgMajBadge(msg.fils.filter(f => f.non_lu && !f.clos).length);
      dessinerListeMsg();
      if (msg.filId) await ouvrirFilMsg(msg.filId);
    } catch (e) {
      const l = document.getElementById('msg-liste');
      if (l) l.innerHTML = `<div class="msg error" style="margin:12px;">${esc(e.message)}</div>`;
    }
  }

  function dessinerListeMsg() {
    const l = document.getElementById('msg-liste'); if (!l) return;
    document.querySelectorAll('.msg-chip').forEach(c => c.classList.toggle('on', c.dataset.f === msg.filtre));
    const fils = msg.fils.filter(f => (msg.filtre !== 'nonlu' || f.non_lu) && (!msg.type || f.sujet_type === msg.type));
    l.innerHTML = fils.length ? fils.map(f => `
      <button class="msg-item ${f.non_lu ? 'nonlu' : ''} ${f.id === msg.filId ? 'actif' : ''}" data-id="${esc(f.id)}">
        <div class="msg-item-top"><span class="msg-objet">${esc(f.objet)}</span><span class="msg-date">${esc(msgDate(f.dernier_message_at))}</span></div>
        <div class="msg-sujet"><span class="tag">${esc(MSG_TYPES[f.sujet_type] || 'Général')}</span>${f.sujet_libelle ? ' ' + esc(f.sujet_libelle) : ''}${f.clos ? ' <span class="tag">Close</span>' : ''}</div>
        <div class="msg-apercu">${f.dernier_auteur ? esc(f.dernier_auteur) + ' : ' : ''}${esc(f.dernier_apercu)}</div>
      </button>`).join('')
      : `<div class="empty">${msg.fils.length ? 'Aucune conversation pour ce filtre.' : 'Aucune conversation pour le moment. Cliquez sur « Nouveau message » pour commencer.'}</div>`;
    l.querySelectorAll('.msg-item').forEach(b => b.addEventListener('click', () => ouvrirFilMsg(b.dataset.id)));
  }

  async function ouvrirFilMsg(id) {
    msg.filId = id;
    const zone = document.getElementById('msg-fil'); if (!zone) return;
    try {
      const d = await msgAppel(`action=fil&id=${encodeURIComponent(id)}`);
      const f = msg.fils.find(x => x.id === id); if (f) f.non_lu = false;
      msgMajBadge(msg.fils.filter(x => x.non_lu && !x.clos).length);
      dessinerListeMsg();
      dessinerFilMsg(d);
    } catch (e) {
      msg.filId = null;
      zone.className = ''; zone.innerHTML = `<div class="msg error" style="margin:14px;">${esc(e.message)}</div>`;
    }
  }

  function dessinerFilMsg(d) {
    const zone = document.getElementById('msg-fil'); if (!zone) return;
    const f = d.fil;
    const brouillon = (document.getElementById('msg-texte') || {}).value || '';   // ce qu'on était en train d'écrire survit à l'actualisation
    zone.className = '';
    zone.innerHTML = `
      <div class="panel-head" style="flex-wrap:wrap; gap:8px;">
        <div><h2>${esc(f.objet)}</h2>
          <div class="msg-sujet"><span class="tag">${esc(MSG_TYPES[f.sujet_type] || 'Général')}</span>${f.sujet_libelle ? ' ' + esc(f.sujet_libelle) : ''}${f.clos ? ' <span class="tag">Close</span>' : ''}</div></div>
        <div style="display:flex; gap:6px;"><button class="btn" id="msg-ajout">Ajouter des personnes</button><button class="btn" id="msg-clore">${f.clos ? 'Rouvrir' : 'Clore'}</button></div>
      </div>
      <div class="msg-part">Participants : ${d.participants.map(p => `<span class="msg-pers">${esc(p.nom)}</span>`).join('')}</div>
      <div class="msg-fil-liste" id="msg-bulles">${d.messages.map(m => `
        <div class="msg-bulle ${m.auteur_id === d.moi ? 'moi' : ''}"><div class="msg-bulle-tete"><strong>${esc(m.auteur_nom)}</strong><span>${esc(msgDate(m.created_at))}</span></div><div class="msg-bulle-corps">${esc(m.corps)}</div></div>`).join('')}</div>
      <div class="msg-saisie">
        <textarea id="msg-texte" class="msg-ta" rows="3" maxlength="5000" placeholder="Votre réponse… (Ctrl + Entrée pour envoyer)"></textarea>
        <div class="msg-saisie-pied"><label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" id="msg-mail" checked> Prévenir par e-mail</label><button class="btn primary" id="msg-envoyer">Envoyer</button></div>
        <div id="msg-err"></div>
      </div>`;
    const bulles = document.getElementById('msg-bulles'); bulles.scrollTop = bulles.scrollHeight;
    const ta = document.getElementById('msg-texte'); ta.value = brouillon;
    const envoyer = async () => {
      const texte = ta.value.trim(); if (!texte) return;
      const btn = document.getElementById('msg-envoyer'); btn.disabled = true;
      try {
        const r = await msgAppel('', { action: 'repondre', fil_id: f.id, message: texte, mail: document.getElementById('msg-mail').checked });
        ta.value = '';
        msgToastMail(r.mail, 'Message envoyé.');
        await chargerFilsMsg();
      } catch (e) { document.getElementById('msg-err').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; btn.disabled = false; }
    };
    document.getElementById('msg-envoyer').addEventListener('click', envoyer);
    ta.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); envoyer(); } });
    document.getElementById('msg-clore').addEventListener('click', async () => {
      try { await msgAppel('', { action: 'cloturer', fil_id: f.id, clos: !f.clos }); await chargerFilsMsg(); }
      catch (e) { document.getElementById('msg-err').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
    document.getElementById('msg-ajout').addEventListener('click', () => ouvrirAjoutPersonnesMsg(d));
  }

  async function ouvrirAjoutPersonnesMsg(d) {
    let users;
    try { users = (await msgAppel('action=utilisateurs')).utilisateurs; } catch (e) { toast(esc(e.message), 'error'); return; }
    const deja = new Set(d.participants.map(p => p.user_id));
    const libres = users.filter(u => !deja.has(u.id));
    afficherModale(`
      <h3>Ajouter des personnes à la conversation</h3>
      ${libres.length ? `${msgHtmlUsers(libres, 'ma-user')}
        <label style="display:flex;gap:6px;align-items:center;margin-top:12px;"><input type="checkbox" id="ma-mail" checked> Prévenir par e-mail</label>
        <div class="plan-note" style="margin-top:6px;">Les personnes ajoutées voient tout l'historique de la conversation.</div>`
        : '<div class="empty">Toutes les personnes ayant un compte sont déjà dans la conversation.</div>'}
      <div id="ma-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button>${libres.length ? '<button class="btn primary" id="ma-ok">Ajouter</button>' : ''}</div>`);
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    msgBranchTout();
    const ok = document.getElementById('ma-ok');
    if (ok) ok.addEventListener('click', async () => {
      const ids = Array.from(document.querySelectorAll('.ma-user:checked')).map(c => c.value);
      if (!ids.length) { document.getElementById('ma-msg').innerHTML = '<div class="msg error">Cochez au moins une personne.</div>'; return; }
      try {
        const r = await msgAppel('', { action: 'ajouter', fil_id: d.fil.id, destinataires: ids, mail: document.getElementById('ma-mail').checked });
        fermerModale(); msgToastMail(r.mail, `${r.ajoutes} personne(s) ajoutée(s).`); await chargerFilsMsg();
      } catch (e) { document.getElementById('ma-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
  }

  async function ouvrirNouveauMessage(pre) {
    pre = pre || {};
    afficherModale('<h3>Nouveau message</h3><div class="empty">Chargement…</div>', 'large');
    let users, sujets;
    try { [users, sujets] = await Promise.all([msgAppel('action=utilisateurs').then(d => d.utilisateurs), msgAppel('action=sujets')]); }
    catch (e) {
      afficherModale(`<h3>Nouveau message</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale); return;
    }
    if (!users.length) {
      afficherModale(`<h3>Nouveau message</h3><div class="msg">Aucun autre compte de connexion n'existe pour le moment. Créez les comptes de vos collègues dans Supabase (Authentication → Users → Add user) : ils apparaîtront ici.</div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale); return;
    }
    const $ = (id) => document.getElementById(id);
    afficherModale(`
      <h3>Nouveau message</h3>
      <div class="field"><label>Sujet concerné</label>
        <select id="nm-type">${Object.entries(MSG_TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <div id="nm-obj-box"><input id="nm-filtre" placeholder="Rechercher…" style="margin-top:6px;"><select id="nm-obj" size="6" class="msg-liste-obj"></select></div></div>
      <div class="field"><label>Destinataires <span class="plan-note">— les personnes qui ont un compte de connexion</span></label>${msgHtmlUsers(users, 'nm-user')}</div>
      <div class="field"><label>Objet</label><input id="nm-objet" maxlength="120" placeholder="ex. Couverture en retard"></div>
      <div class="field"><label>Message</label><textarea id="nm-texte" class="msg-ta" rows="5" maxlength="5000"></textarea></div>
      <label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" id="nm-mail" checked> Prévenir par e-mail</label>
      <div id="nm-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="nm-ok">Envoyer</button></div>`, 'large');
    $('m-cancel').addEventListener('click', fermerModale);
    msgBranchTout();
    const remplirObjets = (garder) => {
      const t = $('nm-type').value;
      $('nm-obj-box').classList.toggle('hidden', t === 'general');
      const f = $('nm-filtre').value.trim().toLowerCase();
      const liste = (sujets[t] || []).filter(x => !f || x.libelle.toLowerCase().includes(f));
      $('nm-obj').innerHTML = liste.length ? liste.map(x => `<option value="${esc(x.id)}">${esc(x.libelle)}</option>`).join('') : '<option disabled>Aucun résultat</option>';
      if (garder) $('nm-obj').value = garder;
    };
    $('nm-type').addEventListener('change', () => { $('nm-filtre').value = ''; remplirObjets(); });
    $('nm-filtre').addEventListener('input', () => remplirObjets($('nm-obj').value));
    $('nm-type').value = pre.type && MSG_TYPES[pre.type] ? pre.type : 'of';
    remplirObjets(pre.id);
    $('nm-ok').addEventListener('click', async () => {
      const t = $('nm-type').value;
      const destinataires = Array.from(document.querySelectorAll('.nm-user:checked')).map(c => c.value);
      const err = (m) => { $('nm-msg').innerHTML = `<div class="msg error">${esc(m)}</div>`; };
      if (t !== 'general' && !$('nm-obj').value) return err('Choisissez le sujet concerné dans la liste (ou « Général »).');
      if (!destinataires.length) return err('Choisissez au moins un destinataire.');
      if (!$('nm-objet').value.trim()) return err('Indiquez l\'objet du message.');
      if (!$('nm-texte').value.trim()) return err('Le message est vide.');
      $('nm-ok').disabled = true; $('nm-msg').innerHTML = '<div class="msg">Envoi…</div>';
      try {
        const r = await msgAppel('', { action: 'creer', sujet_type: t, sujet_id: t === 'general' ? null : $('nm-obj').value, objet: $('nm-objet').value, destinataires, message: $('nm-texte').value, mail: $('nm-mail').checked });
        fermerModale(); msgToastMail(r.mail, 'Message envoyé.');
        msg.filId = r.id;
        if (state.tab !== 'messagerie') { state.tab = 'messagerie'; render(); } else chargerFilsMsg();
      } catch (e) { err(e.message); $('nm-ok').disabled = false; }
    });
  }

  // Pastille « non lus » : au démarrage, toutes les 2 minutes et au retour sur l'onglet du navigateur.
  function demarrerMessagerie() {
    const f = new URLSearchParams(location.search).get('fil');   // lien reçu par e-mail
    if (f) { msg.filId = f; state.tab = 'messagerie'; try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignoré */ } render(); }
    const sessionPresente = () => { try { return !!localStorage.getItem('babouot_session'); } catch (e) { return false; } };
    const maj = async () => {
      if (!sessionPresente() || document.hidden) return;
      try {
        const d = await msgAppel('action=non_lus');
        const change = d.non_lus !== msg.nonLus;
        msgMajBadge(d.non_lus);
        if (change && state.tab === 'messagerie') chargerFilsMsg();
      } catch (e) { /* silencieux : la pastille se mettra à jour au prochain passage */ }
    };
    setTimeout(maj, 1500); setInterval(maj, 120000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) maj(); });
    const cloche = document.getElementById('bell-btn');
    if (cloche) cloche.addEventListener('click', () => { state.tab = 'messagerie'; render(); });
  }

  // ---------- Utilisateurs & rôles (administrateurs) ----------
  const aDroit = (p) => (typeof window.babouotDroit === 'function' ? window.babouotDroit(p) : true);
  function appliquerDroits() {
    const nav = document.getElementById('nav-utilisateurs'); if (nav) nav.classList.toggle('hidden', !aDroit('admin'));
    const regles = { 'new-of': 'ordres', 'import-lot': 'ordres', 'pleiade-btn': 'ordres', 'coffret-btn': 'ordres', 'annuel-btn': 'ordres', 'add-of-btn': 'planifier', 'reorg-btn': 'planifier',
      'recalc-btn': 'planifier', 'recalc-depuis-btn': 'planifier', 'report-btn': 'planifier', 'op-ouvrir': 'planifier', 'couts-btn': 'devis', 'pers-ajout': 'referentiels' };
    Object.keys(regles).forEach((id) => { const e = document.getElementById(id); if (e) e.style.display = aDroit(regles[id]) ? '' : 'none'; });
  }
  window.__appliquerDroits = appliquerDroits;
  const dateHeure = (x) => { try { return x ? new Date(x).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '—'; } catch (e) { return '—'; } };

  function renderUtilisateurs() {
    const wrap = el(`
      <div class="panel">
        <div class="panel-head"><h2>Utilisateurs et rôles</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn" id="usr-journal">Activité récente</button><button class="btn primary" id="usr-new">Ajouter un utilisateur</button></div></div>
        <div id="usr-corps"><div class="empty">Chargement…</div></div>
      </div>`);
    if (!aDroit('admin')) { wrap.querySelector('#usr-corps').innerHTML = '<div class="msg error">Cette page est réservée aux administrateurs.</div>'; return wrap; }
    let donnees = null;
    async function charger() {
      const corps = wrap.querySelector('#usr-corps');
      try {
        const res = await fetch(`${API}/gerer-utilisateurs`);
        const d = await res.json(); if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
        donnees = d; dessiner();
      } catch (e) { corps.innerHTML = `<div class="msg error">${esc(e.message)}${/utilisateurs|relation|schema/i.test(e.message) ? ' — la migration 59 a-t-elle été exécutée dans Supabase ?' : ''}</div>`; }
    }
    function dessiner() {
      const { utilisateurs, roles, moi } = donnees;
      const opt = (r) => roles.map((x) => `<option value="${x.id}" ${x.id === r ? 'selected' : ''}>${esc(x.libelle)}</option>`).join('');
      wrap.querySelector('#usr-corps').innerHTML = `
        <table><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Dernière connexion</th><th>État</th><th></th></tr></thead><tbody>
        ${utilisateurs.map((u) => `<tr>
          <td><b>${esc([u.prenom, u.nom].filter(Boolean).join(' ') || u.email)}</b>${u.user_id === moi ? ' <span class="tag ok">vous</span>' : ''}<br><span style="color:var(--ink-500);font-size:12px;">${esc(u.email)}${u.fonction ? ' · ' + esc(u.fonction) : ''}</span></td>
          <td><select class="usr-role" data-id="${u.user_id}" style="min-width:150px;">${opt(u.role)}</select></td>
          <td>${esc(dateHeure(u.derniere_connexion))}</td>
          <td>${u.actif ? '<span class="tag ok">Actif</span>' : '<span class="tag danger">Désactivé</span>'}</td>
          <td style="white-space:nowrap;"><button class="btn usr-mdp" data-id="${u.user_id}" data-email="${esc(u.email)}">Mot de passe</button>
            <button class="btn usr-actif" data-id="${u.user_id}" data-actif="${u.actif ? '1' : '0'}">${u.actif ? 'Désactiver' : 'Réactiver'}</button></td></tr>`).join('')}
        </tbody></table>
        <h3 style="margin:22px 0 8px;font-size:15px;">Rôles et droits</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;">
          ${roles.map((r) => `<div style="border:1px solid var(--line,#8884);border-radius:10px;padding:10px 12px;"><b>${esc(r.libelle)}</b><div style="font-size:12.5px;color:var(--ink-500);margin-top:4px;">${esc(r.description)}</div></div>`).join('')}
        </div>
        <div style="font-size:12.5px;color:var(--ink-500);margin-top:12px;">Un compte créé directement dans Supabase reçoit le rôle « Lecture seule » jusqu'à ce que vous lui en attribuiez un ici. Un compte désactivé est refusé immédiatement, même si sa session est encore ouverte.</div>`;
      wrap.querySelectorAll('.usr-role').forEach((s) => s.addEventListener('change', async () => {
        try {
          const res = await fetch(`${API}/gerer-utilisateurs`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: s.dataset.id, role: s.value }) });
          const d = await res.json(); if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
          toast('Rôle modifié.');
        } catch (e) { toast(e.message, 'error'); }
        charger();
      }));
      wrap.querySelectorAll('.usr-actif').forEach((b) => b.addEventListener('click', async () => {
        const actif = b.dataset.actif !== '1';
        try {
          const res = await fetch(`${API}/gerer-utilisateurs`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: b.dataset.id, actif }) });
          const d = await res.json(); if (!res.ok) throw new Error(d.error || `HTTP ${res.status}`);
          toast(actif ? 'Compte réactivé.' : 'Compte désactivé.');
        } catch (e) { toast(e.message, 'error'); }
        charger();
      }));
      wrap.querySelectorAll('.usr-mdp').forEach((b) => b.addEventListener('click', () => ouvrirMdpUtilisateur(b.dataset.id, b.dataset.email)));
    }
    function ouvrirMdpUtilisateur(id, email) {
      afficherModale(`
        <h3>Nouveau mot de passe</h3>
        <div style="font-size:13px;color:var(--ink-500);margin-bottom:8px;">${esc(email)}</div>

        <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="m-submit">Créer le compte</button></div>`);

      document.getElementById('nu-role').addEventListener('change', maj); maj();
      document.getElementById('m-cancel').addEventListener('click', fermerModale);

        const msg = document.getElementById('m-msg'), v = (i) => document.getElementById(i).value.trim();

        const res = await fetch(`${API}/gerer-utilisateurs?journal=1&limite=150`);

  const TOAST_ICONS = {
    ok: '<path d="M20 6L9 17l-5-5"/>',

  function toast(message, type) {

  // ---------- Chargement des données réelles (Supabase via Netlify Function) ----------
  // En développement local sans backend branché, ou si l'appel échoue
  // pour toute autre raison, on garde les données de démo ci-dessus
  // plutôt que d'afficher un écran vide.
  //
  // Limites actuelles de ce branchement (à lever plus tard si besoin) :
  //  - la charge du personnel est approximée (créneaux de la semaine
  //    affichée / 5 jours), pas une vraie moyenne glissante.
  // Capacité d'une semaine (une personne ou une machine) d'après ses créneaux : 8 h par jour du lundi au vendredi,
  // 10 h un jour de heures supplémentaires (créneau avant 8h00 ou après 16h30 : ouverture 7h-17h30), 6 h un samedi travaillé (exceptionnel, 6h-12h).
  function capaciteHeuresSemaine(creneaux) {
    const parJour = {};
    creneaux.forEach(c => { (parJour[c.date] = parJour[c.date] || []).push(c); });
    return DAYS_ISO.reduce((cap, iso) => {
      const l = parJour[iso] || [], dow = new Date(iso + 'T12:00:00Z').getUTCDay();
      if (dow >= 1 && dow <= 5) return cap + (l.some(c => (c.heure_debut && String(c.heure_debut).slice(0, 5) < '08:00') || (c.heure_fin && String(c.heure_fin).slice(0, 5) > '16:30')) ? 10 : 8);
      if (dow === 6 && l.length) return cap + 6;
      return cap;
    }, 0);
  }

  async function chargerDonneesReelles() {
    try {
      const url = `/.netlify/functions/lecture-planning?date_debut=${DAYS_ISO[0]}&date_fin=${DAYS_ISO[6]}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      state.machines = data.machines.map(m => ({ id: m.code, uuid: m.id, name: m.nom, code: m.code }));
      state.interventions = data.interventions || []; state.etatsMachines = data.etats_machines || {};
      // Ligne virtuelle pour les opérations manuelles (aucune machine) : sinon leurs créneaux seraient invisibles.
      if (data.planning.some(c => !c.machine_id)) state.machines.push({ id: 'MANUEL', uuid: null, name: 'Travail manuel (sans machine)', code: 'MANUEL', manuel: true });

      state.personnel = data.personnel.map(p => {
        // Charge = heures affectées / capacité de la semaine (40 h = 5 j × 8 h ; 10 h un jour de heures sup, 6 h un samedi travaillé). Une ligne sans heures = journée entière (8 h).
        const minutesDe = (t) => { const [h, m] = String(t).split(':'); return Number(h) * 60 + Number(m); };
        const creneauxPers = data.planning.filter(c => (c.personnel_ids || []).includes(p.id));
        const capSemaine = capaciteHeuresSemaine(creneauxPers);
        const heuresSemaine = creneauxPers.reduce((total, c) => {
          if (!c.heure_debut || !c.heure_fin) return total + 8;
          let min = minutesDe(c.heure_fin) - minutesDe(c.heure_debut);
          min -= Math.max(0, Math.min(minutesDe(c.heure_fin), 750) - Math.max(minutesDe(c.heure_debut), 720)); // pause 12h00-12h30 : seule la part qui chevauche la plage est déduite
          return total + min / 60;
        }, 0);
        const dispoAuj = (data.disponibilites || []).find(d => d.personnel_id === p.id && d.date === AUJOURDHUI_ISO);
        let statutAffiche;
        if (!dispoAuj || dispoAuj.statut === 'disponible') {
          statutAffiche = (dispoAuj && dispoAuj.heure_debut)
            ? `Disponible ${dispoAuj.heure_debut.slice(0,5)}–${dispoAuj.heure_fin.slice(0,5)}`
            : 'Disponible';
        } else if (dispoAuj.statut === 'en arrêt') {
          statutAffiche = 'En arrêt';
        } else {
          statutAffiche = 'Absent(e)';
        }
        return {
          id: p.id, name: p.nom, role: p.poste || '',
          comp: [...(p.competences || []), ...(p.machines_specifiques || []).map(m => `machine: ${m}`)],
          charge: Math.round((heuresSemaine / capSemaine) * 100),
          statut: statutAffiche,
        };
      });

      state.ordres = data.ordres.map(o => ({
        id: o.numero, uuid: o.id,
        produit: o.titres ? o.titres.nom : '(titre non renseigné)',
        client: o.titres ? o.titres.client : '',
        qte: o.quantite, delai: o.delai, priorite: o.priorite,
        statut: o.statut, avancement: o.avancement, type: o.type_production || '',
      }));
      state.ordresTermines = (data.ordres_termines || []).map(o => ({
        id: o.numero, uuid: o.id,
        produit: o.titres ? o.titres.nom : '(titre non renseigné)',
        client: o.titres ? o.titres.client : '',
        qte: o.quantite, delai: o.delai, priorite: o.priorite,
        statut: 'terminé', avancement: 100, type: o.type_production || '',
      }));

      state.stocks = data.stocks.map(s => ({
        id: s.id, name: s.nom, unite: s.unite, qte: s.quantite, seuil: s.seuil_alerte,
        statut: s.quantite <= s.seuil_alerte * 0.5 ? 'danger' : (s.quantite <= s.seuil_alerte ? 'warn' : 'ok'),
      }));

      const planningParMachine = {};
      data.planning.forEach(creneau => {
        const machine = creneau.machine_id ? data.machines.find(m => m.id === creneau.machine_id) : { code: 'MANUEL' };
        if (!machine) return;
        const dayIdx = DAYS_ISO.indexOf(creneau.date);
        if (dayIdx === -1) return;
        const of = data.ordres.find(o => o.id === creneau.of_id);
        if (!planningParMachine[machine.code]) planningParMachine[machine.code] = [];
        planningParMachine[machine.code].push({
          day: dayIdx,
          of: of ? of.numero : (creneau.of_id || 'Hors OF'),
          libre: !creneau.gamme_operatoire_id,
          statut: creneau.statut === 'retard' ? 'danger' : 'ok',
          nbPers: (creneau.personnel_ids || []).length,
          debut: creneau.heure_debut ? String(creneau.heure_debut).slice(0, 5) : null,
          fin: creneau.heure_fin ? String(creneau.heure_fin).slice(0, 5) : null,
          phase: creneau.phase || null,
          gamme: creneau.gamme_operatoire_id || null,
          date: creneau.date,
        });
      });
      state.planning = planningParMachine;
      state.brut = { planning: data.planning, machines: data.machines, ordres: data.ordres, dispo: data.disponibilites || [], jours: DAYS_ISO.slice() };

      const defilement = window.scrollY;   // la page ne doit pas remonter en haut quand on enregistre une saisie
      render();
      window.scrollTo(0, defilement);
      chargerConflitsAbsence();
    } catch (e) {
      console.warn('Backend indisponible, affichage des données de démonstration.', e);
      render();
    }
  }

  // ---------- Écriture : création d'OF et affectation planning ----------
  const API = '/.netlify/functions';
  // Lecture tolérante d'une réponse : une page d'erreur HTML (502, délai dépassé…) donne un vrai message au lieu de « Unexpected token '<' ».
  // ---------- Absences : créneaux touchés, remplaçants proposés, effet sur le délai ----------
  function bandeauAbsencesHtml() {
    const n = (state.conflitsAbsence || []).length;
    if (!n) return '';
    return `<div class="msg error" style="margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">

  }

  async function chargerConflitsAbsence() {
    try {
      const res = await fetch(`${API}/conflits-absence?depuis=${AUJOURDHUI_ISO}&jours=14`);
      const d = await lireJson(res);
      state.conflitsAbsence = res.ok && Array.isArray(d.conflits) ? d.conflits : [];

  document.addEventListener('click', (ev) => {

  });

  async function appelerAbsence(corps) {
    const res = await fetch(`${API}/conflits-absence`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
    const d = await lireJson(res);
    if (!res.ok) { const er = new Error(d.error || `Erreur serveur (HTTP ${res.status})`); er.bloquants = d.bloquants || []; throw er; }
    return d;
  }

  // Message d'erreur + détail des points bloquants renvoyés par le serveur (opération, cause).
  function erreurAbsenceHtml(er) {
    const liste = (er && er.bloquants) || [];
    const detail = liste.length
      ? `<ul style="margin:6px 0 0; padding-left:18px;">${liste.map(b => `<li><strong>${esc(b.operation || 'Étape')}</strong>${b.detail ? ' : ' + esc(b.detail) : ''}</li>`).join('')}</ul>` : '';
    return `<div class="msg error">${esc(er.message)}${detail}</div>`;
  }
  // Proposition automatique : un remplaçant (le mieux classé) s'il en existe, sinon la meilleure replanification
  // (délai tenu d'abord, puis fin d'OF la plus proche).
  async function proposerAbsence(c) {
    const base = { planning_jour_id: c.planning_jour_id, absent_id: c.absent.id };
    if (c.remplacants.length) {
      const r = c.remplacants[0];
      return { type: 'remplacer', remplacant: r, texte: `Remplacer ${c.absent.nom} par <strong>${esc(r.nom)}</strong> — ${r.deja_travaille ? 'a déjà travaillé sur cette tâche' : 'compétent(e) et libre, ' + r.charge + ' créneau(x) planifié(s)'} ; le planning ne bouge pas.` };
    }
    const essais = [];
    for (const option of ['reduit', 'reporter']) {
      try { essais.push({ option, d: await appelerAbsence({ ...base, action: 'apercu', option }) }); } catch (e) { /* option impossible */ }
    }
    if (!essais.length) return null;
    const bloque = (x) => (x.d.bloquants && x.d.bloquants.length) || x.d.complet === false;
    essais.sort((x, y) => (Number(bloque(x)) - Number(bloque(y))) || (Number(y.d.of.respecte_delai === true) - Number(x.d.of.respecte_delai === true)) || String(x.d.of.fin).localeCompare(String(y.d.of.fin)));
    const m = essais[0];
    const libelle = m.option === 'reduit' ? `Continuer sans ${esc(c.absent.nom)}` : `Attendre le retour de ${esc(c.absent.nom)}`;
    return { type: 'replanifier', option: m.option, apercu: m.d, bloquants: m.d.bloquants || [], incomplet: m.d.complet === false, texte: `<strong>${libelle}</strong> — tâche terminée le ${fmtDateHeure(m.d.tache.fin)}, OF le ${fmtDateHeure(m.d.of.fin)} (${m.d.of.respecte_delai === false ? '<span class="tag danger">délai dépassé</span>' : '<span class="tag ok">délai respecté</span>'}).` };
  }
  async function appliquerProposition(c, prop) {
    const base = { planning_jour_id: c.planning_jour_id, absent_id: c.absent.id };
    if (prop.type === 'remplacer') return appelerAbsence({ ...base, action: 'remplacer', remplacant_id: prop.remplacant.id, portee: 'tache' });
    return appelerAbsence({ ...base, action: 'appliquer', option: prop.option });
  }

  function modeAbsences() { try { return localStorage.getItem('absences_mode') === 'manuel' ? 'manuel' : 'auto'; } catch (_) { return 'auto'; } }

  function ouvrirModaleAbsences() {
    const liste = state.conflitsAbsence || [];
    const mode = modeAbsences();
    const jourLong = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const blocs = liste.map((c, i) => {
      const remp = c.remplacants.length
        ? `<select class="ab-remp">${c.remplacants.map(r => `<option value="${r.id}">${esc(r.nom)}${r.deja_travaille ? ' — a déjà travaillé sur cette tâche' : ''} · ${r.charge} créneau(x)</option>`).join('')}</select>
           <label class="plan-note"><input type="checkbox" class="ab-tache"> pour tous les créneaux de cette tâche où ${esc(c.absent.nom)} est absent(e)</label>
           <button class="btn primary ab-remplacer">Remplacer</button>`
        : `<span class="plan-note">Aucune personne compétente et libre sur ce créneau.</span>`;
      return `<div class="plan-step" data-i="${i}">
        <div class="step-head"><strong>${esc(jourLong(c.date))}${c.heure_debut ? ' ' + c.heure_debut + '–' + c.heure_fin : ''}</strong>
          <span class="plan-note">${esc(c.of || '')}${c.titre ? ' — ' + esc(c.titre) : ''} · ${esc(c.operation)}${c.machine ? ' · ' + esc(c.machine) : ''}${c.avancement_pct ? ' · ' + Math.round(c.avancement_pct) + ' % fait' : ''}</span></div>
        <div><span class="tag danger">${esc(c.absent.nom)} ${c.absent.statut === 'en arrêt' ? 'en arrêt' : 'absent(e)'}</span>
          <span class="plan-note"> ${c.absent.motif ? esc(c.absent.motif) + ' · ' : ''}équipe prévue : ${esc(c.equipe.map(p => p.nom).join(', '))}</span></div>
        ${mode === 'auto' ? `<div class="msg ab-prop" style="margin:8px 0;"><div class="plan-note">Proposition du logiciel : calcul…</div></div>` : ''}
        <details class="pl-details" ${mode === 'manuel' ? 'open' : ''}><summary>Choisir moi-même</summary>
          <div class="field"><label>1. Remplacer ${esc(c.absent.nom)} <span style="font-weight:400">(le planning ne bouge pas)</span></label><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${remp}</div></div>
          <div class="field"><label>2. Ou replanifier le temps restant <span style="font-weight:400">(effet calculé avant d'appliquer)</span></label>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn ab-apercu" data-option="reduit">Continuer sans ${esc(c.absent.nom)}</button>
              <button class="btn ab-apercu" data-option="reporter">Attendre son retour</button></div>
            <div class="ab-res"></div></div>
        </details>
      </div>`;
    }).join('');
    afficherModale(`<h3>Absences et planning</h3>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
        <label><input type="radio" name="ab-mode" value="auto" ${mode === 'auto' ? 'checked' : ''}> Le logiciel propose une solution</label>
        <label><input type="radio" name="ab-mode" value="manuel" ${mode === 'manuel' ? 'checked' : ''}> Je choisis moi-même</label>
        ${mode === 'auto' && liste.length > 1 ? '<button class="btn primary" id="ab-tout" disabled>Accepter toutes les propositions</button>' : ''}
      </div>
      <div class="plan-hint">Rien n'est modifié sans votre clic. « Remplacer » garde le même créneau ; les autres solutions replanifient le temps restant de la tâche (et des étapes qui en dépendent) et montrent l'effet sur le délai.</div>
      ${blocs || '<div class="empty">Aucun conflit : toutes les personnes planifiées sont présentes.</div>'}
      <div id="m-msg"></div><div class="actions"><button class="btn" id="m-cancel">Fermer</button></div>`, 'xlarge');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.querySelectorAll('input[name="ab-mode"]').forEach(r => r.addEventListener('change', () => {
      try { localStorage.setItem('absences_mode', r.value); } catch (_) { /* préférence non mémorisée */ }
      ouvrirModaleAbsences();
    }));
    const msg = (h) => { document.getElementById('m-msg').innerHTML = h; };
    const termine = () => { fermerModale(); chargerDonneesReelles().then(chargerConflitsAbsence); };

    const propositions = new Map();
    document.querySelectorAll('.plan-step[data-i]').forEach(bloc => {
      const c = liste[Number(bloc.dataset.i)];
      const base = { planning_jour_id: c.planning_jour_id, absent_id: c.absent.id };
      const rem = bloc.querySelector('.ab-remplacer');
      if (rem) rem.addEventListener('click', async () => {
        rem.disabled = true;
        try {
          const d = await appelerAbsence({ ...base, action: 'remplacer', remplacant_id: bloc.querySelector('.ab-remp').value, portee: bloc.querySelector('.ab-tache').checked ? 'tache' : 'creneau' });
          toast(`${d.remplaces.length} créneau(x) remplacé(s).`); termine();
        } catch (e) { msg(erreurAbsenceHtml(e)); rem.disabled = false; }
      });
      bloc.querySelectorAll('.ab-apercu').forEach(btn => btn.addEventListener('click', async () => {
        const zone = bloc.querySelector('.ab-res');
        zone.innerHTML = '<div class="plan-note">Calcul…</div>';
        try {
          const d = await appelerAbsence({ ...base, action: 'apercu', option: btn.dataset.option });
          const tag = d.of.respecte_delai === false ? '<span class="tag danger">Délai dépassé</span>' : (d.of.respecte_delai ? '<span class="tag ok">Délai respecté</span>' : '');
          const jours = d.of.retard_min ? Math.round(d.of.retard_min / 1440) : 0;
          zone.innerHTML = `<div class="plan-resume" style="margin-top:8px;">
              <div><span class="plan-k">Tâche</span><strong>${d.tache.debut ? fmtDateHeure(d.tache.debut) + ' → ' + fmtDateHeure(d.tache.fin) : '—'}</strong></div>
              <div><span class="plan-k">Fin de l'OF</span><strong>${fmtDateHeure(d.of.fin)}</strong></div>
              <div>${tag} ${d.of.respecte_delai === false ? `<span class="plan-note">(≈ ${jours >= 1 ? jours + ' jour(s)' : 'moins d\'une journée'} de retard)</span>` : ''}</div></div>
              <div class="plan-note">${d.tache.personnes.length ? 'Équipe : ' + esc(d.tache.personnes.join(', ')) : 'Personnel choisi automatiquement'}</div>
              ${(d.bloquants && d.bloquants.length) ? `<div class="plan-bloquants" style="margin-top:8px;"><strong>Points bloquants — cette solution ne peut pas être appliquée :</strong><ul>${d.bloquants.map(b => `<li><strong>${esc(b.operation || 'Étape')}</strong>${b.detail ? ' : ' + esc(b.detail) : ''}</li>`).join('')}</ul></div>` : (d.complet === false ? '<div class="plan-bloquants" style="margin-top:8px;">Le plan est incomplet : certaines étapes ne tiennent pas dans l\'horizon de planification.</div>' : '')}
              <button class="btn primary ab-go" style="margin-top:6px;" ${((d.bloquants && d.bloquants.length) || d.complet === false) ? 'disabled' : ''}>Appliquer cette solution</button>`;
          zone.querySelector('.ab-go').addEventListener('click', async (e2) => {
            e2.target.disabled = true;
            try { await appelerAbsence({ ...base, action: 'appliquer', option: btn.dataset.option }); toast('Planning replanifié.'); termine(); }
            catch (er) { zone.insertAdjacentHTML('beforeend', erreurAbsenceHtml(er)); e2.target.disabled = false; }
          });
        } catch (e) { zone.innerHTML = erreurAbsenceHtml(e); }
      }));
    });

    if (mode !== 'auto') return;
    // Mode automatique : une proposition par créneau, calculée l'une après l'autre (limite de temps du serveur).
    (async () => {
      for (const bloc of document.querySelectorAll('.plan-step[data-i]')) {
        const c = liste[Number(bloc.dataset.i)];
        const zone = bloc.querySelector('.ab-prop');
        if (!zone) return;
        let prop = null;
        try { prop = await proposerAbsence(c); } catch (e) { prop = null; }
        if (!prop) { zone.innerHTML = '<div class="plan-note">Aucune solution automatique : choisissez ci-dessous.</div>'; bloc.querySelector('details').open = true; continue; }
        propositions.set(bloc, { c, prop });
        const bloqueP = (prop.bloquants && prop.bloquants.length) || prop.incomplet;
        const blocP = bloqueP ? `<div class="plan-bloquants" style="margin-top:8px;"><strong>Points bloquants — proposition non applicable :</strong>${(prop.bloquants && prop.bloquants.length) ? `<ul>${prop.bloquants.map(b => `<li><strong>${esc(b.operation || 'Étape')}</strong>${b.detail ? ' : ' + esc(b.detail) : ''}</li>`).join('')}</ul>` : ' le plan est incomplet (étapes hors horizon de planification).'}</div>` : '';
        zone.innerHTML = `<div class="plan-note">Proposition du logiciel</div><div>${prop.texte}</div>${blocP}<button class="btn primary ab-accepter" style="margin-top:6px;" ${bloqueP ? 'disabled' : ''}>Accepter</button>`;
        zone.querySelector('.ab-accepter').addEventListener('click', async (ev) => {
          ev.target.disabled = true;
          try { await appliquerProposition(c, prop); toast('Proposition appliquée.'); termine(); }
          catch (er) { msg(erreurAbsenceHtml(er)); ev.target.disabled = false; }
        });
      }
      const tout = document.getElementById('ab-tout');
      if (tout && propositions.size) {
        tout.disabled = false;
        tout.addEventListener('click', async () => {
          tout.disabled = true;
          // Les replanifications changent le planning : on relit les conflits et on traite un créneau à la fois.
          let faits = 0; let dernierId = null;
          try {
            for (let tour = 0; tour < 30; tour++) {
              msg(`<div class="msg">Application des propositions… (${faits} faite(s))</div>`);
              const r = await fetch(`${API}/conflits-absence?depuis=${AUJOURDHUI_ISO}&jours=14`);
              const d = await lireJson(r);
              const reste = (r.ok && d.conflits) || [];
              if (!reste.length) break;
              const c = reste[0];
              if (c.planning_jour_id === dernierId) { msg(`<div class="msg error">Le conflit de ${esc(c.absent.nom)} le ${esc(c.date)} persiste : choisissez la solution manuellement.</div>`); break; }
              dernierId = c.planning_jour_id;
              const prop = await proposerAbsence(c);
              if (!prop) { msg(`<div class="msg error">Aucune solution automatique pour ${esc(c.absent.nom)} le ${esc(c.date)} (${esc(c.operation)}) : choisissez-la manuellement.</div>`); break; }
              await appliquerProposition(c, prop); faits++;
            }
            toast(`${faits} proposition(s) appliquée(s).`); termine();
          } catch (er) { msg(erreurAbsenceHtml(er)); tout.disabled = false; }
        });
      }
    })();
  }

  async function lireJson(res) {
    const texte = await res.text();
    try { return JSON.parse(texte); }
    catch (e) {
      const brut = texte.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
      return { error: res.status === 502 || res.status === 504
        ? `Le serveur n'a pas répondu à temps ou a planté (HTTP ${res.status}). Réessayez en décochant « Décaler automatiquement le planning » ; si l'erreur persiste, consultez les logs Netlify de la fonction.${brut ? ' [' + brut + ']' : ''}`
        : `Réponse inattendue du serveur (HTTP ${res.status}) ${brut}` };
    }
  }
  let referentielsCache = null;

  async function getReferentiels() {
    if (referentielsCache) return referentielsCache;
    const res = await fetch(`${API}/referentiels`);
    if (!res.ok) throw new Error('Impossible de charger les référentiels.');
    referentielsCache = await res.json();
    return referentielsCache;
  }
