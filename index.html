      const pastille = etatM && etatM.etat !== 'ok' ? `<div><span class="etat-pastille ${etatM.etat}" title="${esc(etatM.intervention ? etatM.intervention.type_libelle + (etatM.intervention.description ? ' — ' + etatM.intervention.description : '') : (etatM.prochaine ? etatM.prochaine.type_libelle + ' le ' + jjmmCourt(etatM.prochaine.date_debut) : ''))}">${esc(etatM.etat === 'programmee' && etatM.prochaine ? 'Intervention le ' + jjmmCourt(etatM.prochaine.date_debut) : etatM.libelle + (etatM.jusqu_au ? ' → ' + jjmmCourt(etatM.jusqu_au) : ''))}</span></div>` : '';
      rows += `<tr class="${sansTravail ? 'ligne-vide' : ''}"><td class="machine-cell row-accent-${accent}"><div class="m-row"><span class="row-icon ${accent}">${svgIcon(ICON_MACHINE)}</span><div><div class="m-name">${m.name}</div><div class="m-sub">${m.code}</div>${pastille}</div></div></td>`;
      for(let d=0; d<7; d++){
        const slotsJour = (state.planning[m.id]||[]).filter(s=>s.day===d);
        if (slotsJour.length) {
          // Un bloc par travail (OF) et par jour : le TITRE en gras, le n° d'OF en petit, puis une ligne par étape avec ses heures.
          const groupes = [];
          slotsJour.forEach(sj => {
            const cle = sj.libre ? 'libre:' + (sj.phase || sj.of) : sj.of;
            let g = groupes.find(x => x.cle === cle);
            if (!g) { g = { cle, libre: !!sj.libre, of: sj.of, slots: [] }; groupes.push(g); }
            g.slots.push(sj);
          });
          const cartes = groupes.map(g => {
            const s0 = g.slots[0];
            const ordre = g.libre ? null : state.ordres.find(o => o.id === g.of);
            const statut = g.slots.some(x => x.statut === 'danger') ? 'danger' : g.slots.some(x => x.statut === 'warn') ? 'warn' : 'ok';
            const col = g.libre ? '#7A6FD0' : (statut === 'danger' ? 'var(--danger)' : statut === 'warn' ? 'var(--accent-amber)' : 'var(--accent-teal)');
            const nbPers = Math.max(...g.slots.map(x => x.nbPers || 0));
            const titre = g.libre ? (s0.phase ? s0.phase : String(s0.of || '').replace(/^OF-\d{4}-/, '')) : ((ordre && ordre.produit) || g.of);
            const petit = g.libre
              ? ['Temps libre', g.of && g.of !== 'Hors OF' ? g.of : ''].filter(Boolean).join(' · ')
              : [g.of, ordre ? ordre.avancement + ' %' : '', nbPers > 1 ? nbPers + ' pers.' : ''].filter(Boolean).join(' · ');
            const info = `${titre}${g.libre ? '' : ' — ' + g.of}${ordre && ordre.client ? ' — ' + ordre.client : ''}`;
            const seul = !g.libre && g.slots.length === 1 && !s0.debut;   // journée entière sans horaire : tout le bloc est cliquable
            const attr = (x) => `data-gamme="${x.gamme || ''}" data-date="${x.date || ''}" data-of="${esc(x.of)}"`;
            const lignes = seul ? '' : g.slots.map(x => {
              const heures = x.debut ? `${x.debut}–${x.fin}` : 'journée';
              const lib = g.libre ? '' : (x.phase || '');
              const txt = `<b>${heures}</b>${lib ? ' ' + esc(lib) : ''}`;
              return g.libre
                ? `<span class="job-ph clic-libre" data-date="${x.date || ''}" title="${esc(info)} — ${heures}">${txt}</span>`
                : `<span class="job-ph clic-tache" ${attr(x)} title="Cliquer pour saisir l'avancement — ${esc(info)} — ${heures}">${txt}</span>`;
            }).join('');
            return `<div class="job${seul ? ' clic-tache' : ''}" style="--jc:${col}" ${seul ? attr(s0) : ''} title="${esc(info)}"><div class="job-t">${esc(titre)}</div><div class="job-of">${esc(petit)}</div>${lignes}</div>`;
          }).join('');
          rows += `<td class="slot">${cartes}</td>`;
        } else {
          const iv = interventionDuJour(m.uuid, DAYS_ISO[d]);
          if (iv) rows += `<td class="slot ${iv.bloquant ? (iv.type === 'reparation' || iv.type === 'retour_sigis' ? 'hs' : 'maint') : ''} intervention-cell" data-machine-uuid="${m.uuid||''}" data-machine-name="${esc(m.name)}" title="${esc(iv.texte)}"><div class="hs-txt">${esc(iv.type_libelle)}${iv.heure_debut ? ' ' + iv.heure_debut + '–' + (iv.heure_fin || '…') : ''}</div></td>`;
          else rows += `<td class="slot clickable" data-machine-uuid="${m.uuid||''}" data-machine-name="${m.name}" data-day="${d}"></td>`;
        }
      }
      rows += `</tr>`;
    });
    table.innerHTML = colgroup + thead + rows;
    // Machines sans travail cette semaine : masquables (choix mémorisé sur cet appareil).
    let masquerVides = false;
    try { masquerVides = localStorage.getItem('planning_masquer_vides') === '1'; } catch (e) { /* stockage indisponible */ }
    const btnVides = legend.querySelector('#vides-btn');
    const majVides = () => { table.classList.toggle('masque-vides', masquerVides); btnVides.textContent = masquerVides ? `Afficher les ${nbVides} machine${nbVides > 1 ? 's' : ''} sans travail` : 'Masquer les machines sans travail'; };
    if (nbVides === 0) btnVides.style.display = 'none'; else majVides();
    btnVides.addEventListener('click', () => { masquerVides = !masquerVides; try { localStorage.setItem('planning_masquer_vides', masquerVides ? '1' : '0'); } catch (e) { /* ignoré */ } majVides(); });

    table.querySelectorAll('.clic-tache').forEach(b=>{
      b.addEventListener('click', (ev)=>{ ev.stopPropagation(); ouvrirModaleTache(b.dataset.gamme, b.dataset.date, b.dataset.of); });
    });
    table.querySelectorAll('.clic-libre').forEach(b => b.addEventListener('click', (ev) => { ev.stopPropagation(); ouvrirModaleTempsLibres(b.dataset.date); }));
    table.querySelectorAll('.intervention-cell').forEach(td => td.addEventListener('click', () => ouvrirModaleInterventions({ id: td.dataset.machineUuid, nom: td.dataset.machineName }, chargerDonneesReelles)));
    table.querySelectorAll('.slot.clickable').forEach(td=>{
      td.addEventListener('click', ()=> ouvrirModaleAffectation({
        machineUuid: td.dataset.machineUuid,
        machineName: td.dataset.machineName,
        dayIdx: parseInt(td.dataset.day, 10),
      }));
    });

    return wrap;
  }

  // Fenêtres de lecture des OF : un bouton pour les OF Pléiade (et coffrets), un autre pour les OF cartonnés (tous les autres).
  const estOfPleiade = (o) => o.type === 'pleiade' || o.type === 'coffret';
  function ouvrirListeOf(genre) {
    const pleiade = genre === 'pleiade';
    const liste = state.ordres.filter((o) => estOfPleiade(o) === pleiade);
    const ETAT = { 'en cours': ['En cours', 'amber'], 'validé': ['Validé', 'teal'], 'planifié': ['Planifié', 'teal'], 'en attente de validation': ['En attente de validation', 'muted'], 'en pause': ['En pause', 'danger'], 'terminé': ['Terminé', 'green'] };
    const PRIO = { urgente: 0, haute: 1, normale: 2 };
    const PRIO_ICON = { urgente: '<path d="M12 2L2 20h20L12 2z"/><path d="M12 9v5M12 17h.01"/>', haute: '<path d="M12 19V5M5 12l7-7 7 7"/>', normale: '<circle cx="12" cy="12" r="8"/>' };
    const trier = (a, b) => (PRIO[a.priorite] ?? 2) - (PRIO[b.priorite] ?? 2) || String(a.delai || '9999').localeCompare(String(b.delai || '9999')) || String(a.id).localeCompare(String(b.id));
    const titre = pleiade ? 'OF Pléiade' : 'OF Cartonnés';
    const sousTitre = pleiade ? 'Pléiade et coffrets : toujours prioritaires, dates de livraison Gallimard strictes.' : 'Tous les autres ordres de fabrication.';
    afficherModale(`
      <h3>${titre} <span style="font-size:13px;font-weight:400;color:var(--muted);">— ${liste.length} ordre${liste.length > 1 ? 's' : ''}</span></h3>
      <div class="plan-note" style="margin-bottom:8px;">${sousTitre} Classement : priorité, puis date de livraison.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
        <input id="lof-q" placeholder="Rechercher (n° d'OF, titre, client)…" style="flex:1;min-width:200px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);">
        <select id="lof-etat" style="padding:7px 10px;border-radius:8px;border:1px solid var(--line);"><option value="">Tous les états</option>${Object.entries(ETAT).filter(([k]) => liste.some((o) => o.statut === k)).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select>
      </div>
      <div style="overflow-x:auto;"><table class="row-table"><thead><tr><th></th><th>Production</th><th>Client</th><th>Qté</th><th>Délai</th><th>État</th><th>Avancement</th><th></th></tr></thead><tbody id="lof-tbody"></tbody></table></div>
      <div class="actions"><button class="btn" id="lof-fermer">Fermer</button></div>`, 'xlarge');
    document.getElementById('lof-fermer').addEventListener('click', fermerModale);
    const tbody = document.getElementById('lof-tbody');
    function afficher() {
      const q = document.getElementById('lof-q').value.trim().toLowerCase(), et = document.getElementById('lof-etat').value;
      const lignes = liste.filter((o) => (!et || o.statut === et) && (!q || `${o.id} ${o.produit} ${o.client}`.toLowerCase().includes(q))).sort(trier);
      tbody.innerHTML = lignes.map((o) => {
        const accent = (ETAT[o.statut] || [0, 'teal'])[1];
        const fill = o.avancement >= 70 ? '' : (o.avancement >= 30 ? 'warn' : 'danger');
        const typeTag = o.type === 'coffret' ? ' <span class="tag warn" style="margin-left:4px;">Coffret</span>' : '';
        return `<tr class="row-accent-${accent}${estOfPleiade(o) ? ' of-pleiade' : ''}">
          <td class="row-icon-cell"><span class="row-icon ${accent}">${svgIcon(PRIO_ICON[o.priorite] || PRIO_ICON.normale)}</span></td>
          <td><div class="row-title">${esc(o.id)}${typeTag}</div><div class="row-sub">${esc(o.produit)}</div></td>
          <td><span class="chip">${esc(o.client || '—')}</span></td>
          <td>${Number(o.qte || 0).toLocaleString('fr-FR')}</td>
          <td class="mono">${o.delai || '—'}</td>
          <td><span class="etat etat-${accent}">${esc((ETAT[o.statut] || [o.statut])[0])}</span></td>
          <td style="min-width:110px;"><div style="font-size:11px;color:var(--ink-500);">${o.avancement}%</div><div class="bar-track"><div class="bar-fill ${fill}" style="width:${o.avancement}%"></div></div></td>
          <td class="row-menu-cell"><button class="row-menu-btn" data-ofid="${o.uuid}" data-ofnum="${esc(o.id)}" data-ofstatut="${o.statut}" aria-label="Actions">${svgIcon('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>')}</button></td></tr>`;
      }).join('') || `<tr><td colspan="8"><div class="empty">Aucun ordre ${liste.length ? 'ne correspond à la recherche' : 'dans cette catégorie'}.</div></td></tr>`;
      tbody.querySelectorAll('.row-menu-btn').forEach((btn) => btn.addEventListener('click', (e) => { e.stopPropagation(); ouvrirMenuOf(btn, btn.dataset.ofid, btn.dataset.ofnum, btn.dataset.ofstatut); }));
    }
    document.getElementById('lof-q').addEventListener('input', afficher);
    document.getElementById('lof-etat').addEventListener('change', afficher);
    afficher();
  }

  function renderOrdres(){
    const wrap = el(`
      <div class="panel">
        <div class="panel-head" style="flex-wrap:wrap;gap:10px 14px;"><h2>Ordres de fabrication</h2><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;"><button class="btn" id="of-pleiade-btn" style="padding:12px 26px;font-size:15px;font-weight:700;min-width:180px;border:none;color:#fff;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);background:#4338ca;"></button><button class="btn" id="of-cartonnes-btn" style="padding:12px 26px;font-size:15px;font-weight:700;min-width:180px;border:none;color:#fff;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18);background:#b45309;"></button></div><div class="of-actions" style="flex:1 1 100%;display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding-top:2px;"><button class="btn" id="couts-btn">Coûts & tarifs</button><button class="btn" id="import-lot">Importer des fiches (PDF)</button><button class="btn" id="pleiade-btn">Fiche Pléiade</button><button class="btn" id="coffret-btn">Coffrets</button><button class="btn" id="annuel-btn">Planning annuel Pléiade</button><button class="btn" id="reorg-btn">Réorganiser par priorité</button><button class="btn" id="recalc-btn" title="Reprend tous les OF en cours de planification ou d'exécution avec les derniers temps, quantités, délais et dépendances">Recalculer tous les OF</button><button class="btn" id="recalc-depuis-btn" title="Supprime puis recalcule tout ce qui est planifié à partir d'une date choisie, même déjà passée">Replanifier à partir de…</button><button class="btn" id="report-btn" title="Reporter à aujourd'hui les tâches passées et non terminées">Reporter les tâches non terminées</button><button class="btn primary" id="new-of"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouvel OF</button></div></div>
        <table class="row-table">
          <thead><tr><th></th><th>Production</th><th>Client</th><th>Qté</th><th>Délai</th><th>État</th><th>Avancement</th><th></th></tr></thead>
          <tbody id="of-tbody"></tbody>
        </table>
      </div>
    `);
    const tbody = wrap.querySelector('#of-tbody');

    const PRIO_ICON = {
      urgente: '<path d="M12 2L2 20h20L12 2z"/><path d="M12 9v5M12 17h.01"/>',
      haute:   '<path d="M12 19V5M5 12l7-7 7 7"/>',
      normale: '<circle cx="12" cy="12" r="8"/>',
    };
    const ROW_ACCENT = { 'en cours': 'amber', 'validé': 'teal', 'planifié': 'teal', 'en attente de validation': 'muted', 'en pause': 'danger', 'terminé': 'green' };
    const ETAT_LABEL = { 'en cours': 'En cours', 'validé': 'Validé', 'planifié': 'Planifié', 'en attente de validation': 'En attente de validation', 'en pause': 'En pause', 'terminé': 'Terminé' };

    const ajouterLigneOf = (o, parent) => {
      const fillClass = o.avancement>=70?'':(o.avancement>=30?'warn':'danger');
      const accent = ROW_ACCENT[o.statut] || 'teal';
      (parent || tbody).appendChild(el(`
        <tr class="row-accent-${accent}${estOfPleiade(o) ? ' of-pleiade' : ''}">
          <td class="row-icon-cell"><span class="row-icon ${accent}">${svgIcon(PRIO_ICON[o.priorite] || PRIO_ICON.normale)}</span></td>
          <td><div class="row-title">${o.id}</div><div class="row-sub">${o.produit}</div></td>
          <td><span class="chip">${o.client || '—'}</span></td>
          <td>${o.qte.toLocaleString('fr-FR')}</td>
          <td class="mono">${o.delai || '—'}</td>
          <td><span class="etat etat-${accent}">${ETAT_LABEL[o.statut] || o.statut}</span></td>
          <td style="min-width:110px;">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-500);"><span>${o.avancement}%</span></div>
            <div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${o.avancement}%"></div></div>
          </td>
          <td class="row-menu-cell">
            <button class="row-menu-btn" data-ofid="${o.uuid}" data-ofnum="${o.id}" data-ofstatut="${o.statut}" aria-label="Actions">${svgIcon('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>')}</button>
          </td>
        </tr>
      `));
    };
    state.ordres.forEach((o) => ajouterLigneOf(o));

    // OF terminés : ils quittent le planning mais restent consultables (rapport de production, traçabilité).
    const termines = state.ordresTermines || [];
    if (termines.length) {
      const bloc = el(`<div id="of-term" style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 16px;">
          <button class="btn" id="of-term-btn" type="button"></button>
          <input id="of-term-q" type="search" placeholder="Rechercher un OF terminé (numéro, titre, client)…" style="display:none;flex:1 1 260px;max-width:420px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;">
          <span style="font-size:12px;color:var(--ink-500);">Menu ⋯ de la ligne → « 7. Rapport de production (traçabilité) »</span>
        </div>
        <table class="row-table" id="of-term-table" style="display:none;margin-top:10px;"><tbody id="of-term-tbody"></tbody></table>
      </div>`);
      wrap.appendChild(bloc);
      const btnT = bloc.querySelector('#of-term-btn'), qT = bloc.querySelector('#of-term-q'), tabT = bloc.querySelector('#of-term-table'), tbT = bloc.querySelector('#of-term-tbody');
      let ouvert = !!state.afficherOfTermines;
      const dessiner = () => {
        btnT.textContent = (ouvert ? 'Masquer' : 'Afficher') + ` les OF terminés (${termines.length})`;
        tabT.style.display = ouvert ? '' : 'none'; qT.style.display = ouvert ? '' : 'none';
        tbT.innerHTML = '';
        if (!ouvert) return;
        const q = qT.value.trim().toLowerCase();
        const liste = termines.filter((o) => !q || [o.id, o.produit, o.client].join(' ').toLowerCase().includes(q));
        liste.forEach((o) => ajouterLigneOf(o, tbT));
        if (!liste.length) tbT.innerHTML = '<tr><td style="padding:14px;color:var(--ink-500);">Aucun OF terminé ne correspond.</td></tr>';
        tbT.querySelectorAll('.row-menu-btn').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); ouvrirMenuOf(b, b.dataset.ofid, b.dataset.ofnum, b.dataset.ofstatut); }));
      };
      btnT.addEventListener('click', () => { ouvert = !ouvert; state.afficherOfTermines = ouvert; dessiner(); });
      qT.addEventListener('input', dessiner);
      dessiner();
    }

    tbody.querySelectorAll('.row-menu-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        ouvrirMenuOf(btn, btn.dataset.ofid, btn.dataset.ofnum, btn.dataset.ofstatut);
      });
    });

    return wrap;
  }

  // Résultat d'une validation réussie : l'OF a aussi été placé au planning (ou on explique pourquoi pas).
  function afficherResultatValidation(ofUuid, ofNumero, data) {
    const p = data.planification;
    const n = esc(ofNumero);
    const nb = (data.blocages || []).length;
    const forcee = data.forcee ? ` (malgré ${nb} point${nb > 1 ? 's' : ''} bloquant${nb > 1 ? 's' : ''})` : '';
    if (!p) { toast(`${n} validé${forcee}.`); return; }
    if (p.statut === 'rien_a_planifier') { toast(`${n} validé${forcee} — toutes ses étapes sont déjà planifiées.`); return; }

    if (p.statut === 'planifie') {
      if (p.respecte_delai === false) {
        const alt = p.alternative_heures_sup;
        afficherModale(`
          <h3>${n} validé et planifié — délai non tenu</h3>
          <div class="plan-resume">
            <div><span class="plan-k">Début</span><strong>${fmtDateHeure(p.debut)}</strong></div>
            <div><span class="plan-k">Fin prévue</span><strong>${fmtDateHeure(p.fin)}</strong></div>
            <div><span class="plan-k">Délai</span><strong>${fmtDateHeure(p.delai)}</strong></div>
            <div><span class="plan-k">Retard</span><strong style="color:var(--danger-text);">${fmtH(p.retard_min / 60)}</strong></div>
          </div>
          <p style="font-size:13px; color:var(--ink-700); margin:0 0 6px;">Le planning <strong>au plus tôt, en horaires normaux</strong>, a été appliqué : c'est déjà le plus rapide possible, mais il dépasse le délai de l'OF.</p>
          ${alt ? `<p style="font-size:13px; color:var(--ink-700); margin:0 0 6px;">Avec des <strong>heures supplémentaires</strong> : fin le ${fmtDateHeure(alt.fin)} — ${alt.respecte_delai ? '<strong>délai tenu</strong>' : 'délai toujours non tenu'}.</p>` : ''}
          <div class="plan-note">« Ouvrir la planification » permet de replanifier avec les heures supplémentaires.</div>
          <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="m-ouvrir-plan">Ouvrir la planification…</button></div>`);
        document.getElementById('m-cancel').addEventListener('click', fermerModale);
        document.getElementById('m-ouvrir-plan').addEventListener('click', () => ouvrirModalePlanification(ofUuid, ofNumero));
        return;
      }
      toast(`${n} validé${forcee} et planifié : ${fmtDateHeure(p.debut)} → ${fmtDateHeure(p.fin)}${p.respecte_delai ? ' — délai tenu' : ''}.`);
      return;
    }

    if (p.statut === 'bloquee') {
      afficherModale(`
        <h3>${n} validé, mais pas encore planifié</h3>
        <div class="plan-bloquants"><strong>À corriger pour pouvoir le planifier :</strong>
          <ul>${(p.bloquants || []).map(b => `<li><strong>${esc(b.operation)}</strong> : ${esc(b.detail)}</li>`).join('')}</ul></div>
        <div class="plan-note" style="margin-top:8px;">L'OF est bien validé. Corrigez ces points (par exemple chiffrez l'étape), puis lancez « Planifier à l'heure » ou revalidez l'OF.</div>
        <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="m-ouvrir-chiffrage">Ouvrir le chiffrage…</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale);
      document.getElementById('m-ouvrir-chiffrage').addEventListener('click', () => ouvrirModaleChiffrage(ofUuid, ofNumero));
      return;
    }
    toast(`${n} validé${forcee}, mais la planification a échoué : ${esc(p.message || 'erreur inconnue')}.`, 'error');
  }

  // Détail d'une validation refusée : chaque blocage, la façon de le lever, et le choix de valider quand même.
  function ouvrirModaleBlocages(ofUuid, ofNumero, data) {
    const GROUPES = [
      ['gamme', 'Gamme', 'Ajoutez des étapes à la gamme de cet OF.'],
      ['machine', 'Machines', 'Reliez l\'opération à une machine active : onglet Machines → Modifier → cochez l\'opération. Vérifiez aussi qu\'aucune maintenance n\'est en cours.'],
      ['matiere', 'Matières', 'Réapprovisionnez le stock (onglet Stocks), ou retirez la matière requise de l\'OF.'],
      ['personnel', 'Personnel', 'Affectez une personne à l\'étape dans le planning, ou déclarez une compétence : onglet Personnel → Compétences (une opération manuelle n\'exige aucune compétence précise). Sans affectation, ce contrôle tient aussi compte des absences d\'aujourd\'hui.'],
    ];
    const n = data.blocages.length;
    const crit = (ok_, nom) => `<span class="tag ${ok_ ? 'ok' : 'warn'}">${ok_ ? '✓' : '✗'} ${nom}</span>`;
    const blocs = GROUPES.map(([type, titre, conseil]) => {
      const lignes = data.blocages.filter(b => b.type === type);
      if (!lignes.length) return '';
      return `
        <div class="blocage-groupe">
          <div class="blocage-titre">${titre} <span class="plan-note">— ${lignes.length} point${lignes.length > 1 ? 's' : ''}</span></div>
          <ul>${lignes.map(b => `<li>${b.etape ? `<span class="mono">Étape ${b.etape}</span> — ` : ''}${esc(b.detail)}</li>`).join('')}</ul>
          <div class="blocage-conseil">${conseil}</div>
        </div>`;
    }).join('');
    afficherModale(`
      <h3>${esc(ofNumero)} — ${n} point${n > 1 ? 's' : ''} bloquant${n > 1 ? 's' : ''}</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">${crit(data.criteres.machines, 'Machines')}${crit(data.criteres.matieres, 'Matières')}${crit(data.criteres.personnel, 'Personnel')}</div>
      ${blocs}
      <div class="plan-note" style="margin-top:10px;">La validation est pour l'instant <strong>informative</strong> : elle n'empêche pas de planifier l'OF. Vous pouvez le valider malgré ces points si vous savez qu'ils seront levés.</div>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="m-valider-force">Valider quand même</button></div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    document.getElementById('m-valider-force').addEventListener('click', async () => {
      const msg = document.getElementById('m-msg');
      msg.innerHTML = '<div class="msg">Validation…</div>';
      try {
        const res = await fetch(`${API}/valider-of`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ of_id: ofUuid, forcer: true, maintenant: maintenantLocal() }) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        fermerModale(); chargerDonneesReelles();
        afficherResultatValidation(ofUuid, ofNumero, d);
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    });
  }

  // ---------- Suivi de production : saisie de fin de journée, jauges, glissement du planning ----------
  function jaugeAvancement(pct, prevu, retard) {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    const cls = retard ? 'danger' : (prevu != null && p + 2 < prevu ? 'warn' : '');
    const marque = prevu != null ? `<span class="jauge-prevu" style="left:${Math.max(0, Math.min(100, prevu))}%" title="Prévu à ce jour : ${prevu} %"></span>` : '';
    return `<div class="bar-track tall"><div class="bar-fill ${cls}" style="width:${p}%"></div>${marque}</div>`;
  }
  const nbFr = (n) => Number(n).toLocaleString('fr-FR').replace(/[  ]/g, ' ');
  const dateLocaleIso = () => maintenantLocal().slice(0, 10);

  // Valeurs à pré-remplir quand on coche « Tâche terminée » : le reste à produire, 100 %, la durée planifiée.
  function valeursTerminee(t) {
    const dejaAutres = Math.max(0, (Number(t.quantite_realisee) || 0) - (Number((t.saisie || {}).quantite) || 0));
    const qte = t.quantite_totale ? Math.max(0, Math.round((Number(t.quantite_totale) - dejaAutres) * 100) / 100) : null;
    let h = null;
    if (t.debut && t.fin) {
      const m = (x) => { const [a, b] = x.split(':'); return Number(a) * 60 + Number(b); };
      let min = m(t.fin) - m(t.debut);
      if (m(t.debut) < 720 && m(t.fin) > 750) min -= 30;   // pause méridienne
      if (min > 0) h = Math.round(min / 60 * 100) / 100;
    }
    return { qte, pct: 100, h };
  }
  // Applique ces valeurs à un conteneur ; mémorise ce qui a été rempli automatiquement pour pouvoir l'annuler.
  function remplirTerminee(conteneur, t, coche, sel) {
    const champs = { qte: conteneur.querySelector(sel.qte), pct: conteneur.querySelector(sel.pct), h: conteneur.querySelector(sel.h) };
    if (coche) {
      const v = valeursTerminee(t);
      const auto = {};
      for (const k of ['qte', 'pct', 'h']) {
        if (v[k] === null || !champs[k]) continue;
        if (k === 'h' && champs.h.value !== '') continue;            // heures déjà saisies : on les garde
        champs[k].value = v[k]; auto[k] = String(v[k]);
      }
      conteneur.dataset.auto = JSON.stringify(auto);
      const det = conteneur.querySelector('details'); if (det) det.open = true;
    } else {
      let auto = {}; try { auto = JSON.parse(conteneur.dataset.auto || '{}'); } catch (e) {}
      for (const k of Object.keys(auto)) if (champs[k] && champs[k].value === auto[k]) champs[k].value = '';
      conteneur.dataset.auto = '{}';
    }
  }

  // ---------- Saisie de production : une seule page, une fiche papier = un bloc (une personne, plusieurs OF possibles) ----------
  async function ouvrirModaleSaisieProduction(dateInit) {
    afficherModale(`
      <h3>Saisie de production — fiches du jour</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div class="field" style="margin:0;"><label>Journée</label>
          <div style="display:flex;gap:4px;align-items:center;"><button class="btn" id="sp-prec" title="Jour précédent" type="button">◀</button><input id="sp-date" type="date" value="${dateInit || dateLocaleIso()}"><button class="btn" id="sp-suiv" title="Jour suivant" type="button">▶</button></div></div>
        <div class="field" style="margin:0;flex:1;min-width:240px;"><label>Fiche suivante : n° de badge ou nom, puis Entrée</label>
          <input id="sp-quick" type="text" list="sp-liste-pers" autocomplete="off" placeholder="ex. 210 ou Corinne"><datalist id="sp-liste-pers"></datalist></div>
      </div>
      <div id="sp-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;"></div>
      <div id="sp-quick-msg" class="plan-note" style="min-height:16px;"></div>
      <div id="sp-blocs"><div class="msg">Chargement…</div></div>
      <label style="display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-size:13px;"><input type="checkbox" id="sp-recaler" checked> Décaler automatiquement le planning si une tâche n'est pas terminée comme prévu</label>
      <div id="m-msg"></div>
      <div class="actions"><span id="sp-resume" class="plan-note" style="margin-right:auto;"></span><button class="btn" id="m-cancel">Annuler</button><button class="btn primary" id="sp-go" disabled>Enregistrer</button></div>
    `, 'xlarge');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    const normN = (x) => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    let taches = [], personnes = [], blocs = [];   // blocs : { pid, nom, badge, rows: [{ gid, hr, hp, qte, pct, com, fini, exist, supprimer, src }] }
    const tacheDe = (gid) => taches.find(t => t.gamme_id === gid);
    const blocDe = (pid) => blocs.find(b => (b.pid || null) === (pid || null));
    const vide = (r) => r.hr === '' && r.hp === '' && r.qte === '' && r.pct === '' && !r.fini;
    // Une ligne n'est envoyée que si elle est nouvelle ou modifiée (les saisies déjà enregistrées et inchangées restent telles quelles).
    const aEnvoyer = (r) => (r.exist || r.migre) ? !!r.touche : (!r.supprimer && !vide(r));

    // ----- Reste à produire d'une tâche, compte tenu de tout ce qui est tapé sur la page
    function resteDe(gid, sauf) {
      const t = tacheDe(gid); if (!t || !t.quantite_totale) return null;
      const jourDeja = Number((t.saisie || {}).quantite) || 0;
      const avant = Math.max(0, (Number(t.quantite_realisee) || 0) - jourDeja);
      const autres = blocs.flatMap(b => b.rows).filter(r => r.gid === gid && r !== sauf && !r.supprimer).reduce((s, r) => s + (Number(String(r.qte).replace(',', '.')) || 0), 0);
      return Math.round((Number(t.quantite_totale) - avant - autres) * 100) / 100;
    }

    function ligneHtml(b, bi, r, ri) {
      const t = tacheDe(r.gid) || {};
      const planifiee = (t.personnel_ids || []).includes(b.pid);
      const clos = t.statut === 'terminé' && !r.fini;
      const bloque = (t.bloquee_par || []).length && !r.fini;
      const sansQte = !t.quantite_totale;
      const dis = r.supprimer ? 'disabled' : '';
      return `<tr data-b="${bi}" data-r="${ri}" ${r.supprimer ? 'style="opacity:.4;"' : ''}>
        <td style="min-width:230px;"><strong>${esc(t.of || '')}</strong> · ${esc(t.titre || '')}${t.client ? ' <span class="plan-note">(' + esc(t.client) + ')</span>' : ''}<br>
          <span class="plan-note">${esc(t.operation || '')} — ${esc(t.machine || '')}${t.debut ? ' · prévu ' + esc(t.debut) + '–' + esc(t.fin) : ''}${planifiee ? '' : ' · <span style="color:var(--accent-amber-text,#b45309);">non prévu pour cette personne ce jour</span>'}</span>
          ${r.src ? `<div class="plan-note" style="color:var(--accent-teal);">Lu : ${esc(r.src)}</div>` : ''}<span class="sp-warn plan-note" style="color:var(--danger-text);display:block;"></span></td>
        <td><input class="sp-in sp-hr" data-k="hr" type="number" min="0" step="0.25" value="${esc(r.hr)}" style="width:72px;" ${dis}></td>
        <td><input class="sp-in sp-hp" data-k="hp" type="number" min="0" step="0.25" value="${esc(r.hp)}" style="width:72px;" ${dis}></td>
        <td><input class="sp-in sp-qte" data-k="qte" type="number" min="0" step="any" value="${esc(r.qte)}" style="width:96px;" ${dis}>
          ${sansQte ? `<div class="plan-note">% cumulé</div><input class="sp-in sp-pct" data-k="pct" type="number" min="0" max="100" step="any" value="${esc(r.pct)}" style="width:72px;" ${dis}>` : (t.quantite_totale ? `<div class="plan-note sp-reste"></div>` : '')}</td>
        <td style="text-align:center;">${clos ? '<span class="plan-note">déjà<br>terminée</span>' : (bloque ? `<input class="sp-fini" type="checkbox" disabled title="Attend la fin de : ${esc(t.bloquee_par.join(', '))}"><div class="plan-note">attend ${esc(t.bloquee_par.join(', '))}</div>` : `<input class="sp-fini" type="checkbox" ${r.fini ? 'checked' : ''} ${dis}>`)}</td>
        <td><input class="sp-com" data-k="com" type="text" value="${esc(r.com)}" placeholder="remarque" style="width:130px;" ${dis}></td>
        <td><button class="btn sp-del" type="button" title="${r.exist ? 'Supprimer cette saisie' : 'Retirer cette ligne'}" style="padding:2px 8px;">${r.supprimer ? '↺' : '✕'}</button></td></tr>`;
    }
    function blocHtml(b, bi) {
      const aucune = !b.rows.length;
      return `<div class="panel" data-bloc="${bi}" style="margin:0 0 10px;padding:10px 12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <strong>${b.pid ? '👤 ' + esc(b.nom) + (b.badge ? ' <span class="plan-note">(badge ' + esc(b.badge) + ')</span>' : '') : 'Saisie globale (sans personne)'}</strong>
          <button class="btn sp-bloc-x" type="button" style="padding:2px 10px;font-size:12px;" title="Retirer cette fiche de la page (sans effacer ce qui est enregistré)">Retirer la fiche</button></div>
        ${aucune ? '<div class="plan-note" style="margin:6px 0;">Aucune tâche planifiée pour cette personne ce jour-là : ajoutez l\'opération ci-dessous.</div>' : `<div style="overflow-x:auto;"><table class="sp-table"><thead><tr><th>Tâche</th><th>Réglage (h)</th><th>Production (h)</th><th>Qté produite</th><th>Terminée</th><th>Remarque</th><th></th></tr></thead><tbody>${b.rows.map((r, ri) => ligneHtml(b, bi, r, ri)).join('')}</tbody></table></div>`}
        <div style="margin-top:6px;position:relative;"><input class="sp-add" type="text" placeholder="+ Ajouter une opération : n° d'OF ou titre (+ opération), puis Entrée" style="width:100%;max-width:420px;"><div class="sp-res"></div></div></div>`;
    }
    function rendre(focus) {
      const box = document.getElementById('sp-blocs');
      box.innerHTML = blocs.length ? blocs.map(blocHtml).join('') : '<div class="msg">Tapez le numéro de badge de la fiche papier ci-dessus (ou cliquez un nom), puis recopiez ses lignes.</div>';
      majAlertes(); majPuces();
      if (focus) { const f = box.querySelector(`[data-bloc="${focus.bi}"] tbody tr:nth-child(${(focus.ri || 0) + 1}) .sp-hr`) || box.querySelector(`[data-bloc="${focus.bi}"] .sp-add`); if (f) { f.focus(); f.select && f.select(); } }
    }
    // Alertes sur place (sans re-rendre, pour ne pas perdre le curseur) : dépassement du reste, reste affiché, résumé.
    function majAlertes() {
      let n = 0;
      document.querySelectorAll('#sp-blocs tbody tr').forEach(tr => {
        const r = blocs[Number(tr.dataset.b)].rows[Number(tr.dataset.r)]; const w = tr.querySelector('.sp-warn'); const rs = tr.querySelector('.sp-reste');
        if (aEnvoyer(r)) n++;
        const reste = resteDe(r.gid, null);
        if (rs && reste !== null) rs.textContent = 'reste ' + nbFr(Math.max(0, reste));
        const trop = reste !== null && reste < -0.5 && Number(String(r.qte).replace(',', '.')) > 0;
        w.textContent = trop ? `⚠ ${nbFr(-reste)} de plus que ce qui restait à produire (${nbFr((tacheDe(r.gid).quantite_totale))} au total) : vérifiez la quantité.` : '';
        tr.style.background = trop ? 'var(--accent-amber-bg,#fffbeb)' : '';
      });
      const nb = blocs.length;
      document.getElementById('sp-resume').textContent = n ? `${n} ligne(s) · ${nb} fiche(s)` : '';
      document.getElementById('sp-go').disabled = !n;
    }
    function majPuces() {
      const vus = new Map();
      taches.forEach(t => (t.personnel_ids || []).forEach((id, i) => vus.set(id, (t.personnel || [])[i] || '')));
      const noms = Object.fromEntries(personnes.map(p => [p.id, p.nom]));
      const ids = [...vus.keys()].sort((a, b) => String(noms[a] || '').localeCompare(String(noms[b] || ''), 'fr'));
      document.getElementById('sp-chips').innerHTML = ids.length ? '<span class="plan-note" style="align-self:center;">Affectés ce jour :</span>' + ids.map(id => {
        const b = blocDe(id); const saisi = b && b.rows.some(r => r.exist);
        return `<button type="button" class="btn sp-chip" data-pid="${id}" style="padding:3px 10px;font-size:12px;${b ? 'background:var(--field-bg);' : ''}">${esc(noms[id] || vus.get(id))}${saisi ? ' ✔' : ''}</button>`; }).join('') : '';
    }

    // ----- Création des blocs
    function ligneExistante(gid, pid) { return (lignesExist || []).find(l => l.gamme_id === gid && (l.personnel_id || null) === (pid || null)); }
    let lignesExist = [];
    function nouvelleLigne(gid, pid) {
      const l = ligneExistante(gid, pid);
      if (!l) return { gid, hr: '', hp: '', qte: '', pct: '', com: '', fini: false, exist: false };
      return { gid, hr: l.heures_reglage ?? '', hp: l.heures_production ?? '', qte: l.quantite ? l.quantite : '', pct: l.pct_cumule ?? '', com: l.commentaire || '', fini: !!l.termine, exist: true };
    }
    function creerBloc(pid) {
      const p = personnes.find(x => x.id === pid);
      const b = { pid: pid || null, nom: p ? p.nom : '', badge: p ? p.badge : '', rows: [] };
      const gids = [];
      taches.filter(t => pid && (t.personnel_ids || []).includes(pid)).forEach(t => gids.push(t.gamme_id));
      (lignesExist || []).filter(l => (l.personnel_id || null) === (pid || null)).forEach(l => { if (!gids.includes(l.gamme_id)) gids.push(l.gamme_id); });
      b.rows = gids.map(g => nouvelleLigne(g, pid));
      blocs.push(b); return b;
    }
    function ajouterPersonne(pid) {
      let b = blocDe(pid); if (!b) b = creerBloc(pid);
      rendre({ bi: blocs.indexOf(b), ri: 0 });
    }
    // Reconnaissance d'une saisie rapide : badge exact, sinon nom (un seul candidat).
    function resoudre(txt) {
      let x = String(txt || '').trim(); if (!x) return { aucun: true };
      const m = x.match(/^(\d+)\s*[·\-—]/); if (m) x = m[1];
      if (/^\d+$/.test(x)) { const p = personnes.find(q => String(q.badge).replace(/\D/g, '') === x); return p ? { p } : { msg: `Aucune personne n'a le badge ${x}. Renseignez-le dans sa fiche personnel.` }; }
      const n = normN(x); const c = personnes.filter(q => normN(q.nom).includes(n));
      if (c.length === 1) return { p: c[0] };
      if (c.length > 1) { const exact = c.filter(q => normN(q.nom) === n); if (exact.length === 1) return { p: exact[0] }; return { msg: `Plusieurs personnes : ${c.slice(0, 6).map(q => q.nom + (q.badge ? ' (' + q.badge + ')' : '')).join(' ; ')}. Tapez le numéro de badge.` }; }
      return { msg: `Aucune personne ne correspond à « ${x} ».` };
    }
    const quick = document.getElementById('sp-quick'), quickMsg = document.getElementById('sp-quick-msg');
    function traiterQuick(auto) {
      const r = resoudre(quick.value); if (r.aucun) return;
      if (r.msg) { if (!auto) quickMsg.innerHTML = `<span style="color:var(--danger-text);">${esc(r.msg)}</span>`; return; }
      quickMsg.textContent = ''; quick.value = ''; ajouterPersonne(r.p.id);
    }
    quick.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); traiterQuick(false); } });
    quick.addEventListener('change', () => traiterQuick(false));
    // Choix d'une ligne de la liste déroulante (« 217 · Alain ») : pris en compte sans appuyer sur Entrée.
    quick.addEventListener('input', () => { const v = quick.value; if (/^\d+\s·\s/.test(v) && personnes.some(p => (p.badge ? p.badge + ' · ' : '') + p.nom === v)) traiterQuick(true); else if (/^\d+$/.test(v.trim()) && personnes.filter(p => String(p.badge).replace(/\D/g, '') === v.trim()).length === 1 && !personnes.some(p => String(p.badge).replace(/\D/g, '').startsWith(v.trim()) && String(p.badge).replace(/\D/g, '') !== v.trim())) { traiterQuick(true); } });
    document.getElementById('sp-chips').addEventListener('click', (ev) => { const c = ev.target.closest('.sp-chip'); if (c) ajouterPersonne(c.dataset.pid); });

    // ----- Édition (délégation) : l'état est tenu à jour à chaque frappe
    const box = document.getElementById('sp-blocs');
    const ligneDe = (el) => { const tr = el.closest('tr'); return tr ? blocs[Number(tr.dataset.b)].rows[Number(tr.dataset.r)] : null; };
    box.addEventListener('input', (ev) => {
      const el = ev.target; if (el.classList.contains('sp-add')) { rechercher(el); return; }
      const r = ligneDe(el); if (!r || !el.dataset.k) return; r[el.dataset.k] = el.value; r.touche = true; majAlertes();
    });
    box.addEventListener('change', (ev) => {
      const el = ev.target; if (!el.classList.contains('sp-fini')) return;
      const r = ligneDe(el); if (!r) return; r.fini = el.checked; r.touche = true;
      if (el.checked && r.qte === '') { const reste = resteDe(r.gid, r); if (reste !== null && reste > 0) { r.qte = reste; el.closest('tr').querySelector('.sp-qte').value = reste; } }
      majAlertes();
    });
    box.addEventListener('click', (ev) => {
      const del = ev.target.closest('.sp-del');
      if (del) { const tr = del.closest('tr'); const b = blocs[Number(tr.dataset.b)]; const r = b.rows[Number(tr.dataset.r)];
        if (r.exist) { r.supprimer = !r.supprimer; r.touche = true; rendre(); } else { b.rows.splice(Number(tr.dataset.r), 1); rendre({ bi: Number(tr.dataset.b), ri: 0 }); } return; }
      const x = ev.target.closest('.sp-bloc-x');
      if (x) { blocs.splice(Number(x.closest('[data-bloc]').dataset.bloc), 1); rendre(); return; }
      const res = ev.target.closest('.sp-res-item');
      if (res) { const bi = Number(res.closest('[data-bloc]').dataset.bloc); const t = JSON.parse(res.dataset.t);
        if (!tacheDe(t.gamme_id)) taches.push(t);
        const b = blocs[bi]; if (!b.rows.some(r => r.gid === t.gamme_id)) b.rows.push(nouvelleLigne(t.gamme_id, b.pid));
        rendre({ bi, ri: b.rows.findIndex(r => r.gid === t.gamme_id) }); }
    });
    // Entrée = champ suivant (réglage → production → quantité → ligne suivante → fiche suivante)
    box.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter' || !ev.target.classList.contains('sp-in')) return; ev.preventDefault();
      const liste = Array.from(box.querySelectorAll(`[data-bloc="${ev.target.closest('[data-bloc]').dataset.bloc}"] .sp-in:not([disabled])`));
      const i = liste.indexOf(ev.target);
      const suivant = liste[i + 1]; if (suivant) { suivant.focus(); suivant.select(); } else { quick.focus(); quick.select(); }
    });
    let minuteur = null;
    const motsDe = (q) => normN(q).split(/\s+/).filter(Boolean);
    async function chercherOperations(q) {
      const mots = motsDe(q); if (!mots.length || mots[0].length < 2) return [];
      const res = await fetch(`${API}/lecture-production?chercher=${encodeURIComponent(mots[0])}`); const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || ('HTTP ' + res.status));
      const reste = mots.slice(1);
      return d.resultats.filter(t => { const txt = normN([t.of, t.titre, t.client, t.operation, t.machine].join(' ')); return reste.every(m => txt.includes(m)); })
        .sort((a, b) => (a.statut === 'en cours' ? 0 : 1) - (b.statut === 'en cours' ? 0 : 1));
    }
    function afficherResultats(zone, liste) {
      zone.__liste = liste;
      zone.innerHTML = liste.length ? `<div style="border:1px solid var(--line);border-radius:6px;background:var(--paper-raised,#fff);max-height:240px;overflow:auto;margin-top:2px;">${liste.map(t => `<div class="sp-res-item" data-t='${esc(JSON.stringify(t))}' style="padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;"><strong>${esc(t.of)}</strong> · ${esc(t.titre)} — ${esc(t.operation)} <span class="plan-note">(${esc(t.machine)} · ${t.avancement_pct} % fait${t.statut === 'en cours' ? ' · en cours' : ''})</span></div>`).join('')}</div>` : '<div class="plan-note">Aucune opération non terminée pour cette recherche.</div>';
    }
    function rechercher(input) {
      const zone = input.parentElement.querySelector('.sp-res'); const q = input.value.trim();
      clearTimeout(minuteur);
      if (q.length < 2) { zone.innerHTML = ''; zone.__liste = []; return; }
      minuteur = setTimeout(async () => { try { afficherResultats(zone, await chercherOperations(q)); } catch (e) { zone.innerHTML = `<div class="plan-note" style="color:var(--danger-text);">${esc(e.message)}</div>`; } }, 250);
    }
    // Entrée dans la zone « autre opération » : choisit le résultat s'il est unique (taper « 0004 couture » suffit).
    box.addEventListener('keydown', async (ev) => {
      if (ev.key !== 'Enter' || !ev.target.classList.contains('sp-add')) return; ev.preventDefault();
      const input = ev.target, zone = input.parentElement.querySelector('.sp-res'); clearTimeout(minuteur);
      try { const l = await chercherOperations(input.value); afficherResultats(zone, l); if (l.length === 1) zone.querySelector('.sp-res-item').click(); } catch (e) { zone.innerHTML = `<div class="plan-note" style="color:var(--danger-text);">${esc(e.message)}</div>`; }
    });

    // ----- Chargement d'un jour
    async function charger() {
      const date = document.getElementById('sp-date').value;
      document.getElementById('sp-go').disabled = true; blocs = [];
      if (!date) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="msg">Chargement…</div>';
      try {
        const res = await fetch(`${API}/lecture-production?date=${date}`);
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        taches = d.taches; personnes = d.personnes || []; lignesExist = d.lignes || [];
        // Une saisie globale ancienne (sans personne) et celles déjà faites par personne réapparaissent pour être relues ou corrigées.
        const dejaP = [...new Set(lignesExist.map(l => l.personnel_id || null))];
        const globaux = taches.filter(t => t.saisie && !lignesExist.some(l => l.gamme_id === t.gamme_id));
        dejaP.forEach(pid => { if (pid && personnes.some(p => p.id === pid)) creerBloc(pid); else if (!pid) creerBloc(null); });
        if (globaux.length) { const b = blocDe(null) || creerBloc(null); globaux.forEach(t => { if (!b.rows.some(r => r.gid === t.gamme_id)) { const s = t.saisie; b.rows.push({ gid: t.gamme_id, hr: s.heures_reglage ?? '', hp: s.heures_production ?? s.heures_reelles ?? '', qte: Number(s.quantite) || '', pct: s.pct_cumule ?? '', com: s.commentaire || '', fini: !!s.termine, exist: false, migre: true }); } }); }
        document.getElementById('sp-liste-pers').innerHTML = personnes.map(p => `<option value="${esc((p.badge ? p.badge + ' · ' : '') + p.nom)}"></option>`).join('');
        rendre();
        quick.focus();
      } catch (e) { box.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
    }
    const aSaisie = () => blocs.some(b => b.rows.some(r => !r.exist && !vide(r)));
    function decalerJour(sens) {
      if (aSaisie() && !confirm('Des chiffres tapés ne sont pas enregistrés. Changer de jour et les perdre ?')) return;
      const inp = document.getElementById('sp-date'); const d = new Date((inp.value || dateLocaleIso()) + 'T12:00:00Z');
      do { d.setUTCDate(d.getUTCDate() + sens); } while ([0, 6].includes(d.getUTCDay()));
      inp.value = d.toISOString().slice(0, 10); charger();
    }
    document.getElementById('sp-prec').addEventListener('click', () => decalerJour(-1));
    document.getElementById('sp-suiv').addEventListener('click', () => decalerJour(1));
    document.getElementById('sp-date').addEventListener('change', charger);

    // ----- Enregistrement : tout ce qui est sur la page, d'un coup
    document.getElementById('sp-go').addEventListener('click', async () => {
      const date = document.getElementById('sp-date').value; const msg = document.getElementById('m-msg');
      const saisies = [];
      blocs.forEach(b => b.rows.forEach(r => {
        if (!aEnvoyer(r)) return;
        if (r.exist && (r.supprimer || vide(r))) { saisies.push({ gamme_id: r.gid, personnel_id: b.pid, supprimer: true }); return; }
        if (r.supprimer || vide(r)) return;
        saisies.push({ gamme_id: r.gid, personnel_id: b.pid, quantite: r.qte, pct: r.pct, termine: !!r.fini, heures_reglage: r.hr, heures_production: r.hp, commentaire: r.com });
      }));
      if (!saisies.length) { msg.innerHTML = '<div class="msg error">Aucune saisie à enregistrer.</div>'; return; }
      msg.innerHTML = '<div class="msg">Enregistrement et recalage du planning…</div>';
      document.getElementById('sp-go').disabled = true;
      try {
        const res = await fetch(`${API}/saisir-production`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date, saisies, recaler: document.getElementById('sp-recaler').checked }) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        afficherBilanProduction(d);
        chargerDonneesReelles();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; document.getElementById('sp-go').disabled = false; }
    });
    charger();
  }

  // Saisie d'avancement d'une seule tâche, depuis un clic sur son bloc dans le planning.
  async function ouvrirModaleTache(gammeId, date, ofNumero) {
    if (!gammeId || !date) {
      afficherModale(`<h3>${esc(ofNumero || 'Tâche')}</h3><div class="msg">Ce créneau n'est pas rattaché à une étape de gamme (planifié avant le suivi de production) : replanifiez l'OF pour pouvoir y saisir l'avancement.</div><div class="actions"><button class="btn primary" id="m-cancel">Fermer</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale); return;
    }
    afficherModale('<h3>Avancement de la tâche</h3><div class="msg">Chargement…</div>', 'large');
    let t;
    try {
      const res = await fetch(`${API}/lecture-production?date=${date}`);
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
      t = d.taches.find(x => x.gamme_id === gammeId);
      if (!t) throw new Error('Tâche introuvable pour ce jour.');
    } catch (e) {
      afficherModale(`<h3>Avancement de la tâche</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn primary" id="m-cancel">Fermer</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale); return;
    }
    const s = t.saisie || {};
    const fini = t.statut === 'terminé';
    const bloque = !fini && Array.isArray(t.bloquee_par) && t.bloquee_par.length > 0;
    afficherModale(`
      <h3>${esc(t.operation)} <span class="plan-note">— ${esc(t.machine)}</span></h3>
      <div class="plan-note" style="margin-bottom:8px;">${esc(t.of)} · ${esc(t.titre)}${t.client ? ' (' + esc(t.client) + ')' : ''}<br>${dateCourte(date)}${t.debut ? ' · ' + esc(t.debut) + '–' + esc(t.fin) : ''} · ${esc((t.personnel || []).join(', ') || 'personnel à affecter')}</div>
      ${jaugeAvancement(t.avancement_pct, null, false)}
      <div class="plan-note" style="margin:3px 0 10px;">${t.avancement_pct} % ${t.quantite_totale ? '· ' + nbFr(t.quantite_realisee) + ' / ' + nbFr(t.quantite_totale) + ' exemplaires' : ''}${fini ? ' · terminée' : ''}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field"><label>Produit ce jour (exemplaires)</label><input id="mt-qte" type="number" min="0" step="any" value="${s.quantite || ''}" placeholder="quantité"></div>
        <div class="field"><label>Ou avancement cumulé (%)</label><input id="mt-pct" type="number" min="0" max="100" step="any" value="${s.pct_cumule ?? ''}"></div>
        <div class="field"><label>Heures réelles</label><input id="mt-h" type="number" min="0" step="0.25" value="${s.heures_reelles ?? ''}"></div>
        <div class="field"><label>Remarque</label><input id="mt-com" type="text" value="${esc(s.commentaire || '')}"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin:8px 0 2px;font-size:13px;"><input type="checkbox" id="mt-fini" ${fini || s.termine ? 'checked' : ''} ${fini || bloque ? 'disabled' : ''}> Tâche terminée${bloque ? ` <span class="plan-note">— indisponible : attend la fin de ${esc(t.bloquee_par.join(', '))}</span>` : ''}</label>
      <label style="display:flex;gap:8px;align-items:center;margin:2px 0 4px;font-size:13px;"><input type="checkbox" id="mt-recaler" checked> Décaler automatiquement le planning en cas de retard</label>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">Annuler</button><button class="btn" id="mt-of">Avancement de l'OF</button><button class="btn primary" id="mt-go">Enregistrer</button></div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    const corps = document.querySelector('.modal');
    document.getElementById('mt-fini').addEventListener('change', (ev) => remplirTerminee(corps, t, ev.target.checked, { qte: '#mt-qte', pct: '#mt-pct', h: '#mt-h' }));
    document.getElementById('mt-of').addEventListener('click', () => ouvrirModaleAvancementOf(t.of_id, t.of));
    document.getElementById('mt-go').addEventListener('click', async () => {
      const msg = document.getElementById('m-msg');
      const saisie = { gamme_id: gammeId, quantite: document.getElementById('mt-qte').value, pct: document.getElementById('mt-pct').value, termine: document.getElementById('mt-fini').checked && !fini, heures_reelles: document.getElementById('mt-h').value, commentaire: document.getElementById('mt-com').value };
      if (saisie.quantite === '' && saisie.pct === '' && !saisie.termine) { msg.innerHTML = '<div class="msg error">Renseignez une quantité, un pourcentage ou cochez « terminée ».</div>'; return; }
      msg.innerHTML = '<div class="msg">Enregistrement et recalage du planning…</div>';
      document.getElementById('mt-go').disabled = true;
      try {
        const res = await fetch(`${API}/saisir-production`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date: (date > dateLocaleIso() ? dateLocaleIso() : date), saisies: [saisie], recaler: document.getElementById('mt-recaler').checked }) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        afficherBilanProduction(d);
        chargerDonneesReelles();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; document.getElementById('mt-go').disabled = false; }
    });
  }

  // Contexte de l'écran « Avancement de l'OF » : permet d'enchaîner les saisies d'une opération à la suivante.
  let avCtx = { ofUuid: null, ofNumero: null, etapes: [] };

  // `suite` (facultatif) = ce qu'on fait après le bilan : revenir à l'avancement de l'OF, passer à l'opération suivante…
  // Sans retard ni erreur, on enchaîne directement (simple message) ; sinon le bilan reste affiché avec un bouton « Continuer ».
  function afficherBilanProduction(d, suite) {
    if (suite && !d.etapes.some(e => e.erreur) && !d.ofs.some(o => o.recalage && o.recalage.retard)) {
      const o = d.ofs[0];
      toast(`Saisie enregistrée${o ? ` — ${esc(o.numero)} : ${o.avancement_of ?? '—'} % au global` : ''}.`);
      suite(); return;
    }
    const erreurs = d.etapes.filter(e => e.erreur).map(e => `<div class="msg error">${esc(e.erreur)}</div>`).join('');
    const blocs = d.ofs.map(o => {
      const r = o.recalage;
      let etat = '<span class="tag ok">Dans les temps</span>';
      let detail = '';
      if (r && r.retard) {
        const lignes = r.retards.map(x => `<li><strong>${esc(x.operation)}</strong> : ${x.reel_pct} % réalisé (prévu ${x.prevu_pct} %) — ${fmtH(x.minutes_manquantes / 60)} de travail en plus à replacer</li>`).join('');
        if (r.applique) {
          etat = '<span class="tag warn">Planning décalé</span>';
          detail = `<ul class="plan-note" style="margin:6px 0;">${lignes}</ul>
            <div class="plan-resume"><div><span class="plan-k">Fin prévue avant</span><strong>${fmtDateHeure(r.ancienne_fin)}</strong></div><div><span class="plan-k">Nouvelle fin</span><strong>${fmtDateHeure(r.nouvelle_fin)}</strong></div>
            <div>${r.delai_tenu === false ? `<span class="tag danger">Délai dépassé</span> <span class="plan-note">(délai ${fmtDateHeure(r.delai)} — ${fmtH(r.retard_delai_min / 60)} de retard${r.alternative_heures_sup ? ' ; avec heures sup : fin ' + fmtDateHeure(r.alternative_heures_sup.fin) + (r.alternative_heures_sup.respecte_delai ? ', délai tenu' : '') : ''})</span>` : (r.delai_tenu ? '<span class="tag ok">Délai tenu</span>' : '')}</div></div>
            <div class="plan-note">Étapes replacées : ${r.etapes_decalees.map(x => esc(x.operation) + ' (' + fmtDateHeure(x.debut) + ' → ' + fmtDateHeure(x.fin) + ')').join(' ; ')}</div>
            ${(r.attente_lot || []).length ? `<div class="msg" style="margin-top:6px;display:block;"><strong>⏳ En attente d'un lot minimum :</strong> ${r.attente_lot.map(a => '« ' + esc(a.operation) + ' » (' + a.quantite + ' ex.)').join(', ')} — la suite n'est <strong>pas reportée automatiquement au lendemain</strong> : elle sera programmée dès que ${r.attente_lot[0].quantite_min} ex. sont prêts (« Réorganiser / Recalculer »). La « nouvelle fin » ci-dessus est donc partielle.</div>` : ''}`;
        } else {
          etat = '<span class="tag danger">Retard — planning non recalé</span>';
          detail = `<ul class="plan-note" style="margin:6px 0;">${lignes}</ul><div class="msg error">${esc(r.raison || 'Recalage impossible')}${(r.bloquants || []).map(b => `<br>• ${esc(b.operation)} : ${esc(b.detail)}`).join('')}</div>`;
        }
      }
      return `<div class="panel" style="margin:0 0 10px;padding:12px;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;"><strong>${esc(o.numero)}</strong>${etat}</div>
        <div class="plan-note" style="margin-top:4px;">Avancement global : <strong>${o.avancement_of ?? '—'} %</strong></div>${jaugeAvancement(o.avancement_of, null, false)}${detail}</div>`;
    }).join('');
    afficherModale(`<h3>Production du ${dateCourte(d.date)} enregistrée</h3>${erreurs}${blocs || '<div class="msg">Rien d\'enregistré.</div>'}
      <div class="actions">${suite ? '<button class="btn" id="m-cancel">Fermer</button><button class="btn primary" id="bil-suite">Continuer</button>' : '<button class="btn primary" id="m-cancel">Fermer</button>'}</div>`, 'large');
    document.getElementById('m-cancel').addEventListener('click', fermerModale);
    if (suite) document.getElementById('bil-suite').addEventListener('click', suite);
  }

  // Historique des saisies d'une opération : ajouter, corriger ou supprimer les données de production.
  async function ouvrirModaleSaisiesEtape(gammeId, ofUuid, ofNumero, scroll) {
    afficherModale('<h3>Saisies de production</h3><div class="msg">Chargement…</div>', 'xlarge');
    let t, hist;
    try {
      const res = await fetch(`${API}/lecture-production?gamme_id=${gammeId}`);
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
      t = d.tache; hist = d.historique;
    } catch (e) {
      afficherModale(`<h3>Saisies de production</h3><div class="msg error">${esc(e.message)}</div><div class="actions"><button class="btn primary" id="m-cancel">Fermer</button></div>`);
      document.getElementById('m-cancel').addEventListener('click', fermerModale); return;
    }
    const fini = t.statut === 'terminé';
    const bloque = !fini && (t.bloquee_par || []).length > 0;
    const retourOf = () => ouvrirModaleAvancementOf(ofUuid || t.of_id, ofNumero || t.of, { scroll, gamme: gammeId });
    // Opération suivante à saisir : la prochaine non terminée dans l'ordre du planning (même ordre que l'écran Avancement).
    const ordre = avCtx.etapes, pos = ordre.findIndex(x => String(x.gamme_id) === String(gammeId));
    const suivante = pos >= 0 ? ordre.slice(pos + 1).find(x => x.statut !== 'terminé') || null : null;
    const ligneHtml = (l, i) => `<tr data-i="${i}" data-orig='${l ? esc(JSON.stringify(l)) : ''}'>
      <td><input class="se-date" type="date" value="${l ? l.date : dateLocaleIso()}" style="width:140px;"></td>
      <td><input class="se-qte" type="number" min="0" step="any" value="${l && l.quantite ? l.quantite : ''}" style="width:100px;" placeholder="quantité"></td>
      <td><input class="se-pct" type="number" min="0" max="100" step="any" value="${l && l.pct_cumule !== null && l.pct_cumule !== undefined ? l.pct_cumule : ''}" style="width:80px;"></td>
      <td><input class="se-h" type="number" min="0" step="0.25" value="${l && l.heures_reelles !== null && l.heures_reelles !== undefined ? l.heures_reelles : ''}" style="width:80px;"></td>
      <td><input class="se-com" type="text" value="${l ? esc(l.commentaire || '') : ''}" style="min-width:140px;"></td>
      <td style="text-align:center;"><input class="se-fini" type="checkbox" ${l && l.termine ? 'checked' : ''} ${bloque && !(l && l.termine) ? 'disabled title="Attend la fin de : ' + esc(t.bloquee_par.join(', ')) + '"' : ''}></td>
      <td><button class="btn se-del" title="Supprimer cette saisie" style="padding:2px 9px;">✕</button></td></tr>`;
    afficherModale(`
      <h3>${esc(t.operation)} <span class="plan-note">— ${esc(t.machine)}</span></h3>
      <div class="plan-note" style="margin-bottom:8px;">${esc(t.of)} · ${esc(t.titre)}${t.client ? ' (' + esc(t.client) + ')' : ''}${t.debut_prevu ? ' · prévu du ' + dateCourte(t.debut_prevu) + ' au ' + dateCourte(t.fin_prevue) : ''}</div>
      <div id="se-jauge">${jaugeAvancement(t.avancement_pct, null, false)}</div>
      <div class="plan-note" style="margin:3px 0 10px;">${t.avancement_pct} % ${t.quantite_totale ? '· ' + nbFr(t.quantite_realisee) + ' / ' + nbFr(t.quantite_totale) + ' exemplaires' : ''}${fini ? ' · terminée' : ''}${bloque ? ' · attend la fin de ' + esc(t.bloquee_par.join(', ')) : ''}</div>
      <div style="overflow-x:auto;"><table class="sp-table"><thead><tr><th>Journée</th><th>Quantité produite</th><th>% cumulé</th><th>Heures</th><th>Remarque</th><th>Terminée</th><th></th></tr></thead><tbody id="se-corps">${hist.map((l, i) => ligneHtml(l, i)).join('')}</tbody></table></div>
      <div id="se-vide" class="plan-note" style="margin:6px 0;${hist.length ? 'display:none;' : ''}">Aucune saisie enregistrée pour cette opération.</div>
      <div style="margin:8px 0;"><button class="btn" id="se-add">+ Ajouter une saisie</button></div>
      <div class="plan-note">Quantité = exemplaires produits ce jour-là ; « % cumulé » sert aux tâches sans quantité. Cocher « Terminée » remplit le reste à produire. Supprimer une ligne retire sa production de l'avancement.</div>
      <label style="display:flex;gap:8px;align-items:center;margin:10px 0 4px;font-size:13px;"><input type="checkbox" id="se-recaler" checked> Décaler automatiquement le planning en cas de retard</label>
      <div id="m-msg"></div>
      <div class="actions"><button class="btn" id="m-cancel">← Retour à l'OF</button>${suivante ? `<button class="btn" id="se-next" title="Enregistre cette opération puis ouvre la suivante : ${esc(suivante.operation)}">Enregistrer et passer à : ${esc(suivante.operation)} ›</button>` : ''}<button class="btn primary" id="se-go">Enregistrer</button></div>`, 'xlarge');
    const corps = document.getElementById('se-corps');
    let prochain = hist.length;
    const supprimes = [];
    const majVide = () => { document.getElementById('se-vide').style.display = corps.children.length ? 'none' : ''; };
    document.getElementById('m-cancel').addEventListener('click', retourOf);
    document.getElementById('se-add').addEventListener('click', () => {
      corps.insertAdjacentHTML('beforeend', ligneHtml(null, prochain++)); majVide();
    });
    corps.addEventListener('click', (ev) => {
      if (!ev.target.classList.contains('se-del')) return;
      const tr = ev.target.closest('tr');
      if (tr.dataset.orig) supprimes.push(JSON.parse(tr.dataset.orig));
      tr.remove(); majVide();
    });
    corps.addEventListener('change', (ev) => {
      if (!ev.target.classList.contains('se-fini')) return;
      const tr = ev.target.closest('tr'), q = tr.querySelector('.se-qte'), p = tr.querySelector('.se-pct');
      if (ev.target.checked) {
        const autres = Array.from(corps.querySelectorAll('tr')).filter(x => x !== tr).reduce((a, x) => a + (Number(x.querySelector('.se-qte').value) || 0), 0);
        if (t.quantite_totale) { q.value = Math.max(0, Math.round((t.quantite_totale - autres) * 100) / 100); q.dataset.auto = q.value; }
        p.value = 100; p.dataset.auto = '100';
        const h = tr.querySelector('.se-h');
      } else {
        if (q.dataset.auto !== undefined && q.value === q.dataset.auto) q.value = '';
        if (p.dataset.auto !== undefined && p.value === p.dataset.auto) p.value = '';
        delete q.dataset.auto; delete p.dataset.auto;
      }
    });
    const enregistrer = async (suite) => {
      const msg = document.getElementById('m-msg');
      const saisies = [];
      const dates = new Set();
      for (const tr of Array.from(corps.querySelectorAll('tr'))) {
        const v = (c) => tr.querySelector(c).value;
        const date = v('.se-date');
        if (!date) { msg.innerHTML = '<div class="msg error">Chaque saisie doit avoir une date.</div>'; return; }
        if (dates.has(date)) { msg.innerHTML = `<div class="msg error">Deux saisies portent la date du ${dateCourte(date)} : regroupez-les en une seule ligne.</div>`; return; }
        dates.add(date);
        const orig = tr.dataset.orig ? JSON.parse(tr.dataset.orig) : null;
        const saisie = { gamme_id: gammeId, date, quantite: v('.se-qte'), pct: v('.se-pct'), termine: tr.querySelector('.se-fini').checked, heures_reelles: v('.se-h'), commentaire: v('.se-com') };
        if (saisie.quantite === '' && saisie.pct === '' && !saisie.termine) { if (orig) supprimes.push(orig); continue; }   // ligne vidée = supprimée
        if (orig && orig.date !== date) supprimes.push(orig);   // date changée : l'ancienne journée est supprimée
        saisies.push(saisie);
      }
      supprimes.filter(o => !dates.has(o.date) || !saisies.some(x => x.date === o.date)).forEach(o => saisies.unshift({ gamme_id: gammeId, date: o.date, supprimer: true }));
      if (!saisies.length) { msg.innerHTML = '<div class="msg error">Rien à enregistrer.</div>'; return; }
      msg.innerHTML = '<div class="msg">Enregistrement et recalage du planning…</div>';
      const boutons = ['se-go', 'se-next'].map(i => document.getElementById(i)).filter(Boolean);
      boutons.forEach(b => { b.disabled = true; });
      try {
        const res = await fetch(`${API}/saisir-production`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date: dateLocaleIso(), saisies, recaler: document.getElementById('se-recaler').checked }) });
        const d = await lireJson(res);
        if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
        afficherBilanProduction(d, suite);
        chargerDonneesReelles();
      } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; boutons.forEach(b => { b.disabled = false; }); }
    };
    document.getElementById('se-go').addEventListener('click', () => enregistrer(retourOf));
    const bSuiv = document.getElementById('se-next');
    if (bSuiv) bSuiv.addEventListener('click', () => enregistrer(() => ouvrirModaleSaisiesEtape(suivante.gamme_id, ofUuid || t.of_id, ofNumero || t.of, scroll)));
  }

          ${ligne(`Main d'œuvre (${t.mo_heures} h)`, eur(t.mo_vente))}${ligne('Utilisation machines', eur(t.machine_vente))}${ligne('Matières premières', eur(t.matieres_vente))}${ligne('Autres frais', eur(t.autres_vente))}
          ${t.remise ? ligne(`Remise (${R.remise_pct} %)`, '− ' + eur(t.remise)) : ''}
          ${ligne('<strong>Total HT</strong>', '<strong>' + eur(t.ht) + '</strong>')}${ligne('TVA ' + R.parametres.tva_pct + ' %', eur(t.tva))}${ligne('<strong>Total TTC</strong>', '<strong>' + eur(t.ttc) + '</strong>')}
          ${t.prix_unitaire_ht !== null ? ligne('Prix par exemplaire HT', (t.prix_unitaire_ht).toLocaleString('fr-FR', { minimumFractionDigits: 3 }) + ' €') + ligne('Prix pour 1 000 HT', eur(t.prix_mille_ht)) : ''}
        </tbody></table>
        <table class="sp-table" style="max-width:340px;background:var(--field-bg);"><tbody>
          <tr><td colspan="2" class="plan-note"><strong>Interne (jamais montré au client)</strong></td></tr>
          ${ligne('Coût de revient', eur(t.cout_revient))}${ligne('Marge', '<strong style="color:' + (t.marge >= 0 ? 'inherit' : 'var(--danger-text)') + ';">' + eur(t.marge) + '</strong>')}${ligne('Taux de marge', t.marge_pct + ' %')}
        </tbody></table></div>`;
    }
    function planifier() { clearTimeout(minuterie); minuterie = setTimeout(recalculer, 250); }

    async function enregistrer() {
      lire();
      const statutSel = document.getElementById('dv-statut');
      const res = await fetch(`${API}/gerer-devis`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: devisId || undefined, of_id: ofUuid, client, titre, notes, statut: statutSel ? statutSel.value : undefined, saisie: S }) });
      const d = await lireJson(res);
      if (!res.ok) throw new Error(d.error || d.errorMessage || ('Erreur serveur (HTTP ' + res.status + ')'));
      R = d.resultat;
      if (!devisId) { devisId = d.id; devisNumero = d.numero; info.saisis.unshift({ id: d.id, numero: d.numero, total_ht: R.totaux.ht, statut: 'brouillon' }); structure(); }
      return { numero: devisNumero || d.numero };
    }
    function brancher() {
      document.getElementById('m-cancel').addEventListener('click', fermerModale);
      document.querySelectorAll('#dv-corps input:not(#dv-notes), #dv-fm').forEach(i => i.addEventListener('input', planifier));
      document.getElementById('dv-couts') && document.getElementById('dv-couts').addEventListener('click', (e) => { e.preventDefault(); ouvrirModaleCouts(); });
      document.getElementById('dv-add-mat').addEventListener('click', () => { lire(); S.matieres.push({ nom: '', unite: '', quantite: 0, prix_unitaire: 0 }); structure(); recalculer(); });
      document.getElementById('dv-add-aut').addEventListener('click', () => { lire(); S.autres.push({ libelle: '', cout: 0, vente: 0 }); structure(); recalculer(); });
      document.querySelectorAll('.dv-del').forEach(b => b.addEventListener('click', () => { lire(); S[b.dataset.g].splice(Number(b.dataset.i), 1); structure(); recalculer(); }));
      // Choisir une matière du stock : unité, prix et quantité type sont repris.
      document.querySelectorAll('.dv-l[data-k="nom"]').forEach(inp => inp.addEventListener('change', () => {
        const m = info.matieres.find(x => x.nom === inp.value);
        if (!m) return;
        lire();
        const l = S.matieres[Number(inp.dataset.i)];
        l.nom = m.nom; l.unite = m.unite; l.prix_unitaire = m.prix_unitaire ?? 0; if (m.quantite_proposee !== null && !Number(l.quantite)) l.quantite = m.quantite_proposee;
        structure(); recalculer();
      }));
      const ouvrir = document.getElementById('dv-charger');
      if (ouvrir) ouvrir.addEventListener('click', async () => {
        try {
          const d = await (await fetch(`${API}/gerer-devis?id=${document.getElementById('dv-ouvrir').value}`)).json();
          const { totaux, ...saisie } = d.contenu; S = saisie; R = d.contenu;
          client = d.client || ''; titre = d.titre || ''; notes = d.notes || ''; statut = d.statut; devisId = d.id; devisNumero = d.numero;
          structure();
        } catch (e) { document.getElementById('m-msg').innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      });
      document.getElementById('dv-save').addEventListener('click', async () => {
        const msg = document.getElementById('m-msg'); msg.innerHTML = '<div class="msg">Enregistrement…</div>';
        try { const r = await enregistrer(); toast(`Devis ${r.numero} enregistré.`); document.getElementById('m-msg').innerHTML = ''; } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      });
      const pdf = (interne) => async () => {
        const msg = document.getElementById('m-msg'); msg.innerHTML = '<div class="msg">Génération du PDF…</div>';
        try { const r = await enregistrer(); await genererPdfDevis({ numero: r.numero, client, titre, notes, R, interne }); document.getElementById('m-msg').innerHTML = ''; } catch (e) { msg.innerHTML = `<div class="msg error">${esc(e.message)}</div>`; }
      };
      document.getElementById('dv-pdf').addEventListener('click', pdf(false));
      document.getElementById('dv-pdf-int').addEventListener('click', pdf(true));
    }
    structure();
  }

  async function genererPdfDevis({ numero, client, titre, notes, R, interne }) {
    await chargerLibsPdf();
    const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const W = doc.internal.pageSize.getWidth(), M = 14;
    const t = R.totaux, p = R.parametres;
    const ajd = new Date();
    const dateTxt = ajd.toLocaleDateString('fr-FR');
    const fin = new Date(ajd.getTime() + (Number(p.validite_jours) || 30) * 86400000).toLocaleDateString('fr-FR');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text('Ateliers Babouot', M, 20);
    doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.setTextColor(110); doc.text('Reliure industrielle et industrie graphique', M, 26); doc.setTextColor(0);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(interne ? 'DEVIS - VERSION INTERNE' : 'DEVIS', W - M, 20, { align: 'right' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text(pdfTxt(`N° ${numero}`), W - M, 26, { align: 'right' });
    doc.text(pdfTxt(`Date : ${dateTxt}`), W - M, 31, { align: 'right' });
    doc.text(pdfTxt(`Valable jusqu'au ${fin}`), W - M, 36, { align: 'right' });
    let y = 46;
    doc.setFont('helvetica', 'bold'); doc.text('Client', M, y); doc.setFont('helvetica', 'normal'); doc.text(pdfTxt(client || '-'), M + 28, y); y += 6;
    doc.setFont('helvetica', 'bold'); doc.text('Ouvrage', M, y); doc.setFont('helvetica', 'normal'); doc.text(pdfTxt(titre || '-'), M + 28, y); y += 6;
    doc.setFont('helvetica', 'bold'); doc.text('Quantite', M, y); doc.setFont('helvetica', 'normal'); doc.text(pdfTxt(`${Number(R.quantite).toLocaleString('fr-FR')} exemplaires`), M + 28, y); y += 8;

    const E = (n) => pdfTxt(eur(n));
    const corps = [];
    const vide = (v) => Number(v) === 0;
    if (interne) {
      R.mo.filter(l => !vide(l.heures)).forEach(l => corps.push([pdfTxt(`Main d'oeuvre - ${l.operation}`), `${l.heures} h`, `${E(l.cout_horaire)}/h`, E(l.cout), E(l.vente)]));
      R.machine.filter(l => !vide(l.heures)).forEach(l => corps.push([pdfTxt(`Machine - ${l.machine} (${l.operation})`), `${l.heures} h`, `${E(l.cout_horaire)}/h`, E(l.cout), E(l.vente)]));
      R.matieres.filter(l => l.nom || l.cout).forEach(l => corps.push([pdfTxt(`Matiere - ${l.nom}`), pdfTxt(`${l.quantite} ${l.unite || ''}`), `${E(l.prix_unitaire)}`, E(l.cout), E(l.vente)]));
      R.autres.filter(l => l.libelle || l.cout || l.vente).forEach(l => corps.push([pdfTxt(l.libelle), '', '', E(l.cout), E(l.vente)]));
      doc.autoTable({ startY: y, margin: { left: M, right: M }, head: [['Poste', 'Quantite', 'Cout unitaire', 'Cout de revient', 'Prix de vente']], body: corps, styles: { fontSize: 8.5, cellPadding: 1.8 }, headStyles: { fillColor: [30, 90, 100] }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } } });
    } else {
      // Version client : main d'oeuvre détaillée par opération (heures x taux), machines regroupées, matières, autres frais. Aucun coût de revient.
      R.mo.filter(l => !vide(l.heures)).forEach(l => corps.push([pdfTxt(`Main d'oeuvre - ${l.operation}`), `${l.heures} h`, `${E(p.taux_horaire_client)}/h`, E(l.vente)]));
      if (t.machine_vente > 0) corps.push(['Utilisation des machines', `${t.machine_heures} h`, '', E(t.machine_vente)]);
      R.matieres.filter(l => l.nom || l.vente).forEach(l => corps.push([pdfTxt(`Matiere - ${l.nom}`), pdfTxt(`${l.quantite} ${l.unite || ''}`), '', E(l.vente)]));
      R.autres.filter(l => l.libelle || l.vente).forEach(l => corps.push([pdfTxt(l.libelle), '', '', E(l.vente)]));
      doc.autoTable({ startY: y, margin: { left: M, right: M }, head: [['Designation', 'Quantite', 'Prix unitaire', 'Montant HT']], body: corps, styles: { fontSize: 9, cellPadding: 2 }, headStyles: { fillColor: [30, 90, 100] }, columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } } });
    }
    y = doc.lastAutoTable.finalY + 6;
    const tot = [];
    if (t.remise) tot.push(['Sous-total HT', E(t.brut_ht)], [`Remise ${R.remise_pct} %`, '- ' + E(t.remise)]);
    tot.push(['Total HT', E(t.ht)], [`TVA ${p.tva_pct} %`, E(t.tva)], ['Total TTC', E(t.ttc)]);
    if (t.prix_unitaire_ht !== null) tot.push(['Prix par exemplaire HT', pdfTxt(t.prix_unitaire_ht.toLocaleString('fr-FR', { minimumFractionDigits: 3 }) + ' EUR')], ['Prix pour 1 000 HT', E(t.prix_mille_ht)]);
    if (interne) tot.push(['Cout de revient', E(t.cout_revient)], ['Marge', E(t.marge)], ['Taux de marge', `${t.marge_pct} %`]);
    doc.autoTable({ startY: y, margin: { left: W - M - 90, right: M }, body: tot, theme: 'plain', styles: { fontSize: 9.5, cellPadding: 1.6 }, columnStyles: { 1: { halign: 'right' } },
      didParseCell: (h) => { if (['Total HT', 'Total TTC'].includes(h.row.raw[0])) h.cell.styles.fontStyle = 'bold'; } });
    y = doc.lastAutoTable.finalY + 8;
    if (notes) { doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.text(doc.splitTextToSize(pdfTxt(notes), W - 2 * M), M, y); y += 10; }
    if (!interne) { doc.setFontSize(8.5); doc.setTextColor(110); doc.text(pdfTxt(`Devis valable ${p.validite_jours} jours. Bon pour accord (date, signature et cachet) :`), M, y + 4); doc.rect(M, y + 7, 80, 24); doc.setTextColor(0); }
    doc.save(`${interne ? 'devis-interne' : 'devis'}-${numero}.pdf`);
  }

  function ouvrirMenuOf(btn, ofUuid, ofNumero, ofStatut) {
    document.querySelectorAll('.row-menu').forEach(m => m.remove());
    const menu = el(`
      <div class="row-menu">
        <button data-action="chiffrage">1. Chiffrage des temps</button>
        <button data-action="delais">Proposer des délais de livraison</button>
        <button data-action="gamme">2. Gamme opératoire</button>
        <button data-action="planifier">3. Planifier à l'heure</button>

        <button data-action="valider">5. Valider l'OF</button>

    document.body.appendChild(menu);
    const r = btn.getBoundingClientRect();
    menu.style.top = `${r.bottom + window.scrollY + 4}px`;
    menu.style.left = `${r.right + window.scrollX - menu.offsetWidth}px`;

      menu.remove();
      ouvrirNouveauMessage({ type: 'of', id: ofUuid });

      menu.remove();
      ouvrirModalePlanification(ofUuid, ofNumero);

      menu.remove();
      ouvrirModaleAffectation({ ofUuid });

    menu.querySelector('[data-action="delais"]').addEventListener('click', () => {
      menu.remove();
      ouvrirModaleDelais(ofUuid, ofNumero);
    });
    menu.querySelector('[data-action="devis"]')?.addEventListener('click', () => {
      menu.remove();
      ouvrirModaleDevis(ofUuid, ofNumero);
